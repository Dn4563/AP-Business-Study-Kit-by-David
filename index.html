vers buy only slightly less gas. What does this show about demand for gas?","right":"It's inelastic","wrong":[["It's elastic, because drivers did buy a little less gas after the price went up","Only slightly less means low responsiveness."],["It has no demand","No."],["It's a luxury","A necessity for many."]],"exp":"Little change in buying after a price change means inelastic demand."},{"q":"What does price elasticity of demand measure?","right":"How much buying changes when price changes","wrong":[["How quickly a business can raise the amount that it pays its suppliers for raw materials","Not about suppliers."],["How many products are made","Supply."],["A product's market share","No."]],"exp":"Elasticity measures customer responsiveness to price."}]},{"term":"Elastic demand","def":"Buyers react strongly to a price change, which limits price increases.","hook":"Stretchy: they leave.","asks":[{"q":"A store raises the price of one brand of bottled water 10%, and sales drop 40%. Demand is:","right":"Elastic","wrong":[["Inelastic, because people still need to drink water every single day no matter what it costs","Many substitute brands exist."],["Fixed","It changed a lot."],["Unaffected","It fell 40%."]],"exp":"A big drop in buying after a price rise is elastic."},{"q":"If demand for a product is elastic, what happens if the business raises its price?","right":"It loses many customers","wrong":[["It gains many customers, since a higher price makes customers think that the quality is better","Not with elastic demand."],["Nothing changes","Buyers react."],["Its costs fall","No."]],"exp":"Elastic demand limits price increases."}]},{"term":"Inelastic demand","def":"Buyers barely react to a price change, which allows price increases.","hook":"Stiff: they stay.","asks":[{"q":"Disneyland raised prices and attendance still rose. What does this suggest?","right":"Demand is inelastic","wrong":[["Demand is elastic, because more customers came to the park after the prices were raised","They didn't respond to price."],["Prices were too low by law","No."],["It's a generic product","Strongly branded."]],"exp":"Customers barely reacting to price increases means inelastic demand."},{"q":"Which product MOST likely has inelastic demand?","right":"Life-saving prescription medicine","wrong":[["One brand of potato chips that sits on the shelf next to a dozen other brands of chips","Many substitutes = elastic."],["Designer sunglasses","Luxury."],["Concert tickets","Not a necessity."]],"exp":"Necessities with few substitutes have inelastic demand."}]},{"term":"Elasticity factors","def":"Substitutes, necessity vs. luxury, brand loyalty, time to decide and share of income all affect how strongly buyers react to price.","hook":"More substitutes, more reaction.","asks":[{"q":"Which change would make demand for a product MORE elastic?","right":"More substitutes appear","wrong":[["The product becomes a necessity that customers depend on for their health each day","That makes demand less elastic."],["Brand loyalty grows","Less elastic."],["It costs a tiny share of income","Less elastic."]],"exp":"More substitutes means buyers can easily switch."},{"q":"Disneyland gives local residents discounts. Why might locals be more price-sensitive?","right":"They can decide on short notice and visit often","wrong":[["Locals have no substitutes for Disneyland, so they will always pay any price for a ticket","That would make them less sensitive."],["A law requires it","No."],["Locals have higher incomes","Not stated."]],"exp":"Time to decide and frequency make locals more responsive."}]}],"intro":["Pricing power is the ability to raise prices without losing customers. It depends on how much customers react to price changes, called price elasticity of demand. When buyers react strongly (elastic), raising prices is risky; when they barely react (inelastic), the business has more power."]},{"name":"Legal limits on pricing","cards":[{"term":"Price gouging","def":"Charging sharply more during an emergency when demand spikes; extreme increases can be illegal.","hook":"Tripling water after a hurricane.","asks":[{"q":"After a hurricane, a store triples the price of bottled water. This is MOST likely:","right":"Price gouging","wrong":[["Dynamic pricing, because the store is simply changing its prices to match the higher demand","Extreme emergency increases are gouging."],["Penetration pricing","Not low."],["Collusion","One store, no agreement."]],"exp":"Sharp increases during emergencies can be illegal gouging."},{"q":"What separates price gouging from ordinary dynamic pricing?","right":"An emergency and an extreme increase","wrong":[["Gouging only happens online, while dynamic pricing only happens in physical stores","Not the difference."],["Gouging lowers prices","No."],["They're the same","Emergencies matter."]],"exp":"Gouging is a sharp increase during an emergency when demand spikes."}]},{"term":"Price discrimination","def":"Charging different groups different amounts for the same product; illegal when based on protected traits such as race, nationality or sex.","hook":"Some legal, some not.","asks":[{"q":"A theater charges students less than adults for the same show. Is this legal?","right":"Yes; it isn't based on a protected trait","wrong":[["No, because charging different groups different prices for the same thing is always against the law","Some forms are legal."],["No, students are protected","Not a protected trait in your notes."],["Only online","No."]],"exp":"Price discrimination is illegal only when based on protected traits."},{"q":"Which pricing practice would be illegal?","right":"Charging customers more because of their race","wrong":[["Charging adults more than children for a ticket to see the very same movie at the theater","Legal."],["Discounts for local residents","Legal."],["Lower prices for seniors","Legal."]],"exp":"Pricing based on race, nationality or sex is illegal discrimination."}]}],"intro":["Pricing laws protect consumers and competition, and breaking them brings fines, lawsuits and reputation damage. Rivals secretly agreeing on prices is collusion (Unit 1), and it's illegal. Two more limits: huge price jumps during emergencies, and charging groups differently based on protected traits."]}],"intro":["Topic 2.5 is about the hardest P to get right. Charge too much and customers leave; charge too little and you don't cover costs. You need four core pricing strategies, the markup and margin math, a set of other strategies, pricing power and elasticity, and the legal limits on pricing."]},{"id":6,"name":"Place and Channels (2.6)","optional":false,"sections":[{"name":"Channels and intermediaries","cards":[{"term":"Brick-and-mortar","def":"Physical stores customers visit in person.","hook":"A real building.","asks":[{"q":"A bookstore sells only in its two physical shops downtown. This is:","right":"Brick-and-mortar","wrong":[["An online marketplace, because customers can look up the store's address on their phones","Selling happens in physical stores."],["B2B","Sells to individuals."],["An intermediary only","It's a retailer, but the format is brick-and-mortar."]],"exp":"Physical stores are brick-and-mortar."},{"q":"What is the BEST reason a mattress brand opens brick-and-mortar stores?","right":"Customers want to try it in person","wrong":[["Physical stores always cost less to run than a website does, so the brand saves money","Usually costlier."],["Online selling is illegal","No."],["To avoid all customers","No."]],"exp":"Place should match how customers want to buy."}]},{"term":"Online marketplace","def":"A website or app where customers buy, such as Amazon.","hook":"Shop on a screen.","asks":[{"q":"A small candle maker sells through Amazon. Amazon is serving as:","right":"An online marketplace","wrong":[["A brick-and-mortar store, because Amazon owns many large warehouses all around the country","Customers shop on a website."],["A direct channel","Amazon is in the middle."],["A supplier","It sells, not supplies."]],"exp":"Websites and apps where people buy are online marketplaces."},{"q":"What is the MAIN benefit for the candle maker of selling through an online marketplace?","right":"Reaching many shoppers quickly","wrong":[["Full control over how its candles are displayed and priced on every page of the site","Marketplaces limit control."],["No fees","Marketplaces charge fees."],["No shipping","Still ships."]],"exp":"Marketplaces bring reach."}]},{"term":"Marketing channel","def":"The path a product takes from producer to customer; the final stage of the supply chain.","hook":"Also called a distribution channel.","asks":[{"q":"Which statement about marketing channels is correct?","right":"They're the last stage of the supply chain","wrong":[["They're the first stage of the supply chain, where raw materials are gathered from suppliers","That's the start."],["They only include stores","Also websites, distributors."],["They're the same as ads","Ads are promotion."]],"exp":"Channels move finished products to customers: the final stage."},{"q":"A farm sells apples to a distributor, who sells to grocery stores, who sell to shoppers. What is this whole path?","right":"A marketing channel","wrong":[["A promotional mix, because each business in the path helps to advertise the farm's apples","It's the path to the customer."],["A sales funnel","That's customer decision steps."],["A product life cycle","No."]],"exp":"The path from producer to customer is a marketing channel."}]},{"term":"Intermediary","def":"A business in the middle that helps move a product from producer to customer, such as a wholesaler, distributor or retailer.","hook":"The middleman.","asks":[{"q":"In \"cereal maker → grocery store → shopper,\" which is the intermediary?","right":"The grocery store","wrong":[["The cereal maker, because it is in the middle of the process between the farm and the store","It's the producer."],["The shopper","The final customer."],["The cereal","The product."]],"exp":"Businesses between producer and customer are intermediaries."},{"q":"What does a business MOSTLY give up by using intermediaries?","right":"Some control and money per unit","wrong":[["All of its customers, because intermediaries are never allowed to share any sales with producers","Too extreme."],["Its brand name","No."],["Its factory","No."]],"exp":"Intermediaries bring reach but less control and less money per unit."}]},{"term":"B2C","def":"Selling to individual customers, through retail stores, company websites or online marketplaces.","hook":"Business to consumer.","asks":[{"q":"A hoodie brand sells on its own online store to teens. This is:","right":"B2C","wrong":[["B2B, because the hoodie brand is a business and it is selling its products online","The buyers are individuals."],["Indirect","No middleman."],["Wholesale","Not bulk to businesses."]],"exp":"Selling to individual customers is B2C."},{"q":"Your class answer key classifies \"cereal → grocery store → shoppers\" as B2C. Why?","right":"The final customers are individuals","wrong":[["Because the grocery store is a business that buys the cereal from the cereal company first","That step is B2B, but the key goes by final customer."],["Because it's direct","It's indirect."],["Because cereal is cheap","Price doesn't decide."]],"exp":"Classify by the final customer."}]},{"term":"B2B","def":"Selling to other businesses, such as through wholesalers, distributors or industrial suppliers.","hook":"Business to business.","asks":[{"q":"A software company sells accounting tools to small businesses through its website. This is:","right":"B2B","wrong":[["B2C, because the software company sells its products through its own website online","The buyers are businesses."],["Indirect","It's direct."],["Brick-and-mortar","Online."]],"exp":"Selling to other businesses is B2B."},{"q":"Amazon earns most of its profit from AWS, which sells cloud services to companies. What does this show?","right":"B2B can be very profitable","wrong":[["Amazon only sells to businesses and has stopped selling products to individual customers","It does both."],["B2B is always direct","Not necessarily."],["Amazon is a nonprofit","No."]],"exp":"A firm can do both B2C and B2B; AWS is B2B."}]},{"term":"Direct channel","def":"Selling to customers with no businesses in between, such as through the company's own website or stores.","hook":"Nike.com.","asks":[{"q":"A jewelry maker sells only through its own website. Which channel is this?","right":"Direct","wrong":[["Indirect, because the jewelry is shipped to customers by a delivery company like UPS","Shipping isn't selling through a middleman."],["B2B","Sells to individuals."],["Multichannel","One channel."]],"exp":"No intermediaries = direct."},{"q":"A farm sells vegetables straight to a local restaurant. How is this classified?","right":"B2B, direct","wrong":[["B2C, indirect, because the restaurant will later serve the vegetables to its own customers","The farm sells straight to a business."],["B2C, direct","The buyer is a business."],["B2B, indirect","No middleman."]],"exp":"Farm to restaurant is B2B and direct."}]},{"term":"Indirect channel","def":"Selling through one or more middlemen.","hook":"Nike through Foot Locker.","asks":[{"q":"Nike sells shoes through Foot Locker. Which channel is this?","right":"Indirect","wrong":[["Direct, because the shoes still carry the Nike name and logo when they are sold at Foot Locker","Foot Locker is an intermediary."],["B2B only","Final buyers are individuals."],["Brick-and-mortar only","The question is the channel type."]],"exp":"Selling through a retailer is indirect."},{"q":"A school district buys desks through a distributor. How is this classified?","right":"B2B, indirect","wrong":[["B2C, direct, because the desks will be used by individual students sitting in the classrooms","The buyer is a district, through a distributor."],["B2B, direct","There's a distributor."],["B2C, indirect","The buyer is an organization."]],"exp":"Organization buyer through an intermediary = B2B, indirect."}]}],"intro":["A marketing channel is the path from producer to customer, the final stage of the supply chain. Selling yourself (company website, own stores) is a direct channel; selling through wholesalers, distributors or retailers is indirect. Separately, a business sells either to individual customers (B2C) or to other businesses (B2B)."]},{"name":"Choosing channels","cards":[{"term":"Direct channel advantages","def":"Control over pricing, branding and the customer experience, plus customer data and relationships.","hook":"Control.","asks":[{"q":"Vitality Drops sells only on its website. What is its BIGGEST advantage?","right":"Control over price and experience","wrong":[["Reaching the most customers in the shortest time without spending money on its own logistics","That's an indirect advantage."],["Lower setup costs","Direct is costlier."],["Free shelf space","No shelves."]],"exp":"Direct channels give control and customer data."},{"q":"Nike pulled out of several retailers. Which benefit was it MOST likely seeking?","right":"More control and profit per sale","wrong":[["Wider reach, because fewer stores would mean more customers could find its shoes everywhere","Reach shrank."],["Lower costs","Direct costs more to set up."],["More shelf space","Fewer shelves."]],"exp":"Direct selling means control, no clearance discounting and keeping all the profit."}]},{"term":"Direct channel drawbacks","def":"Costly to set up, limited reach, and the business needs its own logistics, sales and service expertise.","hook":"Expensive, smaller reach.","asks":[{"q":"After Nike left many retailers, brands like On and Hoka took share. What drawback does this show?","right":"Less reach and shelf visibility","wrong":[["Less control over pricing, because Nike could no longer decide what its shoes would cost","Direct gives more control."],["Higher taxes","No."],["Lower quality","No."]],"exp":"Direct channels limit reach."},{"q":"If Vitality Drops stays direct and goes national, what will it have to build itself?","right":"Nationwide shipping and service","wrong":[["A relationship with a national wholesaler that already has trucks and warehouses in every state","That would be indirect."],["A new tagline","Not the channel issue."],["A patent","No."]],"exp":"Direct channels need their own logistics, sales and service expertise."}]},{"term":"Indirect channel advantages","def":"Lower cost, faster reach to more customers, and partners' expertise and networks.","hook":"Reach.","asks":[{"q":"A protein-bar startup partners with a national wholesaler. What is the MAIN benefit?","right":"Access to a larger network","wrong":[["More control over the price that every store charges customers for each protein bar","That's a direct advantage."],["No competition","Shelves are crowded."],["Higher price per bar","Less money per unit."]],"exp":"Indirect channels bring reach through partners' networks."},{"q":"Which business would gain MOST from an indirect channel?","right":"A new snack brand with no stores","wrong":[["A hair salon that can only serve customers who come into its building for haircuts","Salons can only sell direct."],["A luxury brand that wants total control over its image","Prefers direct."],["A local bakery's walk-in counter","Already direct."]],"exp":"Indirect channels let new brands scale fast."}]},{"term":"Indirect channel drawbacks","def":"Less control over price, promotion and display, less money per unit, and competition for shelf space.","hook":"Less control.","asks":[{"q":"A new drink gets a bottom shelf while Gatorade takes eye-level space. Which drawback is this?","right":"Less control over display","wrong":[["Higher setup costs, because the drink company had to build its own store to sell the product","It's in someone else's store."],["Less customer data only","The issue is shelf placement."],["Legal restrictions","No law here."]],"exp":"Indirect channels mean less control over display and competition for shelves."},{"q":"A brand earns $8 per item selling direct but $5 through a retailer. Why?","right":"The intermediary takes a share","wrong":[["The retailer is breaking the law by charging customers less than the brand's own website","Not stated."],["Costs are higher at retail","Not the reason."],["Direct sales are taxed less","Not stated."]],"exp":"Intermediaries mean less money per unit."}]},{"term":"Multichannel distribution","def":"Using several channels at once to balance reach, cost and control, as Apple does with its own stores, website and other retailers.","hook":"More than one path.","asks":[{"q":"Apple sells through its own stores, its website and other retailers. This is:","right":"Multichannel distribution","wrong":[["A direct channel only, because Apple owns the stores and the website where people buy","It also uses third-party retailers."],["Indirect only","It also sells direct."],["A bundle","Not pricing."]],"exp":"Using several channels at once."},{"q":"Why would a brand use several channels at once?","right":"To balance reach, cost and control","wrong":[["Because using one channel is always against the law for any business that sells nationally","No."],["To avoid all costs","No."],["To skip marketing","No."]],"exp":"Mixing channels balances reach, cost and control."}]}],"intro":["Direct channels give control over price, branding and the customer experience, plus customer data, but they cost more and reach fewer people. Indirect channels reach more people faster and cost less to set up, but the business gives up control and money per unit. Many firms use several channels at once. Nike pulled out of many retailers for control and margin, then lost shelf visibility to rivals."]},{"name":"Legal limits on channels","cards":[{"term":"Channel restrictions","def":"Laws requiring some products to reach customers only through specific routes, such as prescription drugs through licensed pharmacies.","hook":"The law picks the channel.","asks":[{"q":"Vitality Drops' new formula is pharmaceutical-grade. Why must it go through licensed pharmacies?","right":"A law requires it for health and safety","wrong":[["Pharmacies always charge the lowest prices, so selling there will win the most customers","The reason is legal."],["Its website is too slow","No."],["To create scarcity","No."]],"exp":"Some products must use specific channels for health and safety."},{"q":"Some states ban buying a new Tesla in person from Tesla. What does this show?","right":"Laws can limit a firm's channels","wrong":[["Tesla does not want to sell cars directly to customers in any state of the United States","It's the law, not Tesla's choice."],["Cars can't be sold online","No."],["Tesla is a nonprofit","No."]],"exp":"State franchise laws require dealers: a legal channel limit."}]},{"term":"License","def":"Official government permission to sell or distribute certain products under set rules.","hook":"Permission to sell.","asks":[{"q":"A new restaurant must get permission from the city before serving food. What does it need?","right":"A license","wrong":[["A trademark, because the city must approve the name of the restaurant before it can open","That protects a brand name."],["A patent","For inventions."],["A slogan","No."]],"exp":"Government permission to sell under rules is a license."},{"q":"Which business MOST clearly needs a license to sell its product?","right":"An alcohol distributor","wrong":[["A T-shirt company selling on its own website to teenagers who like music","No special license in your notes."],["A bookstore","No."],["A phone-case brand","No."]],"exp":"Alcohol must go through licensed distributors and retailers."}]}],"intro":["Some products can only be sold through certain channels for health and safety, even when another channel would be cheaper. Research the rules before choosing a channel."]}],"intro":["Topic 2.6 is about getting the product to the customer. Place isn't just a store: it's reaching the right customer at the right time in the right way. You need the kinds of channels (direct or indirect, B2C or B2B), the trade-offs between them, and the laws that limit how some products are sold."]},{"id":7,"name":"Promotion (2.7)","optional":false,"sections":[{"name":"Campaigns and the promotional mix","cards":[{"term":"Purposes of promotion","def":"Communicating with customers to inform them, persuade them and build loyalty.","hook":"Inform, persuade, loyalty.","asks":[{"q":"A brand-new fitness app's first ads explain what it does and how it works. Which purpose is this MAINLY?","right":"Informing","wrong":[["Building loyalty, because the app wants customers to keep using it for many years to come","New customers need to learn first."],["Pricing","Not promotion."],["Distribution","Not promotion."]],"exp":"Promotion informs, persuades and builds loyalty; new products need informing."},{"q":"A coffee chain emails its regulars a thank-you reward. Which purpose is this MAINLY?","right":"Building loyalty","wrong":[["Informing, because the email tells customers about a reward that they did not know about yet","The goal is keeping regulars."],["Persuading new buyers","They're regulars."],["Setting prices","No."]],"exp":"Rewarding existing customers builds loyalty."}]},{"term":"Marketing campaign","def":"A coordinated effort built around one goal, such as a launch, rebrand or sales boost, using one or more tools.","hook":"One goal, many tools.","asks":[{"q":"A shoe brand runs TV ads, influencer posts and store events, all around the launch of one new shoe. This is:","right":"A marketing campaign","wrong":[["A sales funnel, because the different activities move customers toward buying the shoe","A funnel is the customer's steps."],["A product life cycle","No."],["A pricing strategy","No."]],"exp":"A coordinated effort around one goal is a campaign."},{"q":"Why use several tools in one campaign?","right":"To keep one message consistent everywhere","wrong":[["Because using only one tool is against the law for any company with a national campaign","No."],["To confuse rivals","No."],["To raise CAC","No."]],"exp":"Several tools keep the message consistent across platforms."}]},{"term":"Promotional mix","def":"The combination of communication tools a business chooses based on its product, target market and buying situation.","hook":"Pick the tools.","asks":[{"q":"A $5,000 robot mower and a $2 candy bar need different promotion. What decides the mix?","right":"Product, target market and buying situation","wrong":[["Only the size of the company's budget, since bigger budgets always use exactly the same tools","The product and buyer matter."],["Only the founder's favorite tool","No."],["Only rivals' choices","Too narrow."]],"exp":"The mix depends on product, target market and buying situation."},{"q":"DoorDash uses social ads, in-app messages, a 20% new-customer discount and community events. What is this set of tools?","right":"Its promotional mix","wrong":[["Its marketing channel, because all of these activities help get food delivered to customers","Channels move the product."],["Its sales funnel","The funnel is customer steps."],["Its pricing strategy","Only one tool is pricing-related."]],"exp":"The combination of promotion tools is the promotional mix."}]}],"intro":["Promotion is the right message to the right audience at the right time. A marketing campaign uses one or more tools around one goal, such as a launch or a rebrand. The promotional mix is the combination of tools a business picks, depending on the product, the target market and the buying situation. Tools can overlap: an emailed coupon is both direct marketing and a sales promotion."]},{"name":"The five tools","cards":[{"term":"Media advertising","def":"Mass communication through TV, radio, print, billboards, websites or online platforms, reaching many people at once; best for awareness.","hook":"Reach many at once.","asks":[{"q":"A soda brand runs a Super Bowl TV ad. Which tool is this?","right":"Media advertising","wrong":[["Public relations, because millions of people will talk about the commercial after the game","It's a paid mass message."],["Direct marketing","Not targeted individually."],["Personal selling","No salesperson."]],"exp":"Mass communication to many at once is media advertising."},{"q":"Which product is media advertising BEST suited for?","right":"A widely used product needing awareness","wrong":[["A custom $2 million machine sold to just a handful of factories after months of meetings","Personal selling fits that."],["A one-of-a-kind painting","Too narrow an audience."],["A service for one client","No."]],"exp":"Media ads build awareness for widely used products."}]},{"term":"Social media","def":"Platforms where users create, share and interact with content, such as Instagram and YouTube.","hook":"Users make the content.","asks":[{"q":"Which platform feature makes social media different from TV?","right":"Users create and share content","wrong":[["It reaches only older viewers who watch the evening news on a big television at home","No."],["It can't be targeted","It can."],["It costs nothing","Ads cost money."]],"exp":"Social media platforms let users create, share and interact."},{"q":"A brand's fans post videos of themselves using its product. What advantage of social media does this show?","right":"Customers spread the message","wrong":[["The brand now has full control over every message that is said about its products online","Less control, not more."],["It's a sales promotion","No discount."],["It's personal selling","No salesperson."]],"exp":"Users creating and sharing content spreads the brand."}]},{"term":"Personal selling","def":"A salesperson working with a customer one-on-one to explain, answer questions and demonstrate.","hook":"Car dealership.","asks":[{"q":"SunCut gives one-on-one demos of its $5,000 solar mower at trade shows. Which tool?","right":"Personal selling","wrong":[["Media advertising, because many people at the trade show will walk by and see the mower","One-on-one demos are personal selling."],["Sales promotion","No discount."],["PR","It's asking for a sale."]],"exp":"A salesperson demonstrating face to face is personal selling."},{"q":"Why is personal selling usually NOT used for chewing gum?","right":"It's too costly for a cheap routine buy","wrong":[["Because chewing gum is a consequential purchase that needs a lot of detailed explanation","It's routine."],["A law forbids it","No."],["Gum has no customers","No."]],"exp":"Personal selling fits expensive, complex purchases."}]},{"term":"Sales pitch","def":"A short presentation of the value proposition meant to persuade.","hook":"Why buy it, fast.","asks":[{"q":"A founder has 90 seconds to explain why investors should back her product. What is she giving?","right":"A sales pitch","wrong":[["A press release, because the founder is sharing information about her company with the public","She's persuading investors directly."],["A tagline","Too short."],["A focus group","No."]],"exp":"A short persuasive presentation of the value proposition is a pitch."},{"q":"What should a sales pitch focus on MOST?","right":"The value proposition","wrong":[["A complete list of every cost the company has paid since it was founded several years ago","Not persuasive."],["The founder's hobbies","No."],["Rivals' slogans","No."]],"exp":"A pitch presents why customers should choose the product."}]},{"term":"Consequential purchase","def":"A big or complex buying decision that needs details, demonstrations and personal contact.","hook":"Cars, appliances.","asks":[{"q":"Which is MOST clearly a consequential purchase?","right":"A family buying its first car","wrong":[["A teenager grabbing a pack of gum at the register while waiting to pay for gas","Routine."],["Buying toothpaste","Routine."],["Buying a soda","Routine."]],"exp":"Big, complex decisions are consequential."},{"q":"SunCut's mower costs $5,000. Which promotion tool fits its buyers BEST?","right":"Personal selling with demos","wrong":[["A coupon in the Sunday newspaper offering fifty cents off the price of a new mower","Too small and impersonal."],["Pop-up ads only","Not enough detail."],["Skywriting","No detail."]],"exp":"Consequential purchases need detail, demos and personal contact."}]},{"term":"Routine purchase","def":"An everyday buying decision that needs little information and suits mass media or direct marketing.","hook":"Toothpaste.","asks":[{"q":"Which tool BEST fits a routine purchase like paper towels?","right":"Media advertising","wrong":[["Personal selling, with a salesperson visiting each home to demonstrate how to use a towel","Far too costly for a routine buy."],["Trade-show demos","Overkill."],["Private meetings","No."]],"exp":"Routine purchases work with mass media or direct marketing."},{"q":"Why do routine purchases need little promotion detail?","right":"Buyers already know the product","wrong":[["Because routine products are always the most expensive items that a household buys each year","Usually cheap."],["A law limits it","No."],["They have no rivals","Many rivals."]],"exp":"Routine buys are familiar and low-risk."}]},{"term":"Sales promotion","def":"Short-term incentives such as discounts, coupons, rebates and BOGO deals that drive quick decisions or clear inventory, not long-term loyalty.","hook":"Act now.","asks":[{"q":"A store runs \"Buy one, get one 50% off\" to clear winter coats. Which tool?","right":"Sales promotion","wrong":[["Public relations, because shoppers will feel good about the store after getting a deal on coats","It's a short-term incentive."],["Personal selling","No salesperson."],["Media advertising","The deal itself is the tool."]],"exp":"Short-term incentives to clear inventory are sales promotions."},{"q":"What is a sales promotion NOT good for?","right":"Building long-term loyalty","wrong":[["Getting customers to make a quick decision to buy before a limited-time offer runs out","That's what it's for."],["Clearing inventory","It does that."],["Boosting short-term sales","It does that."]],"exp":"Sales promotions drive quick action, not lasting loyalty."}]},{"term":"Direct marketing","def":"Tailored messages sent to targeted customers through emails, flyers, brochures or texts, with responses that can be tracked.","hook":"Addressed to you.","asks":[{"q":"A pet store emails customers who bought puppy food a coupon for puppy toys. Which tool is this?","right":"Direct marketing (and a sales promotion)","wrong":[["Media advertising, because the email is sent to many customers on the same day by the store","It's targeted to specific buyers."],["Public relations","It asks for a sale."],["Personal selling","No salesperson."]],"exp":"Tools overlap: a targeted email with a coupon is both."},{"q":"What is a key advantage of direct marketing?","right":"Responses can be tracked","wrong":[["It reaches everyone in the country with exactly the same message at the very same time","That's mass media."],["It needs no customer data","It depends on data."],["It's always free","No."]],"exp":"Tailored messages to targeted customers can be measured."}]},{"term":"Public relations","def":"Building a positive reputation through press releases, reviews, interviews, sponsorships and community events, without asking for a sale.","hook":"Goodwill, not a sale.","asks":[{"q":"SunCut hosts a free \"Green Earth\" festival that the local news covers. Which tool?","right":"Public relations","wrong":[["Sales promotion, because the festival is free for everyone in town to attend this weekend","No incentive to buy."],["Media advertising","Not a paid ad."],["Direct marketing","Not targeted messages."]],"exp":"Community events that build goodwill are PR."},{"q":"Why is PR called indirect marketing?","right":"It doesn't ask customers to buy now","wrong":[["Because it is always handled by an intermediary such as a wholesaler or a large retailer","Not about channels."],["Because it's illegal","No."],["Because it's online","Not necessarily."]],"exp":"PR builds image and trust rather than pushing an immediate sale."}]}],"intro":["The five tools of the promotional mix each do a different job. Media advertising reaches many people at once. Personal selling gives one-on-one detail for big purchases. Sales promotions are short-term deals. Direct marketing sends tailored messages to targeted customers. Public relations builds a positive image without asking for a sale."]},{"name":"Sales funnel and digital marketing","cards":[{"term":"Sales funnel","def":"The steps a customer goes through from first learning about a product to buying it.","hook":"Wide at the top, narrow at the bottom.","asks":[{"q":"A shopper sees an Instagram ad, reads a review, talks to a salesperson, gets an email code, then buys. What does this show?","right":"A sales funnel","wrong":[["A product life cycle, because the shopper moves through several stages before buying the item","That's about the product's sales over time."],["A marketing channel","Not the product's path."],["A focus group","No."]],"exp":"The steps from first learning to buying form the sales funnel."},{"q":"Why do businesses track their sales funnel?","right":"To see where people drop out","wrong":[["To find out how much each product costs to make so that they can set a price with a markup","That's pricing."],["To count employees","No."],["To pick a tagline","No."]],"exp":"Tracking the funnel improves strategy and lowers CAC."}]},{"term":"Digital marketing","def":"Promotion through websites, social media, email and apps; targeted, personal, often cheaper and measurable.","hook":"Measurable reach.","asks":[{"q":"SunCut moves 40% of its budget from TV to social media. What is the BIGGEST advantage?","right":"Targeting and measurable results","wrong":[["Reaching every single household in the country at the very same moment with one message","That's mass TV's strength."],["No need for customer data","It uses data."],["It's always free","No."]],"exp":"Digital is targeted, personal, often cheaper and measurable."},{"q":"Why did DoorDash lean on digital marketing?","right":"Its customers order in the app","wrong":[["Because television advertising is illegal for food delivery companies in most of the states","No."],["Digital can't be measured","It can."],["Its customers don't use phones","They do."]],"exp":"Promote where the target customer already is."}]},{"term":"Big data","def":"Huge amounts of information about customer behavior, such as ads clicked, products viewed and which messages led to sales.","hook":"Every click recorded.","asks":[{"q":"A store analyzes millions of clicks, views and purchases to see which ads lead to sales. It's using:","right":"Big data","wrong":[["A focus group, because the store is learning how its customers decide what to buy online","Millions of data points, not a discussion."],["A customer profile","One made-up person."],["Secondary research only","It's the store's own data."]],"exp":"Huge amounts of behavior data are big data."},{"q":"Which question can big data answer BEST?","right":"Which ad message led to the most sales","wrong":[["Why one loyal customer feels emotionally attached to the brand after years of shopping there","That needs qualitative research."],["What the founder believes","No."],["What a law requires","No."]],"exp":"Big data tracks behavior at scale."}]},{"term":"Metric","def":"A measurement of performance.","hook":"A number to track.","asks":[{"q":"Which is a metric?","right":"Number of website visitors per day","wrong":[["A slogan that the company plans to use in its next television advertising campaign","Not a measurement."],["A brand logo","No."],["A customer profile","No."]],"exp":"A metric is a measurement of performance."},{"q":"Why do digital marketers rely so much on metrics?","right":"To see what's working and adjust","wrong":[["Because metrics replace the need to know anything at all about customers or competitors","Too extreme."],["To raise prices","No."],["A law requires them","No."]],"exp":"Measuring performance lets marketers change quickly."}]},{"term":"Impressions","def":"The number of times an ad is displayed.","hook":"Times shown.","asks":[{"q":"An ad was displayed 50,000 times. What is 50,000?","right":"Impressions","wrong":[["Clicks, because every person who saw the ad on their screen also clicked on it to learn more","Seeing isn't clicking."],["Conversions","Not purchases."],["ROAS","A ratio of dollars."]],"exp":"Impressions count how many times an ad is shown."},{"q":"An ad has 100,000 impressions but almost no clicks. What's the BEST conclusion?","right":"Many saw it, but it didn't persuade","wrong":[["Nobody saw the ad at all, so the company needs to spend more money to get it displayed","100,000 displays."],["Sales are high","No evidence."],["It's a PR win","No."]],"exp":"High impressions with low clicks means the message isn't working."}]},{"term":"Click-through rate (CTR)","def":"The percentage of ad viewers who tap or select it.","hook":"Clicks ÷ impressions × 100.","asks":[{"q":"An ad had 20,000 impressions and 400 clicks. What is the CTR?","right":"2%","wrong":[["5%, because four hundred clicks divided by twenty thousand impressions is five percent","400 ÷ 20,000 = 0.02."],["50%","Divided wrong."],["0.2%","Off by ten."]],"exp":"400 ÷ 20,000 × 100 = 2%."},{"q":"Ad A: 1,000 clicks on 50,000 impressions. Ad B: 600 clicks on 20,000. Which has the higher CTR?","right":"Ad B (3%)","wrong":[["Ad A, because it received four hundred more clicks than Ad B did during the same month","CTR is a rate, not a count."],["They're equal","2% vs. 3%."],["Ad A (3%)","A is 2%."]],"exp":"A: 2%. B: 600 ÷ 20,000 = 3%."}]},{"term":"Conversion rate","def":"The percentage of visitors who take the desired action, such as buying.","hook":"Conversions ÷ visitors × 100.","asks":[{"q":"A website had 5,000 visitors and 150 bought something. What is its conversion rate?","right":"3%","wrong":[["33%, because one hundred fifty buyers out of five thousand visitors works out to one in three","150 ÷ 5,000 = 0.03."],["150%","No."],["0.3%","Off by ten."]],"exp":"150 ÷ 5,000 × 100 = 3%."},{"q":"An A/B test keeps \"Buy Now\" over \"Add to Cart.\" Which metric MOST likely decided it?","right":"Conversion rate","wrong":[["Impressions, because the Buy Now button was shown to many more visitors than the other one","Both were shown equally; buying decided."],["Market share","No."],["CAC only","Not the test metric."]],"exp":"The version with more completed actions wins: conversion rate."}]},{"term":"Return on ad spend (ROAS)","def":"Revenue from advertising ÷ the cost of that advertising.","hook":"Dollars back per ad dollar.","asks":[{"q":"A $2,000 ad campaign brings in $8,000 in sales. What is the ROAS?","right":"4","wrong":[["6, because the eight thousand dollars minus the two thousand dollars equals six thousand dollars","ROAS divides, not subtracts."],["0.25","Divided the wrong way."],["$10,000","Added."]],"exp":"$8,000 ÷ $2,000 = 4."},{"q":"Campaign A: ROAS 1.5. Campaign B: ROAS 5. Which should get more budget, all else equal?","right":"B","wrong":[["A, because a lower return on ad spend means the campaign is cheaper for the business to run","Lower ROAS means less revenue per dollar."],["Neither","B is better."],["Both equally","B earns more per dollar."]],"exp":"Higher ROAS = more revenue per ad dollar."}]}],"intro":["A sales funnel maps the steps from first hearing about a product to buying it, and shows where people drop out. Digital marketing (websites, social media, email, apps) took over much of the budget because it is targeted, personal, cheaper, quick to change and measurable. Four metrics measure it."]}],"intro":["Topic 2.7 is the last P: how a business communicates with customers. Promotion informs, persuades and builds loyalty. You need the five tools of the promotional mix, how a sales funnel moves people toward buying, why digital marketing took over, and the four metrics for measuring it."]}],"sq":[],"flows":[{"id":"F1","title":"From data to a target customer","deck":1,"steps":["Collect customer data (digital, traditional, third-party)","Sort it: demographics (who) and psychographics (why)","Segment: divide customers into similar groups","Target: choose the group most likely to buy","Describe a sample buyer in a customer profile"]},{"id":"F2","title":"The six stages of product development","deck":4,"steps":["Ideation: generate ideas","Validation: test demand, often with an MVP","Design: prototypes, features, cost estimates","Messaging: value proposition and positioning","Production: process, supply chain, small runs","Launch: orders, distribution, marketing to profitable segments"]},{"id":"F3","title":"The product life cycle","deck":4,"steps":["Introduction: low sales; build awareness","Growth: sales speed up, rivals enter; differentiate and promote","Maturity: sales level off; protect share with loyalty and innovation","Decline: sales fall; cut costs, redesign or discontinue"]},{"id":"F4","title":"A sales funnel (example from your slides)","deck":7,"steps":["Sees an Instagram ad (media advertising)","Reads a positive review (public relations)","Talks to a salesperson (personal selling)","Gets an email discount code (direct marketing + sales promotion)","Buys online"]},{"id":"F5","title":"Why customer relationships pay off","deck":1,"steps":["Personal service, rewards, feedback surveys","Happier customers refer friends and buy again","Referrals lower customer acquisition cost (CAC)","Repeat purchases raise customer lifetime value (CLV)"]}],"trees":["THE 4 Ps\nMarketing mix\n├─ Product: features, quality, branding, life cycle\n├─ Price: strategy, markup/margin, elasticity, legal limits\n├─ Place: channels (direct/indirect, B2C/B2B), legal limits\n└─ Promotion: the five tools, sales funnel, digital metrics","MARKET RESEARCH\nMarket research\n├─ Primary (you collect it)\n│  ├─ Quantitative: surveys, experiments, A/B tests\n│  └─ Qualitative: focus groups, interviews\n│     (observation can be either)\n└─ Secondary (someone else collected it)\n   └─ Government reports, census, industry studies, databases","FACTORS THAT INFLUENCE BUYING\nBuying decision\n├─ Personal: age, income, education, occupation, lifestyle\n├─ Psychological: beliefs, values, motivations, perceptions, past experiences\n├─ Social and cultural: family, friends, culture, celebrities, social media\n└─ Situational: time, location, mood, store layout, availability","PROMOTIONAL MIX\nPromotion\n├─ Media advertising (mass, awareness)\n├─ Personal selling (consequential purchases)\n├─ Sales promotion (short-term deals)\n├─ Direct marketing (targeted, trackable)\n└─ Public relations (goodwill, indirect)"],"tables":[{"title":"The 4 Ps","deck":4,"rows":[["P","The decision","Example"],["Product","Features, quality, how it solves the problem","Adding a waterproof case"],["Price","What customers pay","Launching at $1.99 a month"],["Place","Where and how customers get it","Selling through a delivery app"],["Promotion","How you inform and persuade","Instagram ads, sponsorships"]]},{"title":"Research methods","deck":3,"rows":[["Method","Primary or secondary","Data","Best for"],["Survey","Primary","Quantitative","Many people, same questions"],["Focus group","Primary","Qualitative","Why, from a small engaged group"],["Interview","Primary","Qualitative","Why, from individuals"],["Experiment","Primary","What people do","Testing one change"],["Observation","Primary","What people do","Natural behavior"],["A/B test","Primary","What people do","Choosing between two versions"],["Reports, census, databases","Secondary","Either","Market size, trends; cheap and fast"]]},{"title":"Which chart?","deck":3,"rows":[["Chart","Shows","Example"],["Bar","Compare separate items","Revenue of 3 products; customers by store"],["Stacked bar","Items and their subcategories","Quarterly sales of 3 products"],["Line","Trend over time","Sales 2018 to 2023"],["Pie","Parts of a whole","Market share; expenses by category"]]},{"title":"Core pricing strategies","deck":5,"rows":[["Strategy","Price is set by","Fits","Example"],["Value-based","Value to the customer","Unique, high-quality products","AquaPure's patented filter"],["Cost-based","Cost + markup","Costs easy to calculate","Contractors"],["Competitive","Rivals' prices","Many sellers, similar products","Southwest matching fares"],["Penetration","A low start to win share","Price-sensitive, competitive markets","Disney+ at launch"]]},{"title":"Other pricing strategies","deck":5,"rows":[["Strategy","Giveaway","Example"],["Subscription","Recurring fee","$12 a month streaming"],["Bundle","Package for less","Burger + fries + drink"],["Premium","High price signals status","$8,000 watch"],["Freemium","Free basic, paid extras","Free game, paid upgrades"],["Psychological","Ends in .99","$29.99"],["Dynamic","Changes with demand or time","Uber, holiday hotels"],["Loss leader","One item below cost","Costco hot dog; milk"],["Pay-what-you-want","Customer picks","Museum with a $1 minimum"]]},{"title":"Channel types (your class drill)","deck":6,"rows":[["Example","B2C or B2B","Direct or indirect"],["Software sold to a small business on the website","B2B","Direct"],["Cereal to a grocery store to shoppers","B2C","Indirect"],["Desks to a school district through a distributor","B2B","Indirect"],["Hoodies on the brand's own store","B2C","Direct"],["Cars through dealers","B2C","Indirect"],["Farm to restaurant","B2B","Direct"]]},{"title":"Direct vs. indirect channels","deck":6,"rows":[["","Direct","Indirect"],["Advantages","Control over price, branding, experience; customer data","Lower cost; faster, wider reach; partners' networks"],["Drawbacks","Costly to set up; limited reach; needs own logistics and service","Less control; less money per unit; fight for shelf space"],["Example","Nike.com","Nike through Foot Locker"]]},{"title":"The five promotion tools","deck":7,"rows":[["Tool","What it is","Best for","Example"],["Media advertising","Mass messages","Awareness; widely used products","TV, billboards, social ads"],["Personal selling","One-on-one with a salesperson","Consequential purchases","SunCut's trade-show demos"],["Sales promotion","Short-term incentives","Quick decisions; clearing stock","BOGO, coupons"],["Direct marketing","Tailored messages to targets","Special offers; trackable","Emails, flyers, texts"],["Public relations","Positive image, no sale asked","Trust and goodwill","Press releases, community events"]]},{"title":"Cialdini's seven principles","deck":2,"rows":[["Principle","People are swayed by…","Example"],["Scarcity","Limited supply","\"Only 3 left!\""],["Authority","Experts","\"Dentists recommend\""],["Consensus","What others do","\"Best seller\""],["Liking","People they like","A favorite creator"],["Reciprocity","Returning a favor","Free sample"],["Consistency","Past commitments","A signed pledge"],["Unity","Shared identity","\"By runners, for runners\""]]}],"watch":[{"deck":1,"text":"Lifetime value has two names in your materials: CLV (customer lifetime value) on the slides and worksheet, LTV in the Jamba Juice answers. Same idea."},{"deck":1,"text":"The 2.1 worksheet's CAC problem has no answer key. It lists $8,000 online ads, $2,000 social media, $1,500 training new employees, 400 new customers and 1,200 products sold. Reading it as ($8,000 + $2,000) ÷ 400 = $25 (training isn't an acquisition cost; products sold is a distractor). VERIFY with your teacher."},{"deck":2,"text":"Your 2.2 slides couldn't be opened, so this deck comes from your own filled-in 2.2 notes. VERIFY anything your teacher added in class."},{"deck":3,"text":"Your worksheet adds observation and A/B tests to primary research and adds census data, market reports and news articles to secondary research. The slides list fewer. Both lists are right."},{"deck":4,"text":"Product-market fit has two definitions: your Unit 1 study guide says at least 40% of surveyed users would be \"very disappointed\" without the product; your 2.4 slides say there is enough demand to make the business viable. Same idea, different test."},{"deck":4,"text":"The worksheet's blank \"A prototype tests the PRODUCT; an MVP tests the ___\" is most likely \"market\" (market demand). VERIFY."},{"deck":4,"text":"In Unit 1 (1.4), the MVP comes after validation and solution development. In 2.4, the MVP is used during the validation stage. Same tool, placed differently by the two lessons."},{"deck":5,"text":"Markup and margin use the same profit but divide by different numbers: markup by cost, margin by price. The same item always has a higher markup than margin."},{"deck":5,"text":"Your slides call a loss leader \"a form of penetration pricing.\""},{"deck":6,"text":"The worksheet's blank \"Using multiple channels = ___ distribution\" is most likely \"multichannel.\" VERIFY."},{"deck":6,"text":"Your class drill classifies by the final customer, so cereal sold through a grocery store to shoppers is B2C, even though the maker sells to the store."},{"deck":6,"text":"Costco: your slides call it direct and B2C (its own warehouses and website, members), even though businesses shop there too."}],"practice":{"sections":[{"name":"Set A: Customers and research (2.1-2.3)","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"P1":{"title":"Two coffee shops' customers","attr":"Practice scenario: comparing customer data.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["A coffee company surveyed customers at two locations."],"table":[["","Downtown shop","Campus shop"],["Most common age","30 to 45","18 to 22"],["Top reason for visiting","Fast service before work","A place to study with friends"],["Visits per week","4","2"],["Average spend per visit","$6","$4"]]},"P2":{"title":"FreshFold laundry pods","attr":"Practice scenario: a new product and its research.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["FreshFold wants to sell plant-based laundry pods. It reads a government report on household spending, interviews 12 parents about how they do laundry, and shows two package designs to website visitors to see which one sells more. It also wonders whether it can make pods that dissolve in cold water, since its factory has never made pods before."]}},"questions":[{"id":"TA-1","type":"mcq","skill":"Data","topic":"2.1","stem":"Which difference between the shops is psychographic?","options":["The most common age of the customers who come into each of the two coffee shops","Visits per week","Average spend","Why customers visit"],"ans":3,"exp":"Reasons and lifestyle are psychographic.","why":["Age is demographic.","Behavior data.","Behavior data.",""],"src":"P1"},{"id":"TA-2","type":"mcq","skill":"CLV","topic":"2.1","stem":"Which shop's typical customer likely has the higher lifetime value per year?","options":["Downtown","Campus, because students will keep coming to the shop for all four years of college","They're equal","Can't tell"],"ans":0,"exp":"4 × $6 = $24 a week vs. 2 × $4 = $8.","why":["","Downtown: $24/week vs. $8/week.","No.","The table shows spending."],"src":"P1"},{"id":"TA-3","type":"mcq","skill":"Segmentation","topic":"2.1","stem":"What is the company doing by treating these as two groups?","options":["Targeting, because it has picked the downtown customers as the only group it wants to serve","A/B testing","Segmentation","Branding"],"ans":2,"exp":"Dividing customers into similar groups is segmentation.","why":["It divided; it hasn't chosen yet.","No.","","No."],"src":"P1"},{"id":"TA-4","type":"mcq","skill":"Targeting","topic":"2.1","stem":"For campus, which promotion fits the data BEST?","options":["Faster drive-through lanes for people rushing to work every morning before nine o'clock","Higher prices","Luxury branding","Study-friendly seating and group deals"],"ans":3,"exp":"Match the message to why the segment buys.","why":["That fits downtown.","Not supported.","Not supported.",""],"src":"P1"},{"id":"TA-5","type":"mcq","skill":"Research","topic":"2.3","stem":"The government report on household spending is:","options":["Primary research, because FreshFold is using it to answer a question about its own new product","Secondary research","Qualitative data","A/B testing"],"ans":1,"exp":"Existing data is secondary.","why":["Someone else collected it.","","It's numbers.","No."],"src":"P2"},{"id":"TA-6","type":"mcq","skill":"Research","topic":"2.3","stem":"Interviewing 12 parents MAINLY gives FreshFold:","options":["A reliable percentage of all households that would buy the pods at a given price","Reasons behind laundry habits","Market size","Its CAC"],"ans":1,"exp":"Interviews give qualitative why.","why":["Too few for a percentage.","","Secondary.","No."],"src":"P2"},{"id":"TA-7","type":"mcq","skill":"Research","topic":"2.3","stem":"Showing two package designs and comparing sales is:","options":["A focus group, because FreshFold is learning which design website visitors say they like best","Observation","An A/B test","Secondary research"],"ans":2,"exp":"Two versions, real responses.","why":["It measures what they buy.","It controls the versions.","","New data."],"src":"P2"},{"id":"TA-8","type":"mcq","skill":"DFV","topic":"2.3","stem":"\"Can our factory make pods that dissolve in cold water?\" is a question about:","options":["Feasibility","Desirability, because customers will want pods that work in cold water to save on energy","Viability","Elasticity"],"ans":0,"exp":"Resources, technology and expertise are feasibility.","why":["","The question is whether FreshFold can make it.","Not profit.","No."],"src":"P2"}]},{"name":"Set B: Promotion (2.7)","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"P3":{"title":"Velo e-bikes","attr":"Practice scenario: pricing and promotion.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Velo sells a $2,800 electric bike. Riders can test-ride with a salesperson at weekend events. Velo also posts ads on social media and sponsors a city bike-to-work day that local news covers. In December, it offers $300 off for one week to clear last year's models."]}},"questions":[{"id":"TB-1","type":"mcq","skill":"Promotion","topic":"2.7","stem":"Weekend test rides with a salesperson are:","options":["Sales promotion, because the test rides are free and only offered on a few weekends","Personal selling","PR","Direct marketing"],"ans":1,"exp":"One-on-one demos for a big purchase.","why":["No price incentive; a salesperson demonstrates.","","It asks for a sale.","Not messages."],"src":"P3"},{"id":"TB-2","type":"mcq","skill":"Promotion","topic":"2.7","stem":"Why does personal selling fit Velo's bike?","options":["It's a routine purchase that customers make every week, so they need reminders to buy it","A law requires it","It's cheaper than ads","It's a consequential purchase"],"ans":3,"exp":"Expensive, complex purchases need detail and demos.","why":["$2,800 isn't routine.","No.","Usually costlier.",""],"src":"P3"},{"id":"TB-3","type":"mcq","skill":"Promotion","topic":"2.7","stem":"Sponsoring bike-to-work day with news coverage is:","options":["Media advertising, because the news broadcast is shown on television to thousands of people","Sales promotion","Public relations","Personal selling"],"ans":2,"exp":"Community events that build goodwill are PR.","why":["It's goodwill, not a paid ad.","No deal.","","No salesperson."],"src":"P3"},{"id":"TB-4","type":"mcq","skill":"Promotion","topic":"2.7","stem":"The one-week $300 discount is MAINLY meant to:","options":["Clear old inventory quickly","Build long-term loyalty with customers who will buy many more bikes from Velo over time","Raise the price","Get a license"],"ans":0,"exp":"Short-term incentives drive quick decisions or clear stock.","why":["","Sales promotions aren't for loyalty.","It lowers it.","No."],"src":"P3"}]},{"name":"Math drills: CAC, markup, margin, CTR, conversion, ROAS","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{},"questions":[{"id":"MM-1","type":"mcq","skill":"Math","topic":"2.5","stem":"A lamp costs $50 and sells for $60. What are its markup and margin?","options":["16.7% markup and 20% margin, because the profit is ten dollars and margin is always larger","20% and 20%","10% and 10%","20% markup, 16.7% margin"],"ans":3,"exp":"$10 ÷ $50 = 20%; $10 ÷ $60 = 16.7%.","why":["Reversed.","Different bases.","Dollars, not percent.",""]},{"id":"MM-2","type":"mcq","skill":"Math","topic":"2.5","stem":"A backpack costs $40. The store wants a 50% markup. What should it charge?","options":["$80, because a fifty percent markup means doubling the amount that the backpack cost to make","$45","$60","$90"],"ans":2,"exp":"$40 × 1.5 = $60.","why":["That's a 100% markup.","Math error.","","No."]},{"id":"MM-3","type":"mcq","skill":"Math","topic":"2.5","stem":"A phone case sells for $25 and costs $15. What is the profit margin?","options":["67%, because the ten dollars of profit should be divided by the fifteen-dollar cost of the case","40%","10%","60%"],"ans":1,"exp":"$10 ÷ $25 = 40%.","why":["That's the markup.","","Dollars, not percent.","Cost ÷ price."]},{"id":"MM-4","type":"mcq","skill":"Math","topic":"2.1","stem":"A business spent $8,000 on online ads and $2,000 on social media, plus $1,500 training new employees. It gained 400 new customers. Using only acquisition costs, what is its CAC?","options":["$28.75, because all three of the amounts the business spent should be divided by the new customers","$25","$20","$10,000"],"ans":1,"exp":"($8,000 + $2,000) ÷ 400 = $25 (your worksheet has no key: VERIFY).","why":["Training isn't an acquisition cost.","","Leaves out social media.","Total, not per customer."]},{"id":"MM-5","type":"mcq","skill":"Math","topic":"2.7","stem":"An ad was shown 80,000 times and clicked 1,200 times. What is its CTR?","options":["15%, because twelve hundred clicks divided by eighty thousand impressions equals fifteen percent","0.15%","1.5%","66.7%"],"ans":2,"exp":"1,200 ÷ 80,000 = 1.5%.","why":["Off by ten.","Off by ten.","","Divided the wrong way."]},{"id":"MM-6","type":"mcq","skill":"Math","topic":"2.7","stem":"A site had 2,400 visitors and 96 bought. What is the conversion rate?","options":["4%","25%, because twenty-four hundred visitors divided by ninety-six buyers is about twenty-five","0.4%","40%"],"ans":0,"exp":"96 ÷ 2,400 = 4%.","why":["","Divided the wrong way.","Off by ten.","Off by ten."]},{"id":"MM-7","type":"mcq","skill":"Math","topic":"2.7","stem":"A $3,000 campaign brought $12,000 in sales. What is the ROAS?","options":["4","9, because twelve thousand dollars minus three thousand dollars leaves nine thousand dollars","0.25","15"],"ans":0,"exp":"$12,000 ÷ $3,000 = 4.","why":["","ROAS divides.","Reversed.","Added."]},{"id":"MM-8","type":"mcq","skill":"Math","topic":"2.1","stem":"Ad A cost $2,400 and brought 80 customers. Ad B cost $1,800 and brought 45. Which has the lower CAC?","options":["Ad B, because it cost six hundred dollars less to run than Ad A did over the same period","Equal","Ad B ($30)","Ad A ($30)"],"ans":3,"exp":"A: $2,400 ÷ 80 = $30; B: $40.","why":["B: $1,800 ÷ 45 = $40.","$30 vs. $40.","B is $40.",""]}]},{"name":"Mock test (40 questions)","mode":"exam","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"N1":{"title":"Peak Smoothies","attr":"Practice scenario: customer data at a smoothie chain.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Peak Smoothies runs 12 shops near colleges. Its rewards app records every order. Managers learned that most app users are 18 to 24 and earn under $30,000 a year, and that in interviews they say they choose Peak because they can customize drinks and order ahead between classes. Last quarter Peak spent money to win new customers and launched a points program to keep them."],"table":[["Item","Last quarter"],["Online ads","$9,000"],["Campus event sponsorships","$3,000"],["New store furniture","$5,000"],["New app customers","600"],["Average yearly spending, rewards member","$420"],["Average yearly spending, non-member","$150"]]},"N2":{"title":"The sneaker drop","attr":"Practice scenario: a product page built to persuade.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["A sneaker brand releases a limited shoe online at 10 a.m. Saturday. The product page shows a counter reading \"Only 212 pairs left,\" a banner saying \"Over 40,000 runners already own our shoes,\" and a quote from a well-known physical therapist praising the shoe's support. Members who signed up for early alerts last year get an email saying, \"You told us you'd be first in line. Here's your link.\"","Many buyers say they decided within minutes. Some later wrote that they were bored at home that morning and \"just clicked.\""]},"N3":{"title":"BrightBite's research plan","attr":"Practice scenario: planning market research for a new snack.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["BrightBite wants to launch a high-protein chip for teen athletes. Its hypothesis: at least 25% of teen athletes would buy the chip at $3 a bag. The marketing team proposed the steps below. Separately, a database shows the four largest snack brands hold most of the market."],"table":[["Step","Plan"],["1","Buy an industry report on the size of the protein-snack market"],["2","Survey 1,000 high school athletes about price and flavor"],["3","Hold 3 focus groups with 8 athletes each"],["4","Sell two bag designs on its website and compare purchases"],["5","Ask office staff, mostly ages 40 to 60, what flavors teens like"]]},"N4":{"title":"TrailCam","attr":"Practice scenario: a product over time.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["TrailCam makes a small, rugged camera for hikers. It tested a hand-built version with 50 hikers in 2019, then launched nationally. The company has used the line \"Built for where you go\" since its founding. Its 2024 campaign line was \"Summer of the Summit.\""],"table":[["Year","Units sold","Competing brands"],["2020","8,000","1"],["2021","35,000","3"],["2022","90,000","6"],["2023","96,000","9"],["2024","95,000","10"]]},"N5":{"title":"Four ways to price a bike shop","attr":"Practice scenario: comparing pricing choices.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Spoke & Gear sells bikes and repairs. The owner is reviewing four items."],"table":[["Item","Cost to shop","Price"],["Basic helmet","$20","$25"],["Custom carbon road bike","$2,400","$4,000"],["Tune-up","$30","$45"],["Bike + lock + lights package","$310","$349 (separately $389)"]]},"N6":{"title":"ColdCase coolers","attr":"Practice scenario: pricing power under pressure.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["ColdCase sells a patented cooler that keeps ice for 10 days. Fans say no other cooler comes close, and sales held steady when ColdCase raised its price from $250 to $300 last year.","This spring, a rival released a nearly identical cooler for $150. At the same time, a heat wave knocked out power across a nearby region, and some ColdCase retailers there raised cooler prices to $750 for a week."]},"N7":{"title":"Glow Lab skincare","attr":"Practice scenario: choosing channels.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Glow Lab sells a skin cream on its own website and wants to grow fast. The table compares two options. Glow Lab is also developing a stronger cream with a prescription-strength ingredient."],"table":[["","Keep selling on own website","Sell through a national drugstore chain"],["Stores reached","0 (online only)","4,000"],["Glow Lab earns per jar","$22","$13"],["Who controls price and display","Glow Lab","The drugstore"],["Setup needed","Build national shipping and customer service","Use the chain's warehouses"]]},"N8":{"title":"FitFuel's launch campaign","attr":"Practice scenario: measuring a promotion campaign.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["FitFuel launched a meal-prep delivery service with several promotion tools at once. It tracked each channel for one month."],"table":[["Tool","Cost","Impressions","Clicks","Orders","Revenue"],["Social media ads","$4,000","400,000","8,000","400","$20,000"],["Emails to past customers with a 20% code","$500","20,000","1,600","240","$9,600"],["TV spot","$10,000","1,000,000","n/a","300","$12,000"]]}},"questions":[{"id":"MX-1","type":"mcq","skill":"Data","topic":"2.1","stem":"Which piece of Peak's information is psychographic?","options":["Customers value customizing drinks","Most app users are between eighteen and twenty-four years old and earn under $30,000","The app records every order","600 new app customers"],"ans":0,"exp":"Values and preferences explain why people buy.","why":["","Age and income are demographic.","That's a data source.","A count."],"src":"N1"},{"id":"MX-2","type":"mcq","skill":"CAC","topic":"2.1","stem":"Based on the table, what was Peak's customer acquisition cost?","options":["$28.33, because all three of the costs in the table should be divided by the 600 new customers","$15","$20","$12,000"],"ans":2,"exp":"($9,000 + $3,000) ÷ 600 = $20.","why":["Furniture isn't an acquisition cost.","Leaves out sponsorships.","","That's total acquisition spending."],"src":"N1"},{"id":"MX-3","type":"mcq","skill":"CLV","topic":"2.1","stem":"What do the spending figures BEST suggest about the points program?","options":["It lowers acquisition cost, because rewards members spend almost three times as much per year","It raises lifetime value","It has no effect","It creates a data breach"],"ans":1,"exp":"Members spend $420 a year vs. $150: higher lifetime value.","why":["Spending more per year raises CLV.","","Members spend much more.","No."],"src":"N1"},{"id":"MX-4","type":"mcq","skill":"Targeting","topic":"2.1","stem":"Which is the BEST target customer for Peak's next ad?","options":["Retirees who live far from campus, since they have the most free time to visit the smoothie shops","Everyone in the state","Office managers ordering for meetings","College students who order between classes"],"ans":3,"exp":"Target the buyers most likely to purchase.","why":["Not Peak's buyers.","Wasted spending.","Not the data's group.",""],"src":"N1"},{"id":"MX-5","type":"mcq","skill":"Data risk","topic":"2.1","stem":"Peak's app stores card numbers. Which practice would MOST reduce its biggest data risk?","options":["Encrypting stored card data","Collecting even more personal data from each customer so that its rewards can be more personal","Selling the data","Ending rewards"],"ans":0,"exp":"Poor security leads to breaches, fraud and identity theft.","why":["","Increases exposure.","Privacy risk.","Doesn't fix security."],"src":"N1"},{"id":"MX-6","type":"mcq","skill":"Cialdini","topic":"2.2","stem":"\"Only 212 pairs left\" uses which principle?","options":["Consensus, because it tells shoppers how many other runners have already bought the shoe","Authority","Scarcity","Reciprocity"],"ans":2,"exp":"Limited supply raises perceived value.","why":["That's the 40,000 banner.","That's the therapist.","","No gift."],"src":"N2"},{"id":"MX-7","type":"mcq","skill":"Cialdini","topic":"2.2","stem":"The physical therapist's quote uses which principle?","options":["Liking, because shoppers are likely to feel positively toward a friendly health professional","Unity","Scarcity","Authority"],"ans":3,"exp":"Trust in experts is authority.","why":["The power is expertise.","No shared identity.","Nothing limited.",""],"src":"N2"},{"id":"MX-8","type":"mcq","skill":"Cialdini","topic":"2.2","stem":"The email \"You told us you'd be first in line\" MOST directly uses:","options":["Reciprocity, because the brand is giving members a special link before everyone else gets one","Consensus","Consistency","Authority"],"ans":2,"exp":"Reminding people of past commitments triggers consistency.","why":["It leans on their past commitment.","Not about others.","","No expert."],"src":"N2"},{"id":"MX-9","type":"mcq","skill":"Factors","topic":"2.2","stem":"\"I was bored at home that morning and just clicked\" describes which factor?","options":["Personal, because the buyer's age and income decide whether a shopper can afford the shoes","Situational","Social","Cultural"],"ans":1,"exp":"Mood and timing are situational factors.","why":["Boredom is a temporary condition.","","No one influenced them.","No tradition."],"src":"N2"},{"id":"MX-10","type":"mcq","skill":"Behavior","topic":"2.2","stem":"Buyers deciding within minutes BEST shows:","options":["Impulse buying","Habit buying, because many of these buyers have purchased shoes from this brand in the past","Planned buying","A consequential purchase"],"ans":0,"exp":"On-the-spot decisions are impulsive.","why":["","They decided on the spot.","Too quick.","Not carefully considered."],"src":"N2"},{"id":"MX-11","type":"mcq","skill":"Research","topic":"2.3","stem":"Step 1 (the industry report) is an example of:","options":["Primary research, because BrightBite will use the report's numbers to make its own decisions","A focus group","Secondary research","An A/B test"],"ans":2,"exp":"Existing data from reports is secondary.","why":["Someone else collected it.","No.","","No."],"src":"N3"},{"id":"MX-12","type":"mcq","skill":"Methods","topic":"2.3","stem":"Which step BEST tests the hypothesis about paying $3?","options":["Step 3, because focus groups let athletes explain in depth why they would pay three dollars","Step 2, the survey of 1,000 athletes","Step 1","Step 5"],"ans":1,"exp":"A large survey gives a percentage to compare with 25%.","why":["Too few people to estimate 25%.","","Not about price.","Wrong sample."],"src":"N3"},{"id":"MX-13","type":"mcq","skill":"Methods","topic":"2.3","stem":"What does Step 4 add that the survey can't?","options":["The reasons why athletes prefer one bag design over the other, explained in their own words","Market size","Lower costs","What people actually buy"],"ans":3,"exp":"An A/B test measures real behavior.","why":["That's qualitative.","Step 1.","No.",""],"src":"N3"},{"id":"MX-14","type":"mcq","skill":"Bias","topic":"2.3","stem":"What is the BIGGEST problem with Step 5?","options":["The questions are leading, because staff will be asked which flavors they personally love the most","It's secondary research","It costs too much","The sample doesn't represent teen athletes"],"ans":3,"exp":"Ask the people you're studying.","why":["The issue is who is asked.","It's primary.","Not the issue.",""],"src":"N3"},{"id":"MX-15","type":"mcq","skill":"Charts","topic":"2.3","stem":"Which chart BEST shows the four largest brands' share of the snack market?","options":["A line graph, because each brand's share of the market has been changing year after year","A stacked bar","A customer profile","A pie chart"],"ans":3,"exp":"Pie charts show parts of a whole.","why":["The question is the current split.","Not needed.","Not a chart.",""],"src":"N3"},{"id":"MX-16","type":"mcq","skill":"Life cycle","topic":"2.4","stem":"Based on the table, which stage was TrailCam in during 2021–2022?","options":["Growth","Maturity, because by 2022 the company was selling ninety thousand cameras every single year","Introduction","Decline"],"ans":0,"exp":"Accelerating sales and new rivals mark growth.","why":["","Sales were still accelerating.","Sales were taking off.","Rising."],"src":"N4"},{"id":"MX-17","type":"mcq","skill":"Life cycle","topic":"2.4","stem":"Which stage BEST describes 2023–2024?","options":["Decline, because TrailCam sold about one thousand fewer cameras in 2024 than it did in 2023","Maturity","Growth","Introduction"],"ans":1,"exp":"Sales leveling off with many rivals is maturity.","why":["A tiny dip with flat sales is maturity.","","Sales stopped rising.","No."],"src":"N4"},{"id":"MX-18","type":"mcq","skill":"Strategy","topic":"2.4","stem":"Which move fits TrailCam's current stage BEST?","options":["Spend most of the budget on awareness ads, since many hikers still haven't heard of the camera","Discontinue the camera","Stop all marketing","Add features and reward loyal buyers"],"ans":3,"exp":"In maturity, defend share with differentiation, loyalty and innovation.","why":["That's an introduction tactic.","Not declining.","Too extreme.",""],"src":"N4"},{"id":"MX-19","type":"mcq","skill":"Development","topic":"2.4","stem":"The 2019 test with 50 hikers was MAINLY used to:","options":["Check demand before launching","Build awareness among millions of hikers through news stories about the new camera","Set a tagline","Clear old stock"],"ans":0,"exp":"Testing with real users before launch is validation.","why":["","That's PR.","Not the purpose.","No."],"src":"N4"},{"id":"MX-20","type":"mcq","skill":"Branding","topic":"2.4","stem":"\"Built for where you go\" (used since founding) is TrailCam's:","options":["Tagline","Slogan, because it is a short and catchy line that appears on many of TrailCam's ads","Value proposition","Positioning map"],"ans":0,"exp":"Long-term, whole-brand lines are taglines; \"Summer of the Summit\" is a slogan.","why":["","It represents the brand long-term.","Not a full statement.","No."],"src":"N4"},{"id":"MX-21","type":"mcq","skill":"Markup","topic":"2.5","stem":"What is the markup on the basic helmet?","options":["25%","20%, because the five dollars of profit is divided by the twenty-five-dollar selling price","5%","80%"],"ans":0,"exp":"$5 ÷ $20 = 25%.","why":["","That's the margin.","Dollars, not percent.","Wrong division."],"src":"N5"},{"id":"MX-22","type":"mcq","skill":"Margin","topic":"2.5","stem":"Which item has the HIGHEST profit margin?","options":["The custom carbon road bike","The tune-up, because the shop earns fifteen dollars on every tune-up and needs almost no parts","The basic helmet","The package"],"ans":0,"exp":"Bike: $1,600 ÷ $4,000 = 40%. Tune-up: $15 ÷ $45 = 33%.","why":["","$15 ÷ $45 = 33%, below the bike's 40%.","20%.","About 11%."],"src":"N5"},{"id":"MX-23","type":"mcq","skill":"Strategy","topic":"2.5","stem":"The package priced at $349 instead of $389 is BEST described as:","options":["A loss leader, because the shop is losing money on the lights in order to sell the bike","Bundle pricing","Psychological pricing","Premium pricing"],"ans":1,"exp":"Several items together for less than separately.","why":["It's still profitable; items sold together for less.","","The key is the package.","It's a discount."],"src":"N5"},{"id":"MX-24","type":"mcq","skill":"Strategy","topic":"2.5","stem":"The custom carbon bike's $4,000 price for a $2,400 cost MOST likely reflects:","options":["Cost-based pricing, because the shop first had to find out how much the custom bike cost","Value-based pricing","Penetration pricing","Competitive pricing"],"ans":1,"exp":"Unique, high-quality items suit value-based pricing.","why":["Price reflects what riders think it's worth.","","Not low.","Custom, not matched."],"src":"N5"},{"id":"MX-25","type":"mcq","skill":"Price","topic":"2.5","stem":"If the owner priced the helmet at $18, what would happen?","options":["Each helmet would earn two dollars more, because a lower price attracts more customers","Each helmet would lose $2","It would break even","Nothing"],"ans":1,"exp":"A price below per-unit cost brings no profit.","why":["Price below cost loses money.","","No.","It changes profit."],"src":"N5"},{"id":"MX-26","type":"mcq","skill":"Elasticity","topic":"2.5","stem":"Last year's price rise with steady sales suggests ColdCase's demand was:","options":["Elastic, because ColdCase's customers clearly noticed that the price had gone up by fifty dollars","Illegal","Inelastic","Falling"],"ans":2,"exp":"Little change in buying after a price rise means inelastic demand.","why":["Sales held steady.","No.","","Steady."],"src":"N6"},{"id":"MX-27","type":"mcq","skill":"Pricing power","topic":"2.5","stem":"Why did ColdCase have high pricing power last year?","options":["Because coolers are a necessity that every household must buy at least once each summer","A law set its price","It had a unique, patented product","It was the cheapest"],"ans":2,"exp":"Unique products with no close substitutes have more pricing power.","why":["Not the reason given.","No.","","It wasn't."],"src":"N6"},{"id":"MX-28","type
