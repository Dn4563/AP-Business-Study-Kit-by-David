":"mcq","skill":"Pricing power","topic":"2.5","stem":"What will the rival's $150 cooler MOST likely do?","options":["Make demand more elastic","Make ColdCase's demand even less elastic, since fans will see the cheap rival as lower quality","Have no effect","Make ColdCase a monopoly"],"ans":0,"exp":"A cheaper, nearly identical substitute weakens pricing power.","why":["","A close substitute raises elasticity.","Substitutes matter.","No."],"src":"N6"},{"id":"MX-29","type":"mcq","skill":"Legal","topic":"2.5","stem":"The retailers charging $750 during the power outage is MOST likely:","options":["Dynamic pricing, because prices normally rise when demand goes up during busy times of the year","Penetration","Price gouging","Collusion"],"ans":2,"exp":"Sharp increases during emergencies can be illegal gouging.","why":["Extreme emergency increases are gouging.","No.","","No agreement described."],"src":"N6"},{"id":"MX-30","type":"mcq","skill":"Legal","topic":"2.5","stem":"If ColdCase and the rival secretly agreed to both charge $300, that would be:","options":["Competitive pricing, because each company is setting its price based on what the other charges","Price discrimination","Collusion","Bundle pricing"],"ans":2,"exp":"Agreeing on prices instead of competing is illegal collusion.","why":["A secret agreement isn't competing.","No groups.","","No."],"src":"N6"},{"id":"MX-31","type":"mcq","skill":"Channels","topic":"2.6","stem":"Selling through the drugstore chain would make Glow Lab's channel:","options":["Direct, because customers would still be buying Glow Lab's own cream in the drugstores","B2B only","Indirect","Brick-and-mortar only"],"ans":2,"exp":"Selling through an intermediary is indirect.","why":["The drugstore is an intermediary.","Final customers are individuals.","","The question is the channel type."],"src":"N7"},{"id":"MX-32","type":"mcq","skill":"Trade-offs","topic":"2.6","stem":"Which statement BEST describes the drugstore option's trade-off?","options":["More control over price, but fewer stores, because the drugstore limits where the cream is sold","No trade-off","Lower reach","More reach, less money and control"],"ans":3,"exp":"Indirect: reach vs. money per unit and control.","why":["Reversed.","There is one.","4,000 stores.",""],"src":"N7"},{"id":"MX-33","type":"mcq","skill":"Trade-offs","topic":"2.6","stem":"If Glow Lab stays direct and grows nationally, what is its biggest challenge?","options":["Losing control over how its cream is priced and displayed to customers in the stores","Building shipping and service itself","Shelf competition","A license"],"ans":1,"exp":"Direct channels need their own logistics and service.","why":["That's the indirect drawback.","","No shelves.","Not for this cream."],"src":"N7"},{"id":"MX-34","type":"mcq","skill":"Legal","topic":"2.6","stem":"The prescription-strength cream MOST likely must be sold:","options":["Only on Glow Lab's website, since online sales give the company the most control over the price","Through licensed pharmacies","Anywhere it's cheapest","Through gyms"],"ans":1,"exp":"Some products must use specific channels for health and safety.","why":["The law decides the channel.","","Laws limit channels.","No."],"src":"N7"},{"id":"MX-35","type":"mcq","skill":"Multichannel","topic":"2.6","stem":"Which plan would BEST balance reach and control for the current cream?","options":["Close the website and sell only in drugstores, because four thousand stores reach more people","Sell only by mail","Keep the website and add the drugstore","Stop selling"],"ans":2,"exp":"Many firms mix channels to balance reach, cost and control.","why":["Gives up all control and data.","Less reach.","","No."],"src":"N7"},{"id":"MX-36","type":"mcq","skill":"CTR","topic":"2.7","stem":"What was the social ads' click-through rate?","options":["2%","0.1%, because the four hundred orders are divided by the four hundred thousand impressions","5%","20%"],"ans":0,"exp":"8,000 ÷ 400,000 = 2%.","why":["","That's orders ÷ impressions; CTR uses clicks.","Orders ÷ clicks.","Divided wrong."],"src":"N8"},{"id":"MX-37","type":"mcq","skill":"Conversion","topic":"2.7","stem":"Of the people who clicked the emails, what percentage ordered?","options":["1.2%, because two hundred forty orders are divided by the twenty thousand emails that were sent","15%","8%","150%"],"ans":1,"exp":"240 ÷ 1,600 = 15%.","why":["That's orders ÷ impressions; the question asks about people who clicked.","","Clicks ÷ impressions.","Divided wrong."],"src":"N8"},{"id":"MX-38","type":"mcq","skill":"ROAS","topic":"2.7","stem":"Which tool had the HIGHEST return on ad spend?","options":["The TV spot, because it reached one million viewers, more than any other tool in the campaign","The social ads","They're equal","The emails"],"ans":3,"exp":"Email: $9,600 ÷ $500 = 19.2. Social: 5. TV: 1.2.","why":["Reach isn't return.","ROAS 5.","Not equal.",""],"src":"N8"},{"id":"MX-39","type":"mcq","skill":"Tools","topic":"2.7","stem":"The emails with a 20% code are BEST classified as:","options":["Public relations, because the emails help FitFuel build goodwill with its past customers","Personal selling","Media advertising only","Direct marketing and a sales promotion"],"ans":3,"exp":"Tools overlap: a targeted email with a coupon is both.","why":["They push an immediate purchase.","No salesperson.","Targeted, not mass.",""],"src":"N8"},{"id":"MX-40","type":"mcq","skill":"Digital","topic":"2.7","stem":"Based on the data, what is the BEST next step for FitFuel?","options":["Spend more on TV, because television reached the largest number of people during the month","Stop measuring","Drop email","Shift some TV money to email and social"],"ans":3,"exp":"Digital tools here are measurable and earn more per dollar.","why":["TV earned the least per dollar.","Data guide decisions.","Best ROAS.",""],"src":"N8"}],"exam":"Mock test","examTips":["Built like your Unit 1 test: 40 multiple-choice questions, one scenario per page, 5 quest const THEMEK = "sk:theme";
function savedTheme() {
  try {
    const t = localStorage.getItem(THEMEK) || localStorage.getItem("sk:hub:theme");
    if (t === "auto" || t === "light" || t === "dark") return t;
  } catch (e) {}
  return null;
}
function setTheme(t) {
  PREFS.theme = t;
  try {
    localStorage.setItem(THEMEK, t);
  } catch (e) {}
}
PREFS.theme = savedTheme() || PREFS.theme;
/* Another open tab (the hub or another kit) changed the theme: follow it. */
addEventListener("storage", (e) => {
  if (e.key !== THEMEK) return;
  const t = savedTheme();
  if (t && t !== PREFS.theme) {
    PREFS.theme = t;
    applyPrefs();
    if (typeof render === "function" && UNIT) render();

});
function applyPrefs() {
  const root = document.documentElement;

function unitProgress(u) {
  const data = UNITDATA[u.id],
    saved = readJSON(keyOf(u, "kit")) || {},
    known = saved.known || {};
  const ids = [];
  data.decks.forEach((dk) => {
    if (dk.optional) return;
    dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => ids.push(dk.id + "." + si + "." + ci)));
  });
  let answered = 0,
    total = 0;
  const pt = readJSON(keyOf(u, "pt"));
  data.practice.sections.forEach((s) => {
    const st = pt && pt.secs ? (pt.secs.find((x) => x.name === s.name) || {}).st || {} : {};
    s.questions.forEach((q) => {
      total++;
      const x = st[q.id];
      if (x && (x.checked || x.mark != null || Object.keys(x.pm || {}).length)) answered++;
    });
  });
  return { got: ids.filter((id) => known[id]).length, tot: ids.length, answered: answered, total: total };
}

    if (s.theme && !savedTheme()) setTheme(s.theme);
    if (typeof s.size === "number") PREFS.size = s.size;
    writeJSON(PREFK, PREFS);

  }

function indexCards() {
  BYID = {};
  D.allDecks = D.allDecks || D.decks;
  D.allDecks.forEach((dk, di) => {
    dk.tone = di % 8;
    dk.sections.forEach((sc, si) =>
      sc.cards.forEach((c, ci) => {
        c.id = dk.id + "." + si + "." + ci;
        c.deck = dk.id;
        c.sec = dk.id + "." + si;
        BYID[c.id] = c;
      }),
    );
  });
}
/* Optional decks stay out of "All decks", the meter and the mixed quiz unless turned on in Settings. */
function rebuild() {
  D.decks = D.allDecks.filter((d) => !d.optional || SAVE.settings.optDeck);
  ALL = [];
  LESSONS = [];
  D.decks.forEach((dk) =>
    dk.sections.forEach((sc, si) => {
      sc.cards.forEach((c) => ALL.push(c));
      const n = sc.cards.length,
        parts = Math.max(1, Math.ceil(n / 5)),
        base = Math.floor(n / parts),
        extra = n % parts;
      let i = 0;
      for (let p = 0; p < parts; p++) {
        const sz = base + (p < extra ? 1 : 0);
        LESSONS.push({
          id: dk.id + "." + si + "." + p,
          deck: dk.id,
          sec: dk.id + "." + si,
          secName: sc.name,
          part: p,
          parts: parts,
          title: sc.name + (parts > 1 ? " (part " + (p + 1) + " of " + parts + ")" : ""),
          cards: sc.cards.slice(i, i + sz),
        });
        i += sz;
      }
    }),
  );
}

/* Answer choices shared by Learn, Quiz and the Practice Test: cross-off, Lock in, and per-choice explanations.
   Explanations name the choice by its text, never by letter, because choices are shuffled. */
function whyHTML(opts, picked, okTxt) {
  const ci = opts.findIndex((o) => o.ok);
  const quote = (o) => '<span class="qt">' + esc(o.t) + "</span>";
  let h = "";
  if (picked >= 0 && !opts[picked].ok)
    h +=
      '<div class="why bad"><div class="wh">Why your answer is wrong</div>' +
      quote(opts[picked]) +
      (opts[picked].why ? "<p>" + esc(opts[picked].why) + "</p>" : "") +
      "</div>";
  if (ci >= 0 && okTxt) h += '<div class="why good"><div class="wh">Why the correct answer is right</div>' + quote(opts[ci]) + "<p>" + okTxt + "</p></div>";
  if (opts.some((o) => o.why))
    h +=
      '<details class="whyall"><summary>Every choice explained</summary><ul>' +
      opts
        .map(
          (o) =>
            "<li>" +
            quote(o) +
            (o.ok ? '<span class="tag ok">Correct</span>' + (okTxt ? "<p>" + okTxt + "</p>" : "") : '<span class="tag bad">Wrong</span><p>' + esc(o.why || "") + "</p>") +
            "</li>",
        )
        .join("") +
      "</ul></details>";
  return h;
}

/* Question builders and the one-at-a-time runner used by Quiz, the final mixed quiz and retries. */
let FC = null,

const LET = "ABCDE";
function stopTM() {
  clearInterval(TM);
  TM = null;
}
function pickDir() {
  const d = SAVE.settings.dir;
  return d === "both" ? (Math.random() < 0.5 ? "t2d" : "d2t") : d;
}
/* Distractors come from the same section first, then the same deck, then anywhere, preferring similar lengths
   so the right answer never stands out by length. */
function distractors(card, n, field) {
  const target = card[field];
  const fair = (c) => !MIX || field !== "def" || !hasTerm(c.def, card.term);
  const tiers = [
    ALL.filter((c) => c !== card && c.sec === card.sec),
    ALL.filter((c) => c !== card && c.deck === card.deck && c.sec !== card.sec),
    ALL.filter((c) => c.deck !== card.deck),
  ];
  const out = [];
  for (const tier of tiers) {
    const cand = shuf(tier);
    const close = cand.filter((c) => {
      const r = c[field].length / target.length;
      return r >= 0.7 && r <= 1.3;
    });
    const ord = close.concat(cand.filter((c) => close.indexOf(c) < 0));
    for (const c of ord) {
      if (out.length >= n) break;
      if (fair(c) && c[field] !== target && !out.some((o) => o[field] === c[field])) out.push(c);
    }
    if (out.length >= n) break;
  }

}
/* Units with "learnMix" on (set per unit in course.json) hide the term inside definitions used as questions

const MIX = !!(UNIT && UNIT.learnMix);

  return (term.match(/[A-Za-z]{4,}/g) || []).filter((w) => !STOP.test(w)).map((w) => w.toLowerCase().slice(0, Math.max(4, w.length >= 8 ? w.length - 2 : w.length - 1)));

      hidden++;

    kind: "mc",
    card: card,

    kind: "tf",
    card: card,
    ask: "True or false: this definition matches the term.",
    prompt: "<b>" + esc(card.term) + "</b><br>" + esc(isTrue ? card.def : other.def),
    options: [

/* Flashcards, modeled on Quizlet's flashcard mode.
   Pool: not known yet / all / trouble terms / starred. Order: shuffled or section order. Side first: term or definition
   (the Swap sides button flips it in one tap).
   Two modes:
   - Sort: Not yet / Got it. "Not yet" returns the card about 4 cards later. Back undoes the last choice,
     including its Got it / trouble change. The round ends with a results screen.
   - Browse: Previous / Next through the pool, no sorting.
   Keys: Space or Up/Down flips, Right = Got it (Sort) or Next (Browse), Left = Back (Sort) or Previous (Browse),
   1 = Not yet, 2 = Got it, S = star. */
function fcBuild(onlyIds) {
  let pool = deckCards().slice();
  const p = SAVE.settings.fcPool;
  if (onlyIds) pool = pool.filter((c) => onlyIds.indexOf(c.id) >= 0);
  else if (p === "unknown") pool = pool.filter((c) => !SAVE.known[c.id]);
  else if (p === "trouble") pool = pool.filter((c) => SAVE.trouble[c.id] > 0);
  else if (p === "starred") pool = pool.filter((c) => SAVE.star[c.id]);
  if (SAVE.settings.fcOrder === "shuffle") pool = shuf(pool);
  FC = { q: pool.map((c) => c.id), list: pool.map((c) => c.id), i: 0, flip: false, total: pool.length, hist: [], got: [], learning: [] };
}
function selHTML(key, label, opts) {

    "<label>" +
    label +
    ' <select data-set="' +
    key +
    '">' +
    opts.map((o) => '<option value="' + o[0] + '"' + (String(v) === String(o[0]) ? " selected" : "") + ">" + o[1] + "</option>").join("") +
    "</select></label>"

}
const FC_CTL = () =>

/* Every sort records enough to undo it exactly. */
function fcPush(id) {
  FC.hist.push({ q: FC.q.slice(), got: FC.got.slice(), learning: FC.learning.slice(), known: !!SAVE.known[id], trouble: SAVE.trouble[id], id: id });
}
ACT.fcflip = () => {
  FC.flip = !FC.flip;
  render();
};
ACT.fcagain = () => {
  FC = null;
  render();
};
ACT.fcgot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  setKnown(id, true);
  if (FC.learning.indexOf(id) < 0 && FC.got.indexOf(id) < 0) FC.got.push(id);
  FC.flip = false;
  render();
};
ACT.fcnot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  delete SAVE.known[id];
  SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
  if (FC.learning.indexOf(id) < 0) FC.learning.push(id);
  FC.q.splice(Math.min(FC.q.length, 4), 0, id);
  FC.flip = false;
  save();
  render();
};
ACT.fcback = () => {
  const h = FC && FC.hist.pop();
  if (!h) return;
  FC.q = h.q;
  FC.got = h.got;
  FC.learning = h.learning;
  if (h.known) SAVE.known[h.id] = true;
  else delete SAVE.known[h.id];
  if (h.trouble === undefined) delete SAVE.trouble[h.id];
  else SAVE.trouble[h.id] = h.trouble;
  FC.flip = false;
  save();
  render();
};
ACT.fclearn = () => {
  const ids = FC.learning.slice();
  fcBuild(ids);
  render();
};
ACT.fcprev = () => {
  if (FC.i > 0) FC.i--;
  FC.flip = false;
  render();
};
ACT.fcnext = () => {
  if (FC.i < FC.list.length - 1) FC.i++;
  FC.flip = false;
  render();
};
ACT.fcswap = () => {
  SAVE.settings.fcFirst = SAVE.settings.fcFirst === "term" ? "def" : "term";
  FC.flip = false;
  save();
  render();
};
ACT.fcshuf = () => {
  if (fcBrowse()) {
    FC.list = shuf(FC.list);
    FC.i = 0;
  } else FC.q = shuf(FC.q);
  FC.flip = false;
  render();
};
ACT.fcstar = () => {
  const id = fcCur();
  if (!id) return;
  if (SAVE.star[id]) delete SAVE.star[id];
  else SAVE.star[id] = true;
  save();
  render();
};
document.addEventListener("keydown", (e) => {
  if (!UNIT || UI.tab !== "flash" || UI.run || !FC) return;
  const tg = e.target && e.target.tagName;
  if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const browse = fcBrowse();
  if (!(browse ? FC.list.length : FC.q.length)) {
    if (!browse && e.key === "ArrowLeft") ACT.fcback();
    return;
  }
  if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    ACT.fcflip();
  } else if (e.key === "ArrowRight") browse ? ACT.fcnext() : ACT.fcgot();
  else if (e.key === "ArrowLeft") browse ? ACT.fcprev() : ACT.fcback();
  else if (e.key === "s" || e.key === "S") ACT.fcstar();
  else if (!browse && e.key === "1") ACT.fcnot();
  else if (!browse && e.key === "2") ACT.fcgot();
});

/* 70-quiz.js */
/* Quiz builder: decks, how many of each type, number of choices, feedback timing, order and an optional
   per-question timer. Results break down by type and topic, with retry-missed and rerun. */
function initQ() {
  if (!UI.q) UI.q = { decks: {}, mc: 10, tf: 5, sc: 6, nopt: 4, fb: "immediate", order: "shuffle", timer: SAVE.settings.timer };
  D.decks.forEach((d) => {
    if (UI.q.decks[d.id] === undefined) UI.q.decks[d.id] = true;
  });
}
function QSET(t) {
  initQ();
  if (t.dataset.qd !== undefined) {
    const d = D.decks.find((x) => String(x.id) === t.dataset.qd);
    if (d) UI.q.decks[d.id] = t.checked;
    clampQ();
    return render();
  }
  if (t.type === "number") {
    UI.q[t.dataset.q] = Math.max(0, Math.floor(Number(t.value) || 0));
    clampQ();
    return render();
  }
  UI.q[t.dataset.q] = t.value;
}
/* Real limits for the chosen decks. Multiple choice and true/false share the decks' terms (a term is asked
   once, one way or the other); applied questions are counted separately. */
function quizCaps() {
  const decks = quizDecks();
  return { terms: ALL.filter((c) => decks.indexOf(c.deck) >= 0).length, applied: appliedCount() };
}
function clampQ() {
  const c = quizCaps(),
    q = UI.q;
  q.mc = Math.min(Math.max(0, Number(q.mc) || 0), c.terms);
  q.tf = Math.min(Math.max(0, Number(q.tf) || 0), c.terms - q.mc);
  q.sc = Math.min(Math.max(0, Number(q.sc) || 0), c.applied);
}
/* Questions from the last quiz go to the back of the line next time, so a rerun starts with new ones. */
let QRECENT = new Set();
/* How many applied questions the chosen decks have: scenarios plus applied (asks.json) questions. */
function appliedPool(decks) {
  const pool = [];
  D.sq.forEach((s, i) => decks.indexOf(s.deck) >= 0 && pool.push({ key: "s" + i, make: () => scQ(s) }));
  ALL.filter((c) => decks.indexOf(c.deck) >= 0).forEach((c) => (c.asks || []).forEach((a, i) => pool.push({ key: "a" + c.id + ":" + i, make: () => askQ(c, a) })));
  return pool;
}
const quizDecks = () => D.decks.map((d) => d.id).filter((id) => !UI.q || UI.q.decks[id] !== false);
function appliedCount() {
  return appliedPool(quizDecks()).length;
}

  clampQ();
  const caps = quizCaps();
  const num = (k, label, max) =>

  return (

    D.decks.map((d) => '<label><input type="checkbox" data-qd="' + d.id + '"' + (q.decks[d.id] ? " checked" : "") + ">" + dot(d.id) + esc(d.name) + "</label>").join("") +
    '</div></fieldset><fieldset><legend>Questions</legend><div class="grp">' +

    num("sc", ALL.some((c) => c.asks && c.asks.length) ? "Applied (scenarios and apply-it)" : "Scenario", caps.applied) +
    '</div></fieldset><fieldset><legend>Options</legend><div class="grp">' +
    "<label>Choices per question " +

      [3, "3"],
      [4, "4"],

    ]) +

      ["immediate", "After each question"],
      ["end", "At the end"],
    ]) +
    "</label><label>Order " +
    so("order", [
      ["shuffle", "Shuffled"],
      ["deck", "Deck order"],
    ]) +
    "</label><label>Timer per question " +
    so("timer", [
      [0, "Off"],
      [15, "15 s"],
      [30, "30 s"],
      [60, "60 s"],
    ]) +
    '</label></div></fieldset><p class="muted">Every question in a quiz is different: a term is asked once, as multiple choice or true or false. Numbers above the limit are lowered to it. Running out of time counts as a miss. Question types, term direction and focus are in Settings.</p>' +
    (UI.qmsg ? '<p class="msg">' + esc(UI.qmsg) + "</p>" : "") +
    '<div class="qnav"><button class="btn" data-act="qstart">Start quiz</button></div></section>'
  );
}
ACT.qstart = () => {
  initQ();
  const q = UI.q,
    decks = D.decks.map((d) => d.id).filter((id) => q.decks[id]);
  if (!decks.length) {
    UI.qmsg = "Pick at least one deck.";
    return render();
  }
  clampQ();
  /* Random order, then (stable sorts) the Settings focus first and last quiz's questions last. */
  const recentLast = (key) => (QRECENT.has(key) ? 1 : 0);
  let pool = shuf(ALL.filter((c) => decks.indexOf(c.deck) >= 0));
  pool.sort((a, b) => recentLast("c" + a.id) - recentLast("c" + b.id));
  const f = SAVE.settings.focus;
  if (f === "trouble") pool.sort((a, b) => (SAVE.trouble[b.id] || 0) - (SAVE.trouble[a.id] || 0));
  else if (f === "unknown") pool.sort((a, b) => (SAVE.known[a.id] ? 1 : 0) - (SAVE.known[b.id] ? 1 : 0));
  let nmc = Number(q.mc) || 0,
    ntf = Number(q.tf) || 0,
    nsc = Number(q.sc) || 0;
  const qt = SAVE.settings.qType;
  if (qt === "terms") nsc = 0;
  if (qt === "scen") nmc = ntf = 0;
  const qs = [],
    np = Number(q.nopt) || 4;
  /* Each term once: the first nmc as multiple choice, the next ntf as true or false. */
  nmc = Math.min(nmc, pool.length);
  ntf = Math.min(ntf, pool.length - nmc);
  const used = new Set();
  for (let i = 0; i < nmc; i++) {
    const mq = mcQ(pool[i], null, np);
    qs.push(mq);
    used.add("c" + pool[i].id);
    /* A card with no fair definition question is asked with its applied question; don't ask that one again below. */
    if (mq.kind === "ap") used.add("a" + pool[i].id + ":" + pool[i].asks.findIndex((a) => esc(a.q) === mq.prompt));
  }
  for (let i = nmc; i < nmc + ntf; i++) {
    qs.push(tfQ(pool[i]));
    used.add("c" + pool[i].id);
  }
  /* Applied pool: the decks' scenario questions plus every applied (asks.json) question, each at most once. */
  const ap = shuf(appliedPool(decks).filter((it) => !used.has(it.key)));
  ap.sort((a, b) => recentLast(a.key) - recentLast(b.key));
  ap.slice(0, nsc).forEach((it) => {
    qs.push(it.make());
    used.add(it.key);
  });
  QRECENT = used;
  if (!qs.length) {
    UI.qmsg = "Nothing to ask with those settings.";
    return render();
  }
  UI.qmsg = "";
  startRun({ title: "Quiz", qs: q.order === "shuffle" ? shuf(qs) : qs, immediate: q.fb === "immediate", timer: Number(q.timer) || 0, retry: false, breakdown: true, again: true });
};
ACT.qagain = () => {
  UI.run = null;
  stopTM();
  ACT.qstart();
};
const KIND_NAME = { mc: "Multiple choice", tf: "True or false", sc: "Scenario", ap: "Applied" };

/* 75-plan.js */
/* Study plan: a personal, step-by-step plan for this unit. The student says when the test is, how much time
   they have and how well they know each deck; a short quick check (one question per deck) and their saved
   progress refine that. Each deck becomes Learn, Fix or Polish, and the plan lists timed steps whose buttons
   open the right tool (Learn, Flashcards, Quiz, Practice Test, exam, Cheat sheet). Saved in SAVE.plan. */
const PL_WHEN = [
  ["today", "Today"],
  ["tomorrow", "Tomorrow"],
  ["days", "In 2–3 days"],
  ["week", "A week or more"],
];
const PL_MINS = [15, 30, 60, 90];
const PL_RATE = [
  ["know", "I know it well"],
  ["shaky", "It's shaky"],
  ["new", "I haven't learned it"],
];
const PL_LABEL = { learn: "Learn", fix: "Fix", polish: "Polish" };

function planState() {
  if (!SAVE.plan || typeof SAVE.plan !== "object") SAVE.plan = { when: null, mins: null, rate: {}, check: {}, done: {}, phase: "about" };
  const P = SAVE.plan;
  P.rate = P.rate || {};
  P.check = P.check || {};
  P.done = P.done || {};
  P.phase = P.phase || "about";
  return P;
}
const planDecks = () => D.decks.filter((d) => ALL.some((c) => c.deck === d.id));

/* What the saved progress says about a deck: share of terms with a miss on record, share marked Got it. */
function deckHistory(d) {
  const cards = ALL.filter((c) => c.deck === d.id),
    n = cards.length || 1;
  const trouble = cards.filter((c) => SAVE.trouble[c.id] > 0).length,
    known = cards.filter((c) => SAVE.known[c.id]).length;
  return { n: cards.length, trouble: trouble, known: known, weak: trouble >= Math.max(2, Math.ceil(n * 0.2)) };
}
/* Neither the rating nor one quiz answer decides alone:
   - "I haven't learned it" is always Learn (a right answer could be a lucky guess);
   - a miss on the quick check means Fix, but only a quick check-in when the student rated it "know it";
   - a right answer is Polish unless the saved history shows repeated misses. */
function deckLabel(d) {
  const P = planState(),
    r = P.rate[d.id],
    q = P.check[d.id],
    h = deckHistory(d);
  if (r === "new") return { l: "learn", why: "You said you haven't learned it yet" + (q === true ? " (the quick-check answer may have been a lucky guess)." : ".") };
  if (q === true && !h.weak) return { l: "polish", why: r === "know" ? "You know it and got the quick check right." : "You got the quick check right, so it's closer than it feels." };
  if (q === true && h.weak) return { l: "fix", why: "Right on the quick check, but you've missed " + h.trouble + " of its terms before." };
  if (r === "know") return { l: "fix", light: true, why: "You rated it well but missed the quick check: one quick check-in, not a full relearn." };
  return { l: "fix", why: q === false ? "It feels shaky and the quick check agreed." : "It feels shaky and you skipped the quick check." };
}

/* ---------- step builders: each returns {key, min, title, why, go} ---------- */
function lessonFor(d) {
  let i = LESSONS.findIndex((l) => l.deck === d.id && !SAVE.done[l.id]);
  if (i < 0) i = LESSONS.findIndex((l) => l.deck === d.id);
  return i;
}
const deckLessons = (d) => LESSONS.filter((l) => l.deck === d.id && !SAVE.done[l.id]).length || LESSONS.filter((l) => l.deck === d.id).length;
const ptIdx = (mode) => PT.secs.map((s, i) => (s.mode === mode ? i : -1)).filter((i) => i >= 0);
function stepsFor(when, labs) {
  const L = labs.filter((x) => x.lab.l === "learn").map((x) => x.d),
    F = labs.filter((x) => x.lab.l === "fix").map((x) => x.d),
    Po = labs.filter((x) => x.lab.l === "polish").map((x) => x.d);
  const names = (ds) => ds.map((d) => d.name).join(", ");
  const hasTrouble = ALL.some((c) => SAVE.trouble[c.id] > 0);
  const cheat = D.cheat && D.cheat.length;
  const S = [];
  const learnStep = (d) => ({
    key: "learn:" + d.id,
    min: Math.min(60, deckLessons(d) * 6),
    title: "Learn: " + d.name,
    why: "Work through its Learn lessons in order (about 6 minutes each). Read the \"Read this first\" box before the terms.",
    go: { t: "learn", i: lessonFor(d), label: "Open Learn" },
  });
  const skimStep = (d) => ({
    key: "skim:" + d.id,
    min: 4,
    title: "Skim the big picture: " + d.name,
    why: "No time to learn it fully today. Read this deck's summaries in the Study guide so the main ideas are familiar.",
    go: { t: "guide", d: d.id, label: "Open Study guide" },
  });
  const fixStep = (ds) => ({
    key: "fix:" + ds.map((d) => d.id).join(","),
    min: Math.max(8, ds.length * 6),
    title: "Fix: " + names(ds),
    why: "A short Quiz on just these decks. Read every explanation for the ones you miss, then do the Flashcards step.",
    go: { t: "quiz", decks: ds.map((d) => d.id), label: "Start the Quiz" },
  });
  const flashStep = (min) => ({
    key: "flash",
    min: min,
    title: hasTrouble ? "Flashcards: your trouble terms" : "Flashcards: terms you haven't marked Got it",
    why: "Say the answer out loud before you flip. Mark Not yet honestly; those come back.",
    go: { t: "flash", pool: hasTrouble ? "trouble" : "unknown", label: "Open Flashcards" },
  });
  const polishStep = (ds) => ({
    key: "polish",
    min: 5,
    title: "Polish: " + names(ds),
    why: "A quick mixed Quiz to keep these sharp. Don't spend long here.",
    go: { t: "quiz", decks: ds.map((d) => d.id), label: "Start the Quiz" },
  });
  const pi = ptIdx("practice"),
    ei = ptIdx("exam");
  const practiceStep = () =>
    pi.length && {
      key: "pt",
      min: 12,
      title: "Practice Test: " + PT.secs[pi[0]].name,
      why: "Questions in the format of your test. Check each one and read why the wrong answers are wrong.",
      go: { t: "pt", sec: pi[0], label: "Open Practice Test" },
    };
  const examStep = () =>
    ei.length && {
      key: "exam",
      min: Math.min(45, Math.max(20, ei.reduce((n, i) => n + PT.secs[i].qs.length, 0))),
      title: "Full mock test, timed",
      why: "Turn the Timer on, leave Shuffle off, and don't look anything up. Afterward, use Retest missed questions.",
      go: { t: "exam", sec: ei[0], label: "Open the mock test" },
    };
  const cheatStep = (title, why) => ({ key: "cheat:" + title, min: 5, title: title, why: why, go: { t: cheat ? "cheat" : "guide", label: cheat ? "Open Cheat sheet" : "Open Study guide" } });

  if (when === "today") {
    S.push(cheatStep("Read the Cheat sheet", "Start with the whole unit on one page. Notice anything that looks unfamiliar."));
    if (hasTrouble || ALL.some((c) => !SAVE.known[c.id])) S.push(flashStep(10));
    if (F.length) S.push(fixStep(F));
    L.forEach((d) => S.push(skimStep(d)));
    if (Po.length) S.push(polishStep(Po));
    S.push(Object.assign(cheatStep("Last look at the Cheat sheet", "Stop studying new things. A calm last read beats cramming."), { last: true }));
  } else if (when === "tomorrow") {
    /* The mock test is the best practice the night before, so with an hour or more it comes right after Learn and Fix. */
    const e = examStep(),
      p = practiceStep(),
      long = planState().mins >= 60;
    L.forEach((d) => S.push(learnStep(d)));
    if (F.length) S.push(fixStep(F));
    if (long && e) S.push(e);
    else if (p) S.push(p);
    S.push(flashStep(10));
    if (long && p) S.push(p);
    else if (e) S.push(e);
    if (Po.length) S.push(polishStep(Po));
    S.push(Object.assign(cheatStep("Cheat sheet, then sleep", "Read it once, then stop. Stop new material about an hour before bed; sleep is when it sticks."), { last: true }));
  } else {
    /* Several days: today's session starts the schedule (Learn first, then Fix). */
    L.forEach((d) => S.push(learnStep(d)));
    if (F.length) S.push(fixStep(F));
    S.push(flashStep(10));
    const p = practiceStep();
    if (p) S.push(p);
    if (Po.length) S.push(polishStep(Po));
  }
  return S.filter(Boolean);
}
/* Fit the steps into the time chosen; a Learn step that doesn't fit is cut to its first lessons. */
function fitSteps(steps, mins) {
  const now = [],
    later = [];
  /* A step marked "last" (the final Cheat sheet look) always ends today's list, so its time is set aside first. */
  const fin = steps.filter((s) => s.last);
  steps = steps.filter((s) => !s.last);
  let left = (mins >= 90 ? 120 : mins) - fin.reduce((n, s) => n + s.min, 0);
  steps.forEach((s, n) => {
    if (s.min <= left) {
      now.push(s);
      left -= s.min;
    } else if (s.key.indexOf("learn:") === 0 && left >= 6) {
      const k = Math.floor(left / 6);
      now.push(Object.assign({}, s, { min: k * 6, title: s.title + " (first " + k + " lesson" + (k > 1 ? "s" : "") + ")" }));
      later.push(Object.assign({}, s, { key: s.key + ":rest", title: s.title + " (the rest)" }));
      left -= k * 6;
    } else if (!now.length && n === 0) {
      now.push(s);
      left -= s.min;
    } else later.push(s);
  });
  return { now: now.concat(fin), later: later };
}
function dayPlan(when, labs) {
  const L = labs.filter((x) => x.lab.l === "learn").map((x) => x.d.name),
    F = labs.filter((x) => x.lab.l === "fix").map((x) => x.d.name);
  const ex = ptIdx("exam").length;
  if (when === "days")
    return [
      ["Day 1 (today)", "Learn " + (L.length ? L.join(", ") : "anything still new") + ". Finish with trouble-term Flashcards."],
      ["Day 2", "Fix " + (F.length ? F.join(", ") : "your weakest decks") + " with a Quiz, then one Practice Test section."],
      ["Last day", (ex ? "Timed mock test, then Retest missed questions. " : "A mixed Quiz on every deck. ") + "Cheat sheet, then sleep."],
    ];
  if (when === "week") {
    const order = L.concat(F);
    const rows = order.map((n, i) => ["Day " + (i + 1), (i < L.length ? "Learn " : "Fix ") + n + ", then 10 minutes of trouble-term Flashcards on earlier decks."]);
    rows.push(["2 days before", ex ? "Timed mock test. Redo every missed question." : "A long mixed Quiz on every deck."]);
    rows.push(["Day before", "Fix whatever the mock showed, Cheat sheet, sleep."]);
    return rows;
  }
  return null;
}

/* Whole-course backup on the course home page: one file with every unit's saved progress (and the course's
   theme and text size). Restore reads that file back. In a kit built with content/import-map.json (for example
   the Psych kit, whose content came from Phineas's kit), Restore also reads that other kit's backup file and
   carries over the cards marked known and the missed-term counts. */
let bkMsg = "";
const BK_PREFIX = "sk:" + COURSE.id + ":";
function backupData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.indexOf(BK_PREFIX) === 0 || k === THEMEK)) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return { app: "study-kit", course: COURSE.id, saved: new Date().toISOString(), data: data };
}
function restoreData(o) {
  if (!o || o.app !== "study-kit" || typeof o.data !== "object") throw new Error("unreadable");
  if (o.course !== COURSE.id) throw new Error("other course");
  const keys = Object.keys(o.data).filter((k) => (k.indexOf(BK_PREFIX) === 0 || k === THEMEK) && typeof o.data[k] === "string");
  if (!keys.length) throw new Error("empty");
  keys.forEach((k) => {
    try {
      localStorage.setItem(k, o.data[k]);
    } catch (e) {}
  });
  return "Restored your progress for " + plural(new Set(keys.filter((k) => k !== THEMEK).map((k) => k.split(":")[2])).size - (o.data[BK_PREFIX + "prefs"] ? 1 : 0), "unit") + ".";
}
/* Every card in a unit, optional decks included, keyed by term. */
function termIds(u) {
  const out = {};
  UNITDATA[u.id].decks.forEach((dk) => dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => (out[c.term] = dk.id + "." + si + "." + ci))));
  return out;
}
function importForeign(o) {
  const M = IMPORT_MAP;
  const parse = (k) => {
    try {
      return JSON.parse((o.data || {})[k] || "null") || {};
    } catch (e) {
      return {};
    }
  };
  const known = parse(M.known),
    miss = parse(M.miss);
  const per = {};
  const ids = {};
  const touch = (hisId) => {
    const m = M.cards[hisId];
    if (!m) return null;
    const u = COURSE.units.find((x) => x.id === m[0]);
    if (!u) return null;
    ids[u.id] = ids[u.id] || termIds(u);
    const id = ids[u.id][m[1]];
    if (!id) return null;
    if (!per[u.id]) per[u.id] = { u: u, saved: readJSON(keyOf(u, "kit")) || {}, known: 0, trouble: 0 };
    const p = per[u.id];
    p.saved.known = p.saved.known || {};
    p.saved.trouble = p.saved.trouble || {};
    return { p: p, id: id };
  };
  Object.keys(known).forEach((h) => {
    if (!known[h]) return;
    const t = touch(h);
    if (!t) return;
    if (!t.p.saved.known[t.id]) t.p.known++;
    t.p.saved.known[t.id] = true;
  });
  Object.keys(miss).forEach((h) => {
    const n = Number(miss[h]) || 0;
    if (n <= 0) return;
    const t = touch(h);
    if (!t) return;
    if (!((t.p.saved.trouble[t.id] || 0) > 0)) t.p.trouble++;
    t.p.saved.trouble[t.id] = Math.max(t.p.saved.trouble[t.id] || 0, n);
  });
  const parts = [];
  let nk = 0,
    nt = 0;
  COURSE.units.forEach((u) => {
    const p = per[u.id];
    if (!p) return;
    writeJSON(keyOf(u, "kit"), p.saved);
    nk += p.known;
    nt += p.trouble;
    parts.push(u.label + ": " + p.known + " known, " + p.trouble + " to practice");
  });
  if (!parts.length) throw new Error("nothing");
  return "Brought over " + plural(nk, "known card") + " and " + plural(nt, "missed term") + " from " + M.name + ". " + parts.join(" · ") + ".";
}
function readBackupFile(text) {
  const o = JSON.parse(text);
  if (IMPORT_MAP && o && o.app === IMPORT_MAP.app) return importForeign(o);
  return restoreData(o);
}
const BK_ERR = {
  "other course": "That backup is from a different course. Restore it in that course's study kit.",
  empty: "That backup has no saved progress in it.",
  nothing: "None of the cards in that backup match this kit.",
};
function backupHTML() {
  return (
    '<section class="panel backup"><h2>Backup</h2><p class="muted">Your progress saves in this browser. Download one file with every unit, then restore it on another device or browser.' +
    (IMPORT_MAP ? " Restore also accepts a backup file from " + esc(IMPORT_MAP.name) + "." : "") +
    '</p><div class="qnav"><button class="btn sec" data-act="bkdown">Download backup</button><button class="btn sec" data-act="bkup">Restore from backup</button></div>' +
    '<input type="file" id="bkfile" accept=".json,application/json" hidden>' +
    (bkMsg ? '<p class="bkmsg" role="status">' + esc(bkMsg) + "</p>" : "") +
    "</section>"
  );
}
ACT.bkdown = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(backupData(), null, 1)], { type: "application/json" }));
  a.download = COURSE.id + "-study-kit-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);

};
ACT.bkup = () => document.getElementById("bkfile").click();
document.addEventListener("change", (e) => {
  if (!e.target || e.target.id !== "bkfile" || !e.target.files || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {

    } catch (err) {

    }

/* 90-pt.js */
/* Practice Test and exams. Sections sit behind their own top tabs. One question at a time with a numbered
   palette (gray = not visited, outlined = visited, green = correct, red = incorrect, amber = partly right,
   ring = current, corner mark = flagged). Question types: mcq, tf, label, diagram, frq, saq. */
const PT = { sec: 0, secs: [], timerOn: false, elapsed: 0, iv: null, retest: null, msg: "", intro: {}, res: null };
const TYPE_NAME = { mcq: "Multiple choice", tf: "True or false", label: "Labeling", diagram: "Diagram labeling", frq: "Free response", saq: "Short answer" };
const newSt = () => ({ elim: [], visited: false, checked: false, sel: null, correct: null, flag: false, items: {}, work: "", abox: "", ans: {}, revealed: false, mark: null, pm: {} });
const isWritten = (q) => q.type === "frq" || q.type === "saq";
/* A free-response question whose every part lists accepted answers ("accept") is typed and marked automatically.
   Names ignore case and spacing; formulas keep case (Co is not CO) but accept plain digits, "(aq)" and any hydrate dot. */
const isTyped = (q) => q.type === "frq" && q.parts.every((p) => Array.isArray(p.accept) && p.accept.length);
function normAns(v, formula) {
  let t = String(v || "")
    .replace(/[₀-₉]/g, (d) => String("₀₁₂₃₄₅₆₇₈₉".indexOf(d)))
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]/g, "")
    .replace(/\(aq\)/gi, "")
    .replace(/[*•∙.]/g, "·")
    .replace(/\s+/g, "")
    .replace(/·$/, "");
  return formula ? t : t.toLowerCase();
}
const isFormulaAns = (a) => !/\s/.test(a) && /[A-Z]/.test(a) && !/^[A-Z][a-z]{3,}$/.test(a);
const typedOk = (v, acc) => acc.some((a) => normAns(v, isFormulaAns(a)) === normAns(a, isFormulaAns(a)));
const itemsOf = (q) => (q.type === "diagram" ? q.pins.map((p, i) => Object.assign({ t: "Pin " + (i + 1) }, p)) : q.items);

function initPT() {
  D.practice.sections.forEach((s) => {
    const sec = { name: s.name, mode: s.mode || "practice", exam: s.exam || s.name, tips: s.tips || [], examTips: s.examTips || [], sources: s.sources || {}, qs: s.questions, byId: {}, cur: 0, st: {}, oo: {} };
    sec.qs.forEach((q) => {
      if (q.type === "tf") {
        q.options = ["True", "False"];
        q.ai = q.ans ? 0 : 1;
      } else if (q.type === "mcq") q.ai = q.ans;
      sec.byId[q.id] = q;
      sec.st[q.id] = newSt();
      if (q.type === "mcq") sec.oo[q.id] = q.options.map((o, i) => i);
    });
    sec.orig = sec.qs.map((q) => q.id);
    sec.order = sec.orig.slice();
    PT.secs.push(sec);
  });
  PTload(readJSON(PTK));
}

/* Points earned on one question, 0 to 1, or null if not answered yet. Multi-part items earn partial credit. */
function frac(q, s) {
  if (isWritten(q)) {
    const ks = q.parts.map((p) => p.k),
      pm = s.pm || {};
    if (ks.every((k) => pm[k] !== undefined)) return ks.filter((k) => pm[k]).length / ks.length;
    return null;
  }
  if (q.type === "label" || q.type === "diagram") {
    const it = itemsOf(q);
    return s.checked ? it.filter((x, i) => s.items[i] === x.ans).length / it.length : null;
  }
  return s.checked ? (s.correct ? 1 : 0) : null;
}
function status(q, s) {
  const f = frac(q, s);
  if (f !== null) return f === 1 ? "ok" : f === 0 ? "bad" : "partial";
  return s.visited ? "vis" : "new";
}
const ptMode = () => (UI.tab === "exam" ? "exam" : "practice");
function curView() {
  const sec = PT.secs[PT.sec],
    R = PT.retest && PT.retest.sec === PT.sec ? PT.retest : null;
  return { sec: sec, R: R, ids: R ? R.ids : sec.order, st: R ? R.st : sec.st, h: R || sec };
}
function cur3() {
  const v = curView(),
    id = v.ids[v.h.cur];
  return { v: v, id: id, q: v.sec.byId[id], s: v.st[id] };
}
function secScore(sec, ids, st) {
  let pts = 0,
    n = 0;
  ids.forEach((id) => {
    const f = frac(sec.byId[id], st[id]);
    if (f !== null) {
      n++;
      pts += f;
    }
  });

}
const fmtT = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const ul = (a) => "<ol>" + a.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ol>";

function srcImg(key) {
  if (!key || !D.images) return "";

}
function srcHTML(s) {

  const img = srcImg(s.img);
  if (img) h += '<img class="srcimg" alt="' + esc(s.alt || s.title) + '" src="' + img + '">';
  /* A source can have text, a table, or both (text first, as in a business case with a data table). */
  if (s.paras) h += s.paras.map((p, i) => '<p class="stext"><span class="pn">Paragraph ' + (i + 1) + "</span> " + esc(p) + "</p>").join("");
  else if (s.text) h += '<p class="stext">' + esc(s.text) + "</p>";

/* ---------- one question ---------- */
function choiceQHTML(q, s, sec, id, nav, topic) {
  const order = q.type === "mcq" ? sec.oo[id] : [0, 1];
  let h = '<div class="stem">' + esc(q.stem) + '</div><div class="opts' + (q.type === "tf" ? " tf" : "") + '">';
  order.forEach((oi, pos) => {
    let c = "opt";
    const ex = s.elim.indexOf(oi) >= 0;
    if (s.checked) {
      if (oi === q.ai) c += " right";
      else if (oi === s.sel) c += " wrong";
    } else if (oi === s.sel && !ex) c += " sel";
    h += q.type === "mcq" ? optRow(c, "ptopt", oi, LET[pos], esc(q.options[oi]), "ptelim", ex, s.checked) : '<div class="optrow"><button class="' + c + '" data-act="ptopt" data-k="' + oi + '"' + (s.checked ? " disabled" : "") + '><span class="ot">' + q.options[oi] + "</span></button></div>";
  });
  h += '</div><div class="qnav">';

  h += nav + "</div>";

      h += whyHTML(od, sec.oo[id].indexOf(s.sel), esc(q.exp));

}
function labelRowsHTML(q, s) {

function diagramHTML(q, s) {

function writtenHTML(q, s, nav, topic) {

function ptSectionHTML() {

    h += labelRowsHTML(q, s);
    const all = itemsOf(q).every((it, i) => s.items[i] !== undefined);
    h += '<div class="qnav"><button class="btn" data-act="ptcheck"' + (!all || s.checked ? " disabled" : "") + ">Check Answer</button>" + nav + "</div>";
    if (s.checked) {
      const it = itemsOf(q),
        n = it.filter((x, i) => s.items[i] === x.ans).length;

    }
  } else h += writtenHTML(q, s, nav, topic);
  return h + "</section>";
}

/* ---------- actions ---------- */
function PTinput(t) {
  const c = cur3(),
    k = t.dataset.ans;
  if (k === "work" || k === "abox") c.s[k] = t.value;
  else c.s.ans[k] = t.value;
  PTsave();
}
/* A right answer in a retest round also updates the main section. */
function syncMain() {
  const R = PT.retest;
  if (!R || R.sec !== PT.sec) return;
  const sec = PT.secs[R.sec],
    c = cur3(),
    m = sec.st[c.id],
    r = R.st[c.id];
  if (frac(c.q, r) === 1) {
    Object.assign(m, { checked: r.checked, correct: r.correct, sel: r.sel, revealed: r.revealed, mark: r.mark });
    m.items = Object.assign({}, r.items);
    m.pm = Object.assign({}, r.pm);
  }
}
function checkCur() {
  const c = cur3();
  if (isWritten(c.q)) {
    if (isTyped(c.q) && !c.s.revealed) c.q.parts.forEach((p) => (c.s.pm[p.k] = typedOk(c.s.ans[p.k], p.accept)));
    c.s.revealed = true;
  }
  else if (c.q.type === "label" || c.q.type === "diagram") {
    const it = itemsOf(c.q);
    if (c.s.checked || !it.every((x, i) => c.s.items[i] !== undefined)) return;
    c.s.checked = true;
    c.s.correct = it.every((x, i) => c.s.items[i] === x.ans);
  } else {
    if (c.s.sel === null || c.s.checked) return;
    c.s.checked = true;
    c.s.correct = c.s.sel === c.q.ai;
  }
  syncMain();
  render();
}
ACT.ptsec = (t) => {

ACT.ptres = (t) => {

ACT.ptjump = (t) => {

ACT.ptprev = () => {

ACT.ptnext = () => {

ACT.ptflag = () => {

};
ACT.ptshuffle = () => {
  const sec = PT.secs[PT.sec];
  sec.order = shuf(sec.orig);
  sec.cur = 0;
  sec.qs.forEach((q) => q.type === "mcq" && (sec.oo[q.id] = shuf(q.options.map((o, i) => i))));

  PT.retest = null;
  render();
};
ACT.ptunshuffle = () => {
  const sec = PT.secs[PT.sec];
  sec.order = sec.orig.slice();
  sec.cur = 0;
  sec.qs.forEach((q) => q.type === "mcq" && (sec.oo[q.id] = q.options.map((o, i) => i)));
  sec.shuffled = false;
  PT.retest = null;

};
function freshSec(sec) {
  sec.qs.forEach((q) => (sec.st[q.id] = newSt()));
  sec.cur = 0;
}
ACT.ptresetsec = () => {
  if (!ask("Clear every answer in " + PT.secs[PT.sec].name + "?")) return;
  freshSec(PT.secs[PT.sec]);
  if (PT.retest && PT.retest.sec === PT.sec) PT.retest = null;

};
ACT.ptresetall = () => {
  const M = ptMode();
  if (!ask(M === "exam" ? "Clear every answer in every exam section?" : "Clear every answer in every practice section?")) return;
  PT.secs.forEach((x) => x.mode === M && freshSec(x));
  PT.retest = null;
  PT.elapsed = 0;
  render();
};
ACT.ptretest = () => {
  const sec = PT.secs[PT.sec],
    ids = sec.order.filter((id) => ["bad", "partial"].indexOf(status(sec.byId[id], sec.st[id])) >= 0);
  if (!ids.length) {
    PT.msg = "No missed questions in this section yet. Check some answers first.";
    return render();
  }
  const st = {};
  ids.forEach((id) => (st[id] = newSt()));
  PT.retest = { sec: PT.sec, ids: ids, st: st, cur: 0 };
  render();
};
ACT.ptendretest = () => {

};
function tick() {

ACT.pttimer = () => {

/* ---------- printable view ---------- */

/* ---------- saving ---------- */
function PTpack() {
  return {
    sec: PT.sec,
    timerOn: PT.timerOn,
    elapsed: PT.elapsed,
    intro: PT.intro,
    secs: PT.secs.map((s) => ({ name: s.name, order: s.order, cur: s.cur, st: s.st, oo: s.oo, shuffled: !!s.shuffled })),
    retest: PT.retest ? { sec: PT.retest.sec, ids: PT.retest.ids, st: PT.retest.st, cur: PT.retest.cur } : null,
  };
}
function PTsave() {
  if (PTK) writeJSON(PTK, PTpack());
}
function PTload(o) {
  try {
    if (!o || !o.secs) return;
    o.secs.forEach((x) => {
      const s = PT.secs.find((y) => y.name === x.name);
      if (!s) return;
      if (Array.isArray(x.order) && x.order.length === s.orig.length && x.order.every((id) => s.byId[id])) s.order = x.order;
      if (typeof x.cur === "number") s.cur = Math.min(Math.max(0, x.cur), s.order.length - 1);
      s.shuffled = x.shuffled === undefined ? !!o.shuffled : !!x.shuffled;
      s.qs.forEach((q) => {
        const st = x.st && x.st[q.id];
        if (st && typeof st === "object") {
          const n = Object.assign(newSt(), st, { items: Object.assign({}, st.items || {}), pm: Object.assign({}, st.pm || {}), ans: Object.assign({}, st.ans || {}), elim: (st.elim || []).slice() });
          /* Old World SAQ saves kept per-part marks in "parts". */
          if (st.parts && q.type === "saq") Object.keys(st.parts).forEach((k) => st.parts[k] !== null && (n.pm[k] = st.parts[k]));
          if (st.ans && typeof st.ans === "object" && q.type === "saq") n.ans = Object.assign({}, st.ans);
          s.st[q.id] = n;
        }
        const oo = x.oo && x.oo[q.id];
        if (q.type === "mcq" && Array.isArray(oo) && oo.length === q.options.length) s.oo[q.id] = oo;
      });
    });
    if (typeof o.sec === "number" && PT.secs[o.sec]) PT.sec = o.sec;
    PT.intro = o.intro || {};
    PT.elapsed = Number(o.elapsed) || 0;
    PT.retest = null;
    if (o.retest && PT.secs[o.retest.sec] && Array.isArray(o.retest.ids)) {
      const rs = PT.secs[o.retest.sec];
      if (o.retest.ids.every((id) => rs.byId[id])) {
        PT.retest = { sec: o.retest.sec, ids: o.retest.ids, st: {}, cur: o.retest.cur || 0 };
        o.retest.ids.forEach((id) => (PT.retest.st[id] = Object.assign(newSt(), (o.retest.st || {})[id] || {})));
      }
    }
    if (o.timerOn && !PT.timerOn) {
      PT.timerOn = true;
      PT.iv = setInterval(tick, 1000);
    }
  } catch (e) {}
}
function PTreset() {
  PT.secs.forEach((s) => {
    s.qs.forEach((q) => {
      s.st[q.id] = newSt();
      if (q.type === "mcq") s.oo[q.id] = q.options.map((o, i) => i);
    });
    s.order = s.orig.slice();
    s.cur = 0;
    s.shuffled = false;
  });
  PT.retest = null;
  PT.elapsed = 0;
  PT.sec = 0;
  PTsave();
}

/* 95-results.js */
/* Per-exam results page (score with partial credit, by type, what to study next, question by question) and
   the Progress tab (every practice topic ranked weakest first). */
const topicOf = (q) => q.topic || q.skill || "Other";
function reviewDeck(topic) {
  const d = D.topicDeck && D.topicDeck[topic];
  return d === undefined ? null : D.allDecks.find((x) => x.id === d) || null;
}
const barHTML = (p) => '<span class="bar ' + (p < 60 ? "low" : p < 85 ? "mid" : "high") + '" aria-hidden="true"><i style="width:' + p + '%"></i></span>';
const jumpBtn = (si, q, label) => '<button class="lnk" data-act="progjump" data-s="' + si + '" data-id="' + esc(q.id) + '">' + esc(label) + "</button>";

function resDetail(q, s) {
  if (q.type === "mcq" || q.type === "tf")
    return "<p><b>Your answer:</b> " + (s.sel == null ? "none" : esc(q.options[s.sel])) + "</p><p><b>Correct answer:</b> " + esc(q.options[q.ai]) + '</p><p class="muted">' + esc(q.exp) + "</p>";
  if (q.type === "label" || q.type === "diagram")
    return (
      "<ul>" +
      itemsOf(q)
        .map((it, i) => {
          const sel = s.items[i],
            ok = sel === it.ans;
          return (
            "<li>" +
            esc(q.type === "diagram" ? "Pin " + (i + 1) : it.t) +
            ": " +
            (ok ? "<b>" + esc(q.labels[it.ans]) + "</b>, correct" : "you said " + (sel === undefined ? "nothing" : esc(q.labels[sel])) + ", correct is <b>" + esc(q.labels[it.ans]) + '</b>. <span class="muted">' + esc(it.exp || "") + "</span>") +
            "</li>"
          );
        })
        .join("") +
      "</ul>"
    );
  return (
    '<ol class="fparts" type="a">' +
    q.parts
      .map((p) => "<li><p><b>" + (s.pm[p.k] === true ? "Got it. " : s.pm[p.k] === false ? "Missed. " : "") + "</b>" + esc(p.prompt) + "</p><p>" + esc(p.tea ? p.tea.join(" ") : p.model) + "</p></li>")
      .join("") +
    "</ol>"
  );
}

function resHTML(group) {
  const secs = PT.secs.map((sec, si) => ({ sec: sec, si: si })).filter((x) => x.sec.mode === "exam" && x.sec.exam === group);
  let tot = 0,
    ok = 0,
    done = 0;
  const byType = {},
    byTopic = {},
    rows = [];
  secs.forEach((x) =>
    x.sec.orig.forEach((id, n) => {
      const q = x.sec.byId[id],
        s = x.sec.st[id],
        f0 = frac(q, s),
        f = f0 === null ? 0 : f0;
      tot++;
      ok += f;
      if (f0 !== null) done++;
      const T = (byType[TYPE_NAME[q.type]] = byType[TYPE_NAME[q.type]] || { ok: 0, tot: 0, n: 0 });
      T.tot++;
      T.ok += f;
      if (f0 !== null) T.n++;
      const P = (byTopic[topicOf(q)] = byTopic[topicOf(q)] || { ok: 0, tot: 0, bad: 0, none: 0 });
      P.tot++;
      P.ok += f;
      if (f0 === null) P.none++;
      else if (f0 < 1) P.bad++;
      rows.push({ x: x, q: q, s: s, f0: f0, n: n });
    }),
  );
  let h = '<section class="panel"><div class="rtop"><h2>' + esc(group) + " results</h2></div>";
  if (!done) return h + '<p class="muted">Nothing checked yet. Work through this exam, press Check Answer (or self-mark written answers), then come back. Each exam is scored on its own.</p></section>';
  const pct = Math.round((ok / tot) * 100);
  h +=
    '<div class="fb' +
    (pct >= 85 ? " ok" : pct < 60 ? " bad" : "") +
    '"><p class="big">' +
    fmt1(ok) +
    " of " +
    tot +
    " points (" +
    pct +
    "%)</p><p>Partial credit counts." +
    (done < tot ? " " + plural(tot - done, "question") + " not answered or self-marked yet, worth 0 points." : "") +
    " " +
    (pct >= 85 ? "Strong. Review the few misses below." : pct >= 70 ? "Solid, but the topics below still need work." : "Not there yet. Use the study list below, then retake this exam.") +
    "</p></div>";
  h +=
    '<h3>By question type</h3><div class="wk">' +
    Object.keys(byType)
      .map((k) => {
        const t = byType[k],
          p = Math.round((t.ok / t.tot) * 100);
        return '<div class="wkrow"><div class="wkhead"><b>' + esc(k) + "</b><span>" + fmt1(t.ok) + " of " + t.tot + " points" + (t.n < t.tot ? ", " + (t.tot - t.n) + " not answered" : "") + "</span></div>" + barHTML(p) + "</div>";
      })
      .join("") +
    "</div>";
  const need = Object.keys(byTopic)
    .filter((k) => byTopic[k].bad || byTopic[k].none)
    .sort((a, b) => byTopic[a].ok / byTopic[a].tot - byTopic[b].ok / byTopic[b].tot);
  h += "<h3>What to study next</h3>";
  if (!need.length) h += "<p>Nothing missed. Try the Practice Test sections for more.</p>";
  else
    h +=
      '<div class="wk">' +
      need
        .map((k) => {
          const t = byTopic[k],
            p = Math.round((t.ok / t.tot) * 100),
            dk = reviewDeck(k);
          const miss = rows.filter((r) => topicOf(r.q) === k && r.f0 !== 1);
          return (
            '<div class="wkrow"><div class="wkhead"><b>' +
            esc(k) +
            "</b><span>" +
            fmt1(t.ok) +
            " of " +
            t.tot +
            " points" +
            (t.none ? ", " + t.none + " not answered" : "") +
            "</span></div>" +
            barHTML(p) +
            '<p class="wkmiss">Go back to: ' +
            miss.map((r) => jumpBtn(r.x.si, r.q, r.x.sec.name + ", question " + (r.n + 1))).join(", ") +
            "</p>" +
            (dk ? '<p class="wkrev">Then review <b>' + esc(dk.name) + "</b> in the Study guide.</p>" : "") +
            "</div>"
          );
        })
        .join("") +
      "</div>";
  h += "<h3>Question by question</h3>";
  rows.forEach((r) => {
    const st = r.f0 === null ? "none" : r.f0 === 1 ? "ok" : r.f0 > 0 ? "partial" : "bad";
    const parts = isWritten(r.q) ? r.q.parts.length : r.q.type === "label" || r.q.type === "diagram" ? itemsOf(r.q).length : 1;
    const lbl = { ok: "Correct", bad: "Missed", none: "Not answered", partial: "Partly right, " + fmt1(r.f0 * parts) + " of " + parts }[st];
    const stem = r.q.title || r.q.stem || r.q.lead || "";
    h +=
      '<details class="resq ' +
      st +
      '"' +
      (st === "ok" ? "" : " open") +
      '><summary><span class="pal ' +
      st +
      '" aria-hidden="true">' +
      (r.n + 1) +
      "</span><span><b>" +
      lbl +
      "</b> " +
      esc(r.x.sec.name) +
      ", " +
      esc(TYPE_NAME[r.q.type]) +
      ' <span class="skill">' +
      esc(topicOf(r.q)) +
      "</span><br>" +
      esc(stem.length > 160 ? stem.slice(0, 160) + "..." : stem) +
      "</span></summary>" +
      (st === "ok"
        ? ""
        : '<div class="resd">' +
          (r.f0 !== null || isWritten(r.q) ? resDetail(r.q, r.s) : '<p class="muted">You did not check this question.</p>') +
          "<p>" +
          jumpBtn(r.x.si, r.q, "Go to this question") +
          "</p></div>") +
      "</details>";
  });
  return h + "</section>";
}

function progHTML() {
  const T = {};
  PT.secs.forEach((sec, si) =>
    sec.qs.forEach((q) => {
      const o = (T[topicOf(q)] = T[topicOf(q)] || { ok: 0, n: 0, miss: [], total: 0 });
      o.total++;
      const f = frac(q, sec.st[q.id]);
      if (f !== null) {
        o.n++;
        o.ok += f;
        if (f < 1) o.miss.push({ si: si, q: q });
      }
    }),
  );
  const rows = Object.keys(T)
    .map((n) => ({ n: n, o: T[n], pct: T[n].n ? T[n].ok / T[n].n : null }))
    .sort((a, b) => (a.pct === null) - (b.pct === null) || (a.pct || 0) - (b.pct || 0));
  let h = '<section class="panel"><h2>Weak topics</h2>';
  h += rows.some((r) => r.o.n)
    ? '<p class="muted">Every question you have checked or self-marked, ranked weakest first. Under 3 answers counts as an early number.</p>'
    : '<p class="muted">Answer some practice or exam questions and your topics show up here, weakest first.</p>';
  h += '<div class="wk">';
  rows.forEach((r) => {
    const p = r.pct === null ? 0 : Math.round(r.pct * 100),
      dk = reviewDeck(r.n);
    h +=
      '<div class="wkrow"><div class="wkhead"><b>' +
      esc(r.n) +
      "</b><span>" +
      (r.pct === null ? "Not started" : fmt1(r.o.ok) + " of " + r.o.n + " points (" + p + "%)" + (r.o.n < 3 ? ", early" : "")) +
      ", " +
      plural(r.o.total, "question") +
      " in the kit</span></div>" +
      barHTML(p);
    if (r.o.miss.length) h += '<p class="wkmiss">Missed: ' + r.o.miss.map((m) => jumpBtn(m.si, m.q, PT.secs[m.si].name + ", question " + (PT.secs[m.si].orig.indexOf(m.q.id) + 1))).join(", ") + "</p>";
    if (dk && (r.pct === null || r.pct < 0.85)) h += '<p class="wkrev">Review <b>' + esc(dk.name) + "</b> in the Study guide.</p>";
    h += "</div>";
  });
  h += "</div>";
  const tr = Object.keys(SAVE.trouble).filter((k) => SAVE.trouble[k] && !SAVE.known[k] && BYID[k]).length;
  if (tr) h += '<p class="muted">You also have ' + plural(tr, "trouble term") + " in the Flashcards pool.</p>";
  return h + "</section>";
}
ACT.progjump = (t) => {
  const si = Number(t.dataset.s),
    sec = PT.secs[si];
  UI.tab = sec.mode === "exam" ? "exam" : "pt";
  PT.res = null;
  PT.sec = si;
  PT.retest = null;
  const i = sec.order.indexOf(t.dataset.id);
  if (i >= 0) sec.cur = i;
  render();
  window.scrollTo(0, 0);
};

if (UNIT) {
  initShell();
  initPT();
  restoreL();
}
render();
