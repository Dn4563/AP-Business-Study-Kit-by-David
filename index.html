s purpose."]],"exp":"PESTEL helps managers evaluate how external changes may affect future decisions."},{"q":"A restaurant chain lists: a minimum-wage increase, a high-protein diet trend, a new delivery app and a stricter labeling law. What is it doing?","right":"A PESTEL analysis","wrong":[["A market research survey that collects opinions from the restaurant's own customers","These are external factors, not survey results."],["A Business Canvas","Not the six lenses."],["A sales funnel","Unrelated."]],"exp":"Sorting outside changes is PESTEL."}]},{"term":"Viability","def":"A business's ability to operate successfully and sustainably over time.","hook":"Can it last?","asks":[{"q":"Which question is about a business's viability?","right":"Can it keep operating successfully over time?","wrong":[["Which department should be in charge of hiring the new employees next year?","That's HR."],["What color should the logo be?","Branding."],["Who is the consumer?","Not viability."]],"exp":"Viability is the ability to operate successfully and sustainably."},{"q":"A region's PESTEL factors fit a farm-to-table restaurant: health-conscious residents, local farms, friendly rules. What does this most improve?","right":"The restaurant's viability there","wrong":[["The restaurant's legal liability, since owners become personally responsible for debts","Unrelated."],["Its market share elsewhere","Not supported."],["Its patent protection","Unrelated."]],"exp":"Businesses enter markets where PESTEL factors align with their model."}]},{"term":"Internal vs. external","def":"Only outside forces count in PESTEL; a firm's own new product, hire or invention is a decision made inside the firm, not a PESTEL factor.","hook":"PESTEL is outside the walls.","asks":[{"q":"A restaurant chain develops a food-prep system that cuts waste by 15%. Which statement is true?","right":"It is not part of a PESTEL analysis","wrong":[["It is a technological PESTEL factor, since it is new technology that changes costs","It's the company's own innovation, not an outside force."],["It is an economic factor","Not external."],["It is a legal factor","Not a law."]],"exp":"PESTEL covers external forces; a firm's own invention is internal."},{"q":"Tesla develops better battery cells. Why isn't this a technological PESTEL factor for Tesla?","right":"It's Tesla's own innovation, not an outside force","wrong":[["Because batteries are an environmental factor, since they affect carbon emissions","That's not why."],["Because PESTEL ignores technology","Technology is the T."],["Because it's a legal factor","No law involved."]],"exp":"PESTEL technology means outside tech changes, not a firm's own R&D."}]},{"term":"Opportunity or threat","def":"Each PESTEL factor can help a business or hurt it, and the same change can help one firm while hurting another.","hook":"Help or hurt?","asks":[{"q":"Automation robots become available to restaurants. For a small restaurant, this is best described as:","right":"Both an opportunity and a risk","wrong":[["Only a threat, because robots always cost more than workers in every situation","It can lower labor costs too."],["Only an opportunity","High upfront costs are a risk."],["Not a PESTEL factor","It's external technology."]],"exp":"Automation can cut labor costs but has high upfront costs that favor big firms."},{"q":"Interest rates rise from 4% to 7% just as an e-bike company plans to borrow $120 million. This factor is mainly:","right":"An economic threat","wrong":[["A social opportunity, since people will want more e-bikes as interest rates rise","Interest rates are economic and raise borrowing costs."],["A legal threat","Not a law."],["A technological opportunity","Not technology."]],"exp":"Higher interest rates raise borrowing costs, an economic obstacle."}]}],"intro":["The business environment is everything outside the company that affects how it operates. Spotting changes early helps businesses foresee opportunities, anticipate risks, and decide where to operate. A business does best where the PESTEL factors fit its model."]},{"name":"The six factors","cards":[{"term":"Political factors","def":"Government actions and policies such as taxes, subsidies, trade policy, elections and stability.","hook":"Government choices.","asks":[{"q":"A government offers a tax credit to anyone who installs solar panels. Which PESTEL factor?","right":"Political","wrong":[["Economic, because the tax credit puts more money back into homeowners' pockets","It's a government policy choice."],["Social","Not a cultural trend."],["Technological","Solar is tech, but the credit is policy."]],"exp":"Government policies and subsidies are political factors."},{"q":"Several states approve tax credits for electric-bike purchases. What effect is most likely?","right":"Demand for e-bikes increases","wrong":[["Borrowing costs rise for e-bike makers, making it harder to build new factories","That's interest rates."],["Compliance costs rise","That's new rules."],["Demand falls","Credits encourage buying."]],"exp":"A political incentive raises demand."}]},{"term":"Tariff","def":"A tax on imported goods.","hook":"Tax at the border.","asks":[{"q":"The U.S. adds a tax on imported steel. What is this, and who is most hurt?","right":"A tariff; firms that buy imported steel","wrong":[["A subsidy; foreign steel makers who sell to American companies","A tax isn't a subsidy."],["A tariff; American consumers who don't buy steel","Firms using imported steel pay more."],["A recession; all businesses","Not a recession."]],"exp":"A tariff is a tax on imports; buyers of imports pay more."},{"q":"Which PESTEL category does a tariff belong to?","right":"Political","wrong":[["Economic, since a tariff changes the price that businesses pay for imported goods","It's a government trade policy."],["Legal","It's a policy decision."],["Environmental","Unrelated."]],"exp":"Trade policies like tariffs are political factors."}]},{"term":"Economic factors","def":"Conditions of overall spending, jobs and prices, such as inflation, unemployment, interest rates, wages and recessions, that affect how much people can spend.","hook":"How the economy is doing.","asks":[{"q":"Why might a business find a market unattractive during high inflation?","right":"Customers can afford to buy less","wrong":[["Inflation leads directly to stricter employment laws that protect workers","That would be legal."],["Inflation slows automation","Not the point."],["Inflation limits renewable energy","Unrelated."]],"exp":"Economic factors like inflation reduce spending power."},{"q":"An ice cream shop sees sales drop as household incomes fall. Which factor?","right":"Economic","wrong":[["Social, because people are changing their eating habits toward healthier desserts","Falling income is economic."],["Environmental","Not weather."],["Legal","No law."]],"exp":"Income and spending are economic factors."}]},{"term":"Recession","def":"A decline in economic activity.","hook":"Economy shrinks.","asks":[{"q":"During a recession, which business is most likely to see sales fall?","right":"A luxury vacation company","wrong":[["A grocery store selling basic foods that families must buy every single week","Necessities hold up better."],["A pharmacy","Necessities."],["A discount store","Often gains customers."]],"exp":"In a decline, people cut wants like luxury travel first."},{"q":"Economic activity declines for several months. What is this called?","right":"A recession","wrong":[["Inflation, which means that the prices of most goods are rising quickly","Inflation is rising prices."],["A tariff","A tax on imports."],["A surplus","A market condition."]],"exp":"A recession is a decline in economic activity."}]},{"term":"Social factors","def":"Trends in society and culture, such as lifestyles, cultural norms, health attitudes and population changes.","hook":"What people value.","asks":[{"q":"Consumers increasingly prefer environmentally friendly transportation. Your practice test labels this which way for an e-bike maker?","right":"A trend that increases demand","wrong":[["A legal requirement that forces all consumers to buy electric bicycles instead of cars","It's a preference, not a law."],["An internal strength","It's external."],["A cost increase","It raises demand."]],"exp":"Changing consumer preferences increase demand."},{"q":"Consumers are buying more high-protein, low-carb meals. Which PESTEL factor is this?","right":"Social","wrong":[["Economic, because people are spending more money on food in restaurants","It's a lifestyle trend."],["Technological","Not technology."],["Legal","Not a law."]],"exp":"Lifestyle and health trends are social factors."}]},{"term":"Demographics","def":"Statistical characteristics of a population, such as age, income, education and location.","hook":"Population stats.","asks":[{"q":"A region's population is getting older. For a company making mobility scooters, this is:","right":"A demographic opportunity","wrong":[["A legal threat, because older customers are protected by consumer protection laws","Age trends are demographic."],["An internal strength","External."],["A technological factor","Not technology."]],"exp":"Age is a demographic characteristic, a social factor."},{"q":"Which is a demographic characteristic?","right":"Age","wrong":[["Interest in outdoor yoga, which a company might learn from social media posts","That's psychographic."],["Brand loyalty","Behavior, not demographic."],["Values","Psychographic."]],"exp":"Demographics are statistical traits: age, income, education, location."}]},{"term":"Technological factors","def":"Access to and use of new technology, such as AI, internet access, digital platforms and automation.","hook":"New tech out there.","asks":[{"q":"A new food-delivery platform expands throughout a region. For a restaurant chain this is:","right":"A technological factor","wrong":[["A social factor, because people are changing how they like to eat their meals","The platform itself is technology."],["An internal decision","It's external."],["A legal factor","Not a law."]],"exp":"New digital platforms available to firms are technological factors."},{"q":"Which pair is one social and one technological factor?","right":"Interest in high-protein meals; a new delivery platform","wrong":[["A higher minimum wage and a stricter food-labeling law passed by the state","Those are political/economic and legal."],["A new prep system and a new manager","Both internal."],["A delivery platform and a prep system","The prep system is internal."]],"exp":"Diet trends are social; a new outside platform is technological."}]},{"term":"Automation","def":"Using technology to do tasks with minimal human labor.","hook":"Machines do the work.","asks":[{"q":"A burger robot can flip patties with little human labor. Which term describes this?","right":"Automation","wrong":[["Outsourcing, because the restaurant hires another company to do the cooking","No outside firm does the work."],["Vertical integration","Unrelated."],["Artisan production","The opposite."]],"exp":"Automation uses technology to do tasks with minimal labor."},{"q":"Why can automation give large firms an advantage over small ones?","right":"Large firms can afford the high upfront cost","wrong":[["Small firms are not allowed by law to buy automated equipment for their kitchens","No such law."],["Automation raises labor costs","It lowers them."],["Automation only works in big buildings","Not the reason."]],"exp":"High upfront costs are easier for big firms."}]},{"term":"Environmental factors","def":"Natural conditions and concerns about the planet, such as climate, natural disasters, resources, pollution and consumers' green attitudes.","hook":"Nature and the planet.","asks":[{"q":"A heat wave boosts ice cream sales. Which factor is this?","right":"Environmental","wrong":[["Economic, because the shop earns more revenue when the weather is hot","Weather is environmental."],["Social","Not a cultural trend."],["Political","Not government."]],"exp":"Climate and weather are environmental factors."},{"q":"Severe flooding closes highways between farm warehouses and distributors. Which factor is this?","right":"Environmental","wrong":[["Political, because the government decides when to close and reopen the highways","The cause is a natural disaster."],["Legal","No law."],["Technological","Not technology."]],"exp":"Natural disasters are environmental factors."}]},{"term":"Legal factors","def":"Specific laws and regulations a business must follow, such as consumer protection, health and safety, employment and intellectual property laws.","hook":"Rules on the books.","asks":[{"q":"New federal rules require battery recycling programs next year. For an e-bike maker this is:","right":"A legal factor that raises costs","wrong":[["A social factor that increases demand, because customers like recycling programs","It's a law that adds compliance costs."],["An economic opportunity","It adds costs."],["An internal decision","External."]],"exp":"Laws a business must follow are legal factors."},{"q":"Several states pass strict labeling laws for meat-alternative products. How does this affect the maker?","right":"It raises operating costs","wrong":[["It speeds up product innovation, since companies must invent new kinds of labels","Not the main effect."],["It increases population growth","Unrelated."],["It promotes renewable packaging","Not stated."]],"exp":"Legal factors like labeling rules raise costs and can make a market less attractive."}]},{"term":"Political vs. legal","def":"Government priorities and policy choices belong to the first; the specific laws a business must obey belong to the second.","hook":"Policy vs. rulebook.","asks":[{"q":"Which is a POLITICAL factor rather than a legal one?","right":"A government's new policy to subsidize clean energy","wrong":[["A state law requiring restaurants to post calorie counts on every menu item","That's a specific law: legal."],["A labeling requirement","Legal."],["Health and safety rules","Legal."]],"exp":"Policy priorities are political; specific laws are legal."},{"q":"A new law requires food handlers to follow strict sanitation steps. Which factor?","right":"Legal","wrong":[["Political, because the law was passed by elected officials in the government","The law a business must follow is legal."],["Social","Not a trend."],["Economic","Not the economy."]],"exp":"Specific laws and regulations are legal factors."}]}],"intro":["Political factors are government actions and policies, like taxes, subsidies and tariffs. Economic factors are about how the economy is doing, like inflation and interest rates. Social factors are trends in society and culture. Technological factors are new technology available to everyone. Environmental factors are nature and environmental concerns. Legal factors are the specific laws a business must follow."]}],"intro":["Topic 1.3 is about forces outside a business that it cannot control. PESTEL sorts them into six kinds. For every factor, decide whether it is an opportunity or a threat, and remember: a company's own decisions and inventions are not PESTEL factors."]},{"id":4,"name":"How Business Ideas Originate (1.4)","optional":false,"sections":[{"name":"Entrepreneurs and ideas","cards":[{"term":"Entrepreneur","def":"A person who bears the risk of bringing a new product or service to market.","hook":"The risk-taker.","asks":[{"q":"Maya leaves a job to start a mobile pet-grooming business with her own savings. What makes her an entrepreneur?","right":"She bears the risk of a new business","wrong":[["She works for a large corporation that pays her a steady salary and benefits","She left that to take a risk."],["She owns a pet","Not the point."],["She's a customer","She's the seller."]],"exp":"An entrepreneur bears the risk of bringing a new product or service to market."},{"q":"Which person is best described as an entrepreneur?","right":"A student who starts a bike-repair service","wrong":[["An employee who receives a bonus for meeting this year's sales target at work","No business risk."],["A customer buying a bike","A buyer."],["A government inspector","Not starting a business."]],"exp":"Starting a new business and bearing its risk."}]},{"term":"Entrepreneur motivations","def":"The usual reasons people start businesses: profit, solving a problem, and passion.","hook":"Money, problems, passion.","asks":[{"q":"Jordan loves fixing bikes and sees students struggling to get repairs. Which motivations fit?","right":"Passion and problem-solving","wrong":[["Only profit, since entrepreneurs never start businesses for any other reason","Your guide lists three motivations."],["Avoiding risk","Starting a business is risky."],["Government requirements","Not a motivation."]],"exp":"Motivations include profit, problem-solving and passion."},{"q":"Which is NOT one of the three motivations in your study guide?","right":"Guaranteed income","wrong":[["Solving a problem that customers have and are frustrated by every day","That's problem-solving."],["Profit","Listed."],["Passion","Listed."]],"exp":"Profit, problem-solving and passion; nothing is guaranteed."}]},{"term":"Idea generation","def":"Finding business concepts by observing, interviewing and surveying potential customers.","hook":"Watch, ask, survey.","asks":[{"q":"Lena watches families struggling to carry gear at tournaments and interviews parents. What is she doing?","right":"Generating ideas by observing and interviewing","wrong":[["Building a minimum viable product to test whether parents will buy her backpack","That comes later."],["Setting prices","Not yet."],["Writing a mission statement","Not this step."]],"exp":"Ideas come from observing, interviewing and surveying."},{"q":"Which method fits idea generation in your study guide?","right":"Surveying potential customers","wrong":[["Signing an exclusive agreement with the only supplier of a special material","That's a barrier."],["Filing for a patent","Protects an idea already found."],["Hiring an accountant","Unrelated."]],"exp":"Observe, interview, survey."}]}],"intro":["An entrepreneur takes the risk of bringing something new to market, usually for profit, to solve a problem, or out of passion. Good ideas come from paying attention to real people: observing, interviewing and surveying them."]},{"name":"Design thinking and the MVP","cards":[{"term":"Design thinking","def":"A process that validates an idea (test, feedback, iterate), develops a solution and builds an MVP.","hook":"Test before you build big.","asks":[{"q":"Which order matches design thinking in your study guide?","right":"Validate, develop the solution, build an MVP","wrong":[["Build the final product, then launch it, then ask customers what they think","That skips validation."],["Launch, then validate","Validation comes first."],["Patent, then validate","Not the order."]],"exp":"Validation (test, feedback, iterate) → solution development → MVP."},{"q":"Why does design thinking start by testing ideas with customers?","right":"To avoid building something customers don't want","wrong":[["To make sure the product is as expensive as possible before it reaches stores","Not the goal."],["To get a patent faster","Unrelated."],["To skip feedback later","Feedback continues."]],"exp":"Testing first saves time and money."}]},{"term":"Validation","def":"Testing an idea with customers, getting feedback and improving it before committing large resources.","hook":"Prove they want it.","asks":[{"q":"Before buying equipment, Jordan surveys 200 students about a repair plan. Which step is this?","right":"Validation","wrong":[["Launch, since Jordan is now selling repair plans to students on campus","He hasn't launched."],["Production","No production yet."],["Outsourcing","Unrelated."]],"exp":"Testing an idea with customers before committing resources is validation."},{"q":"Maya runs a mobile grooming van before renting a storefront. What does this show?","right":"Validating the model before a big commitment","wrong":[["Creating a barrier to entry so that other groomers can't compete with her","Not the purpose."],["Maximizing capacity","Not the point."],["Increasing market share","Not the main goal."]],"exp":"She tests demand before a large financial commitment."}]},{"term":"Iteration","def":"Making repeated improvements based on testing and feedback.","hook":"Improve, repeat.","asks":[{"q":"Lena redesigns the straps and enlarges a compartment after families test her backpack. What is this?","right":"Iteration","wrong":[["Mass production, because she is preparing to manufacture hundreds of backpacks","This step is improving the design."],["Collusion","Unrelated."],["Outsourcing","Unrelated."]],"exp":"Repeated improvements from feedback are iteration."},{"q":"Why do businesses iterate on products?","right":"Each round of feedback improves the product","wrong":[["Iteration guarantees that the product will never fail once it is launched","Nothing guarantees that."],["To avoid customers","It relies on them."],["To raise prices","Not its purpose."]],"exp":"Iteration means improving repeatedly based on testing and feedback."}]},{"term":"MVP hierarchy","def":"The order of what an MVP must achieve: functional, then reliable, then usable, then engaging.","hook":"Works, works every time, easy, fun.","asks":[{"q":"An MVP looks great but often crashes. Which requirement has it failed?","right":"Reliable","wrong":[["Engaging, because users get bored when the app keeps crashing on them","The issue is consistency."],["Functional","It works when it runs."],["Usable","Not the main issue."]],"exp":"Your guide's order: functional, reliable, usable, engaging."},{"q":"Which must an MVP achieve FIRST?","right":"Functional: it works and solves the core problem","wrong":[["Engaging: it has unique value that keeps users coming back again and again","That's last."],["Usable","Third."],["Reliable","Second."]],"exp":"Functional comes first."}]},{"term":"Keep it simple","def":"Testing rough, unpolished prototypes because they draw more honest feedback.","hook":"Rough gets real feedback.","asks":[{"q":"Why might a founder test a rough, unpolished prototype?","right":"Rough versions get more honest feedback","wrong":[["Rough prototypes are always cheaper to sell in stores than finished products","It's about feedback."],["Customers prefer ugly products","Not the point."],["It avoids testing","It is testing."]],"exp":"Keep it simple: unpolished prototypes draw honest feedback."},{"q":"Which action fits the \"keep it simple\" principle?","right":"Testing a cardboard model before building the real thing","wrong":[["Spending a year perfecting every detail before letting anyone see the product","That's the opposite."],["Adding every possible feature","Not simple."],["Skipping tests","Not the principle."]],"exp":"Simple prototypes give quick, honest feedback."}]},{"term":"Embrace friction","def":"Welcoming early failures, which cost far less to fix than failures at large scale.","hook":"Fail early, fail cheap.","asks":[{"q":"Why does your study guide say to embrace friction early?","right":"Early failures cost less than failures at scale","wrong":[["Friction always means the idea should be abandoned immediately and forgotten","It's a chance to learn."],["Friction creates barriers to entry","Unrelated."],["Customers like problems","No."]],"exp":"Early failures save time and money later."},{"q":"A prototype fails a test in week one. Under \"embrace friction,\" how should the team see it?","right":"A cheap lesson to fix before scaling","wrong":[["Proof that the business can never succeed and should close right away","Too extreme."],["A reason to stop testing","Keep testing."],["A legal problem","Unrelated."]],"exp":"Learn from early failures."}]},{"term":"User-centricity","def":"Designing around what the people using it actually need rather than what the founder assumes.","hook":"Build for the user.","asks":[{"q":"A founder adds features he likes but users never asked for. Which principle is he ignoring?","right":"User-centricity","wrong":[["Embrace friction, because he is making the product harder for users to learn","The issue is ignoring user needs."],["Keep it simple","Related, but the core issue is users."],["Vertical integration","Unrelated."]],"exp":"Center on users' actual needs."},{"q":"Which action best shows user-centricity?","right":"Redesigning based on what users say they need","wrong":[["Choosing features based on what the company's engineers find most interesting","Not centered on users."],["Raising prices","Unrelated."],["Copying a rival's design","Not user-centered."]],"exp":"User-centricity designs around real user needs."}]}],"intro":["Design thinking tests an idea before investing heavily: test, get feedback, iterate, then develop the solution and build an MVP. An MVP has to work before it needs to be pretty. Your study guide ranks its requirements: functional, then reliable, then usable, then engaging."]}],"intro":["Topic 1.4 follows an idea from an entrepreneur's head to a tested product. This deck comes from your study guide (the 1.4 slides could not be opened). Expect questions about testing an idea cheaply before spending a lot."]},{"id":5,"name":"Vision (1.5)","optional":false,"sections":[{"name":"Values and competencies","cards":[{"term":"Core values","def":"The beliefs and principles that guide a business's actions, such as transparency, empathy or reliability.","hook":"What we believe.","asks":[{"q":"A tech firm turns down a profitable project because it would collect user data aggressively, against its belief in privacy. What guided the decision?","right":"Core values","wrong":[["Core competencies, because the firm is very good at protecting users' private data","The decision rests on a belief, not a skill."],["Market share goals","It gave up profit."],["Legal mandates","No law is mentioned."]],"exp":"Beliefs like privacy are core values."},{"q":"A company refuses to build a back door into its phones for law enforcement. This most reflects:","right":"A core value of privacy","wrong":[["A core competency in low-cost manufacturing that lets it sell phones cheaply","Unrelated."],["A legal requirement","It's refusing a request."],["A barrier to entry","Unrelated."]],"exp":"Core values guide strategic decisions (your slides: Apple and privacy)."}]},{"term":"Company culture","def":"The shared values and behaviors that shape how people work and interact in a business.","hook":"How we act together.","asks":[{"q":"New employees quickly learn that everyone helps customers beyond what's required. What does this describe?","right":"Company culture","wrong":[["A code of conduct, since the company has written rules for helping customers","Nothing is written; it's shared behavior."],["Outsourcing","Unrelated."],["A mission statement","That's a written statement."]],"exp":"Shared values and behaviors are company culture."},{"q":"Why do businesses share their core values with employees?","right":"To build a culture where everyone works toward the same goals","wrong":[["To meet a legal requirement that all businesses must publish their values","Not required."],["To set prices","Unrelated."],["To avoid hiring","Unrelated."]],"exp":"Shared values align employees and shape culture."}]},{"term":"Core competencies","def":"The capabilities, skills and expertise that let a business outperform rivals, such as low-cost production or great service.","hook":"What we're best at.","asks":[{"q":"Schools buy Spark Robotics' kits mainly for its lesson plans and live teacher support, not the hardware. What is its core competency?","right":"Teacher support and instructional materials","wrong":[["Producing robotics kits at a lower cost than any other company in the market","Schools pass up cheaper kits."],["The widest product selection","Not mentioned."],["More advanced hardware","Not why schools buy."]],"exp":"Core competencies are the capabilities that let a firm outperform rivals."},{"q":"Spark Robotics wants to expand to high schools. Which question matters most?","right":"Will its teacher support create value there too?","wrong":[["Can the company lower its manufacturing costs without lowering the quality of its kits?","That's not its core competency."],["Will high schools buy more kits?","Secondary."],["Would cheaper kits raise share?","Not its strength."]],"exp":"Businesses weigh their core competencies when choosing opportunities."}]}],"intro":["Core values are beliefs (privacy, empathy, transparency); core competencies are skills (low-cost production, customer service, innovation). If a company turns down a profitable deal because it clashes with a belief, it is following a core value. If it chooses an opportunity because it is especially good at something, it is using a core competency."]},{"name":"Vision and mission statements","cards":[{"term":"Vision statement","def":"A short declaration of a business's aspirations and values: where it hopes to go and why.","hook":"Where and why.","asks":[{"q":"\"To become the most trusted provider of healthy school meals in the state.\" What is this?","right":"A vision statement","wrong":[["A mission statement, because it says what the company does for its customers","It states an aspiration: where it wants to go."],["A value proposition","It's not about why to choose a product."],["A tagline","Not a brand phrase."]],"exp":"A vision statement describes where the business aspires to go."},{"q":"Which proposal best supports a vision \"to become the most trusted provider of healthy school meals in the state\"?","right":"Independent nutrition certification and gradual expansion","wrong":[["Cutting prices and using standardized menus to win contracts in as many districts as possible","Trust and health matter more than speed and price here."],["Expanding fast while keeping current standards","Speed doesn't build trust."],["Staying in one district only","The vision is statewide."]],"exp":"Choose the option that builds trust and reaches the state."}]},{"term":"Mission statement","def":"A declaration of what a business does and how it will reach its long-term goals.","hook":"What and how.","asks":[{"q":"\"We prepare affordable, nutritious meals that help students learn and thrive every day.\" What is this?","right":"A mission statement","wrong":[["A vision statement, because it describes the company's hopes for its students' futures","It says what the company does and how."],["A core competency","Not a skill."],["A slogan","Not for a campaign."]],"exp":"A mission statement says what a business does and how."},{"q":"A prosthetics maker's site says: \"using recycled materials and 3D printing to provide affordable devices to underserved communities.\" What is this?","right":"A mission statement","wrong":[["A vision statement, since it describes the future the company hopes to create","It explains what it does and how."],["A core value","It's a statement of activity."],["A trademark","Not a protected mark."]],"exp":"What and how: mission."}]}],"intro":["Your study guide's shortcut: a vision statement says WHERE the business wants to go and WHY (its aspirations and values); a mission statement says WHAT the business does and HOW. Both give everyone a shared purpose and tell customers and investors what the business cares about."]},{"name":"Types of organizations","cards":[{"term":"For-profit business","def":"An organization whose goal is to earn money beyond its costs for its owners while fulfilling its mission and staying competitive; example: Amazon.","hook":"Profit for owners.","asks":[{"q":"Which organization is a for-profit business?","right":"Walmart","wrong":[["The American Red Cross, which provides disaster relief around the world","Nonprofit."],["Habitat for Humanity","Nonprofit."],["Doctors Without Borders","Nonprofit."]],"exp":"For-profits aim to earn profit for owners."},{"q":"How can a for-profit business increase its profit?","right":"Raise revenue or cut costs","wrong":[["Reinvest every dollar of surplus back into its programs, as the law requires","That's a nonprofit rule."],["Rely on donations","Nonprofits do."],["Avoid competition","Not a method."]],"exp":"Profit = revenue − costs."}]},{"term":"Social enterprise","def":"A business that earns profit while also pursuing goals for society or the environment; examples: Patagonia, TOMS.","hook":"Profit with a purpose.","asks":[{"q":"TOMS gives part of its profits to social causes while selling shoes for profit. What kind of organization is it?","right":"A social enterprise","wrong":[["A nonprofit, because it gives money to charities that work on social issues","It still earns profit."],["A cooperative","Not in your sources."],["A monopoly","Unrelated."]],"exp":"Profit plus social or environmental goals: social enterprise."},{"q":"A prosthetics company charges a \"fair price\" that covers costs and modest growth instead of the highest price possible. This reflects:","right":"Its core values meeting the market price","wrong":[["A desire for a monopoly combined with buyers who want the lowest possible price","Not supported."],["A nonprofit legal requirement","It's a social enterprise."],["A PESTEL factor","It's internal."]],"exp":"A social enterprise's beliefs shape how it prices."}]},{"term":"Nonprofit organization","def":"A group that serves the public good; by law its surplus is reinvested, and it relies on donations and grants; example: the Red Cross.","hook":"Surplus goes back in.","asks":[{"q":"What is a key difference between a nonprofit and a traditional business?","right":"Nonprofits must reinvest surplus funds","wrong":[["Nonprofits are not allowed to have mission statements or vision statements","They do have them."],["Traditional businesses ignore core competencies","Not true."],["Traditional businesses serve the public good only","Reversed."]],"exp":"By law, a nonprofit's surplus goes back into the organization."},{"q":"Where does a nonprofit usually get much of its money?","right":"Donations, grants and fundraising","wrong":[["Selling shares of stock to investors who expect to receive part of the profits","Nonprofits don't have shareholders."],["Only customer purchases","Usually not the main source."],["Tariffs","Unrelated."]],"exp":"Nonprofits rely on donations, grants and fundraising."}]}],"intro":["For-profit businesses aim to earn profit for their owners. Social enterprises earn profit while also pursuing social or environmental goals. Nonprofits serve the public good; by law, any surplus goes back into the organization, and they rely on donations and grants."]}],"intro":["Topic 1.5 is about what a business stands for and where it is going. Core values guide decisions, core competencies are what the business is best at, and vision and mission statements put it into words. Different organizations also have different goals: profit, profit plus social good, or the public good."]},{"id":6,"name":"Business Ethics (1.6)","optional":false,"sections":[{"name":"Unethical behavior and its causes","cards":[{"term":"Unethical behavior","def":"Actions such as falsifying information, misusing company property, concealing data or committing fraud.","hook":"Lying, hiding, cheating.","asks":[{"q":"A founder wants to advertise a filter as \"clinically proven\" with no testing done. Why is this the biggest ethical concern?","right":"It makes claims with no reliable evidence","wrong":[["Applying for a patent before production starts is a form of unfair competition","Patents are legal and normal."],["Surveying customers first","Normal research."],["Revising the prototype","Normal iteration."]],"exp":"Unsupported claims are deceptive, a form of unethical behavior."},{"q":"Which is an example of unethical behavior from your study guide?","right":"Concealing data from regulators","wrong":[["Hiring an outside accounting firm to prepare the company's tax documents each year","Outsourcing is legal."],["Raising prices when demand rises","Not unethical by itself."],["Launching an MVP","Normal practice."]],"exp":"Falsifying, misusing property, concealing data and fraud."}]},{"term":"Incentive structures","def":"The rewards a business sets up; poorly designed ones can push employees toward unethical choices.","hook":"Bad rewards, bad choices.","asks":[{"q":"A company pays big bonuses for hitting sales targets no matter how. Some reps start lying to customers. What is the root cause?","right":"A poorly designed incentive structure","wrong":[["A strong code of conduct that employees must follow at all times","That would discourage lying."],["Too much ethics training","That's not the cause."],["A PESTEL factor","It's internal."]],"exp":"Poor incentives can push employees toward unethical choices."},{"q":"Which change would best fix incentives that reward results \"at any cost\"?","right":"Reward both results and honest methods","wrong":[["Raise the bonus for hitting targets so employees are even more motivated to sell","That worsens the pressure."],["Remove all goals","Too extreme."],["Outsource sales","Doesn't fix incentives."]],"exp":"Incentives should not push people toward unethical choices."}]},{"term":"Ethical dilemma","def":"A decision between competing responsibilities where no option is clearly right or wrong.","hook":"No perfect choice.","asks":[{"q":"A thermostat has a minor Wi-Fi bug; fixing it delays launch four months and costs $8 million. Executives weigh customers, shareholders and reputation. What is this?","right":"An ethical dilemma involving competing responsibilities","wrong":[["A conflict between two market segments that want different thermostat features","Not about segments."],["A differentiation decision","Not the core issue."],["A feedback-based design choice","Not the core issue."]],"exp":"Competing responsibilities with no clearly right option."},{"q":"What makes a situation an ethical dilemma rather than a simple wrong?","right":"No option is clearly right or wrong","wrong":[["Breaking a law that clearly protects customers from unsafe products","That's a clear wrong."],["Earning a profit","Not a dilemma."],["Following the code of conduct","Not a dilemma."]],"exp":"Dilemmas involve competing responsibilities."}]}],"intro":["Unethical behavior includes falsifying records, misusing company property, hiding data and fraud. Poorly designed incentives can push employees toward it, for example rewarding results no matter how they were reached."]},{"name":"Encouraging ethical behavior","cards":[{"term":"Code of conduct","def":"Written standards of behavior that employees are expected to follow.","hook":"Written rules of behavior.","asks":[{"q":"A company publishes written rules for how employees handle gifts from suppliers. What is this?","right":"A code of conduct","wrong":[["A mission statement that explains what the company does and how it does it","Not about behavior rules."],["A business hypothesis","Unrelated."],["A trademark","Unrelated."]],"exp":"Written standards employees must follow."},{"q":"A code of conduct mainly helps by:","right":"Making expected behavior clear in writing","wrong":[["Guaranteeing that no employee will ever make an unethical choice at work","Too strong."],["Raising profits immediately","Not its purpose."],["Replacing leadership","Leaders still matter."]],"exp":"It sets clear written standards."}]},{"term":"Ethics training","def":"Ongoing programs that teach employees how to recognize and handle right-and-wrong situations.","hook":"Practice doing right.","asks":[{"q":"A bank holds yearly workshops where staff practice handling fraud situations. What is this?","right":"Ethics training","wrong":[["Accountability, since employees who commit fraud will be fired by the bank","That's consequences, not training."],["Outsourcing","Unrelated."],["A code of conduct","That's written rules."]],"exp":"Ongoing programs that build ethical skills."},{"q":"Why is ethics training ongoing rather than one-time?","right":"New situations and employees keep coming","wrong":[["The law requires companies to retrain every employee every single week","Not stated."],["Training raises prices","Unrelated."],["It replaces accountability","Both matter."]],"exp":"Ongoing programs keep ethics current."}]},{"term":"Accountability","def":"Internal consequences for employees who break ethical rules.","hook":"Breaking rules has a cost.","asks":[{"q":"A manager who falsified reports loses a promotion and must repay bonuses. What does this show?","right":"Accountability","wrong":[["A strong incentive structure that rewards managers for reporting results quickly","This is a consequence."],["Leadership modeling","Not modeling."],["Outsourcing","Unrelated."]],"exp":"Internal repercussions for wrongdoing are accountability."},{"q":"Which situation shows weak accountability?","right":"Rule-breakers face no consequences","wrong":[["Employees who break the code of conduct are disciplined by their managers","That's strong accountability."],["Leaders follow the rules","Leadership."],["Staff are trained","Training."]],"exp":"Without consequences, rules lose force."}]},{"term":"Ethical leadership","def":"Executives modeling the honest, fair behavior they expect from everyone else.","hook":"Leaders go first.","asks":[{"q":"A CEO publicly refuses an expensive gift from a supplier, following the same rule as staff. What does this show?","right":"Leadership modeling ethics","wrong":[["Outsourcing the company's decisions to the supplier's leadership team","Unrelated."],["A PESTEL factor","Internal."],["Accountability only","It's mainly modeling."]],"exp":"Executives model the behavior they expect."},{"q":"Why does ethical leadership matter so much?","right":"Employees follow what leaders actually do","wrong":[["Leaders are the only people in a company who can behave unethically","Anyone can."],["It replaces the code of conduct","Both matter."],["It sets prices","Unrelated."]],"exp":"Leaders set the example."}]}],"intro":["Businesses build ethics into the organization with written codes of conduct, ongoing training, real consequences for wrongdoing, and leaders who model the behavior they expect."]},{"name":"Stakeholders and frameworks","cards":[{"term":"Internal stakeholders","def":"People inside the business who are directly involved in operations, such as employees and managers.","hook":"Inside the company.","asks":[{"q":"Which group is an internal stakeholder?","right":"Employees","wrong":[["Customers who buy the company's products at stores across the country","External."],["Suppliers","External."],["The local community","External."]],"exp":"Internal stakeholders work inside the business."},{"q":"Factory workers would be affected by a plan to automate production. As stakeholders they are:","right":"Internal","wrong":[["External, because they would lose their jobs and leave the company afterward","They are inside the business now."],["Not stakeholders","They are affected."],["Shareholders","Not necessarily."]],"exp":"Employees are internal stakeholders."}]},{"term":"External stakeholders","def":"People outside the business who are affected by it, such as customers, the community, investors and suppliers.","hook":"Outside the company.","asks":[{"q":"A thermostat launches without disclosing a bug. Which stakeholder is most directly affected first?","right":"Customers using the thermostats","wrong":[["Shareholders who expect higher profits from the company this quarter","Not first."],["Retailers","Less directly."],["Manufacturing employees","Less directly."]],"exp":"Customers, external stakeholders, feel it first."},{"q":"Which group is an external stakeholder?","right":"Suppliers","wrong":[["Managers who oversee the company's day-to-day operations and its employees","Internal."],["Employees","Internal."],["Executives","Internal."]],"exp":"Customers, community, investors and suppliers are external."}]},{"term":"Net benefit framework","def":"Choosing the option that produces the greatest total good and least total harm across everyone affected.","hook":"Most good, least harm.","asks":[{"q":"A device maker can't tell if delaying a launch is right or wrong. Which approach best helps decide?","right":"Greatest total benefit, least total harm","wrong":[["Pick whatever produces the biggest short-term return for the investors","Ignores other stakeholders."],["Go with most managers' vote","Popularity isn't a framework."],["Change the launch date least","Not ethical reasoning."]],"exp":"Net benefit weighs all stakeholders."},{"q":"A company launches while clearly telling hospitals about a software issue and sending a fix soon. Which conclusion is most reasonable?","right":"It balances interests while increasing transparency","wrong":[["It removes every possible ethical concern because hospitals got advance notice","Too strong."],["It guarantees future sales","No guarantee."],["It shows profit beats safety","Not what it shows."]],"exp":"A balanced choice across stakeholders, with transparency."}]},{"term":"Strategic alignment framework","def":"Choosing the option that fits the business's stated values and mission.","hook":"Does it match who we are?","asks":[{"q":"A company known for \"radical honesty\" chooses to publicly disclose a product flaw. Which framework fits best?","right":"Strategic alignment","wrong":[["Net benefit, because disclosure always produces the most good for everyone","The reason given is fit with values."],["Reputation only","The stated reason is its values."],["Limit pricing","Unrelated."]],"exp":"Choosing what fits stated values is strategic alignment."},{"q":"Which question applies the strategic alignment framework?","right":"Does this match our stated values?","wrong":[["Which option produces the greatest total benefit for every group affected?","That's net benefit."],["How will the public see us?","Reputation."],["What's cheapest?","Not a framework."]],"exp":"Strategic alignment checks fit with values and mission."}]},{"term":"Reputation framework","def":"Choosing the option that protects the business's public standing and trust.","hook":"What will people think?","asks":[{"q":"A firm recalls a product early because news coverage could destroy trust in the brand. Which framework is it using?","right":"Reputation","wrong":[["Strategic alignment, since the recall fits the company's mission statement","The stated reason is public trust."],["Net benefit","The reason given is trust."],["Accountability","Not a decision framework here."]],"exp":"Protecting public standing is the reputation framework."},{"q":"Why might the reputation framework favor honesty even when it's costly?","right":"Lost trust can cost more over time","wrong":[["Honest companies are always exempt from lawsuits and government fines","Not true."],["Reputation never affects sales","It does."],["It's required by tariffs","Unrelated."]],"exp":"Public trust supports long-term success."}]}],"intro":["Stakeholders are everyone affected by a business decision. Internal stakeholders work inside the company; external ones are customers, the community, investors and suppliers. To decide a dilemma, your study guide gives three lenses: net benefit, strategic alignment and reputation."]}],"intro":["Topic 1.6 asks what pushes people toward unethical choices and how businesses encourage ethical ones. This deck comes from your study guide and the ethics questions on your practice test (there are no 1.6 slides in your Drive). Many questions describe a dilemma with no perfect answer and ask for the best way to decide."]},{"id":7,"name":"Organization, Roles and Responsibilities (1.7)","optional":false,"sections":[{"name":"Business structures","cards":[{"term":"Liability","def":"Legal responsibility for a business's debts and losses.","hook":"Who pays the debts?","asks":[{"q":"Which question is about liability?","right":"Who must pay if the business can't pay its debts?","wrong":[["Which department in the company is responsible for hiring new employees?","That's HR."],["What is the mission?","Not liability."],["Who is the target customer?","Not liability."]],"exp":"Liability is legal responsibility for a business's debts and losses."},{"q":"Why do growing businesses often change their structure?","right":"To reduce risk or raise money","wrong":[["To avoid having to pay any taxes to the government ever again","Not a reason given."],["To lower prices","Not the reason."],["To stop hiring","Not the reason."]],"exp":"Structure affects control, liability and access to funding."}]},{"term":"Unlimited liability","def":"Owners' personal assets, such as savings or a house, can be used to pay business debts.","hook":"Your house is at risk.","asks":[{"q":"A sole proprietor's bakery fails owing $50,000. What can creditors pursue?","right":"The owner's personal savings and property","wrong":[["Only the bakery's equipment, since the owner's own property is legally protected","That's limited liability."],["Nothing","Debts must be paid."],["Only the shareholders","There are none."]],"exp":"With unlimited liability, personal assets can pay business debts."},{"q":"Which structures usually have unlimited liability?","right":"Sole proprietorships and partnerships","wrong":[["LLCs and corporations, because their owners are responsible for every decision","They have limited liability."],["Only corporations","Limited."],["Only LLCs","Limited."]],"exp":"Owners of these structures are usually personally responsible."}]},{"term":"Limited liability","def":"Owners can lose only what they invested; their personal assets are protected.","hook":"You lose only your investment.","asks":[{"q":"An LLC owner invested $20,000 and the business fails owing $100,000. What can she lose?","right":"Her $20,000 investment","wrong":[["Her house, car and savings, since she owns the business that owes the money","Limited liability protects personal assets."],["$100,000","Not beyond her investment."],["Nothing at all","She loses her investment."]],"exp":"Limited liability: owners lose only what they invested."},{"q":"Kai and Nora's partnership is growing. Which reason best justifies switching to an LLC?","right":"To protect their personal assets","wrong":[["To hire more marketing employees for the new advertising campaign this year","Any structure can hire."],["To raise their prices","Unrelated."],["To outsource payroll","Unrelated."]],"exp":"An LLC gives limited liability."}]},{"term":"Sole proprietorship","def":"A business owned and run by one person with no legal separation from it: full control, all profits, unlimited liability and limited funding.","hook":"One owner, all the risk.","asks":[{"q":"Olivia starts a home invitation business with low costs and wants full control. Which factor most likely led her to choose a sole proprietorship?","right":"Low startup costs and being the only owner","wrong":[["Expecting to need outside investment to support rapid growth next year","That points to other structures."],["Wanting less personal liability","Sole proprietors have unlimited liability."],["Planning to hire many employees","Not the deciding factor."]],"exp":"Sole proprietorships fit one owner with low startup costs."},{"q":"A year later Olivia signs large contracts with penalties for late delivery. Why might she reconsider her structure?","right":"Her personal financial risk has grown","wrong":[["Her invitation product line has expanded to include more paper designs","Not the key reason."],["She has more customers","Not by itself."],["Her profits keep rising","Not by itself."]],"exp":"Bigger risks make limited liability more attractive."}]},{"term":"Partnership","def":"A business owned by two or more people who share decisions, profits and losses; partners are usually personally liable and it is hard to dissolve.","hook":"Shared control, shared risk.","asks":[{"q":"Kai buys beans and roasts; Nora handles café clients and the website. They share profits. What is their structure?","right":"A partnership","wrong":[["A corporation, because they divide the company's work into separate departments","No shareholders or board."],["A sole proprietorship","Two owners."],["A nonprofit","They earn profit."]],"exp":"Two or more owners sharing control and profits."},{"q":"Why are partnerships often harder to end than sole proprietorships?","right":"Ending one needs the partners' agreement","wrong":[["The government must approve every partnership's closing in a public hearing","Not stated."],["Partners have limited liability","Usually unlimited."],["They have shareholders","They don't."]],"exp":"Dissolving requires agreement among partners."}]},{"term":"Limited liability company (LLC)","def":"A structure whose owners (members) can lose only what they invested and enjoy flexible management; it can attract investors but cannot sell stock.","hook":"Protection without complexity.","asks":[{"q":"Which feature is true of an LLC?","right":"It can attract investors but cannot sell stock","wrong":[["It must be run by a board of directors elected by many public shareholders","That's a corporation."],["Owners have unlimited liability","Limited."],["It can have only one owner","One or more members."]],"exp":"LLCs offer limited liability, flexible management and moderate funding."},{"q":"Why do many owners choose an LLC over a corporation?","right":"Protection without corporate complexity","wrong":[["LLCs have the greatest access to funding because they sell shares of stock","Corporations do."],["LLCs avoid all taxes","Not stated."],["LLCs have unlimited liability","Limited."]],"exp":"Limited liability with flexible, simpler management."}]},{"term":"Corporation","def":"A business owned by shareholders as a separate legal entity, with limited liability, the greatest access to funding (it sells stock) and the most rules.","hook":"Shareholders own it.","asks":[{"q":"Sara turns her delivery business into a corporation to buy a fleet of electric vans. What did she gain?","right":"Greater access to funding","wrong":[["Total control over every daily decision in each of the company's departments","She gives up control."],["No need for a board","Corporations have boards."],["Personal liability for the fleet","Limited liability."]],"exp":"Corporations can raise capital by selling stock."},{"q":"What trade-off would Olivia face if she organized as a corporation?","right":"More funding, but giving up sole control","wrong":[["Lower startup costs, but losing the personal protection she has right now","Reversed."],["Complete control, but full personal liability","That's a sole proprietorship."],["No employees, but slower growth","Unrelated."]],"exp":"Owners cede control to shareholders and a board."}]},{"term":"C-corporation","def":"A shareholder-owned company run by a board of directors that can raise the most capital but faces double taxation.","hook":"Taxed twice.","asks":[{"q":"Which feature belongs to a C-corporation?","right":"Double taxation","wrong":[["Pass-through taxation, with profits taxed only once on the owners' returns","That's an S-corp."],["At most 100 shareholders","S-corp."],["Unlimited liability","Corporations are limited."]],"exp":"Your study guide: C-corps face double taxation."},{"q":"A company wants to raise as much capital as possible from many investors. Which structure fits best?","right":"C-corporation","wrong":[["Sole proprietorship, since one owner can make funding decisions more quickly","Least access to funding."],["Partnership","Limited funding."],["S-corporation","Limited to 100 shareholders."]],"exp":"C-corporations have the greatest capital access."}]},{"term":"S-corporation","def":"A shareholder-owned company with pass-through taxation, limited to 100 or fewer shareholders.","hook":"Passes taxes through.","asks":[{"q":"Which is true of an S-corporation?","right":"Pass-through taxation, 100 or fewer shareholders","wrong":[["Unlimited shareholders and double taxation on every dollar the company earns","That's a C-corp."],["Unlimited liability","Limited."],["Owned by one person only","Up to 100."]],"exp":"S-corps pass profits through and cap shareholders at 100."},{"q":"A company expects to grow to 300 shareholders. Why wouldn't an S-corporation work?","right":"S-corps are limited to 100 shareholders","wrong":[["S-corps can't have limited liability for any of their shareholders at all","They do."],["S-corps must be nonprofits","No."],["S-corps can't make profits","They can."]],"exp":"S-corporations have at most 100 shareholders."}]}],"intro":["A sole proprietorship has one owner who controls everything and is personally liable. A partnership shares control among two or more owners, who are usually all personally liable. An LLC gives owners limited liability with flexible management. A corporation is owned by shareholders, has the most access to money because it can sell stock, but owners give up control to a board."]},{"name":"Leadership and departments","cards":[{"term":"Board of directors","def":"A group elected by shareholders that oversees a corporation's major strategic decisions.","hook":"Watches over the company for shareholders.","asks":[{"q":"After reviewing an expansion proposal, the board approves it. What role is the board playing?","right":"Overseeing major decisions for shareholders","wrong":[["Managing daily operations and setting the tutoring schedules for each location","That's management."],["Running ad campaigns","Marketing."],["Hiring tutors","HR."]],"exp":"The board oversees major strategic decisions on behalf of shareholders."},{"q":"Who elects a corporation's board of directors?","right":"The shareholders","wrong":[["The CEO, who chooses the board members to help run the company each day","The board oversees the CEO."],["The employees","Not usually."],["The government","No."]],"exp":"Shareholders elect the board."}]},{"term":"Executives","def":"Top leaders such as the CEO and CFO who are responsible for strategy and overall performance; in a corporation they report to the board.","hook":"Run the whole company.","asks":[{"q":"A company must decide whether it can afford a $2 million expansion. Who is most responsible?","right":"The CFO","wrong":[["The CEO, since the CEO makes every decision in the company personally","Finance questions go to the CFO."],["The VP of Marketing","Not finances."],["The HR director","Not finances."]],"exp":"The Chief Financial Officer oversees financial decisions."},{"q":"In a corporation, to whom do executives like the CEO report?","right":"The board of directors","wrong":[["The department managers, who supervise the executives on behalf of employees","Reversed."],["Customers","Not formally."],["Suppliers","No."]],"exp":"Executives report to the board and shareholders."}]},{"term":"Outsourcing","def":"Hiring another firm to perform specific tasks, such as payroll, IT or accounting, to reduce costs or get specialized skills.","hook":"Hire it out.","asks":[{"q":"A coffee roaster hires an outside firm to prepare its financial statements so the owners can focus on growth. Why?","right":"To let specialists handle accounting","wrong":[["To gain control of every stage of its supply chain from farm to café","That's vertical integration."],["To target new customers","Unrelated."],["To differentiate the coffee","Unrelated."]],"exp":"Outsourcing taps specialized skills and frees owners to focus."},{"q":"A board suggests paying a tech company to store the firm's data instead of running its own servers. What is this?","right":"Outsourcing","wrong":[["Vertical integration, because the company is adding a new stage to its business","It's handing a task to another firm."],["Becoming an LLC","Unrelated."],["Merging departments","Unrelated."]],"exp":"Paying another firm for a function is outsourcing."}]},{"term":"Sales and marketing","def":"The department that researches customer needs, promotes products, sets pricing and builds relationships to increase revenue.","hook":"Win customers.","asks":[{"q":"As a coffee business grows, which task would most likely go to Nora, who handles clients and advertising?","right":"Analyzing survey data to find a new target market","wrong":[["Forecasting the company's cash flow for the next quarter of the year","That's finance."],["Scheduling roaster maintenance","Operations."],["Designing benefit packages","HR."]],"exp":"Finding customers is sales and marketing."},{"q":"After sales decline, a company weighs more advertising versus a redesign. Your slides assign this to:","right":"Sales and marketing","wrong":[["Accounting, because the department records all of the company's sales figures","Recording isn't deciding strategy."],["HR","Not people."],["Operations","Not production."]],"exp":"Your slides list this decision under sales and marketing."}]},{"term":"Research and development (R&D)","def":"The department that designs new products and improves goods, services and processes.","hook":"Invent and improve.","asks":[{"q":"Competitors keep releasing bottles with new features. Which reason best justifies giving R&D more money?","right":"Rivals keep introducing new features","wrong":[["Production delays have raised the company's shipping and transportation costs","That points to operations."],["Retailers get late shipments","Operations."],["Machines need more maintenance","Operations."]],"exp":"R&D designs new products to stay competitive."},{"q":"A firm designs and tests an improved version of an existing product. Which department?","right":"R&D","wrong":[["Operations, since the improved product will eventually be produced in the factory","Designing and testing is R&D."],["Accounting","Records."],["HR","People."]],"exp":"R&D improves goods, services and processes."}]},{"term":"Operations","def":"The department that manages production and delivery, efficiency and quality control.","hook":"Make it and deliver it.","asks":[{"q":"A bottle company invests in R&D but not operations, and retailers cut orders because deliveries stay late. What does this show?","right":"Operations was underestimated","wrong":[["Customer surveys found demand for additional bottle features, so R&D was right","Late deliveries point to operations."],["Engineers built another prototype","R&D success."],["Rivals copied the insulation","Competition."]],"exp":"Operations handles on-time production and delivery."},{"q":"A company schedules workers and manages production of goods. Which department?","right":"Operations","wrong":[["Human resources, because the department manages the company's workers","Scheduling production is operations."],["Finance","Money."],["Marketing","Customers."]],"exp":"Operations manages production and delivery."}]},{"term":"Accounting","def":"The department that records transactions, tracks revenue and expenses, and prepares financial statements.","hook":"Keep the records.","asks":[{"q":"A company records revenues and expenses and prepares financial statements. Which department?","right":"Accounting","wrong":[["Finance, because the department deals with the company's money every day","Finance plans; accounting records."],["Operations","Production."],["R&D","Products."]],"exp":"Accounting records transactions and prepares statements."},{"q":"How do accounting and finance differ?","right":"Accounting records; finance plans and allocates","wrong":[["Accounting decides whether to borrow money; finance records all the transactions","Reversed."],["They are the same","Different jobs."],["Finance hires people","That's HR."]],"exp":"Accounting tracks; finance budgets, invests and borrows."}]},{"term":"Finance","def":"The department that manages funds and plans for future needs through budgeting, investing and borrowing.","hook":"Plan the money.","asks":[{"q":"A department analyzes electricity versus fuel costs and secures a multimillion-dollar loan for new vans. Which is it?","right":"Finance","wrong":[["Operations, since the vans will be used every day to make the deliveries","Securing loans is finance."],["Accounting","Records, not loans."],["Marketing","Customers."]],"exp":"Finance manages funds, borrowing and investment."},{"q":"A company evaluates whether to borrow money or invest in new equipment. Which department?","right":"Finance","wrong":[["R&D, since new equipment helps the company design better products in the future","Funding decisions are finance."],["HR","People."],["Sales","Customers."]],"exp":"Finance plans future financial needs."}]},{"term":"Human resources (HR)","def":"The department that recruits, hires, trains and evaluates employees and manages pay and benefits.","hook":"Hire and train people.","asks":[{"q":"A tutoring company must hire 75 online tutors before school starts. Which department leads?","right":"Human resources","wrong":[["Operations, because the tutors will deliver the company's main service to students","Hiring is HR."],["Finance","Money."],["Marketing","Customers."]],"exp":"HR recruits, hires and trains employees."},{"q":"A company builds a long-term plan to recruit, train and retain skilled workers. Which department?","right":"HR","wrong":[["Operations, since the workers will run the company's production lines","Workforce planning is HR."],["Accounting","Records."],["R&D","Products."]],"exp":"HR manages the workforce."}]}],"intro":["In a corporation, the board of directors oversees major decisions for shareholders, executives like the CEO and CFO run the business and report to the board, and managers lead specialized departments. Some tasks are outsourced to other firms to cut costs or get special skills."]}],"intro":["Topic 1.7 covers how businesses are legally organized and how work is divided. The most tested idea is liability: whether owners can lose their personal property to pay business debts. Structures trade control against protection and access to money."]},{"id":8,"name":"Supply Chains (1.8)","optional":false,"sections":[{"name":"Production and the chain","cards":[{"term":"Artisan production","def":"Producing smaller quantities of unique items with skilled labor and attention to detail, at a higher cost per unit.","hook":"Handmade and unique.","asks":[{"q":"Candles are poured, decorated and inspected by hand, and customers wait three weeks. Which process is this?","right":"Artisan production","wrong":[["Mass production, since the company makes many candles for customers every month","Hand work with long waits is artisan."],["Outsourcing","Unrelated."],["Vertical integration","Unrelated."]],"exp":"Skilled hand labor, small quantities, unique items."},{"q":"Before automating, what should a handmade-candle maker consider most?","right":"Whether customers value handmade quality enough","wrong":[["Whether competitors will lower their prices after the company automates production","Secondary."],["Whether wax suppliers will cut prices","Secondary."],["Whether ad spending can fall","Unrelated."]],"exp":"Its differentiation may depend on being handmade."}]},{"term":"Mass production","def":"Using technology and assembly lines to produce large quantities quickly and consistently at a lower cost per unit.","hook":"Lots, fast, the same.","asks":[{"q":"A candle maker buys equipment that makes thousands of identical candles a week. Most likely outcome?","right":"More capacity but less differentiation","wrong":[["Customers will automatically see the candles as being higher quality than before","Not automatic."],["Less inventory","More."],["No more competition","Too strong."]],"exp":"Mass production raises output but may weaken a handmade identity."},{"q":"Why is mass production more than \"making cheap stuff\"?","right":"It's a strategic choice that lowers cost per unit","wrong":[["It always produces the highest-quality goods available anywhere in the market","Not always."],["It removes the need for a supply chain","It still needs one."],["It is required by law","No."]],"exp":"Mass production spreads costs and can create a barrier to entry."}]},{"term":"Supply chain","def":"The network of businesses, people, activities and resources involved in producing and delivering a product from its origin to the final buyer.","hook":"Origin to buyer.","asks":[{"q":"Strawberries are harvested, stored cold, shipped to a distributor, then to grocery chains. What is the farm's role?","right":"It creates the product before intermediaries move it","wrong":[["Its main job is transporting the strawberries to the grocery stores","Distributors transport."],["It is the intermediary","It's the producer."],["It buys from other farms","Not stated."]],"exp":"The farm is the origin; distributors and retailers follow."},{"q":"Floods delay trucks carrying strawberries from warehouses. Who most likely runs out first?","right":"Grocery stores","wrong":[["The farm, because it will have to stop picking strawberries right away","The farm keeps harvesting."],["The distributor","Not the shelves."],["Consumers","They feel it via stores."]],"exp":"A break mid-chain empties retail shelves first."}]},{"term":"Raw materials","def":"Basic natural resources used to make products, such as timber, oil, metals and crops.","hook":"Where it all starts.","asks":[{"q":"Which is a raw material?","right":"Timber","wrong":[["A finished dining table that is ready to be shipped to a furniture store","A finished good."],["A retailer","A business."],["A warehouse","A facility."]],"exp":"Raw materials are basic natural resources."},{"q":"A drought cuts the cotton harvest. Which part of a T-shirt maker's supply chain is hit first?","right":"Raw materials","wrong":[["The retailer, which sells T-shirts to customers in stores and online","Later in the chain."],["The wholesaler","Later."],["The customer","Last."]],"exp":"Cotton is a raw material at the start of the chain."}]},{"term":"Suppliers","def":"Businesses that provide raw materials or component parts to manufacturers.","hook":"Provide the inputs.","asks":[{"q":"Ford buys steel, engines and tires from firms in several countries. Those firms are:","right":"Suppliers","wrong":[["Retailers, because they sell their products to another company for money","Retailers sell to consumers."],["Distributors","They move finished goods."],["Wholesalers","They resell in bulk."]],"exp":"Suppliers provide raw materials or components."},{"q":"What do businesses weigh when choosing suppliers?","right":"Cost, quality, efficiency, convenience, reliability","wrong":[["Only the lowest price, because nothing else affects the final product","More factors matter."],["Only location","More factors."],["Only brand","More factors."]],"exp":"Your slides list cost, quality, efficiency, convenience and reliability."}]},{"term":"Manufacturers","def":"Businesses that transform raw materials and components into finished goods.","hook":"Turn inputs into products.","asks":[{"q":"Which stage turns parts into a finished car?","right":"Manufacturers","wrong":[["Distributors, which carry the parts between different countries around the world","They move goods."],["Retailers","They sell."],["Suppliers","They provide parts."]],"exp":"Manufacturers transform inputs into finished goods."},{"q":"Quality control mostly takes place at which stage?","right":"Manufacturing","wrong":[["Retail, where store employees check products before customers buy them","Mostly during production."],["Raw materials","Before production."],["Logistics","Moving goods."]],"exp":"Manufacturing involves machinery, labor, assembly and quality control."}]},{"term":"Distributors","def":"Businesses that move finished goods from factories to warehouses, wholesalers or retailers.","hook":"Move the goods.","asks":[{"q":"A company carries finished goods from factories to regional hubs. It is a:","right":"Distributor","wrong":[["Manufacturer, since it handles products that came from the company's factories","It moves, doesn't make."],["Retailer","Doesn't sell to consumers."],["Supplier","Doesn't provide inputs."]],"exp":"Distributors transport finished goods."},{"q":"A national distributor combines shipments from many farms and delivers to grocery chains. Why use one?","right":"It moves goods from many producers efficiently","wrong":[["It grows the strawberries more cheaply than any individual farm could","It doesn't grow anything."],["It sets the retail price","Not its role."],["It owns the farms","Not stated."]],"exp":"Distributors consolidate and transport goods."}]},{"term":"Wholesaler","def":"A business that buys goods in bulk and resells them to retailers.","hook":"Buys big, sells to stores.","asks":[{"q":"A business buys snacks in bulk from manufacturers and resells them to corner stores. It is a:","right":"Wholesaler","wrong":[["Retailer, because it sells the snacks to other businesses for a profit","Retailers sell to consumers."],["Manufacturer","It doesn't make them."],["Supplier of raw materials","Snacks are finished."]],"exp":"Wholesalers buy in bulk and resell to retailers."},{"q":"Why might a small store buy from a wholesaler instead of the manufacturer?","right":"It can buy smaller amounts from one source","wrong":[["Wholesalers always sell products at a lower price than manufacturers charge","Not always."],["It's required by law","No."],["Manufacturers don't sell","They do."]],"exp":"Wholesalers break bulk for retailers."}]},{"term":"Retailers","def":"The final link in the chain: businesses that sell finished products to consumers in stores or online.","hook":"Sells to you.","asks":[{"q":"Which is the final link in the supply chain?","right":"Retailers","wrong":[["Wholesalers, since they sell products to the stores that customers visit","Retailers come after them."],["Distributors","Earlier."],["Suppliers","First."]],"exp":"Retailers sell to consumers."},{"q":"Besides selling, retailers focus on:","right":"Merchandising, inventory and customer service","wrong":[["Mining raw materials and turning them into the parts that factories need","That's earlier in the chain."],["Setting tariffs","Government."],["Manufacturing","Earlier."]],"exp":"Your slides list merchandising, inventory and customer service."}]},{"term":"Logistics","def":"Planning, moving and managing goods, services and information from producers to customers.","hook":"Moving things smoothly.","asks":[{"q":"A company plans how goods and information move from its factory to customers. What is this?","right":"Logistics","wrong":[["Merchandising, since it decides how the products will look on the store shelves","That's display."],["R&D","Product design."],["Collusion","Unrelated."]],"exp":"Logistics plans and manages movement of goods and information."},{"q":"How can efficient logistics create a low-price advantage?","right":"It cuts the cost of moving goods","wrong":[["It allows the company to raise prices because the products arrive faster","The point is lower costs."],["It removes competitors","Not directly."],["It replaces suppliers","No."]],"exp":"Low-price supply chains use cheaper resources, mass production and efficient logistics."}]}],"intro":["Artisan production uses skilled labor for unique, customized goods at a higher cost per unit. Mass production uses technology and assembly lines for large quantities at a lower cost per unit. A supply chain links everyone from raw materials to the final buyer; your study guide summarizes it as sourcing, manufacturing, warehousing, logistics and consumption."]},{"name":"Retail and inventory","cards":[{"term":"Merchandising","def":"How products are displayed, arranged, priced and promoted to attract customers.","hook":"How it's shown on the shelf.","asks":[{"q":"A store moves a new snack to eye level with a bright sign and a sale price. What is this?","right":"Merchandising","wrong":[["Logistics, because the store is moving products to a different shelf location","This is display and promotion."],["Inventory","Not stock levels."],["Customer service","Not helping customers."]],"exp":"Merchandising is how products are displayed, arranged, priced and promoted."},{"q":"Why do big brands pay for eye-level shelf space?","right":"Display strongly affects sales","wrong":[["Eye-level products are legally protected from all competition in the store","Not true."],["It lowers production costs","Unrelated."],["It's a tariff","No."]],"exp":"Merchandising affects what customers notice and buy."}]},{"term":"Inventory","def":"The stock of goods a business keeps on hand to sell.","hook":"What's in stock.","asks":[{"q":"A store keeps 200 bikes on hand to sell. What is this stock called?","right":"Inventory","wrong":[["Merchandising, since the bikes are arranged on display for customers to see","Stock on hand is inventory."],["A surplus","Not necessarily."],["Logistics","Moving goods."]],"exp":"Inventory is the stock a business keeps to sell."},{"q":"Why must retailers manage inventory carefully?","right":"To avoid shortages and excess stock","wrong":[["Because carrying more inventory always increases a store's profits","Excess stock costs money."],["Because inventory is taxed daily","Not stated."],["To avoid customers","No."]],"exp":"Too little causes stockouts; too much ties up money."}]},{"term":"Stockout","def":"Running out of inventory so customer orders cannot be filled, causing lost sales.","hook":"Sold out.","asks":[{"q":"Demand for candles keeps exceeding what the company can make. Which problem is most likely?","right":"Inventory stockouts","wrong":[["Increased product differentiation that sets the candles apart from competitors","Not a problem."],["Lower demand","Demand is high."],["Lower quality from competition","Not supported."]],"exp":"When demand exceeds supply, inventory runs out."},{"q":"What is the usual result of a stockout?","right":"Lost sales and unhappy customers","wrong":[["Higher profits, since the store doesn't have to pay to store any products","Lost sales hurt profit."],["A surplus","The opposite."],["Lower demand forever","Not necessarily."]],"exp":"Stockouts mean orders can't be filled."}]}],"intro":["Retailers handle merchandising (how products are shown and priced), inventory and customer service. When inventory runs too low to fill orders, the result is a stockout and lost sales."]},{"name":"Strategy, risk and scale","cards":[{"term":"Low-price leadership","def":"A supply chain strategy built on mass production, economies of scale and efficient processes to charge the least.","hook":"Cheapest to make, cheapest to sell.","asks":[{"q":"A company uses mass production, economies of scale and process optimization. Which strategy?","right":"Low-price leadership","wrong":[["High-quality differentiation, since its efficient processes produce better products","That uses premium materials."],["Artisan production","The opposite."],["Penetration pricing","A pricing tactic, not a supply chain strategy."]],"exp":"Mass production and efficiency support low prices."},{"q":"Which company best fits low-price leadership?","right":"A discount store with huge volume and lean operations","wrong":[["A watchmaker using rare metals and hand-assembly for each piece it sells","Differentiation."],["A custom jeweler","Artisan."],["A boutique bakery","Small scale."]],"exp":"Scale and efficiency drive low prices."}]},{"term":"High-quality differentiation","def":"A supply chain strategy built on premium resources, precision and durability.","hook":"Best materials, best product.","asks":[{"q":"A laptop maker sources premium liquid-cooling parts to have the fastest machines. Which strategy?","right":"High-quality differentiation","wrong":[["Low-price leadership, since faster machines help the company sell more laptops","It's about premium quality."],["Limit pricing","Unrelated."],["Outsourcing","It's still about quality."]],"exp":"Premium resources and precision support differentiation."},{"q":"Which supply chain choice fits high-quality differentiation?","right":"Paying more for durable premium materials","wrong":[["Switching to the cheapest available materials to cut the price of each product","That's low-price leadership."],["Removing inspections",
