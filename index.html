in aisle 5 might be damaged or past their dates","The question is about buying decisions."],["Supply chain management","Not about why people buy."],["Accounting","Records money, not decisions."]],"exp":"Why and how people decide to buy is consumer behavior."},{"q":"Which question is MOST clearly a consumer-behavior question?","right":"Why do customers choose our brand over a rival's?","wrong":[["How many units can our factory make each day if we add one more shift of workers?","That's operations."],["What is our tax rate?","Accounting."],["Who sits on our board?","Organization."]],"exp":"Consumer behavior asks why and how people buy."}]},{"term":"Planned vs. impulse buying","def":"Purchases can be carefully thought out ahead of time or made on the spot.","hook":"List vs. checkout-lane candy.","asks":[{"q":"Maya grabs a candy bar while waiting in the checkout line. This is MOST likely:","right":"An impulse purchase","wrong":[["A planned purchase, because she has bought candy bars at this store many times before","Grabbed on the spot, not planned."],["A consequential purchase","Small, quick."],["A B2B purchase","She's an individual."]],"exp":"Decisions made on the spot are impulsive."},{"q":"A family spends three months comparing minivans before buying one. This is MOST likely:","right":"A planned purchase","wrong":[["An impulse purchase, because the family bought the minivan right after the final test drive","Months of comparing is planning."],["A habit purchase","Not routine."],["A routine purchase","Big and rare."]],"exp":"Carefully thought-out decisions are planned purchases."}]},{"term":"Habit buying","def":"Once a purchase is routine, customers stop considering alternatives.","hook":"Same brand, no thinking.","asks":[{"q":"Jordan has bought the same toothpaste for 10 years without checking other brands. What does this show?","right":"Habit buying","wrong":[["Scarcity, because Jordan worries the toothpaste might sell out before the next shopping trip","Nothing suggests limited supply."],["Elastic demand","He doesn't react or compare."],["Impulse buying","It's routine, not sudden."]],"exp":"Once buying is a habit, customers stop considering alternatives."},{"q":"Why is it so hard for a new cereal brand to win customers away from established brands?","right":"Habitual buyers stop comparing","wrong":[["Because cereal is a necessity, so shoppers never consider switching to a brand they don't know","Habit, not necessity, is the main barrier here."],["Because new brands can't advertise","They can."],["Because cereal has no substitutes","It has many."]],"exp":"Habits mean customers stop looking at alternatives."}]},{"term":"Purchasing patterns","def":"Customers' typical habits: what, when, where, how often and how much they buy.","hook":"Every Friday, the same order.","asks":[{"q":"A grocery app notices a family orders milk, eggs and bread every Sunday night. This is:","right":"A purchasing pattern","wrong":[["An impulse purchase, because the family places the order late at night on the weekend","It's regular and predictable."],["A focus group","No discussion."],["A psychological factor","It's a habit in behavior."]],"exp":"Typical habits of what, when and how often are purchasing patterns."},{"q":"How could the grocery app BEST use that Sunday pattern?","right":"Send a reminder Sunday afternoon","wrong":[["Raise the price of milk, eggs and bread for every customer on every single day of the week","That ignores the pattern and risks losing them."],["Stop selling bread","No."],["Run a TV ad on Tuesday","Wrong timing."]],"exp":"Knowing when people buy lets a business reach them at the right moment."}]},{"term":"Technology and buying","def":"Phones and the internet make it easy to compare prices, read reviews and buy instantly.","hook":"Compare in seconds.","asks":[{"q":"Before buying a TV in a store, a shopper checks prices and reviews on her phone. What does this show?","right":"Technology makes comparing easy","wrong":[["Situational factors no longer matter, because shoppers can now buy anything from home instead","Situations still matter."],["The store has pricing power","Easy comparing reduces it."],["She is buying on impulse","She's comparing."]],"exp":"Phones make it easy to compare prices, read reviews and buy instantly."},{"q":"How does easy online price comparison MOST likely affect a store selling identical products?","right":"Buyers react more to its prices","wrong":[["Buyers react less to its prices, because they trust the store more once they see online reviews","Easy comparing makes buyers more sensitive."],["It has no effect","It does."],["It can charge more","Less pricing power."]],"exp":"When comparing is easy, buyers switch more readily."}]},{"term":"Consumer protection laws","def":"Rules that protect buyers from fraud, false advertising, unsafe products and deceptive practices.","hook":"Protects the buyer.","asks":[{"q":"A company advertises \"cures colds in one hour\" with no evidence. Which rules is it MOST likely breaking?","right":"Consumer protection laws","wrong":[["Channel restrictions, because cold medicine can only be sold through licensed pharmacies","The problem is the false claim."],["Trademark law","Not about a brand name."],["Tax law","No."]],"exp":"Consumer protection laws guard against false advertising."},{"q":"Who do consumer protection laws MAINLY protect?","right":"Buyers","wrong":[["Businesses that are competing against much larger rivals with more money to spend","Those are competition laws."],["Advertisers","No."],["Suppliers","No."]],"exp":"They protect buyers from fraud, false ads, unsafe products and deception."}]},{"term":"Why study consumer behavior","def":"Understanding buyers helps a business make better products, improve service and earn more profit.","hook":"Know them, sell more.","asks":[{"q":"A shoe brand studies why runners quit using its app. What is the MOST likely payoff?","right":"Better products and service","wrong":[["It no longer needs to do any other kind of market research about its customers again","Research continues."],["Lower taxes","No."],["Fewer competitors","No."]],"exp":"Understanding buyers improves products, service and profit."},{"q":"Which result BEST shows a business using consumer behavior insights?","right":"Moving popular items near the entrance","wrong":[["Paying its suppliers on time every month so that it keeps getting good prices","Not about buyers."],["Hiring an accountant","No."],["Filing taxes early","No."]],"exp":"Using how people shop to shape the store is applied consumer behavior."}]}],"intro":["Consumer behavior studies why and how people make buying decisions. Some purchases are planned; some are impulsive. Once buying becomes a habit, people stop comparing. Technology changed this by making it easy to compare prices, read reviews and buy instantly, and laws protect buyers from being cheated."]},{"name":"Factors that influence buying","cards":[{"term":"Personal factors","def":"Traits of the buyer such as age, income, education, occupation and lifestyle.","hook":"Who the buyer is.","asks":[{"q":"A retiree on a fixed income chooses store-brand products. Which factor MOST influences her?","right":"Personal (her income)","wrong":[["Social, because her friends at the senior center tell her which store brands to buy","Nothing says friends advised her."],["Situational","Not temporary."],["Authority","No expert."]],"exp":"Age and income are personal factors."},{"q":"Which is a personal factor?","right":"Occupation","wrong":[["A celebrity's post that recommends a new energy drink to millions of followers","Social."],["A store's layout","Situational."],["A bad past experience","Psychological."]],"exp":"Personal factors are traits like age, income, education and occupation."}]},{"term":"Psychological factors","def":"What goes on in the buyer's mind: beliefs, values, motivations, perceptions and past experiences.","hook":"Inside the head.","asks":[{"q":"After a bad experience with a laptop brand, Sam refuses to buy it again. Which factor is this?","right":"Psychological","wrong":[["Personal, because Sam is a college student who doesn't have much money for laptops","Nothing about income is given."],["Situational","It's lasting, not temporary."],["Social","No one else involved."]],"exp":"Past experiences and perceptions are psychological."},{"q":"A buyer believes organic food is healthier and pays more for it. Which factor drives this?","right":"Psychological (her beliefs)","wrong":[["Demographic, because people with more education are more likely to buy organic food","The scenario points to her belief."],["Situational","Not temporary."],["Scarcity","No limited supply."]],"exp":"Beliefs and motivations are psychological factors."}]},{"term":"Social and cultural factors","def":"Influence from family, friends, celebrities, the traditions people grow up in, and online platforms.","hook":"Other people.","asks":[{"q":"A teen buys sneakers because everyone on his team wears them. Which factor is this?","right":"Social","wrong":[["Psychological, because the teen personally believes the sneakers are good for basketball","The cause given is his teammates."],["Personal","Not his traits."],["Situational","Not temporary."]],"exp":"Influence from friends and peers is social."},{"q":"A family buys certain foods every year for a holiday its culture celebrates. Which factor is this?","right":"Cultural","wrong":[["Situational, because the holiday is only once a year and the food is only bought around then","The tradition comes from culture."],["Personal","Not age or income."],["Scarcity","Nothing limited."]],"exp":"Culture and family traditions are social and cultural factors."}]},{"term":"Situational factors","def":"Temporary conditions at the moment of buying, such as time, location, mood, store layout and what's available.","hook":"Right here, right now.","asks":[{"q":"A shopper buys an umbrella at a gas station because it suddenly started pouring. Which factor is this?","right":"Situational","wrong":[["Psychological, because the shopper believes that umbrellas are useful to have in the car","The trigger is the sudden rain."],["Personal","Not a trait."],["Social","No one influenced her."]],"exp":"Temporary conditions like weather and location are situational."},{"q":"Which is a situational factor?","right":"The product being out of stock","wrong":[["The buyer's long-held belief that name brands are always better than store brands","Psychological."],["The buyer's income","Personal."],["Advice from parents","Social."]],"exp":"Availability at the moment is situational."}]}],"intro":["Four kinds of factors push a buying decision. Personal factors describe the buyer (age, income, job). Psychological factors are inside the buyer's mind (beliefs, motivations, past experiences). Social and cultural factors come from other people. Situational factors are temporary: the time, the place, the mood, what's in stock."]},{"name":"Cialdini's principles of influence","cards":[{"term":"Scarcity","def":"Limited availability makes something seem more valuable and pushes people to buy now.","hook":"\"Only 3 left in stock!\"","asks":[{"q":"A website shows \"Only 3 left in stock!\" Which principle is it using?","right":"Scarcity","wrong":[["Consensus, because the message suggests that many other shoppers have bought the product","It stresses limited supply, not others' choices."],["Authority","No expert."],["Reciprocity","No favor."]],"exp":"Limited availability raises perceived value and urgency."},{"q":"Nintendo makes limited consoles at launch. Which principle does this MOST likely use?","right":"Scarcity","wrong":[["Reciprocity, because buyers feel they owe Nintendo after waiting so long for the console","Limited supply is the tool."],["Unity","Not group identity."],["Authority","No expert."]],"exp":"Limited quantities build excitement: scarcity."}]},{"term":"Authority","def":"People trust and follow experts.","hook":"\"Dentists recommend…\"","asks":[{"q":"A toothpaste ad says \"recommended by 9 out of 10 dentists.\" Which principle is this?","right":"Authority","wrong":[["Consensus, because nine out of ten is a large share of people who agree with each other","The power comes from their expertise."],["Liking","Not about likable people."],["Scarcity","Nothing limited."]],"exp":"Trust in experts is authority."},{"q":"Which ad uses authority MOST clearly?","right":"A pilot recommends a travel pillow","wrong":[["A pop star who has millions of fans holds up the travel pillow in a social media post","Liking: a person fans admire."],["\"Our best seller!\"","Consensus."],["\"Sale ends tonight\"","Scarcity."]],"exp":"A relevant expert's endorsement is authority."}]},{"term":"Consensus","def":"People follow what others are doing or saying.","hook":"\"Best seller.\"","asks":[{"q":"A restaurant app labels a dish \"Most ordered this week.\" Which principle is this?","right":"Consensus","wrong":[["Scarcity, because the dish might run out if too many people order it in the same week","It points to what others chose."],["Authority","No expert."],["Consistency","Not past commitments."]],"exp":"People follow what others are doing."},{"q":"Which message uses consensus?","right":"\"Over 2 million happy customers\"","wrong":[["\"Developed together with a team of leading doctors at a well-known university\"","Authority."],["\"Only today\"","Scarcity."],["\"Free gift inside\"","Reciprocity."]],"exp":"Pointing to how many others bought it is consensus."}]},{"term":"Liking","def":"People are swayed by those they like, admire or relate to.","hook":"A favorite celebrity.","asks":[{"q":"A brand hires a popular, relatable YouTuber to show off its headphones. Which principle is this?","right":"Liking","wrong":[["Authority, because the YouTuber has a lot of followers and is famous on the platform","Fame isn't expertise."],["Scarcity","Nothing limited."],["Unity","Not shared identity."]],"exp":"People are swayed by those they like or relate to."},{"q":"Why do salespeople often find something in common with a customer before pitching?","right":"To be liked","wrong":[["To act as an authority, since sharing a hobby proves that the salesperson is an expert","Shared hobbies don't show expertise."],["To create scarcity","No."],["To get referrals","Not the immediate goal."]],"exp":"Finding common ground builds liking."}]},{"term":"Reciprocity","def":"People feel they should return a favor after receiving something of value.","hook":"Free sample, then a sale.","asks":[{"q":"A store gives free samples, and many tasters then buy the product. Which principle is this?","right":"Reciprocity","wrong":[["Consensus, because customers see other customers tasting the samples and then buying them","The driver is the free gift."],["Scarcity","Nothing limited."],["Authority","No expert."]],"exp":"Receiving value makes people want to return the favor."},{"q":"A software company gives away a free, useful guide. Which principle does it MOST likely hope to trigger?","right":"Reciprocity","wrong":[["Scarcity, because the guide will only be available for a short period of time online","Nothing says it's limited."],["Liking","Not about a person."],["Habit buying","Not a principle."]],"exp":"Giving value first makes people more likely to give back."}]},{"term":"Consistency","def":"People act in line with their past commitments, actions, beliefs and identity.","hook":"\"You signed up before…\"","asks":[{"q":"A charity asks people to sign a small pledge, then later asks them to donate. Which principle is this?","right":"Consistency","wrong":[["Reciprocity, because the charity gave the people a small pledge card to sign at the event","A pledge is a commitment, not a gift."],["Consensus","Not others' actions."],["Authority","No expert."]],"exp":"People act in line with their past commitments."},{"q":"A gym says, \"You set a fitness goal in January; renew today to keep it.\" Which principle is it using?","right":"Consistency","wrong":[["Scarcity, because the gym membership renewal is only available for a limited time today","It leans on the past goal."],["Unity","Not group identity."],["Liking","No person."]],"exp":"Reminding people of past commitments is consistency."}]},{"term":"Unity","def":"People are swayed by those who share their identity or group.","hook":"\"For runners, by runners.\"","asks":[{"q":"An ad says, \"Made by veterans, for veterans.\" Which principle is it using?","right":"Unity","wrong":[["Liking, because most people feel positively toward veterans and admire their service","The appeal is shared identity."],["Authority","Not expertise."],["Consensus","Not numbers."]],"exp":"Shared identity or belonging is unity."},{"q":"Which is the BEST difference between unity and liking?","right":"Unity needs a shared identity","wrong":[["Liking only works on teenagers, while unity works on people of any age or background","Not true."],["Unity uses experts","That's authority."],["They are the same","Different principles."]],"exp":"Liking: someone you like. Unity: someone who is 'one of us.'"}]}],"intro":["Psychologist Robert Cialdini named seven principles that make people say yes. Marketers use them on purpose: \"Only 3 left!\" (scarcity), a dentist recommending toothpaste (authority), \"best seller\" badges (consensus), a free sample (reciprocity). Learn to spot which one an ad is using."]}],"intro":["Topic 2.2 asks why people buy what they buy. Buying can be planned or impulsive, and it is shaped by personal, psychological, social and situational factors. Robert Cialdini's seven principles of influence explain the persuasion tricks marketers use. (Your 2.2 slides couldn't be read; this deck comes from your filled-in 2.2 notes.)"]},{"id":3,"name":"Market Research (2.3)","optional":false,"sections":[{"name":"Research basics","cards":[{"term":"Market research","def":"Collecting and analyzing information about customers, competitors and industries to guide decisions and reduce uncertainty.","hook":"Data, not gut feeling.","asks":[{"q":"A founder wants to open a smoothie bar because she \"has a good feeling about it.\" What does market research add?","right":"Evidence that reduces uncertainty","wrong":[["A guarantee that the smoothie bar will earn a profit during its very first year of business","Research reduces risk; it can't guarantee."],["A lower rent","Not research."],["A trademark","Not research."]],"exp":"Market research replaces gut feeling with data."},{"q":"Starbucks used surveys, focus groups and app data, then added seasonal drinks and mobile ordering. What does this show?","right":"Research guiding product decisions","wrong":[["Research is only useful before a business opens, never once it is already successful","Starbucks used it while established."],["Surveys replace sales data","It used both."],["A pricing law","No."]],"exp":"Research tracks changing needs and guides decisions for existing products too."}]},{"term":"Quantitative data","def":"Numbers: how many, how much, how often; shows WHAT is happening.","hook":"Quantity = numbers.","asks":[{"q":"A survey finds 62% of customers visit twice a week. What type of data is this?","right":"Quantitative","wrong":[["Qualitative, because it describes what the customers think about visiting the store","A percentage is a number."],["Psychographic","It's a count of behavior."],["Secondary","The business collected it."]],"exp":"Numbers on how many, how much and how often are quantitative."},{"q":"A manager wants to know how many people tried the new menu item. Which data does she need?","right":"Quantitative","wrong":[["Qualitative, because she should ask people to describe their feelings about the menu item","\"How many\" needs numbers."],["A customer profile","Not a count."],["A tagline","No."]],"exp":"\"How many\" calls for quantitative data."}]},{"term":"Qualitative data","def":"Words or images that explain WHY and HOW.","hook":"Quality = reasons.","asks":[{"q":"Customers say the new chair \"feels cheap\" and \"wobbles when I lean back.\" What type of data is this?","right":"Qualitative","wrong":[["Quantitative, because several different customers said the same kind of thing about the chair","Words describing why are qualitative."],["Demographic","Not traits."],["Secondary","Collected directly."]],"exp":"Words that explain why are qualitative."},{"q":"Sales of a snack dropped 20%. What would qualitative research add?","right":"Why customers stopped buying it","wrong":[["The exact number of snacks that were sold in each of the company's stores every week","That's quantitative."],["The market share","Quantitative."],["The price","Already known."]],"exp":"Quantitative shows what happened; qualitative explains why."}]},{"term":"Business hypothesis","def":"An assumption about a customer, product or market that is tested with data before acting on it.","hook":"Test it before you bet on it.","asks":[{"q":"\"At least 30% of parents will pay $120 for a wagon\" is BEST described as:","right":"A business hypothesis","wrong":[["A vision statement, because it describes where the company hopes to be in the long term","It's a testable assumption."],["A sales promotion","No."],["Secondary research","It's a claim to test."]],"exp":"An assumption about customers to test with data is a business hypothesis."},{"q":"Research shows only 12% would pay. What should the business do with its hypothesis?","right":"Revise it and test again","wrong":[["Ignore the results and launch anyway, because the founders are confident about the idea","Defeats the purpose of testing."],["Double the price","Data don't support that."],["Stop all research","No."]],"exp":"Research decides whether evidence supports a hypothesis."}]}],"intro":["Market research gathers information about customers, competitors and markets. Quantitative data (numbers) tells you what is happening; qualitative data (words, images) explains why. A business hypothesis is an assumption you test with data before you act on it."]},{"name":"Desirable, feasible, viable","cards":[{"term":"Desirable product","def":"One customers want because it creates value for them (problem-solution fit).","hook":"A teleporter: wanted, but impossible.","asks":[{"q":"A teleporter that moves you anywhere instantly would pass which test?","right":"Desirable","wrong":[["Feasible, because a large company with enough money and engineers could definitely build one","No one can make it."],["Viable","Can't make it, so can't profit."],["All three","Fails feasibility."]],"exp":"People would want it, but it can't be made."},{"q":"Before investing, a business runs interviews and finds customers don't care about its idea. Which test did it fail?","right":"Desirability","wrong":[["Feasibility, because the business has not yet built a working version of its product","The finding is about wanting it."],["Viability","Not about profit yet."],["Legality","Not one of the three."]],"exp":"If customers don't want it, it isn't desirable."}]},{"term":"Feasible product","def":"One the business can make with its resources, technology, expertise and time.","hook":"Can we build it?","asks":[{"q":"A startup wants to make a phone but lacks the factories, technology and expertise. Which test does it fail?","right":"Feasibility","wrong":[["Desirability, because people already own phones and won't want to buy another one","Lack of resources is the problem."],["Viability","Can't tell yet."],["None","It fails one."]],"exp":"Capacity, technology and time are feasibility."},{"q":"Which question is a feasibility question?","right":"Do we have the equipment to make it?","wrong":[["Will enough customers pay a high enough price for us to earn a profit after covering costs?","That's viability."],["Do customers want it?","Desirability."],["What will our slogan be?","Not one of the three."]],"exp":"Feasibility asks whether you can make it."}]},{"term":"Viable product","def":"One that can earn a profit.","hook":"A $5,000 gold pencil: buildable, but who buys?","asks":[{"q":"A $5,000 gold pencil can be made easily, but almost no one would buy it. Which test does it fail?","right":"Viability","wrong":[["Feasibility, because gold is an expensive material that is very difficult to work with","It can be made easily."],["Desirability only","The key failure is profit."],["None","It fails viability."]],"exp":"Buildable but unprofitable means not viable."},{"q":"A product customers love costs $40 to make, but buyers will pay only $25. What's the problem?","right":"It isn't viable","wrong":[["It isn't desirable, because customers would have to spend twenty-five dollars to buy it","They love it."],["It isn't feasible","It can be made."],["Nothing","It loses money."]],"exp":"A product must earn a profit to be viable."}]}],"intro":["Before a business commits money to a new product, it asks three questions. Do customers want it? Can we make it? Can we make money on it? A product has to pass all three."]},{"name":"Primary and secondary research","cards":[{"term":"Primary research","def":"New data a business collects itself, through surveys, interviews, focus groups, experiments, observations or A/B tests.","hook":"You collect it.","asks":[{"q":"BrewScape shows two ads to Gen Z viewers and counts clicks. Which kind of research is this?","right":"Primary","wrong":[["Secondary, because the ads are shown online on websites that are run by other companies","BrewScape collected the click data itself."],["A focus group","No discussion."],["Third-party data","Not bought."]],"exp":"Collecting new data directly is primary research."},{"q":"Why might a business pay for primary research when secondary data exists?","right":"It answers its exact question","wrong":[["Primary research is always cheaper and faster than looking at any data already collected","Usually the reverse."],["Secondary data is illegal","No."],["It needs no customers","It does."]],"exp":"Primary research fits your specific question and tests your hypothesis."}]},{"term":"Secondary research","def":"Data someone else already gathered, such as government reports, census data, industry studies and commercial databases; cheaper and faster, but may not fit exactly.","hook":"Someone else collected it.","asks":[{"q":"BrewScape uses a commercial database to estimate the size of the canned cold-brew market. This is:","right":"Secondary research","wrong":[["Primary research, because BrewScape is using the market size number to plan its own business","Someone else collected it."],["A focus group","No."],["A/B testing","No experiment."]],"exp":"Existing data from databases is secondary research."},{"q":"What is the MAIN drawback of using a government census report?","right":"It may not fit your exact question","wrong":[["It is always far more expensive than running your own survey of a thousand customers","Secondary is usually cheaper."],["It's always false","Too extreme."],["It can't show trends","It can."]],"exp":"Secondary data is cheaper and faster but may not fit exactly."}]},{"term":"Survey","def":"The same questions asked of a large group, producing numbers you can count.","hook":"Many people, same questions.","asks":[{"q":"A company wants opinions from 5,000 customers it can compare as numbers. Which method fits BEST?","right":"A survey","wrong":[["A focus group, because a focus group lets customers explain their opinions in great depth","Too few people for 5,000."],["An observation","Doesn't capture opinions."],["An interview","Too slow at that scale."]],"exp":"Surveys ask a large group the same questions for quantitative data."},{"q":"What is a survey's weakness compared with a focus group?","right":"Less depth on why","wrong":[["It can only reach a handful of people, so the results can never be compared as numbers","Surveys reach many."],["It costs more per person","Usually less."],["It can't be online","It can."]],"exp":"Surveys give breadth; focus groups give depth."}]},{"term":"Focus group","def":"A guided discussion with a handful of engaged or potential customers, producing in-depth reasons.","hook":"Small group, deep \"why.\"","asks":[{"q":"A company wants to know WHY a small group of loyal customers loves its product. Which method fits BEST?","right":"A focus group","wrong":[["A survey sent to a random sample of ten thousand people across the whole country","Breadth, not depth from loyal users."],["A pie chart","Not a method."],["Secondary research","Not their reasons."]],"exp":"\"Why\" from a small engaged group calls for a focus group."},{"q":"A focus group of 8 teens loved a new drink. What's the BEST caution?","right":"Eight people may not represent the market","wrong":[["Focus groups are always wrong, so the company should ignore the results completely","Too extreme."],["Teens can't be in focus groups","No."],["The data are quantitative","It's qualitative."]],"exp":"Focus groups give depth, not a representative count."}]},{"term":"Interview","def":"In-depth questions asked of individual customers to learn their reasons.","hook":"One at a time, in depth.","asks":[{"q":"A furniture maker sits down with five designers to learn how they choose suppliers. Which method is this?","right":"Interviews","wrong":[["Observation, because the furniture maker is watching how the designers act during the meeting","It's asking, not watching."],["A survey","Not a large group."],["Secondary research","Collected directly."]],"exp":"In-depth questions to individuals are interviews."},{"q":"Interviews and focus groups both produce:","right":"Qualitative data","wrong":[["Quantitative data, because each person's answers can be added together into a total","They give in-depth reasons."],["Secondary data","Collected directly."],["Big data","Small samples."]],"exp":"Both give in-depth, qualitative answers from a few people."}]},{"term":"Experiment","def":"A controlled test that measures what people actually do, not what they say.","hook":"Change one thing, measure.","asks":[{"q":"A store moves a snack to eye level in half its stores for a month and compares sales. Which method is this?","right":"An experiment","wrong":[["A survey, because the store will later ask customers if they noticed the snack's new spot","It changed one thing and measured."],["Observation","It controlled the change."],["Secondary research","New data."]],"exp":"A controlled test measuring what people do is an experiment."},{"q":"Why do experiments often beat surveys for predicting sales?","right":"They measure what people do","wrong":[["They always include more people than any survey that a business could possibly run","Size isn't the reason."],["They're cheaper","Not necessarily."],["They explain feelings","That's qualitative."]],"exp":"People don't always do what they say."}]},{"term":"Observation","def":"Watching what people do in a natural setting.","hook":"Watch, don't ask.","asks":[{"q":"A researcher watches which aisles shoppers walk down first, without talking to them. This is:","right":"Observation","wrong":[["An interview, because the researcher will learn about the shoppers by spending time near them","No questions asked."],["An experiment","Nothing changed."],["A survey","No questions."]],"exp":"Watching natural behavior is observation."},{"q":"What's the main difference between observation and an experiment?","right":"Observation changes nothing","wrong":[["Observation always uses a large sample, while experiments use only one or two people","Not the difference."],["Experiments are secondary","Both are primary."],["Observation is qualitative only","Can be either."]],"exp":"Experiments control a change; observations watch natural behavior."}]},{"term":"A/B testing","def":"Showing real customers two versions of something and keeping the one that performs better.","hook":"\"Add to Cart\" vs. \"Buy Now.\"","asks":[{"q":"A website shows half its visitors \"Buy Now\" and half \"Add to Cart,\" then keeps the button with more sales. This is:","right":"A/B testing","wrong":[["A focus group, because the company is learning which button its customers say they like more","It measures real behavior."],["A survey","No questions."],["Dynamic pricing","Not price."]],"exp":"Comparing two versions with real users is an A/B test."},{"q":"Netflix shows different thumbnails for the same show to different users. What is it MOST likely measuring?","right":"Which thumbnail gets more clicks","wrong":[["Which users have the highest lifetime value so it can raise their subscription prices","Not about the thumbnails."],["Users' demographics","Not the test."],["Its market share","No."]],"exp":"A/B tests measure authentic responses to two alternatives."}]}],"intro":["Primary research collects new data directly from people, so it fits your exact question and can test your hypothesis. Secondary research uses data someone else already collected, so it is cheaper and faster but may not fit exactly. Each method answers a different kind of question."]},{"name":"Bias and data visualization","cards":[{"term":"Leading question","def":"Wording that pushes people toward an answer, such as \"How much do you love…\" instead of \"Rate your satisfaction.\"","hook":"Neutral wording only.","asks":[{"q":"Which survey question is MOST biased?","right":"\"How much do you love our new flavor?\"","wrong":[["\"On a scale of one to five, how would you rate your overall satisfaction with the new flavor?\"","Neutral."],["\"Which flavor did you choose?\"","Neutral."],["\"How often do you buy it?\"","Neutral."]],"exp":"Assuming love pushes people toward an answer."},{"q":"Why is a leading question a problem?","right":"The data won't reflect real opinions","wrong":[["It makes the survey take much longer, so fewer people will finish answering all of it","Not the main issue."],["It's illegal","No."],["It always gives numbers","Not the problem."]],"exp":"Bad data is worse than no data."}]},{"term":"Unrepresentative sample","def":"Surveying people who don't match the customers you're studying, such as asking only friends.","hook":"Asking the wrong people.","asks":[{"q":"BrewScape surveys its middle-aged employees about what Gen Z wants. What's the problem?","right":"The sample doesn't match the target","wrong":[["The questions were too neutral, so the employees did not give the company useful answers","Wording isn't the issue."],["It used secondary data","It's primary."],["Too many people","Wrong people."]],"exp":"Ask the people you're studying."},{"q":"A student surveys only her friends about a new school snack bar. What's the BEST fix?","right":"Survey a random mix of students","wrong":[["Survey the same friends again next week to see whether their answers stay the same","Still the wrong sample."],["Ask more leading questions","Adds bias."],["Skip the survey","No data."]],"exp":"A representative sample matches the whole group."}]},{"term":"Bar chart","def":"A graphic that compares separate items or categories, such as revenue from three products.","hook":"Compare items.","asks":[{"q":"Which chart BEST compares revenue from three different products?","right":"A bar chart","wrong":[["A line graph, because revenue is something that companies track over many months and years","No time series here."],["A pie chart","Not parts of a whole."],["A stacked bar chart","No subcategories."]],"exp":"Bar charts compare separate items."},{"q":"A manager wants to compare the number of customers at each of five stores. Which chart?","right":"A bar chart","wrong":[["A pie chart, because the five stores together add up to all of the company's customers","The goal is comparing stores."],["A line graph","Not over time."],["A stacked bar","No subcategories."]],"exp":"Comparing separate items calls for a bar chart."}]},{"term":"Stacked bar chart","def":"A graphic that compares items and the subcategories inside each, such as quarterly sales of three products.","hook":"Compare items and their parts.","asks":[{"q":"Which chart BEST shows quarterly sales for three products, with each quarter split by product?","right":"A stacked bar chart","wrong":[["A pie chart, because each quarter's sales can be divided into slices for the three products","One pie can't compare four quarters well."],["A plain bar chart","Doesn't show the split."],["A line graph only","Not the best for parts."]],"exp":"Stacked bars compare items and their subcategories."},{"q":"What does a stacked bar show that a plain bar doesn't?","right":"The parts inside each bar","wrong":[["A trend over time that shows exactly when the company's sales began to rise or fall","That's a line graph."],["Only percentages","Can show amounts."],["Nothing extra","It shows subcategories."]],"exp":"Each bar is broken into subcategories."}]},{"term":"Line graph","def":"A chart that shows a trend over time, such as sales from 2018 to 2023.","hook":"Over time.","asks":[{"q":"Which chart BEST shows sales from 2018 to 2023?","right":"A line graph","wrong":[["A pie chart, because the sales from each year add up to the company's total sales","The goal is the trend."],["A bar chart of products","Not about time."],["A customer profile","Not a chart."]],"exp":"Line graphs show trends over time."},{"q":"A line graph of a product's sales rises for 3 years, then flattens. What life-cycle stage does the flat part suggest?","right":"Maturity","wrong":[["Introduction, because the product's sales are no longer growing as quickly as they were","Introduction comes first, with low sales."],["Decline","Sales aren't falling."],["Growth","Growth means rising."]],"exp":"Flattening sales after growth signals maturity."}]},{"term":"Pie chart","def":"A graphic that shows parts of a whole, such as market share.","hook":"Slices of 100%.","asks":[{"q":"Which chart BEST shows each brand's share of the energy-drink market?","right":"A pie chart","wrong":[["A line graph, because market share changes over time as new brands enter and leave","The question is the current split."],["A stacked bar","Not needed."],["A bar chart of prices","Not shares."]],"exp":"Pie charts show parts of a whole."},{"q":"A pie shows Brand X at 45% and Brand Y at 30%. What does this suggest about the market?","right":"It's concentrated in two brands","wrong":[["It's perfectly competitive, because there must be many other brands sharing the last part","Two brands hold 75%."],["Brand X is a monopoly","Not 100%."],["Sales are rising","A pie shows no trend."]],"exp":"75% held by two firms means a concentrated market."}]}],"intro":["Bad data is worse than no data. Leading questions and samples that don't match your customers produce answers you can't trust, and even good research can't predict behavior perfectly. Once you have good data, the right chart makes it clear."]}],"intro":["Topic 2.3 is about replacing guesses with evidence. Market research collects and analyzes information so a business can make decisions with less uncertainty. You need to know the kinds of data, the kinds of research, which method fits which question, how bias ruins data, and which chart fits which data."]},{"id":4,"name":"Product (2.4)","optional":false,"sections":[{"name":"The 4 Ps","cards":[{"term":"Product (4 Ps)","def":"The good or service itself: its features, quality and how it solves a problem.","hook":"What you sell.","asks":[{"q":"A company adds a waterproof case and longer battery to its speaker. Which P is it working on?","right":"Product","wrong":[["Promotion, because the new features will be the main point of the company's next ad campaign","Changing features is product."],["Place","Not where it's sold."],["Price","No price change."]],"exp":"Features and quality are the product decision."},{"q":"Which decision belongs to the Product P?","right":"Which colors and sizes to offer","wrong":[["Whether to sell through the company's own website or through large national retail chains","Place."],["How much to charge","Price."],["Which influencers to hire","Promotion."]],"exp":"Product covers features, quality and options."}]},{"term":"Price (4 Ps)","def":"What customers pay, which affects sales, profit and how customers see the brand.","hook":"What you charge.","asks":[{"q":"A brand lowers its price from $49 to $39 to win students. Which P changed?","right":"Price","wrong":[["Promotion, because the lower price is a message that will persuade students to buy it","The amount charged changed."],["Product","Same product."],["Place","Same channels."]],"exp":"What customers pay is price."},{"q":"Why can a very low price hurt a luxury brand?","right":"It changes how customers see the brand","wrong":[["Because lowering prices always makes the product illegal under consumer protection laws","No."],["Because it raises CAC","Not directly."],["It has no effect","Price shapes perception."]],"exp":"Price affects sales, profit and perception."}]},{"term":"Place (4 Ps)","def":"How and where customers get the product: online, in stores or through delivery channels.","hook":"Where you sell it.","asks":[{"q":"A snack brand starts selling in vending machines at gyms. Which P is this?","right":"Place","wrong":[["Product, because the snack will now be eaten by people who have just finished working out","Same snack; new location."],["Price","No price change."],["Promotion","Not a message."]],"exp":"Where and how customers get it is place."},{"q":"Which decision belongs to the Place P?","right":"Selling through a delivery app","wrong":[["Running a 20% off coupon for all new customers who download the app this month","Promotion."],["Adding a new flavor","Product."],["Charging $4.99","Price."]],"exp":"Channels and locations are place."}]},{"term":"Promotion (4 Ps)","def":"Advertising and other communication that informs and persuades customers.","hook":"How you tell people.","asks":[{"q":"A company sponsors a youth soccer league and runs Instagram ads. Which P is this?","right":"Promotion","wrong":[["Place, because the company's name will be shown at every soccer field across the region","Communicating, not selling there."],["Product","No change to it."],["Price","No price change."]],"exp":"Advertising and communication are promotion."},{"q":"What are the two main jobs of the Promotion P?","right":"Inform and persuade","wrong":[["Set the price and choose the store locations where customers will be able to buy it","Price and place."],["Make and ship it","Operations."],["Hire and train","HR."]],"exp":"Promotion informs and persuades customers."}]}],"intro":["The 4 Ps are the four decisions every marketing plan makes: what to sell, what to charge, where and how to sell it, and how to tell people about it. The rest of this unit takes them one at a time."]},{"name":"Product development","cards":[{"term":"Product development","def":"Creating or improving a good or service through research and iteration, which reduces risk.","hook":"Test before you invest.","asks":[{"q":"Why do businesses test and iterate instead of launching their first idea?","right":"It reduces the risk of a flop","wrong":[["Because the law requires every product to go through all six stages before it can be sold","No such law."],["To raise prices","Not the purpose."],["To avoid customers","It involves customers."]],"exp":"Research and iteration reduce risk."},{"q":"Which is the correct order of the first three stages?","right":"Ideation, validation, design","wrong":[["Design, ideation, validation, since a company has to draw up the product before it has ideas","Ideas come first."],["Validation, design, ideation","Ideas come first."],["Launch, design, ideation","Launch is last."]],"exp":"Ideation → validation → design → messaging → production → launch."}]},{"term":"Ideation stage","def":"The first step: generating ideas through market research, R&D and brainstorming.","hook":"Brainstorm.","asks":[{"q":"A team brainstorms 50 ideas after reading customer complaints. Which stage is this?","right":"Ideation","wrong":[["Validation, because the ideas are based on what real customers have complained about","Nothing has been tested yet."],["Design","No prototypes."],["Launch","Nothing to sell."]],"exp":"Generating ideas is ideation."},{"q":"Fortnite uses player data to come up with new game modes. Which stage is this?","right":"Ideation","wrong":[["Launch, because the new game modes will eventually be released to millions of players","Coming up with ideas comes first."],["Production","Not building yet."],["Decline","Not a development stage."]],"exp":"Using research to generate ideas is ideation."}]},{"term":"Validation stage","def":"The second step: testing with potential customers, often using an MVP, to check for real demand before investing heavily.","hook":"Do they want it?","asks":[{"q":"NovaCore gives a basic solar-backpack prototype to hikers to see if they'd buy it. Which stage is this?","right":"Validation","wrong":[["Design, because the company has already built a working version of the backpack to hand out","The goal is testing demand."],["Ideation","Past ideas."],["Launch","Not selling widely."]],"exp":"Testing demand with an MVP is validation."},{"q":"What is the MAIN question in validation?","right":"Do customers really want it?","wrong":[["What is the cheapest supply chain the company can use once it starts selling in large numbers?","That's production."],["What's our slogan?","Messaging."],["Where do we ship?","Launch."]],"exp":"Validation checks demand before heavy investment."}]},{"term":"Design stage","def":"The third step: building prototypes, choosing features and materials, and estimating production and delivery costs.","hook":"Make it work.","asks":[{"q":"A team picks materials, builds prototypes and estimates shipping costs. Which stage is this?","right":"Design","wrong":[["Messaging, because the team is deciding which features it will talk about in advertisements","These are design tasks."],["Ideation","Past ideas."],["Launch","Not selling."]],"exp":"Prototypes, features and cost estimates are design."},{"q":"Prototype feedback shows mostly older hikers like a backpack. Which stage produced this, and what can it shape?","right":"Design; who to target","wrong":[["Launch; the final price, because older hikers have the most money to spend on new gear","Prototype feedback comes before launch."],["Ideation; the brand name","Past ideation."],["Decline; cutting costs","Not a development stage."]],"exp":"Prototype feedback in design shows who buys."}]},{"term":"Messaging stage","def":"The fourth step: writing the value proposition and positioning strategy that explain who it's for and why it's better.","hook":"What will we say?","asks":[{"q":"NovaCore writes, \"Unlike traditional battery packs, our backpack charges itself.\" Which stage is this?","right":"Messaging","wrong":[["Production, because the company is explaining how the backpack will be made in its factory","It's the value proposition."],["Ideation","Not brainstorming."],["Validation","Not testing."]],"exp":"Writing the value proposition and positioning is messaging."},{"q":"Which TWO things are written in the messaging stage?","right":"Value proposition and positioning","wrong":[["The prototype and the minimum viable product, which are both tested on real customers first","Those come earlier."],["Supply chain and costs","Production and design."],["Orders and shipping","Launch."]],"exp":"Messaging explains who it's for and why it's better than rivals."}]},{"term":"Production stage","def":"The fifth step: choosing the process and supply chain and making enough to match demand, often starting with small runs.","hook":"Make enough.","asks":[{"q":"A company orders a small first run of 2,000 units and sets up its supply chain. Which stage is this?","right":"Production","wrong":[["Launch, because the company has to make products before customers can order and receive them","Making it comes before selling it."],["Design","Past prototypes."],["Validation","Past testing."]],"exp":"Choosing the process and supply chain and building it is production."},{"q":"Why do many businesses start production with small runs?","right":"To match output to real demand","wrong":[["To create scarcity on purpose, since small runs are always the best way to raise prices","Not the reason given."],["To skip launch","No."],["Because laws require it","No."]],"exp":"Small runs avoid making too much before demand is clear."}]},{"term":"Launch stage","def":"The final step: taking orders, distributing and marketing to the most profitable segments.","hook":"Go to market.","asks":[{"q":"A company starts taking orders and focuses ads on its most profitable segments. Which stage is this?","right":"Launch","wrong":[["Messaging, because the company is now running advertisements aimed at its target customers","Taking orders and distributing is launch."],["Production","Past making."],["Ideation","No."]],"exp":"Taking orders, distributing and marketing to profitable segments is launch."},{"q":"After launch, sales are weak. What does product development suggest?","right":"Gather feedback and iterate","wrong":[["Stop all marketing at once, because a weak launch shows that the product can never succeed","Too extreme."],["Double production","Not without demand."],["Change the logo only","Too narrow."]],"exp":"Development continues after launch through iteration."}]},{"term":"Prototype","def":"An early version made to test whether the product works and to improve its design.","hook":"Tests the product.","asks":[{"q":"An engineer builds a rough model to check whether a folding hinge holds up. This is a:","right":"Prototype","wrong":[["Minimum viable product, because it is the simplest version of the product the company has made","It tests whether it works, not demand."],["Generic product","No."],["Customer profile","No."]],"exp":"A prototype tests whether the product works."},{"q":"What is the MAIN purpose of a prototype?","right":"To test and improve the design","wrong":[["To win as many customers as possible before any of the company's competitors can react","That's launch."],["To set the price","Not its role."],["To replace branding","No."]],"exp":"Prototypes test whether it works and improve its design."}]},{"term":"Prototype vs. MVP","def":"The first tests whether the product works; the second tests whether there is market demand.","hook":"Product test vs. market test.","asks":[{"q":"Dev wants to know if parents will actually pay for his wagon. Which should he use?","right":"An MVP","wrong":[["A prototype, because a prototype tests whether the wagon's wheels and handle work properly","That tests the product, not demand."],["A tagline","No."],["A pie chart","No."]],"exp":"An MVP tests the market; a prototype tests the product."},{"q":"A drone company tests whether its propeller survives a crash. Which is this?","right":"A prototype test","wrong":[["An MVP test, because the company wants to find out whether customers will buy the drone","Crash-testing tests the product."],["A focus group","No."],["A launch","No."]],"exp":"Testing whether it works is a prototype's job."}]},{"term":"Positioning strategy","def":"How a business wants customers to see its product compared with competitors.","hook":"Where you stand in their mind.","asks":[{"q":"Liquid Death presents its water as edgy and rebellious, unlike calm, pure-looking rivals. What is this?","right":"A positioning strategy","wrong":[["A pricing strategy, because Liquid Death charges more than most other brands of bottled water","It's about how customers see it versus rivals."],["A focus group","No."],["A generic product","Strongly branded."]],"exp":"Positioning is how a product is seen compared with competitors."},{"q":"A new phone brand wants to be seen as the best value for students. What should guide its positioning?","right":"How it compares with rival phones","wrong":[["Only its own production costs, because customers mainly care about how a phone is made","Positioning is about perception versus rivals."],["Its tax rate","No."],["Its board","No."]],"exp":"Positioning places the product in customers' minds relative to rivals."}]},{"term":"Quality control","def":"Keeping products consistent and up to standard by finding and fixing problems during production, through inspections, testing and training.","hook":"Catch defects early.","asks":[{"q":"A bakery weighs every 20th loaf and checks it for defects. What is this?","right":"Quality control","wrong":[["Market research, because the bakery is collecting numbers about the bread that it sells","It checks production, not customers."],["Branding","No."],["A/B testing","No."]],"exp":"Inspections and testing during production are quality control."},{"q":"Why does quality control matter for marketing, not just for the factory?","right":"Consistent products protect the brand","wrong":[["It lets the company skip customer research, since good products never get complaints","Too extreme."],["It sets the price","No."],["It replaces ads","No."]],"exp":"Products that meet expectations build trust and loyalty."}]}],"intro":["Product development creates or improves a product through research and repeated testing, which cuts the risk of a flop. It runs in six stages: ideation, validation, design, messaging, production and launch. A prototype tests whether the product works; an MVP tests whether customers want it."]},{"name":"Branding","cards":[{"term":"Brand","def":"A name, term, symbol, design or combination of these that identifies a product.","hook":"Name + logo + idea.","asks":[{"q":"Which is part of a company's brand?","right":"Its name and logo","wrong":[["Its factory equipment and the trucks that it uses to deliver products to stores","Operations."],["Its tax returns","Accounting."],["Its payroll","HR."]],"exp":"A brand is a name, term, symbol, design or combination."},{"q":"Store-brand ibuprofen works like a famous brand but costs less. What does the famous brand mainly add?","right":"Recognition and loyalty","wrong":[["A completely different chemical formula that makes the medicine work in a new way","Same function."],["A lower price","It costs more."],["A legal requirement","No."]],"exp":"Brands distinguish products and build loyalty."}]},{"term":"Branding","def":"Developing an identity that reflects the vision and value proposition, sets the product apart and builds loyalty.","hook":"Must match reality.","asks":[{"q":"Pancakes labeled \"protein\" also say \"Not a good source of protein.\" What's the branding problem?","right":"The identity doesn't match reality","wrong":[["The package uses too many colors, so customers cannot easily read the product's name","Not the issue."],["It isn't trademarked","No."],["It's a generic product","It's branded."]],"exp":"Effective branding aligns identity with reality."},{"q":"A pizza chain known for cheap, average pizza remakes its recipe and relaunches its identity around quality, as Domino's did. What is this?","right":"A brand pivot","wrong":[["A price cut, because the chain is trying to bring back customers who stopped ordering from it","It changed its product and identity, not its price."],["A data breach","No."],["A loss leader","No."]],"exp":"Changing identity to match a remade product is a brand pivot."}]},{"term":"Tagline","def":"A long-term phrase that stands for the whole company, such as Nike's \"Just Do It.\"","hook":"Whole company, for years.","asks":[{"q":"Nike has used \"Just Do It\" for decades across all its products. This is a:","right":"Tagline","wrong":[["Slogan, because it is a short and memorable phrase that appears on many of Nike's ads","It stands for the whole brand long-term."],["Trademark only","A tagline can be trademarked but that's not the type."],["Mission statement","Not a statement of purpose."]],"exp":"Taglines represent the whole brand for years."},{"q":"A company wants one phrase to represent the whole brand for the next 20 years. It needs a:","right":"Tagline","wrong":[["Slogan, because a slogan can be changed whenever the company starts a new advertising campaign","Slogans change; it wants long-term."],["Sales promotion","No."],["Positioning map","No."]],"exp":"Long-term, whole-brand phrases are taglines."}]},{"term":"Slogan","def":"A phrase for one product or campaign that can change, such as \"Share a Coke.\"","hook":"One campaign, can change.","asks":[{"q":"Coca-Cola's \"Share a Coke\" ran for one campaign. This is a:","right":"Slogan","wrong":[["Tagline, because it is a phrase that millions of customers around the world remember","Tied to one campaign."],["Brand pivot","No."],["Value proposition","Not a statement of value."]],"exp":"Campaign phrases that can change are slogans."},{"q":"Which is the BEST difference between a slogan and a tagline?","right":"A slogan is for a campaign","wrong":[["A slogan is always protected by a patent, while a tagline is never protected by any law","Not true."],["A tagline is for one product","Reversed."],["They're the same","Different scope."]],"exp":"Slogans can change with campaigns; taglines represent the brand long-term."}]},{"term":"Generic products","def":"Unbranded goods with the same basic function, sold to price-sensitive customers, such as store-brand ibuprofen.","hook":"No name, low price.","asks":[{"q":"Which shopper is MOST likely to buy a generic product?","right":"A price-sensitive shopper","wrong":[["A shopper who is very loyal to one brand name and buys it no matter how high the price is","Brand-loyal shoppers avoid generics."],["A luxury buyer","Wants status."],["A collector","Wants the brand."]],"exp":"Generics serve price-sensitive buyers where brand loyalty matters less."},{"q":"Why can generic products charge less?","right":"They skip branding costs","wrong":[["Because they are made from ingredients that are always lower quality and unsafe","Same basic function."],["A law caps their price","No."],["They have no costs","No."]],"exp":"Unbranded products save on brand building."}]}],"intro":["A brand is the identity that sets a product apart and builds loyalty. Taglines stand for the whole brand for years; slogans belong to one product or campaign and can change. Branding only works if the product lives up to it. Generic products skip branding and compete on price."]},{"name":"Product life cycle","cards":[{"term":"Product life cycle","def":"The phases a good or service passes through based on demand and the number of competitors; marketing adapts at each one.","hook":"Intro, growth, maturity, decline.","asks":[{"q":"What two things define a product's life-cycle stage?","right":"Demand and number of competitors","wrong":[["The product's color and size, because these change as the product gets older on the market","Not what defines stages."],["Its tagline and slogan","No."],["Its price and tax","No."]],"exp":"Stages are based on demand and competition."},{"q":"The Model T sold from 1908 to 1927. What does this show about the life cycle?","right":"Products eventually decline","wrong":[["Every product lasts exactly nineteen years before it is replaced by a newer version","Lifespans vary widely."],["Cars never decline","It ended."],["Maturity lasts forever","No."]],"exp":"Products move through stages; lengths vary (the RCA player lasted 85 years)."}]},{"term":"Introduction stage","def":"Sales and revenue are low; the goal is building awareness.","hook":"Nobody knows it yet.","asks":[{"q":"A brand-new smart ring has low sales and few people know about it. Which stage is it in?","right":"Introduction","wrong":[["Decline, because its sales are low and the company is not yet earning any profit on the ring","Low sales at the start is introduction."],["Growth","Sales aren't accelerating."],["Maturity","Not leveled off."]],"exp":"Low sales and little awareness mark introduction."},{"q":"What should marketing focus on in the introduction stage?","right":"Building awareness","wrong":[["Cutting the price below cost so the company can clear its remaining inventory quickly","That's a decline tactic."],["Fighting many rivals","Few rivals yet."],["Discontinuing it","Too soon."]],"exp":"Customers need to know it exists."}]},{"term":"Growth stage","def":"Sales speed up and a few competitors enter; the business differentiates, improves quality and advertises.","hook":"Taking off, rivals arrive.","asks":[{"q":"NovaCore's sales jump and three rivals enter. Which stage is it in, and what should it do?","right":"Growth; differentiate","wrong":[["Decline; cut costs, because new competitors always mean the product will soon disappear","Sales are rising."],["Introduction; build awareness","Past that."],["Maturity; lower prices","Sales still rising."]],"exp":"Rapid sales plus new rivals = growth; differentiate and promote."},{"q":"Which sign MOST clearly marks the growth stage?","right":"Sales accelerating as rivals appear","wrong":[["Sales flattening as most of the people who want the product already own one","Maturity."],["Sales falling","Decline."],["Almost no sales","Introduction."]],"exp":"Accelerating sales and a few new competitors mark growth."}]},{"term":"Maturity stage","def":"Sales level off; the business protects share with brand loyalty, differentiation, lower prices or innovation.","hook":"Flat, not dead.","asks":[{"q":"Fortnite's growth slowed, so it added new seasons and brand collaborations. Which stage is it in?","right":"Maturity","wrong":[["Decline, because the game's growth has slowed down compared with its first few years","Flat isn't dying."],["Introduction","Long established."],["Growth","Growth slowed."]],"exp":"Mature products defend share with innovation and differentiation."},{"q":"Which strategy fits the maturity stage BEST?","right":"Building loyalty and adding features","wrong":[["Building basic awareness, because most customers still haven't heard of the product at all","Introduction."],["Discontinuing at once","Too early."],["Ignoring rivals","Rivals are many."]],"exp":"Maturity: protect share with loyalty, differentiation, lower prices or innovation."}]},{"term":"Decline stage","def":"Sales fall as customers switch to rivals or substitutes; the business cuts costs, redesigns or discontinues.","hook":"Fading out.","asks":[{"q":"DVD players' sales fall as people switch to streaming. Which stage is this?","right":"Decline","wrong":[["Maturity, because DVD players have been on the market for a long time and are well known","Sales are falling."],["Growth","No."],["Introduction","No."]],"exp":"Falling sales as customers move to substitutes is decline."},{"q":"Which option fits a product in decline?","right":"Redesign it or discontinue it","wrong":[["Spend heavily on awareness ads, since nobody has heard of the product yet in the market","That's introduction."],["Hire many salespeople","Unlikely to help."],["Raise production","Demand is falling."]],"exp":"In decline: cut costs, redesign or discontinue."}]}],"intro":["Products move through four stages based on demand and the number of competitors: introduction, growth, maturity and decline. Marketing changes at each stage. Maturity isn't dying: new features and collaborations can keep a mature product going (Fortnite's new seasons)."]}],"intro":["Topic 2.4 starts the 4 Ps of marketing with the product itself. It covers how products are developed in six stages, how quality and branding make them stand out, and how a product's sales change over its life cycle."]},{"id":5,"name":"Price (2.5)","optional":false,"sections":[{"name":"Price, cost and the core strategies","cards":[{"term":"Price vs. cost","def":"The first is what the business charges customers; the second is what the business spends to make and sell the product.","hook":"Charge vs. spend.","asks":[{"q":"A T-shirt costs $8 to make and sells for $20. Which is the price?","right":"$20","wrong":[["$8, because that is the amount of money that changes hands when the T-shirt is produced","That's the cost."],["$12","That's the profit per shirt."],["$28","Price plus cost."]],"exp":"Price is what the business charges; cost is what it spends."},{"q":"A startup sells a gadget for $15, but each one costs $18 to make. What's the result?","right":"It loses $3 on each sale","wrong":[["It earns $3 on each one, because the startup sells the gadget to a lot of customers","Price is below cost."],["It breaks even","No."],["It earns $15 each","Ignores cost."]],"exp":"A price below per-unit cost brings no profit."}]},{"term":"Pricing strategy","def":"A plan for how much to charge, based on goals, costs, competition and target customers.","hook":"The plan behind the number.","asks":[{"q":"Which set of things should a business consider when choosing a pricing strategy?","right":"Goals, costs, competitors and customers","wrong":[["Only its own costs, because the price of a product should always be exactly what it costs to make","Ignores customers and rivals."],["Only rivals' prices","Too narrow."],["Only the founder's opinion","No."]],"exp":"A pricing strategy depends on goals, costs, competition and target customers."},{"q":"A business wants to win market share fast in a crowded market. Which goal-strategy pair fits?","right":"Share goal; penetration pricing","wrong":[["Prestige goal; premium pricing, because high prices will attract the most customers quickly","High prices slow share gains."],["Share goal; premium pricing","Mismatch."],["Profit goal; loss leader on everything","Not sustainable."]],"exp":"Different goals call for different strategies."}]},{"term":"Value-based pricing","def":"Setting the amount by what the product is worth to customers, not by cost; fits unique, high-quality products and often means premium prices.","hook":"\"What's it worth to them?\"","asks":[{"q":"A company with a patented water filter that customers love prices it far above its cost. Which strategy?","right":"Value-based pricing","wrong":[["Cost-based pricing, because the company first figured out exactly what the filter cost to make","Price is set by perceived value."],["Penetration pricing","That starts low."],["Competitive pricing","No similar rival."]],"exp":"Unique, valued products suit value-based pricing."},{"q":"Which question drives value-based pricing?","right":"\"What is this worth to the customer?\"","wrong":[["\"How much does it cost us to make one, and what percentage should we add on top of that?\"","Cost-based."],["\"What do rivals charge?\"","Competitive."],["\"How low can we start?\"","Penetration."]],"exp":"Value-based pricing starts from perceived value."}]},{"term":"Cost-based pricing","def":"Adding a set markup to what each unit takes to make; predictable profit, but it ignores what customers will pay.","hook":"Cost + markup.","asks":[{"q":"A contractor adds 20% to the cost of materials and labor for every job. Which strategy?","right":"Cost-based pricing","wrong":[["Value-based pricing, because homeowners place a high value on having their homes built well","The price is cost plus a set markup."],["Dynamic pricing","Not changing with demand."],["Penetration pricing","Not starting low."]],"exp":"Cost plus markup is cost-based pricing."},{"q":"What is the BIGGEST weakness of cost-based pricing?","right":"It ignores what customers will pay","wrong":[["It never covers the company's costs, so every sale made with it loses money for the business","It does cover costs."],["It's illegal","No."],["It changes every hour","That's dynamic."]],"exp":"It can be too high (lose customers) or too low (miss profit)."}]},{"term":"Competitive pricing","def":"Setting the amount by rivals' prices, common with many sellers of similar products.","hook":"Southwest matching fares.","asks":[{"q":"Southwest lowers fares to match a rival on the same route. Which strategy?","right":"Competitive pricing","wrong":[["Price gouging, because airlines change their fares often and customers can't always predict them","Matching isn't gouging."],["Value-based","Set by the rival."],["Freemium","No."]],"exp":"Setting prices by rivals' prices is competitive pricing."},{"q":"When does competitive pricing fit BEST?","right":"Many sellers, similar products","wrong":[["A single seller of a patented product that customers cannot buy anywhere else in the market","No rivals to match."],["A luxury, one-of-a-kind item","Value-based."],["A new market with no rivals","Nothing to match."]],"exp":"Competitive pricing is common with many sellers of similar products."}]},{"term":"Penetration pricing","def":"Starting low, sometimes below cost, to win market share and recognition, then raising it later.","hook":"Disney+ at launch.","asks":[{"q":"A new streaming service launches at $1.99 a month, planning to raise it later. Which strategy?","right":"Penetration pricing","wrong":[["Psychological pricing, because the price ends in ninety-nine cents instead of a round number","The key is starting low to win share."],["Premium pricing","It's low."],["Loss leader","No other items."]],"exp":"Low initial prices to grab share, raised later, is penetration pricing."},{"q":"What is the MAIN risk of penetration pricing?","right":"Customers may leave when prices rise","wrong":[["It always earns the most profit in the first year, which makes investors expect too much","It often loses money early."],["It's illegal","No."],["It needs a patent","No."]],"exp":"Low prices win share but aren't sustainable unless costs are low."}]}],"intro":["Price is what the business charges; cost is what it spends. A price below per-unit cost earns no profit. A pricing strategy is a plan for how much to charge, based on goals, costs, competition and customers. The four core strategies start from different places: customer value, cost, rivals' prices, or winning share fast."]},{"name":"Markup and margin","cards":[{"term":"Markup","def":"Profit as a percentage of cost: (price − cost) ÷ cost × 100.","hook":"Divide by cost.","asks":[{"q":"An item costs $12 and sells for $15. What is the markup?","right":"25%","wrong":[["20%, because the three dollars of profit should be divided by the fifteen-dollar price","That's the margin."],["3%","That's dollars, not percent."],["80%","Wrong division."]],"exp":"$3 ÷ $12 = 25%."},{"q":"An item costs $24. The store adds a 25% markup. What is the selling price?","right":"$30","wrong":[["$25, because a twenty-five percent markup means adding twenty-five dollars onto the price","25% of $24 is $6."],["$32","Math error."],["$18","Subtracted."]],"exp":"$24 + (0.25 × $24) = $30."}]},{"term":"Profit margin","def":"What's left after cost, as a percentage of the selling price: (price − cost) ÷ price × 100.","hook":"Divide by price.","asks":[{"q":"An item costs $40 and sells for $50. What is the profit margin?","right":"20%","wrong":[["25%, because the ten dollars of profit is divided by the forty dollars that it cost to make","That's the markup."],["10%","Dollars, not percent."],["80%","Wrong division."]],"exp":"$10 ÷ $50 = 20%."},{"q":"Product A costs $80, sells for $100. Product B costs $40, sells for $60. Which has the higher margin?","right":"B (33%)","wrong":[["A, because it earns twenty dollars of profit on every unit and B earns the same dollar amount","Same dollars, but margin is a percent of price."],["They're equal","20% vs. 33%."],["A (33%)","A is 20%."]],"exp":"A: $20 ÷ $100 = 20%. B: $20 ÷ $60 = 33.3%."}]}],"intro":["Markup and margin both measure profit as a percentage, but from different bases. Markup divides profit by COST; margin divides profit by SELLING PRICE. The same item has a bigger markup than margin: cost $50, price $60 is a 20% markup but a 16.7% margin."]},{"name":"Other pricing strategies","cards":[{"term":"Subscription pricing","def":"Charging a recurring fee, such as $12 a month for streaming.","hook":"Pay every month.","asks":[{"q":"A meal-kit company charges $60 every week until you cancel. Which strategy?","right":"Subscription pricing","wrong":[["Bundle pricing, because each weekly box includes several different meals in one package","The key is the recurring fee."],["Dynamic pricing","Fixed fee."],["Freemium","No free tier."]],"exp":"A recurring fee is subscription pricing."},{"q":"Why do businesses like subscription pricing?","right":"Predictable, repeating revenue","wrong":[["Customers can never cancel a subscription once they have signed up for it","They can."],["It has no costs","No."],["It needs no marketing","No."]],"exp":"Recurring fees bring steady revenue and raise lifetime value."}]},{"term":"Bundle pricing","def":"Selling several products together for less than their separate total.","hook":"Combo deal.","asks":[{"q":"A fast-food chain sells a burger, fries and drink together for less than buying each separately. Which strategy?","right":"Bundle pricing","wrong":[["Loss leader, because the chain is losing money on the fries in order to sell more burgers","Several items at a lower total is a bundle."],["Premium pricing","It's cheaper."],["Dynamic pricing","Not changing with demand."]],"exp":"Several products together at a lower total is bundling."},{"q":"A cable company bundles internet, TV and phone. What is it MOST likely trying to do?","right":"Get customers to buy more services","wrong":[["Lower its costs to zero, because customers who buy bundles never need any customer service","No."],["Avoid all competition","Too extreme."],["Meet a legal rule","No."]],"exp":"Bundles encourage buying more by lowering the total."}]},{"term":"Premium pricing","def":"Charging a high amount to signal quality or exclusivity, like an $8,000 watch.","hook":"Expensive on purpose.","asks":[{"q":"A watch brand sells an $8,000 watch that tells time like a $20 one. Which strategy?","right":"Premium pricing","wrong":[["Cost-based pricing, because an expensive watch takes much more money to make than a cheap one","The price signals status, not cost."],["Penetration","Not low."],["Psychological","Not a .99 trick."]],"exp":"High prices that signal quality or exclusivity are premium pricing."},{"q":"Why might cutting the price of a premium product HURT sales?","right":"It weakens its image of exclusivity","wrong":[["Because lower prices always reduce the number of customers who are able to buy a product","Usually the opposite; here image matters."],["It's illegal","No."],["It raises costs","No."]],"exp":"Premium prices signal quality."}]},{"term":"Freemium","def":"Giving away a basic version and charging for extra features.","hook":"Free game, paid upgrades.","asks":[{"q":"A game is free to download but charges for new characters and skins. Which strategy?","right":"Freemium","wrong":[["A loss leader, because the game is given away to bring players into the company's store","Free basic + paid features is freemium."],["Subscription","No recurring fee."],["Bundle","No."]],"exp":"Free basic version, paid premium features."},{"q":"What must be true for freemium to make money?","right":"Enough free users pay for extras","wrong":[["Every single user must pay something, or else the company is breaking a consumer law","Most users never pay."],["It must have no rivals","No."],["The free version must be bad","It must be good enough to attract users."]],"exp":"Revenue comes from the share who upgrade."}]},{"term":"Psychological pricing","def":"Setting amounts like $9.99 that feel noticeably lower than the next round number.","hook":"$29.99.","asks":[{"q":"A store prices a jacket at $29.99 instead of $30. Which strategy?","right":"Psychological pricing","wrong":[["Competitive pricing, because the store wants its jacket to cost less than a rival's jacket","The .99 ending is the giveaway."],["Dynamic pricing","Not changing."],["Penetration","Not a launch price."]],"exp":"Prices like $29.99 feel lower."},{"q":"Why does $9.99 often sell better than $10?","right":"It feels noticeably cheaper","wrong":[["It costs the business less to make a product that is priced at nine ninety-nine","Cost doesn't change."],["It's required by law","No."],["It raises markup","Lower, if anything."]],"exp":"The price looks lower than the next round number."}]},{"term":"Dynamic pricing","def":"Changing the amount with demand, time or customer behavior.","hook":"Uber surge, holiday hotels.","asks":[{"q":"Uber's fares rise when demand spikes after a concert. Which strategy?","right":"Dynamic pricing","wrong":[["Price gouging, because any increase in price during a busy time is against the law","Normal demand changes aren't gouging."],["Premium","Not about status."],["Bundle","No."]],"exp":"Prices that change with demand or time are dynamic."},{"q":"A hotel charges more on holiday weekends. What is the MAIN reason?","right":"Demand is higher then","wrong":[["Its costs to clean the rooms triple on holidays, so it must cover those extra expenses","The driver is demand."],["A law requires it","No."],["To clear inventory","Opposite."]],"exp":"Dynamic pricing follows demand."}]},{"term":"Loss leader","def":"Selling one item very cheaply, even below what it costs, to bring in buyers of other items.","hook":"Costco hot dog.","asks":[{"q":"Costco sells hot dogs very cheaply, even at a loss. What is it MOST likely trying to do?","right":"Bring in shoppers who buy other items","wrong":[["Win the market for hot dogs, since that is where the company earns most of its money","The point is the other items."],["Get rid of old stock","That's a sales promotion."],["Signal luxury","Opposite."]],"exp":"A loss leader draws buyers for other products."},{"q":"A grocery store sells milk below cost. Which strategy, and what kind is it?","right":"Loss leader, a form of penetration","wrong":[["Premium pricing, because milk is a necessity that people will buy no matter what it costs","It's priced low, not high."],["Cost-based pricing","Below cost."],["Price gouging","Opposite."]],"exp":"Your slides call loss leaders a form of penetration pricing."}]},{"term":"Pay-what-you-want","def":"Letting customers choose the amount, sometimes with a minimum.","hook":"You decide.","asks":[{"q":"A museum lets visitors pay any amount, with a $1 minimum. Which strategy?","right":"Pay-what-you-want","wrong":[["Freemium, because some visitors will pay more to get extra features during their museum visit","No paid features."],["Penetration","Not a low start."],["Psychological","No .99."]],"exp":"Customers choose the amount, sometimes with a minimum."},{"q":"What is the BIGGEST risk of pay-what-you-want pricing?","right":"Many people may pay very little","wrong":[["Every customer will choose to pay much more than the product is really worth to them","Unlikely."],["It's illegal","No."],["It raises costs","Not directly."]],"exp":"Revenue depends on customers' generosity."}]}],"intro":["Beyond the core four, businesses use many specific tactics. Each one has a giveaway: a recurring fee, a package deal, a price ending in .99, a free basic version, a price that changes with demand, or one item sold cheap to pull people in."]},{"name":"Pricing power and elasticity","cards":[{"term":"Pricing power","def":"The ability to raise prices without losing customers; unique, differentiated products have more.","hook":"Raise it and they stay.","asks":[{"q":"AquaPure's patented filter has no close rivals and loyal buyers. What pricing power does it have?","right":"High","wrong":[["None, because a filter is a simple product that almost any company in the world could make","Patented and unique."],["Low","Few substitutes means more power."],["Negative","Not a thing."]],"exp":"Unique, differentiated products have more pricing power."},{"q":"A rival launches an identical filter at half AquaPure's price. What happens to AquaPure's pricing power?","right":"It falls","wrong":[["It rises, because customers will see AquaPure's higher price as a sign of better quality","A close substitute weakens power."],["It stays the same","Substitutes matter."],["It becomes illegal","No."]],"exp":"A cheap substitute makes demand more elastic and cuts pricing power."}]},{"term":"Price elasticity of demand","def":"A measure of how much buying changes when the amount charged changes.","hook":"How much they react.","asks":[{"q":"When gas prices rise 20%, dri
