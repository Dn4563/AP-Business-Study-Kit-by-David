<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Business Study Kit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
/* Design tokens shared by the Study Hub and every kit. The course accent comes from course.json
   (set at runtime as --accent-l / --accent-d). */
:root {
  --ground: #E9EBEE; --sheet: #FFFFFF; --sunk: #F3F4F6; --ink: #1A1D21; --ink-2: #555C65; --rule: #D6DAE0;
  --ok: #23774A; --ok-wash: #E3F2E9; --bad: #B3261E; --bad-wash: #FBE9E7; --mid: #9A5B00; --mid-wash: #FCF0DC;
  --t0: #3E6FB0; --t1: #B5552F; --t2: #3D8A5F; --t3: #7A5BB5; --t4: #A8862A; --t5: #3B8C99; --t6: #A54C79; --t7: #6B7280;
  --accent: var(--accent-l, #2C5AA0); --on-accent: #FFFFFF;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 8px; --r-sm: 6px; --fast: 120ms; --mid-t: 180ms;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
  --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
  --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
  --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
    --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
    --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
    --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
  }
}
:root { --accent-wash: color-mix(in srgb, var(--accent) 10%, var(--sheet)); }

/* Study kit layout and components. Uses tokens.css only. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1rem/1.55 var(--sans); }
#app { max-width: 60rem; margin: 0 auto; padding: 0 16px 72px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font: 600 clamp(2rem, 5vw, 2.8rem)/1.05 var(--serif); letter-spacing: -.01em; }
h2 { font: 600 1.55rem/1.2 var(--serif); }
h3 { font-size: 1.05rem; font-weight: 600; margin: 22px 0 8px; }
h4 { font-size: .95rem; font-weight: 600; margin: 14px 0 6px; }
p { margin: 8px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted, .hint { color: var(--ink-2); }
.hint { font-size: .9rem; }
.big { font-size: 1.25rem; font-weight: 600; }

/* header */
.top { padding: 22px 0 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.hublink { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.hublink:hover { color: var(--accent); }
.credit { margin: 40px 0 8px; text-align: center; font-size: .85rem; color: var(--ink-2); }
.credit a { color: inherit; }
.credit a:hover { color: var(--accent); }
.kicker { margin: 0 0 6px; color: var(--accent); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 60ch; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; color: var(--ink-2); font-size: .95rem; }
.meter .bar { flex: 1 1 160px; }
.bar { display: block; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--mid-t); }
.bar.low i { background: var(--bad); } .bar.mid i { background: var(--mid); } .bar.high i { background: var(--ok); }

/* tabs and chips */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); margin: 0 -16px; padding: 0 16px; }
.tabrow { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 12px 10px; color: var(--ink-2); font-weight: 600; }
.tab:hover { color: var(--ink); }
@media (min-width: 760px) { .tabrow { flex-wrap: wrap; overflow-x: visible; } }
.tab[aria-current] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 13px; font-size: .92rem; }
.chip small { color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.t0 { background: var(--t0); } .dot.t1 { background: var(--t1); } .dot.t2 { background: var(--t2); } .dot.t3 { background: var(--t3); }
.dot.t4 { background: var(--t4); } .dot.t5 { background: var(--t5); } .dot.t6 { background: var(--t6); } .dot.t7 { background: var(--t7); }
main { padding-top: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 18px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; transition: background-color var(--fast), border-color var(--fast); }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.sec { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn.sec:hover { border-color: var(--ink-2); background: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: transparent; padding: 8px 10px; min-height: 38px; font-weight: 500; }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.ghost[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:not(.ghost).danger { background: var(--sheet); border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }

/* panels */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 24px; margin-bottom: 18px; }
.rtop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.rtop h2 { margin-right: auto; }
.msg { color: var(--bad); font-weight: 600; }
.kbd { color: var(--ink-2); font-size: .85rem; margin-top: -6px; }

/* questions and choices */
.lockt { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-2); margin-bottom: 4px; }
.qask { color: var(--ink-2); font-weight: 600; margin: 14px 0 4px; }
.qprompt, .stem { font-size: 1.12rem; line-height: 1.5; margin: 6px 0 16px; max-width: 70ch; }
.opts { display: grid; gap: 10px; }
.opts.tf { grid-template-columns: repeat(2, minmax(0, 12rem)); }
.optrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; transition: border-color var(--fast), background-color var(--fast); }
.opt:not(:disabled):hover { border-color: var(--ink-2); }
.opt .k { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.opt .ot { padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-wash); }
.opt.right .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
.opt.wrong .k { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.opt:disabled { cursor: default; color: var(--ink); }
.crossed .opt .ot { text-decoration: line-through; color: var(--ink-2); }
.crossed .opt { opacity: .7; }
.xoff { width: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); border-radius: var(--r-sm); }
.xoff:hover { background: var(--sunk); color: var(--ink); }
.xoff[aria-pressed="true"] { color: var(--accent); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--ink-2); }
.fb.ok { background: var(--ok-wash); border-left-color: var(--ok); }
.fb.bad { background: var(--bad-wash); border-left-color: var(--bad); }
.fb p:first-child { margin-top: 0; } .fb p:last-child { margin-bottom: 0; }
.why { margin-top: 10px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--rule); }
.why .wh { font-size: .85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.why.bad .wh { color: var(--bad); } .why.good .wh { color: var(--ok); }
.why p { margin: 6px 0 0; }
.qt { display: block; font-weight: 600; }
.whyall { margin-top: 10px; }
.whyall summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.whyall ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
.whyall li { padding: 10px 14px; background: var(--sunk); border-radius: var(--r-sm); }
.whyall li p { margin: 4px 0 0; }
.tag { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.tag.ok { background: var(--ok-wash); color: var(--ok); } .tag.bad { background: var(--bad-wash); color: var(--bad); }
.hook { display: block; margin-top: 6px; color: var(--ink-2); font-size: .94rem; }
.hook b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.skill { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: var(--sunk); border: 1px solid var(--rule); padding: 0 8px; border-radius: 999px; vertical-align: 1px; }

/* learn */
.lessonbar { margin-bottom: 14px; }
.lessonbar .rtop { margin-bottom: 8px; }
.lmap { margin-top: 14px; display: grid; gap: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.lmdeck h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.lmlist { display: flex; flex-wrap: wrap; gap: 6px; }
.lm { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 10px; font-size: .9rem; }
.lm.done { color: var(--ok); }
.lm[aria-current] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; color: var(--ink); }
.deckname { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: .92rem; margin: 0 0 4px; }
.terms { margin: 16px 0 0; display: grid; gap: 0; }
.terms > div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 13px 0; border-top: 1px solid var(--rule); }
.terms > div:first-child { border-top: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; }
.terms.guide > div { grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; }
.know { align-self: start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 4px 10px; font-size: .85rem; color: var(--ink-2); white-space: nowrap; }
.know[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); font-weight: 600; }
.chain { margin: 18px 0; }
.chain figcaption { font-weight: 600; font-size: .92rem; color: var(--ink-2); margin-bottom: 8px; }
.chain ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; counter-reset: c; }
.chain li { position: relative; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: var(--r-sm); padding: 7px 12px; font-size: .95rem; }
.chain li + li { margin-left: 22px; }
.chain li + li::before { content: ""; position: absolute; left: -20px; top: 50%; width: 14px; height: 2px; background: var(--ink-2); }
.chain li + li::after { content: ""; position: absolute; left: -10px; top: calc(50% - 4px); border: 5px solid transparent; border-left-color: var(--ink-2); border-right: 0; }
.watch { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--mid); background: var(--mid-wash); border-radius: var(--r-sm); }
.watch b { display: block; color: var(--mid); margin-bottom: 2px; }
.scorebig { font: 600 2.6rem/1 var(--serif); margin: 14px 0 0; }
.missed { padding-left: 20px; }
.missed li { margin: 6px 0; }

/* study guide */
.deckblock { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; margin-bottom: 18px; }
.deckblock > h2 { display: flex; align-items: center; gap: 10px; }
.tree { background: var(--sunk); border-radius: var(--r-sm); padding: 14px 16px; overflow-x: auto; font: .92rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.tablewrap { margin: 16px 0; }
.tablewrap figcaption { font-weight: 600; margin-bottom: 8px; }
.scrollx { overflow-x: auto; }
.gt { border-collapse: collapse; width: 100%; font-size: .95rem; }
.gt th, .gt td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.gt th { background: var(--sunk); font-weight: 600; }
.breakdown { max-width: 34rem; margin: 14px 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 16px 24px; }
.cblock h3 { margin-top: 6px; }
.cblock ul { padding-left: 18px; margin: 0; }

/* flashcards */
.ctl { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.ctl label, .grp label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .95rem; }
select, input[type="number"] { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 6px 8px; color: var(--ink); }
input[type="number"] { width: 4.5rem; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.fcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; width: 100%; min-height: 15rem; padding: 32px; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: var(--r); text-align: center; }
.fterm { font: 600 2rem/1.15 var(--serif); }
.fdef { font-size: 1.15rem; max-width: 50ch; }
.fcard small { color: var(--ink-2); }
.fcnav .btn { flex: 1 1 8rem; }
.fctools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.fctools [aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.fcprog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
.fcprog .muted { flex: none; font-size: .92rem; }
.fcprog .bar { flex: 1 1 140px; }
.srb { margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: .8rem; font-weight: 600; white-space: nowrap; }

/* forms */
.form fieldset { border: 0; padding: 0; margin: 18px 0 0; }
.form legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.grp { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; }
.chk input { margin-top: 3px; }
textarea { width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.5; resize: vertical; margin-top: 12px; }

/* practice test */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stab { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 7px 13px; font-size: .92rem; color: var(--ink-2); }
.stab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }
.stab.res { border-style: dashed; }
.ptctl { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 -10px 10px; }
.score { color: var(--ink-2); font-weight: 600; font-size: .95rem; }
.banner { background: var(--accent-wash); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; }
.intro { margin-bottom: 12px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.disclose .ic { transition: transform var(--fast); }
.disclose[aria-expanded="true"] .ic { transform: rotate(90deg); }
.intro ol { margin: 8px 0; padding-left: 22px; }
.intro li { margin: 4px 0; }
.pals { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.pal { position: relative; width: 38px; height: 38px; border-radius: var(--r-sm); border: 1.5px solid var(--rule); background: var(--sunk); color: var(--ink-2); font-weight: 600; font-size: .9rem; }
.pal.vis { background: var(--sheet); border-color: var(--mid); color: var(--ink); }
.pal.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.pal.bad { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.pal.partial { background: var(--mid-wash); border-color: var(--mid); color: var(--mid); }
.pal.none { background: var(--sunk); }
.pal[aria-current] { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.pal.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border: 7px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); border-top-right-radius: var(--r-sm); }
.qtitle { color: var(--ink-2); font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
.qhead { font: 600 1.25rem/1.25 var(--serif); margin: 4px 0 8px; }
.src { margin: 0 0 16px; padding: 16px 18px; background: var(--sunk); border: 1px solid var(--rule); border-radius: var(--r-sm); }
.src figcaption b { display: block; }
.sattr, .slab { display: block; font-size: .88rem; color: var(--ink-2); }
.srcimg { display: block; max-width: 100%; height: auto; margin: 12px 0; border-radius: 4px; }
.stext { font-family: var(--serif); font-size: 1.08rem; line-height: 1.6; max-width: 68ch; }
.pn { font-family: var(--sans); font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-right: 6px; }
.litems { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.litem { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 8px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.litem.pinrow { grid-template-columns: auto minmax(0, 1fr); }
.litem.right { border-color: var(--ok); background: var(--ok-wash); }
.litem.wrong { border-color: var(--bad); background: var(--bad-wash); }
.lt { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.ln { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: .8rem; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.lb { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 12px; font-size: .92rem; }
.lb.sel { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.lb.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.lb.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.lb:disabled { cursor: default; }
.lfb { grid-column: 1 / -1; font-size: .93rem; }
.diagram { margin: 0 0 16px; }
.dimg { position: relative; display: inline-block; max-width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.dimg img { display: block; max-width: 100%; max-height: 34rem; width: auto; height: auto; border-radius: var(--r-sm); }
.pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1A1D21; color: #fff; font-size: .85rem; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 0 1px #1A1D21; }
.pin.set { background: var(--accent-l, #2C5AA0); }
.pin.right { background: #23774A; } .pin.wrong { background: #B3261E; }
.credit { font-size: .82rem; color: var(--ink-2); margin-top: 6px; }
.fparts { padding-left: 22px; }
.fparts li { margin: 6px 0; }
.fparts.typed li { margin: 10px 0; }
.tpart label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.tpart .tq { min-width: 9em; font-weight: 600; }
.tpart input { flex: 1 1 14em; min-width: 0; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); }
.tpart.right input { border-color: var(--ok); background: var(--ok-wash); }
.tpart.wrong input { border-color: var(--bad); background: var(--bad-wash); }
.tyes b { color: var(--ok); } .tno b { color: var(--bad); }
.part { display: block; margin-top: 16px; }
.pl { display: block; font-weight: 600; }
.pl small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.model { margin-top: 20px; padding: 18px; background: var(--accent-wash); border-radius: var(--r-sm); }
.model h4 { margin-top: 0; font-size: 1rem; }
.mpart { padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--accent) 25%, var(--rule)); }
.mpart:first-of-type { border-top: 0; }
.tea { margin: 8px 0; display: grid; gap: 6px; }
.tea > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; }
.tea dt { font-weight: 600; color: var(--accent); }
.tea dd { margin: 0; }
.earns, .weak { font-size: .95rem; }
.weak { color: var(--ink-2); }
.selfmark { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.selfmark > span { font-weight: 600; font-size: .9rem; margin-right: 4px; }
.mk { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 6px 12px; font-size: .9rem; }
.mk.on.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.mk.on.wrong { border-color: var(--bad); background: var(--bad); color: var(--sheet); }

/* results and progress */
.wk { display: grid; gap: 14px; }
.wkhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
.wkhead span { color: var(--ink-2); font-size: .92rem; }
.wkmiss, .wkrev { font-size: .92rem; margin: 6px 0 0; }
.resq { border: 1px solid var(--rule); border-radius: var(--r-sm); margin: 8px 0; }
.resq summary { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
.resq summary::-webkit-details-marker { display: none; }
.resq .pal { flex: none; }
.resd { padding: 0 14px 12px 62px; }

/* course home */
.course { margin-bottom: 4px; }
.unitlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.unitrow { display: grid; grid-template-columns: 7rem minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px 24px; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: var(--r); color: inherit; text-decoration: none; transition: border-color var(--fast); }
.unitrow:hover { border-color: var(--accent); }
.ulabel { font-weight: 600; color: var(--accent); }
.ubody { display: grid; gap: 4px; }
.utitle { font: 600 1.35rem/1.2 var(--serif); }
.ublurb { color: var(--ink-2); }
.ustat { font-size: .9rem; color: var(--ink-2); }
.ugo { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); }

@media (max-width: 640px) {
  .panel, .deckblock { padding: 18px 16px; }
  .terms > div, .terms.guide > div { grid-template-columns: minmax(0, 1fr); }
  .terms.guide .know { justify-self: start; }
  .litem:not(.pinrow) { grid-template-columns: minmax(0, 1fr); }
  .tea > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .unitrow { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; }
  .ulabel { grid-column: 1 / -1; }
  .resd { padding-left: 14px; }
  .opts.tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; }
  .tabs, .chips, .topbar, .meter, .noprint, .qnav, .ptctl { display: none !important; }
  .panel, .deckblock { border: 0; padding: 0; }
}

/* Plain-language intros (deck big picture, section story) */
.intro { margin: 12px 0 16px; padding: 12px 16px; border-left: 4px solid var(--accent); background: var(--sunk); border-radius: var(--r-sm); }
.intro p { margin: 0 0 8px; line-height: 1.6; }
.intro p:last-child { margin-bottom: 0; }
.intro .introhead { font-weight: 700; font-size: .92rem; color: var(--accent); margin-bottom: 6px; }
.intro.bigpic { background: transparent; border: 1px solid var(--rule); border-left: 4px solid var(--accent); }
.introfold { margin: 8px 0 12px; }
.introfold summary { cursor: pointer; font-weight: 600; color: var(--accent); }

/* Course home: whole-course backup */
.backup { margin-top: 24px; }
.bkmsg { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--accent); }

/* Study plan */
.plan h3 { margin-top: 22px; }
.plrate, .pltable { display: grid; gap: 10px; }
.plrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; border-top: 1px solid var(--rule); }
.plrow:first-child { border-top: 0; }
.pld { min-width: 12em; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.plwhy { flex: 1 1 18em; color: var(--ink-2); }
.pltag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 700; border: 1px solid var(--rule); }
.pltag.learn { border-color: var(--bad); background: var(--bad-wash); }
.pltag.fix { border-color: var(--mid); background: var(--mid-wash); }
.pltag.polish { border-color: var(--ok); background: var(--ok-wash); }
.plsteps { padding-left: 22px; }
.plstep { margin: 14px 0; }
.plstep p { margin: 2px 0 8px; color: var(--ink-2); }
.plstep .chk { margin: 0; }
.plstep.done b { text-decoration: line-through; color: var(--ink-2); }
.plsteps.later { opacity: .85; }
.pldays div { display: flex; gap: 12px; padding: 6px 0; border-top: 1px solid var(--rule); }
.pldays dt { min-width: 8em; font-weight: 600; }
.pldays dd { margin: 0; }

<script>
const COURSE = {"id":"apbus","name":"AP Business","tagline":"One kit per unit. Pick a unit to study; progress in each one is saved in this browser.","hub":"https://dn4563.github.io/Study-Hub-by-David/","accent":"#6B3A7A","accentDark":"#C9A0D6","examTab":"Mock test","units":[{"id":"u1","label":"Unit 1","title":"Business, Competition, and New Ideas","blurb":"What a business is, markets and competitive advantage, PESTEL, where ideas come from, vision, ethics, business structures and supply chains (topics 1.1 to 1.8).","learnMix":true},{"id":"u2","label":"Unit 2","title":"Marketing","blurb":"Marketing to customers, consumer behavior, market research, and the 4 Ps: product, price, place and promotion (topics 2.1 to 2.7).","learnMix":true,"recall":true}]};
const UNITDATA = {"u1":{"images":{},"decks":[{"id":1,"name":"What Is a Business? (1.1)","optional":false,"sections":[{"name":"Businesses and customers","cards":[{"term":"Business","def":"An organization that produces and distributes goods and/or services, in person or online, locally or worldwide.","hook":"Makes and sells stuff people want.","asks":[{"q":"Which of these is NOT a business?","right":"A family cooking dinner for itself at home","wrong":[["A teenager who sells custom phone cases to classmates through an online store","Selling goods for money makes it a business."],["A barber who cuts hair for pay","Selling a service makes it a business."],["An app that sells movie tickets","Online businesses count too."]],"exp":"A business produces and distributes goods or services for customers; cooking for yourself isn't selling anything."},{"q":"A company sells only through its website to customers in 40 countries. What does this show?","right":"Businesses can be virtual and global","wrong":[["It isn't really a business because it doesn't have a physical store location","Businesses can operate virtually."],["It must be a nonprofit","Nothing suggests that."],["It sells only services","Not stated."]],"exp":"Businesses can serve customers face to face or virtually, locally or globally."}]},{"term":"Goods","def":"Tangible items you can touch and own, such as cars, phones or soda.","hook":"Goods you can hold.","asks":[{"q":"A concert venue sells T-shirts and also charges for coat check. Which is the good?","right":"The T-shirt","wrong":[["The coat check, because customers get their coats back in their hands","Coat check is work done for you: a service."],["Both are goods","Coat check is a service."],["Neither is a good","The T-shirt is tangible."]],"exp":"Goods are tangible things you can own."},{"q":"A ski resort rents helmets and sells lessons. Which statement is correct?","right":"The helmet is a good; the lesson is a service","wrong":[["Both are services, since customers don't keep the helmet after renting it","The helmet is still a tangible item."],["The lesson is a good","A lesson is work done for you."],["Neither has value","Both have value."]],"exp":"Goods are tangible items; services are work performed for pay."}]},{"term":"Services","def":"Work or actions performed for payment, such as haircuts, hotel stays or tax preparation.","hook":"Services are done for you.","asks":[{"q":"Which of these is a service?","right":"Preparing someone's taxes","wrong":[["A box of cereal sold at a grocery store to a family with young children","Cereal is a tangible good."],["A smartphone","A good."],["A pair of sneakers","A good."]],"exp":"Services are work performed for payment."},{"q":"A homeowner hires a company to clean the air conditioner and buys a filter from it. Which is the service?","right":"The cleaning","wrong":[["The filter, because the homeowner needs it to keep the system working well","The filter is tangible: a good."],["Both are services","The filter is a good."],["Neither is a service","The cleaning is work done for pay."]],"exp":"Cleaning is work performed for payment; the filter is a good."}]},{"term":"Profit","def":"What is left when total revenue is greater than total costs; it lets a business survive, grow, invest and reward owners.","hook":"Revenue − costs = profit.","asks":[{"q":"A bakery earns $18,000 in revenue and pays $17,000 in total costs. What is its profit?","right":"$1,000","wrong":[["$18,000, since that is all of the money the bakery collected from its customers","That's revenue, not profit."],["$17,000","That's total costs."],["$35,000","Subtract, don't add."]],"exp":"Profit = revenue − costs = $18,000 − $17,000."},{"q":"A business has $1.2 million in revenue and $1.35 million in costs. Which statement is correct?","right":"It has revenue but a $150,000 loss","wrong":[["It earned $150,000 in profit, since the gap between revenue and costs is positive","Costs are higher, so it's a loss."],["It has no revenue","It has $1.2 million in revenue."],["It can't be creating value","It can still create value for customers."]],"exp":"When costs exceed revenue, there is a loss, not a profit."}]},{"term":"Customer","def":"The person or organization that pays for a product and makes the buying decision.","hook":"The customer pays.","asks":[{"q":"A school district signs a contract to buy lunches; students choose whether to eat them. Who is the customer?","right":"The school district","wrong":[["The students, because they are the ones who decide each day whether to eat the meals","They're the consumers: the users."],["The delivery drivers","They don't buy anything."],["The food suppliers","They sell to the company."]],"exp":"The customer pays and makes the buying decision."},{"q":"A parent buys a meal subscription for a college student, who picks and eats the meals. Which role does the parent play?","right":"Customer","wrong":[["Consumer, since the parent is the one spending money on the meal subscription","The consumer is the one who uses it."],["Supplier","The parent isn't selling."],["Competitor","Not a business role here."]],"exp":"The parent pays: customer. The student uses: consumer."}]},{"term":"Consumer","def":"The person who actually uses the product; may or may not be the one who paid.","hook":"The consumer uses.","asks":[{"q":"A delivery company buys e-bikes for its couriers to ride. Who is the consumer?","right":"The couriers who ride the bikes","wrong":[["The delivery company, because it paid for the bikes and signed the purchase contract","That's the customer."],["The bike maker","That's the seller."],["The battery supplier","That's a supplier."]],"exp":"The consumer is the person who uses the product."},{"q":"A museum buys audio guides that visitors use on tours. Which is correct?","right":"The museum is the customer; visitors are consumers","wrong":[["The visitors are the customers, because they physically hold the devices on tours","They use them but didn't buy them."],["The supplier is the consumer","The supplier sells them."],["The museum is the consumer","The museum paid but doesn't use them."]],"exp":"Customer pays; consumer uses."}]},{"term":"Need","def":"Something essential for survival, such as food, water, shelter or basic healthcare.","hook":"Can't live without it.","asks":[{"q":"Which purchase is best classified as a need?","right":"Basic groceries for the week","wrong":[["Premium imported chocolates bought for the family to enjoy after dinner","Enjoyment items are wants."],["A luxury watch","A want."],["A convertible for weekends","A want."]],"exp":"Needs are essential for survival: food, water, shelter, basic healthcare."},{"q":"A person with no place to live rents a small apartment. How is the apartment classified?","right":"A need","wrong":[["A want, because the person could choose a nicer apartment in a better area instead","Shelter itself is essential."],["A service","Rent is for housing, a need."],["A profit","Not a business term here."]],"exp":"Shelter is a need."}]},{"term":"Want","def":"Something that improves quality of life but is not required to survive, such as entertainment or designer clothes.","hook":"Nice, not necessary.","asks":[{"q":"A commuter who already owns a reliable watch buys a luxury watch for prestige. What is the luxury watch?","right":"A want","wrong":[["A need, because everyone has to know the time to get to work on schedule","He already has a working watch."],["A service","It's a good."],["Value capture","That's a business term."]],"exp":"Wants improve quality of life but aren't necessary."},{"q":"Why would a business care whether its product meets a need or a want?","right":"It shapes how the product is designed and marketed","wrong":[["Because businesses are not allowed by law to sell anything that is only a want","Wants are sold all the time."],["Needs never sell","They do."],["It decides the business structure","Unrelated."]],"exp":"Businesses consider customers' problems, needs and wants when designing and marketing products."}]}],"intro":["A business produces and sells goods (things you can touch) or services (work done for you), in person or online, locally or worldwide. Its goal is usually profit. Two people can be involved in one sale: the customer who buys and the consumer who uses. Businesses also separate needs (essential) from wants (nice to have)."]},{"name":"Value and fit","cards":[{"term":"Problem-solution fit","def":"When a business correctly identifies a customer's pain point, need or want and its offering effectively solves it.","hook":"Real problem, working fix.","asks":[{"q":"Photographers say late payments waste time. A startup's reminder tool takes so long to set up that they stop using it. What does this show?","right":"The problem is real but the fit is weak","wrong":[["The startup has shown strong problem-solution fit because the problem it found is real","A real problem isn't enough; the solution must work."],["The problem was disproved","It's still valid."],["The startup captured value","Nothing was sold."]],"exp":"Problem-solution fit needs a real problem AND a solution that effectively solves it."},{"q":"Which evidence best shows problem-solution fit?","right":"Customers keep using it because it solves their problem","wrong":[["Managers believe customers might dislike the problem the product is meant to solve","A belief isn't evidence."],["The company advertised the product","Advertising isn't evidence."],["The company raised the price","Price isn't evidence of fit."]],"exp":"Repeated use because it works is strong evidence of fit."}]},{"term":"Value creation","def":"The benefit customers receive when a product solves their problem or meets a need or want.","hook":"Made for the customer.","asks":[{"q":"A hotel turns unused lobby space into work pods, saving travelers' time. What is the time saved?","right":"Value creation","wrong":[["Value capture, since the hotel benefits when guests use the new work pods","Capture is the money the hotel earns."],["Profit","No revenue is mentioned."],["A barrier to entry","Unrelated."]],"exp":"Benefits to customers are value creation."},{"q":"A free app saves students hours each week but earns no money. Which is true?","right":"It creates value but captures little","wrong":[["It cannot create any value because it doesn't charge its users anything","Customers still benefit."],["Its users' time savings are its profit","Customer benefits aren't company profit."],["It has captured value","No revenue means little capture."]],"exp":"Value creation can happen without value capture."}]},{"term":"Value capture","def":"The money a business keeps from the benefit it delivers, such as charging more than the product costs to make.","hook":"Taken by the business.","asks":[{"q":"An e-bike costs $800 to make and sells for $1,800. How much value does the company capture per bike?","right":"$1,000","wrong":[["$1,800, which is the full price that customers pay for each of the bikes","Subtract the cost."],["$800","That's the cost."],["$2,600","Subtract, don't add."]],"exp":"Price − cost = $1,800 − $800 = $1,000."},{"q":"A note app is popular for free; it then charges for a pro tier. What does charging represent?","right":"Value capture","wrong":[["Value creation, because users who pay for the pro tier get more storage space","The charge is the business taking value."],["Problem-solution fit","That's about solving the problem."],["A need","Not a business strategy."]],"exp":"Charging for value delivered is value capture."}]},{"term":"Value proposition","def":"A clear statement of how a product solves the customer's problem and why customers should choose it over competitors.","hook":"Why pick us?","asks":[{"q":"\"Cut picking errors and find inventory faster with real-time shelf tracking.\" What is this?","right":"A value proposition","wrong":[["A mission statement, since it explains what the company does for its customers","A mission statement describes the company, not why to choose a product."],["Value capture","No price is involved."],["Profit","No numbers."]],"exp":"It says how the product solves a problem and why to choose it."},{"q":"How does a value proposition differ from problem-solution fit?","right":"One communicates the value; the other is whether it works","wrong":[["A value proposition measures profit, while problem-solution fit measures revenue","Neither is a financial measure."],["They are the same","They differ."],["A value proposition identifies the consumer","Not its job."]],"exp":"A value proposition explains why to choose a product; problem-solution fit is whether it actually solves the problem."}]},{"term":"Product-market fit","def":"When enough customers want a specific offering to make the business viable; your study guide's test is that at least 40% of surveyed users would be \"very disappointed\" if it disappeared.","hook":"Customers would miss it.","asks":[{"q":"A survey finds 48% of users would be \"very disappointed\" if an app disappeared. By your study guide's test, what does this suggest?","right":"Product-market fit","wrong":[["Product failure, because more than half of the users would not be disappointed at all","The guide's benchmark is 40%."],["A need, not a want","Not the test here."],["A barrier to entry","Unrelated."]],"exp":"Your study guide: at least 40% \"very disappointed\" signals product-market fit."},{"q":"Which is the best evidence that a product has product-market fit, not just problem-solution fit?","right":"Enough customers buy it to make the business viable","wrong":[["The product solves the problem it was designed for in early lab tests by engineers","That's problem-solution fit at most."],["The founder likes the product","Opinion isn't evidence."],["The product has many features","Features aren't demand."]],"exp":"Product-market fit means enough demand for the business to be viable."}]},{"term":"Build-measure-learn","def":"A cycle of launching a product, gathering customer feedback and refining it, as Zappos did.","hook":"Launch, listen, improve.","asks":[{"q":"A shoe startup launches a small online store, studies what customers order and return, then changes its selection. Which cycle is this?","right":"Build-measure-learn","wrong":[["The product life cycle, which follows sales through introduction, growth and decline","That's about sales stages, not testing."],["Vertical integration","Unrelated."],["Collusion","Unrelated."]],"exp":"Launch, gather feedback, refine: build-measure-learn (like Zappos)."},{"q":"Why do businesses use build-measure-learn instead of perfecting a product first?","right":"Feedback shows what to fix before investing more","wrong":[["It guarantees that the product will be profitable from the very first day","Nothing guarantees profit."],["It avoids talking to customers","It depends on customer feedback."],["It replaces the need for a product","There's still a product."]],"exp":"Launching, measuring and learning lets a business improve with real feedback."}]},{"term":"Minimum viable product (MVP)","def":"The simplest working version of an offering, with only core features, used to test whether customers want it.","hook":"Simplest version that works.","asks":[{"q":"A software company releases a stripped-down app with only its core feature to test demand. What is it?","right":"An MVP","wrong":[["A minimum marketable product, since it is ready to sell to a large group of customers","An MMP has grown beyond the test version."],["A trademark","That protects a brand."],["A generic product","Unrelated."]],"exp":"An MVP is the simplest working version used to test demand."},{"q":"A startup tests its MVP and customers keep asking for one missing feature. What should it most likely do?","right":"Use the feedback to improve the product","wrong":[["Stop testing, because an MVP is meant to be the final version of the product","An MVP is for learning."],["Ignore the feedback","Feedback is the point."],["Sell the company","Not supported."]],"exp":"MVPs exist to gather feedback and improve."}]},{"term":"Minimum marketable product (MMP)","def":"A version that has grown beyond the first test version and is ready to sell to a larger group of customers.","hook":"Ready for a bigger crowd.","asks":[{"q":"An app has moved past its first test version and is ready for a larger customer group. What is it now?","right":"An MMP","wrong":[["An MVP, because every product stays an MVP until the company earns its first profit","It has evolved beyond the MVP."],["A prototype","It's beyond testing."],["A commodity","Unrelated."]],"exp":"MMP: evolved beyond the MVP and ready for a larger segment."},{"q":"Put these in order: MMP, MVP, idea.","right":"Idea → MVP → MMP","wrong":[["MMP → MVP → idea, starting from the most complete version and working backward","Reversed."],["MVP → idea → MMP","The idea comes first."],["Idea → MMP → MVP","The MVP comes before the MMP."]],"exp":"A product starts as an idea, is tested as an MVP, then grows into an MMP."}]}],"intro":["Every business starts with a customer problem. Problem-solution fit means the product actually solves it. Value creation is the benefit customers get; value capture is the money the business keeps from that benefit. A business has to create value before it can capture any. A value proposition is the statement that explains the value to customers."]},{"name":"The Business Canvas","cards":[{"term":"Business Canvas","def":"A tool for mapping and communicating how a company works through six lenses; the class project on it is assessed on the AP Exam.","hook":"Six-part business map.","asks":[{"q":"Why does your teacher say the six Business Canvas lenses matter beyond the class project?","right":"They are how you analyze case studies on the exam","wrong":[["They are the six PESTEL factors that every business must track in its environment","PESTEL is different."],["They are the six departments of every corporation","Departments are different."],["They are only for nonprofits","They apply to any business."]],"exp":"The six lenses are the same strategic lenses used for case studies."},{"q":"Which list names the six lenses?","right":"Customer, Product, Market, Finance, Operations, Organization","wrong":[["Political, Economic, Social, Technological, Environmental, Legal","That's PESTEL."],["Product, Price, Place, Promotion, People, Profit","Mixes the 4 Ps."],["Sales, R&D, Operations, Accounting, Finance, HR","Those are departments."]],"exp":"Customer, Product, Market, Finance, Operations, Organization."}]},{"term":"Customer lens","def":"Who the business serves and which problems, needs or wants it addresses.","hook":"Who are we serving?","asks":[{"q":"A pet-care company decides whether to serve frequent travelers or owners of elderly pets. Which lens?","right":"Customer","wrong":[["Market, because it is studying the different groups of people who own pets","Market is about competitors and alternatives."],["Product","Not deciding features yet."],["Finance","No money decisions."]],"exp":"Choosing who to serve is the Customer lens."},{"q":"A company studies whether students or working adults are more frustrated by a scheduling problem. Which lens?","right":"Customer","wrong":[["Product, because the company will eventually build a scheduling product for them","This step is about who has the problem."],["Operations","Not about production."],["Organization","Not about staff."]],"exp":"Who has the problem is the Customer lens."}]},{"term":"Product lens","def":"The good or service itself and how it creates value.","hook":"What are we selling?","asks":[{"q":"After choosing its customers, a company decides between video check-ins and GPS walk reports. Which lens?","right":"Product","wrong":[["Customer, because the features are chosen to please the customers it selected","Choosing features is the Product lens."],["Market","Not about rivals."],["Finance","Not about money."]],"exp":"Deciding features and how they create value is the Product lens."},{"q":"A restaurant considers adding mobile ordering to improve its service. Which lens?","right":"Product","wrong":[["Operations, because mobile ordering changes how the kitchen receives each order","The focus is improving what customers get."],["Finance","Not about costs here."],["Market","Not about rivals."]],"exp":"Improving the offering is the Product lens."}]},{"term":"Market lens","def":"The competitive environment: rivals, alternatives and how crowded the field is.","hook":"Who else is out there?","asks":[{"q":"A company compares kennels, pet sitters and other apps that customers might use instead. Which lens?","right":"Market","wrong":[["Customer, because the company is looking at what its customers do today","Comparing alternatives is the Market lens."],["Operations","Not about production."],["Organization","Not about staff."]],"exp":"The competitive environment and alternatives are the Market lens."},{"q":"Managers ask how crowded the field of educational apps is. Which lens?","right":"Market","wrong":[["Product, because the company needs to decide what features its own app should have","That's a different question."],["Finance","Not about money."],["Customer","Not about who the customer is."]],"exp":"Competition is the Market lens."}]},{"term":"Finance lens","def":"How the business earns revenue and manages costs.","hook":"Will the numbers work?","asks":[{"q":"A retailer estimates sales, rent and payroll for a second location. Which lens?","right":"Finance","wrong":[["Operations, because opening a store changes how products get to the customers","The question is whether it can be profitable."],["Market","Not about rivals."],["Customer","Not about who buys."]],"exp":"Revenue and costs are the Finance lens."},{"q":"Management sets profit-margin goals and adjusts prices to meet them. Which lens?","right":"Finance","wrong":[["Product, since prices are part of what the customer sees when they buy","Profit goals are Finance."],["Organization","Not about staff."],["Customer","Not about who buys."]],"exp":"Managing revenue, costs and profit is Finance."}]},{"term":"Operations lens","def":"How the good or service is produced and delivered.","hook":"How does it get made and delivered?","asks":[{"q":"A furniture maker maps each step from design approval to delivery to remove bottlenecks. Which lens?","right":"Operations","wrong":[["Organization, because the company is deciding which team handles each part of the work","This is about the production process."],["Market","Not about rivals."],["Finance","Not about money."]],"exp":"How a product is produced and delivered is Operations."},{"q":"A small company plans how to handle extra holiday orders. Which lens?","right":"Operations","wrong":[["Finance, because extra holiday orders will bring in more revenue for the company","Handling orders is a process question."],["Customer","Not about who buys."],["Product","Not about features."]],"exp":"Producing and delivering is Operations."}]},{"term":"Organization lens","def":"The people, structure and roles needed to run the business.","hook":"Who does what?","asks":[{"q":"A consulting firm grows to 150 people and decides who reports to whom. Which lens?","right":"Organization","wrong":[["Operations, because the firm needs to decide how the work gets done each day","Reporting structure is Organization."],["Market","Not about rivals."],["Finance","Not about money."]],"exp":"People, structure and roles are the Organization lens."},{"q":"A business considers hiring a regional manager to oversee several stores. Which lens?","right":"Organization","wrong":[["Customer, because a regional manager would help keep customers happy in each store","Hiring and structure are Organization."],["Product","Not about features."],["Finance","Not about money."]],"exp":"Roles and structure are Organization."}]}],"intro":["The Business Canvas is a tool for mapping a business model, and its six lenses are also the six ways you will analyze every case study in this course. Questions often describe one activity and ask which lens it belongs to."]}],"intro":["Topic 1.1 sets up the whole course: what a business is, who it serves, and how it makes money. The big idea is the difference between creating value for customers and capturing value for the business."]},{"id":2,"name":"Markets and Competitive Advantage (1.2)","optional":false,"sections":[{"name":"Markets and prices","cards":[{"term":"Market","def":"Any physical or virtual space where sellers and buyers interact to exchange goods or services.","hook":"Where buyers meet sellers.","asks":[{"q":"Which of these is NOT a market?","right":"A household where parents assign chores","wrong":[["An app store where developers sell games to people with smartphones around the world","A virtual marketplace is a market."],["A farmers market","Buyers and sellers meet there."],["eBay","An online marketplace."]],"exp":"A market is any physical or virtual space where buyers and sellers exchange."},{"q":"An online platform lets students buy and sell used textbooks. What makes it a market?","right":"Buyers and sellers interact to exchange","wrong":[["It is owned by a corporation that sells shares of stock to investors","Ownership doesn't make a market."],["It has a physical location","Markets can be virtual."],["Prices are set by the government","Not required, and not true here."]],"exp":"Interaction of buyers and sellers is what makes a market."}]},{"term":"Voluntary exchange","def":"A trade both buyer and seller agree to because each expects to be better off.","hook":"Both sides win or no deal.","asks":[{"q":"A shopper pays $40 for a backpack she values more than $40; the seller would rather have the $40. What is this?","right":"Voluntary exchange","wrong":[["Collusion, since both the buyer and the seller agreed on the price ahead of time","Collusion is between competing sellers."],["A shortage","Nothing is scarce."],["Price gouging","No emergency."]],"exp":"Both sides trade willingly because each expects to be better off."},{"q":"Which situation is NOT voluntary exchange?","right":"A law requires every household to buy a service","wrong":[["A customer buys coffee because she'd rather have the coffee than keep her $5","Both sides choose to trade."],["A store sells shoes to a willing buyer","Both choose."],["A student sells an old bike to a friend","Both choose."]],"exp":"Being forced to buy isn't voluntary."}]},{"term":"Equilibrium price","def":"The level where the quantity buyers want equals the quantity sellers offer, so there is no shortage or surplus.","hook":"Also called the market price.","asks":[{"q":"At $90, buyers want 5,000 sneakers and sellers offer 5,000. What is $90?","right":"The equilibrium price","wrong":[["A surplus price, because sellers are producing more sneakers than buyers want","Quantities are equal."],["A shortage price","Quantities are equal."],["A limit price","That's a barrier strategy."]],"exp":"Where quantity demanded equals quantity supplied is equilibrium."},{"q":"Who sets the price in a competitive market?","right":"Buyers and sellers together","wrong":[["The seller alone, based on how much profit it wants to earn on each sale","Sellers can't ignore buyers."],["The government","Not in a competitive market."],["The largest buyer","No single buyer sets it."]],"exp":"In competitive markets, the interaction of buyers and sellers sets the price."}]},{"term":"Shortage","def":"Quantity demanded is greater than quantity supplied, so buyers compete and the price rises.","hook":"Too few for the buyers.","asks":[{"q":"At the current price, fans want 1,800 concert tickets but only 1,200 are offered. What is likely?","right":"A shortage pushes the price up","wrong":[["A surplus pushes the price down as sellers compete for the buyers that remain","Buyers want more than is offered."],["The market is at equilibrium","The quantities differ."],["Sellers leave the market","Not likely."]],"exp":"Quantity demanded > supplied is a shortage; buyers compete and the price rises."},{"q":"Fresh strawberries sell out faster than shipments arrive. What do stores face?","right":"A shortage","wrong":[["A surplus, because the farm keeps harvesting more strawberries than usual","Shelves are empty."],["Equilibrium","Demand exceeds supply."],["Collusion","Unrelated."]],"exp":"Buyers want more than is available."}]},{"term":"Surplus","def":"Quantity supplied is greater than quantity demanded, so sellers compete and the price falls.","hook":"Too many for the buyers.","asks":[{"q":"At $90, buyers want 5,000 pairs of sneakers but sellers offer 7,500. What happens?","right":"A surplus; the price falls","wrong":[["A shortage; the price rises because buyers compete for the limited sneakers","Sellers offer more than buyers want."],["Nothing changes","The market isn't at equilibrium."],["The government sets a new price","Not in a competitive market."]],"exp":"Quantity supplied > demanded is a surplus; sellers compete and the price falls."},{"q":"As the price falls during a surplus, what happens?","right":"Buyers want more and sellers offer less","wrong":[["Buyers want less and sellers offer more, making the surplus even bigger","Reversed."],["Both want more","Sellers offer less at a lower price."],["Nothing changes","Quantities adjust."]],"exp":"A falling price raises quantity demanded and lowers quantity supplied until the surplus disappears."}]}],"intro":["A market is anywhere buyers and sellers meet, from a farmers market to Amazon. Trades are voluntary, so both sides expect to gain. Buyers want low prices and sellers want high ones; together they settle on a market (equilibrium) price. When buyers want more than sellers offer there is a shortage, and the price rises; when sellers offer more than buyers want there is a surplus, and the price falls. You don't need to draw graphs, just explain the direction."]},{"name":"Competitive advantage","cards":[{"term":"Competitive advantage","def":"A business's ability to outperform rivals in the same market, leading to greater market share and profit.","hook":"Why customers pick you.","asks":[{"q":"A local coffee shop adds mobile ordering, faster service and rewards while rivals sell similar coffee at similar prices. What is it doing?","right":"Building a competitive advantage through experience","wrong":[["Creating a legal barrier to entry that stops new coffee shops from opening nearby","No legal barrier is described."],["Becoming a price taker","It isn't competing on price."],["Eliminating voluntary exchange","Customers still choose."]],"exp":"Differentiating the customer experience is a source of competitive advantage."},{"q":"72% of a smartwatch maker's buyers say they chose it for exclusive features, and only 14% for price. What is its main advantage?","right":"Unique features customers will pay more for","wrong":[["Lower production costs than every rival, which lets it sell at the lowest price","Price isn't why most people buy."],["Its location","Not mentioned."],["Government protection","Not mentioned."]],"exp":"Its advantage is differentiation through features."}]},{"term":"Commodities","def":"Products that are nearly identical no matter who sells them, such as wheat, corn or eggs.","hook":"Same stuff, any seller.","asks":[{"q":"A tomato farmer sells tomatoes nearly identical to hundreds of other farms. What is the best path to an advantage?","right":"Producing efficiently at lower cost","wrong":[["Charging much more, since customers can't find tomatoes anywhere else in town","There are many substitutes."],["Controlling the market price","Commodity sellers can't."],["Running national TV ads about its tomatoes' brand","Branding works poorly for identical products."]],"exp":"With commodities, efficiency and low cost are the main advantage."},{"q":"Which product is the best example of a commodity?","right":"Wheat","wrong":[["A smartphone with a patented camera that no other brand is allowed to use","That's differentiated."],["A designer handbag","Differentiated."],["A restaurant meal","Differentiated."]],"exp":"Commodities are nearly identical regardless of seller."}]},{"term":"Differentiated products","def":"Goods or services with unique features that set them apart from rivals.","hook":"Different on purpose.","asks":[{"q":"Gyms in a city compete on equipment, classes, atmosphere and trainers. What are they selling?","right":"Differentiated products","wrong":[["Commodities, because every gym basically offers a place to exercise and lift weights","They compete on differences."],["Monopoly services","There are many gyms."],["Public goods","Unrelated."]],"exp":"Products with features that set them apart are differentiated."},{"q":"Why can a lighting company with a patented \"Smart-Dim\" feature charge $500 for a unit that costs $150 to make?","right":"Its product is highly differentiated","wrong":[["Its customers are consumers who don't care how much they pay for their lighting","The developers are customers who do care."],["Prices in competitive markets equal production costs","Not true."],["Voluntary exchange benefits only the seller","Both sides benefit."]],"exp":"A unique product reduces the pull of rival products."}]},{"term":"Low-cost strategy","def":"Competing by producing efficiently and charging the lowest price, the usual path when products are identical.","hook":"Cheapest wins.","asks":[{"q":"Walmart and Costco often compete by doing what?","right":"Lowering costs and offering lower prices","wrong":[["Offering the most exclusive luxury products in the market at premium prices","That's the opposite."],["Avoiding competition","They compete."],["Selling only online","Not their strategy."]],"exp":"Your notes list Walmart and Costco as low-cost competitors."},{"q":"Which business is most likely to rely on a low-cost strategy?","right":"A corn farm","wrong":[["A luxury watchmaker that hand-assembles each watch for collectors","That's high-quality differentiation."],["A custom jeweler","Differentiated."],["A patented drug maker","Protected by a patent."]],"exp":"Identical products push firms toward low-cost competition."}]},{"term":"Market share","def":"The percentage of total sales in an industry controlled by one firm or brand; a bigger slice usually means more control over price.","hook":"Your slice of the pie.","asks":[{"q":"ActiveTech sells 8.0 million watches in a market of 20 million. What is its market share?","right":"40%","wrong":[["8%, since ActiveTech sold eight million of the watches during the year","Divide by the total."],["20%","That's not its share."],["60%","That's everyone else."]],"exp":"8.0 ÷ 20 = 40%."},{"q":"Total smartwatch sales rise 8% next year but Pulse sells the same 3.6 million watches. What happens to Pulse's market share?","right":"It falls","wrong":[["It rises, because the whole market for smartwatches is growing larger","Pulse's slice stays the same size while the pie grows."],["It stays the same","The total grew."],["It doubles","Not supported."]],"exp":"Same sales in a bigger market means a smaller share."}]}],"intro":["Competitive advantage is whatever makes customers choose you over rivals, which brings more market share and profit. With identical products (commodities) firms win by being efficient and cheap. With differentiated products they win with quality, features, service, branding or marketing."]},{"name":"Barriers to entry","cards":[{"term":"Barriers to entry","def":"Obstacles that make it difficult or impossible for new firms to enter a market and compete.","hook":"Keep-out signs.","asks":[{"q":"Two of three new smartwatch startups quit after failing to raise enough money for product development. What is discouraging entry?","right":"The high cost of developing comparable technology","wrong":[["Strong demand for smartwatches, which is expected to grow next year","Growing demand attracts entry."],["Customers having many brands to choose from","That's not what stopped them."],["Low prices","Not the reason given."]],"exp":"Large development costs are a barrier to entry."},{"q":"Why do barriers to entry help existing firms?","right":"They keep new competitors out","wrong":[["They force existing firms to lower prices to match every new competitor that arrives","They keep competitors out."],["They guarantee customers will buy","Nothing guarantees that."],["They lower production costs","Not their purpose."]],"exp":"Barriers protect existing firms from new rivals."}]},{"term":"High startup costs","def":"A barrier where entering requires huge spending before the first sale, such as buying aircraft to start an airline.","hook":"Too expensive to start.","asks":[{"q":"A new airline must spend billions on planes, gates and safety approvals before its first flight. What is this?","right":"A barrier to entry","wrong":[["Product differentiation, because every airline offers a different flying experience","The point is the cost of entering."],["Voluntary exchange","Unrelated."],["Equilibrium","Unrelated."]],"exp":"Huge upfront costs are a barrier to entry."},{"q":"Which industry most likely has the highest startup-cost barrier?","right":"Building a new airline","wrong":[["Opening a dog-walking service in a neighborhood with lots of dog owners","Low startup cost."],["Tutoring","Low startup cost."],["Selling crafts online","Low startup cost."]],"exp":"Airlines require billions before carrying a passenger."}]},{"term":"Control of resources","def":"A barrier where one firm owns or locks up key raw materials or suppliers, for example through exclusive supplier contracts.","hook":"Can't get the inputs.","asks":[{"q":"A company signs exclusive contracts with every major supplier of a special glass. A startup can't find glass. What blocks the startup?","right":"A barrier from control of resources","wrong":[["Lack of problem-solution fit, since the startup's lights don't solve any problem","The problem is supply access."],["A government regulation","No law is involved."],["Its decision to differentiate","That's not what blocks it."]],"exp":"Locking up key suppliers is a barrier to entry."},{"q":"FreshLock signs an exclusive deal with the only domestic supplier of a special seal material. What does this create?","right":"A barrier to entry","wrong":[["A shortage of food-storage containers that raises prices across the whole industry","The point is blocking rivals."],["A patent","A patent is separate."],["Voluntary exchange","Unrelated."]],"exp":"Controlling a key input keeps rivals out."}]},{"term":"Patent","def":"Legal protection giving an inventor exclusive rights to an invention for a limited time, which encourages innovation.","hook":"Temporary exclusive rights.","asks":[{"q":"A drug company receives a patent on a new medicine. What does it most directly do?","right":"Stops rivals from making it for a time","wrong":[["Guarantees that patients and doctors will choose the drug over all alternatives","Demand isn't guaranteed."],["Eliminates production costs","Costs remain."],["Makes the drug a commodity","The opposite."]],"exp":"A patent gives temporary exclusive rights to an invention."},{"q":"If a water-filter startup gets a patent before launch, what is most likely in the first few years?","right":"Temporary protection from copies","wrong":[["It becomes the only company allowed to sell any household water product at all","A patent covers its own invention only."],["It can charge any price without affecting demand","Demand still responds."],["It never needs to improve the product","Innovation still matters."]],"exp":"Patents protect the specific invention for a limited time."}]},{"term":"Trademark","def":"Legal protection for a brand name, logo or symbol.","hook":"Protects the brand mark.","asks":[{"q":"A company registers its sunburst logo with the government. What protection is this?","right":"A trademark","wrong":[["A patent, since the logo was invented by the company's own design team","Patents protect inventions."],["A copyright","Copyright protects creative works like books."],["An exclusive agreement","That's a supplier contract."]],"exp":"Trademarks protect brand names and logos."},{"q":"Why might a rival be stopped from using a nearly identical swoosh logo?","right":"The original logo is trademarked","wrong":[["The original company owns a patent on athletic shoes as an invention","Logos are trademarks."],["Copying logos is collusion","Collusion is price agreements."],["It's a natural monopoly","Unrelated."]],"exp":"Trademark law protects brand marks."}]},{"term":"Copyright","def":"Legal protection for creative works such as books, music or software.","hook":"Protects creative work.","asks":[{"q":"A game studio's code and music are protected from copying. Which protection covers creative works like these?","right":"Copyright","wrong":[["Patent, because video games are new inventions that took years to develop","Patents cover inventions; creative works are copyrighted."],["Trademark","That's for brand marks."],["A license","That's government permission to sell."]],"exp":"Copyright protects creative works."},{"q":"Which of these is protected by copyright, not a patent?","right":"A novel","wrong":[["A new kind of engine invented by a car company's engineering team","That's a patent."],["A medicine formula","Patent."],["A brand logo","Trademark."]],"exp":"Creative works are copyrighted."}]},{"term":"Limit pricing","def":"Keeping prices low enough that a new rival cannot enter profitably.","hook":"Too cheap to compete with.","asks":[{"q":"A dominant firm keeps prices low enough that no newcomer could earn a profit. What is this?","right":"Limit pricing","wrong":[["Penetration pricing, since the firm is keeping its prices low to win market share","Penetration is a newcomer's low entry price."],["Collusion","No agreement between rivals."],["Price gouging","That's high prices in emergencies."]],"exp":"Low prices that block profitable entry are limit pricing."},{"q":"Why is limit pricing listed as a barrier to entry?","right":"Newcomers can't enter profitably","wrong":[["It forces the government to give the company a patent on its low prices","Prices aren't patented."],["It raises prices","It keeps them low."],["It creates shortages","Not its effect."]],"exp":"Very low prices make entry unprofitable."}]},{"term":"Vertical integration","def":"Controlling several stages of production and distribution, as Apple does.","hook":"Own more of the chain.","asks":[{"q":"Apple designs its chips, software and phones and runs its own stores. What is this?","right":"Vertical integration","wrong":[["Outsourcing, because Apple hires other firms to handle each part of the process","Apple controls the stages itself."],["Collusion","Unrelated."],["A monopoly","Apple has rivals."]],"exp":"Controlling several stages of production and distribution is vertical integration."},{"q":"A coffee chain buys its own farms and roasting plants. What advantage might this give?","right":"More control over supply and quality","wrong":[["It removes all competition from the coffee market for the next ten years","Too extreme."],["It turns coffee into a commodity","Not the effect."],["It ends voluntary exchange","Unrelated."]],"exp":"Owning more stages gives control over supply, quality and costs."}]}],"intro":["Barriers to entry are obstacles that keep new firms out, protecting the businesses already there. They include high startup costs, geography, control of raw materials, and legal protections like patents."]},{"name":"Market structures","cards":[{"term":"Perfect competition","def":"Many small firms sell identical products, have no control over price (price takers) and face almost no barriers; example: wheat farms.","hook":"Many sellers, same product.","asks":[{"q":"Hundreds of farms sell identical wheat, have no control over price and can enter easily. Which structure?","right":"Perfect competition","wrong":[["Oligopoly, because wheat farms often sell to a few very large food companies","There are hundreds of sellers."],["Monopoly","Many sellers."],["Monopolistic competition","Products are identical."]],"exp":"Many firms, identical products, no price control: perfect competition."},{"q":"Why is cost efficiency most important in perfect competition?","right":"Firms can't raise prices, so they must cut costs","wrong":[["Firms can charge whatever they like because their product is unique","Products are identical."],["Advertising works best there","Identical products gain little."],["The government sets profits","Not true."]],"exp":"Price takers compete on cost."}]},{"term":"Monopolistic competition","def":"Many firms sell differentiated products, have some control over price and face low barriers; examples: restaurants, gyms, hair salons.","hook":"Many sellers, different products.","asks":[{"q":"Many restaurants compete with different menus, atmospheres and service. Which structure?","right":"Monopolistic competition","wrong":[["Perfect competition, since there are so many restaurants that no one controls price","Products are differentiated."],["Oligopoly","Many firms, not a few."],["Monopoly","Many firms."]],"exp":"Many firms with differentiated products: monopolistic competition."},{"q":"Which is a correct pairing?","right":"Monopolistic competition: many firms, differentiated products","wrong":[["Oligopoly: many small firms selling identical products with no barriers","That's perfect competition."],["Monopoly: many firms","One firm."],["Perfect competition: one firm","Many firms."]],"exp":"Many firms selling differentiated products."}]},{"term":"Oligopoly","def":"A few large firms dominate, have a lot of control over price but depend on each other's moves, and face high barriers; examples: airlines, smartphones, soda.","hook":"A few giants.","asks":[{"q":"Four airlines carry nearly all passengers, and starting an airline costs billions. Which structure?","right":"Oligopoly","wrong":[["Monopolistic competition, because each airline offers a slightly different experience","A few dominant firms with high barriers is oligopoly."],["Perfect competition","Few firms."],["Monopoly","More than one firm."]],"exp":"A few large firms and high barriers: oligopoly."},{"q":"Which feature best separates an oligopoly from monopolistic competition?","right":"A few large firms dominate behind high barriers","wrong":[["Firms in the market sell products to consumers and try to earn a profit","True of both."],["Firms advertise","Both advertise."],["Products are sold online","Unrelated."]],"exp":"Few dominant firms and significant barriers mark an oligopoly."}]},{"term":"Monopoly","def":"One firm sells a unique product with no close substitutes and is protected by high barriers; examples: local utilities, patented drugs.","hook":"Only one seller.","asks":[{"q":"A city lets one company provide water because building rival pipe systems would be wasteful. Which structure?","right":"Monopoly","wrong":[["Oligopoly, since a few water companies often serve the larger cities nearby","Only one firm is allowed here."],["Perfect competition","One firm."],["Monopolistic competition","One firm."]],"exp":"One firm with no close substitutes: monopoly (a local utility)."},{"q":"If new firms were allowed to enter a monopoly market, what would most likely happen?","right":"Prices and the monopolist's profits would fall","wrong":[["Prices would rise because the new firms would add to the total costs of the market","Competition pushes prices down."],["Nothing would change","Competition changes things."],["The monopolist's profits would rise","They'd fall."]],"exp":"More competition lowers prices and profits."}]},{"term":"Price taker","def":"A firm that must accept the going rate because buyers can get an identical product elsewhere; if it charges more it sells nothing.","hook":"Takes the price it's given.","asks":[{"q":"A wheat farmer sets a price above the market price. What happens to her sales?","right":"They drop to zero","wrong":[["They rise, because a higher price makes buyers think the wheat is better quality","The wheat is identical."],["They stay the same","Buyers switch."],["They double","No."]],"exp":"Buyers get identical wheat elsewhere at the market price."},{"q":"Which firm is most likely a price taker?","right":"One of hundreds of corn farms","wrong":[["The only electric company in a city, which is allowed to serve every household","A monopoly sets its price."],["A patented drug maker","It has pricing power."],["A luxury brand","It has pricing power."]],"exp":"Firms in perfect competition are price takers."}]},{"term":"Collusion","def":"An agreement between firms to coordinate prices or output instead of competing; hard to keep in competitive markets because firms have reasons to cheat.","hook":"Rivals secretly cooperating.","asks":[{"q":"Several airlines secretly agree to charge the same high fare. What is this?","right":"Collusion","wrong":[["Competitive pricing, since all of the airlines ended up charging the same fare","They agreed instead of competing."],["Price gouging","No emergency."],["Penetration pricing","Not a low entry price."]],"exp":"Agreeing on prices instead of competing is collusion."},{"q":"Why is collusion hard to keep up in a market with many firms?","right":"Each firm can gain by cheating with lower prices","wrong":[["The government requires all firms in a market to charge exactly the same price","Not true."],["Customers prefer higher prices","No."],["Barriers are too high","Competitive markets have low barriers."]],"exp":"With many firms and low barriers, coordination is hard and cheating pays."}]}],"intro":["Markets fall on a spectrum from many small firms to one firm. Four structures to know: perfect competition (many firms, identical products, no control over price), monopolistic competition (many firms, differentiated products, some control), oligopoly (a few large, interdependent firms, high barriers) and monopoly (one firm, unique product, high barriers)."]}],"intro":["Topic 1.
