priced), inventory and customer service. When inventory runs too low to fill orders, the result is a stockout and lost sales."]},{"name":"Strategy, risk and scale","cards":[{"term":"Low-price leadership","def":"A supply chain strategy built on mass production, economies of scale and efficient processes to charge the least.","hook":"Cheapest to make, cheapest to sell.","asks":[{"q":"A company uses mass production, economies of scale and process optimization. Which strategy?","right":"Low-price leadership","wrong":[["High-quality differentiation, since its efficient processes produce better products","That uses premium materials."],["Artisan production","The opposite."],["Penetration pricing","A pricing tactic, not a supply chain strategy."]],"exp":"Mass production and efficiency support low prices."},{"q":"Which company best fits low-price leadership?","right":"A discount store with huge volume and lean operations","wrong":[["A watchmaker using rare metals and hand-assembly for each piece it sells","Differentiation."],["A custom jeweler","Artisan."],["A boutique bakery","Small scale."]],"exp":"Scale and efficiency drive low prices."}]},{"term":"High-quality differentiation","def":"A supply chain strategy built on premium resources, precision and durability.","hook":"Best materials, best product.","asks":[{"q":"A laptop maker sources premium liquid-cooling parts to have the fastest machines. Which strategy?","right":"High-quality differentiation","wrong":[["Low-price leadership, since faster machines help the company sell more laptops","It's about premium quality."],["Limit pricing","Unrelated."],["Outsourcing","It's still about quality."]],"exp":"Premium resources and precision support differentiation."},{"q":"Which supply chain choice fits high-quality differentiation?","right":"Paying more for durable premium materials","wrong":[["Switching to the cheapest available materials to cut the price of each product","That's low-price leadership."],["Removing inspections","Hurts quality."],["Mass-producing identical units","Low-price."]],"exp":"Premium resources, precision and durability."}]},{"term":"Supply chain risks","def":"Events that raise costs or delay delivery, such as natural disasters, political instability, trade wars, resource shortages, production errors and problems with vendors.","hook":"What can break the chain.","asks":[{"q":"A laptop maker's shipping costs from South Korea rise due to new rules on cargo ships. This is:","right":"A supply chain risk","wrong":[["A strength of its mass-production process, which lowers the cost of each laptop","It's a risk, not a strength."],["Its corporate structure","Unrelated."],["Its operations expertise","Unrelated."]],"exp":"External changes that raise costs or delay delivery are supply chain risks."},{"q":"Which is most likely to delay deliveries and threaten a firm's advantage?","right":"Political instability where materials are sourced","wrong":[["Rising household incomes in the local market where the company sells products","That raises demand."],["A new vision statement","Internal."],["Choosing an LLC structure","Internal."]],"exp":"Political instability is a supply chain risk."}]},{"term":"Scaling operations","def":"Expanding capacity to produce and deliver more while keeping or improving efficiency.","hook":"Grow without slowing down.","asks":[{"q":"A laptop maker moves from hand-assembly to automated lines and its cost per unit falls. What did it do?","right":"Scaled its operations","wrong":[["Moved toward an artisan process in order to offer customers more customization","The opposite."],["Eliminated its finance department","Unrelated."],["Followed a hand-made trend","The opposite."]],"exp":"Scaling expands capacity while improving efficiency."},{"q":"How can scaling create a barrier to entry?","right":"New firms can't match the low costs","wrong":[["It makes the government stop new firms from entering the market legally","Not a legal barrier."],["It raises prices for everyone","It lowers costs."],["It ends competition forever","Too strong."]],"exp":"Newcomers lack the scale to match established costs."}]},{"term":"Economies of scale","def":"Lower cost per unit from producing more, because fixed costs are spread over more units.","hook":"Bigger, cheaper per unit.","asks":[{"q":"Why does producing 1 million units often cost less per unit than producing 1,000?","right":"Fixed costs are spread over more units","wrong":[["Workers are paid less per hour when the factory makes a larger number of units","Not the reason."],["Materials are free in bulk","Not free."],["Taxes disappear","No."]],"exp":"Spreading fixed costs lowers cost per unit."},{"q":"A large chain and a single shop sell the same product. Rising ingredient costs hurt the shop more. Why?","right":"The chain buys in volume and spreads costs","wrong":[["The single shop pays a special tax that only small businesses have to pay","Not stated."],["The chain doesn't buy ingredients","It does."],["The shop has more customers","Not the reason."]],"exp":"Scale gives large firms cost advantages."}]},{"term":"Exclusive agreements","def":"Contracts that stop suppliers from selling to rivals, creating a barrier to entry.","hook":"Suppliers locked in.","asks":[{"q":"A laptop maker signs a 3-year deal stopping its cooling supplier from selling to rivals. What does this create?","right":"A barrier to entry","wrong":[["Lower quality, since the supplier will stop improving its cooling systems","Not supported."],["A switch to a service model","No."],["A new corporate structure","No."]],"exp":"Exclusive agreements limit rivals' access to key parts."},{"q":"Why might a new rival struggle when an established firm has exclusive supplier contracts?","right":"It can't get the parts it needs","wrong":[["It lacks problem-solution fit because customers don't want the product","Not the issue."],["It didn't write a mission statement","Unrelated."],["It chose differentiation","Unrelated."]],"exp":"Locked-up suppliers block rivals."}]},{"term":"Restrictive distribution","def":"Limiting which retailers carry competitors' products, creating a barrier to entry.","hook":"Shelves locked in.","asks":[{"q":"A soda giant pushes stores to keep rival drinks off its coolers. Which barrier is this?","right":"Restrictive distribution","wrong":[["An exclusive agreement with suppliers, since it controls who makes the soda","This limits retailers, not suppliers."],["A patent","Unrelated."],["Limit pricing","Unrelated."]],"exp":"Limiting which retailers carry rivals is restrictive distribution."},{"q":"How does restrictive distribution hurt a new brand?","right":"It can't reach customers through stores","wrong":[["It raises the new brand's production costs by making materials more expensive","That's a supplier issue."],["It gives the brand a patent","No."],["It lowers its prices","Unrelated."]],"exp":"Blocked retail access keeps rivals off shelves."}]},{"term":"Globalization","def":"The growing connection between countries through trade, technology, communication and the movement of people, goods and money.","hook":"The world is connected.","asks":[{"q":"Students check clothing labels and find items made in Vietnam, Bangladesh and Mexico. What does this show?","right":"Globalization","wrong":[["Vertical integration, because one company made every item from start to finish","Unrelated."],["A recession","Unrelated."],["Collusion","Unrelated."]],"exp":"Goods made worldwide reflect global connections."},{"q":"Why does Ford use a global supply chain?","right":"Different regions make certain parts cheaper or better","wrong":[["The law requires automakers to buy every part from a different country","No such law."],["It removes all risk","It adds risk."],["It avoids mass production","It supports it."]],"exp":"Specialization lowers costs and improves access to inputs."}]},{"term":"Globalization trade-offs","def":"Benefits include more variety and lower prices; costs include lost jobs in industries that can't compete with imports and fragile, interdependent supply chains.","hook":"Winners and losers.","asks":[{"q":"Which is a disadvantage of globalization?","right":"Job losses in industries that can't compete with imports","wrong":[["A wider variety of goods and services available to consumers at home","An advantage."],["Lower prices","An advantage."],["Growth in some industries","An advantage."]],"exp":"Globalization creates winners and losers."},{"q":"Why can globalization make supply chains fragile?","right":"Countries depend on each other for inputs","wrong":[["Because global trade is illegal in most countries and can be stopped at any time","Not true."],["Because it raises prices","It usually lowers them."],["Because it reduces variety","It increases variety."]],"exp":"Interdependence means one disruption can spread."}]}],"intro":["Supply chains can create competitive advantage: low-price leadership through mass production and efficiency, or high-quality differentiation through premium materials and precision. They also face risks such as disasters, political instability, trade wars and supplier problems. Growing efficiently (scaling) lowers costs and can itself become a barrier to entry, as can exclusive agreements and control of distribution."]}],"intro":["Topic 1.8 follows a product from raw materials to the customer. Businesses choose how to produce (by hand or mass production), manage risks that can break the chain, and use their supply chains to compete on price or quality."]}],"sq":[],"flows":[{"id":"F1","title":"How a business idea becomes a business","deck":4,"steps":["Observe, interview, survey (find a real problem)","Validate: test, get feedback, iterate","Develop the solution","Build an MVP","Grow into an MMP and launch"]},{"id":"F2","title":"How a shortage fixes itself","deck":2,"steps":["Buyers want more than sellers offer (shortage)","Buyers compete, so the price rises","Quantity demanded falls, quantity supplied rises","The market moves to the equilibrium price"]},{"id":"F3","title":"How a surplus fixes itself","deck":2,"steps":["Sellers offer more than buyers want (surplus)","Sellers compete, so the price falls","Quantity demanded rises, quantity supplied falls","The market moves to the equilibrium price"]},{"id":"F4","title":"A product supply chain","deck":8,"steps":["Raw materials","Suppliers","Manufacturers","Distributors and wholesalers","Retailers","Consumers"]}],"trees":["WHERE BUSINESS IDEAS GO\nProblem (observe, interview, survey)\n└─ Validation (test → feedback → iterate)\n   └─ Solution development\n      └─ MVP (functional → reliable → usable → engaging)\n         └─ MMP (ready for a larger group)","BUSINESS STRUCTURES BY LIABILITY\nUnlimited liability\n├─ Sole proprietorship (one owner)\n└─ Partnership (two or more owners)\nLimited liability\n├─ LLC (members; flexible; no stock)\n└─ Corporation (shareholders; board; sells stock)\n   ├─ C-corporation (double taxation)\n   └─ S-corporation (pass-through; ≤100 shareholders)"],"tables":[{"title":"The four market structures","rows":[["Structure","Number of firms","Product","Control over price","Barriers to entry","Examples"],["Perfect competition","Many small firms","Identical","None (price takers)","None or very low","Wheat, corn, soybeans"],["Monopolistic competition","Many firms","Differentiated","Some","Low","Restaurants, gyms, hair salons"],["Oligopoly","Few large firms","Identical or differentiated","A lot, but firms depend on each other","High","Airlines, smartphones, soda"],["Monopoly","One firm","Unique","Total","High","Local utilities, patented drugs"]]},{"title":"Business structures","rows":[["Structure","Owners","Liability","Management","Access to funds"],["Sole proprietorship","One owner","Unlimited","Owner decides everything","Very limited (savings, credit)"],["Partnership","Two or more","Usually unlimited","Shared by partners","Limited to moderate"],["LLC","One or more members","Limited","Flexible","Moderate; investors but no stock"],["Corporation","Shareholders","Limited","Executives under a board of directors","Greatest; sells stock"]]},{"title":"PESTEL at a glance","rows":[["Factor","What it covers","Example"],["Political","Government actions and policies","Tax credit for solar panels; tariffs"],["Economic","How the economy is doing","Inflation; interest rates rising from 4% to 7%"],["Social","Trends in society and culture","More people want high-protein meals"],["Technological","New technology available to everyone","A new food-delivery platform; automation"],["Environmental","Nature and environmental concerns","Floods; heat waves; green attitudes"],["Legal","Specific laws a business must follow","Labeling rules; recycling requirements"]]},{"title":"Departments and what they do","rows":[["Department","Job","Typical task"],["Sales and marketing","Win and keep customers","Ad campaign; find a new target market"],["R&D","Design and improve products","Test an improved version"],["Operations","Produce and deliver","Schedule production; fix late deliveries"],["Accounting","Record the money","Prepare financial statements"],["Finance","Plan the money","Decide whether to borrow for a $2M expansion"],["Human resources","People","Hire 75 tutors; plan training"]]},{"title":"Three kinds of organization","rows":[["Type","Goal","Example"],["For-profit","Profit for owners","Walmart, Apple"],["Social enterprise","Profit plus social or environmental goals","Patagonia, TOMS"],["Nonprofit","Public good; surplus reinvested by law","Red Cross, Habitat for Humanity"]]}],"watch":[{"deck":1,"text":"Product-market fit has two definitions in your materials. Your study guide: at least 40% of surveyed users would be \"very disappointed\" if the product disappeared. Your Unit 2 slides and notes: there is enough customer demand to make the business viable. Know both; they describe the same idea."},{"deck":1,"text":"Value capture is described two ways: \"charging above the cost of production\" (study guide) and \"earning revenue and profit from the value created\" (slides). On a number question, value captured per unit = price − cost."},{"deck":2,"text":"The candy simulation chart in your scan is hard to read next to \"Oligopoly.\" Your 1.2 slides and quiz agree: oligopolies have HIGH barriers to entry; monopolistic competition has LOW barriers."},{"deck":3,"text":"Your 1.3 slides label regulators checking Tesla's self-driving software as a political factor, but by the slides' own definitions (political = policy priorities, legal = specific laws and regulations) it reads as legal. If a test question gives both choices, look for clues: a new law or rule a firm must follow is legal; a government's priorities or policy choices are political."},{"deck":3,"text":"A company's own new technology or hire is not a PESTEL factor (your slides' Tesla battery example and practice test question 14)."},{"deck":4,"text":"The 1.4 slides could not be opened, so this deck comes only from your one-page study guide. VERIFY anything your teacher added in class."},{"deck":5,"text":"Your study guide lists only for-profit and nonprofit organizations; the 1.5 slides add social enterprises (profit plus a social or environmental goal). Know all three."},{"deck":6,"text":"There are no 1.6 Ethics slides in your Drive; this deck comes from the study guide and the ethics questions on your practice test. VERIFY anything your teacher added."},{"deck":7,"text":"Your slides teach four structures (sole proprietorship, partnership, LLC, corporation). Your study guide also splits corporations into C-corporations (double taxation) and S-corporations (pass-through, at most 100 shareholders)."},{"deck":8,"text":"Your study guide names the chain sourcing → manufacturing → warehousing → logistics → consumption; your slides name the businesses (raw materials → suppliers → manufacturers → distributors/wholesalers → retailers). Same chain, different labels."}],"practice":{"sections":[{"name":"Set A: Markets, PESTEL and new ideas (1.1-1.4)","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"A1":{"title":"Pumpkin bread at the fall fair","attr":"Practice scenario: a market with a fixed number of sellers.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Five bakeries sell pumpkin bread at a weekend fair. Each loaf is nearly the same. Over the morning, the bakeries tracked how many loaves people wanted at each price."],"table":[["Price per loaf","Loaves buyers want","Loaves bakeries offer"],["$4","300","150"],["$6","220","220"],["$8","140","290"]]},"A2":{"title":"Snack subscription box","attr":"Practice scenario: a new company.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["SnackDrop mails a monthly box of healthy snacks to college students. Most boxes are bought by parents as gifts. To test the idea, the founder first shipped 40 hand-packed boxes to students on one campus and asked what they liked. Students wanted fewer granola bars and more savory snacks, so the next boxes changed. Each box sells for $30 and costs $18 to fill and ship."]},"A3":{"title":"Changes facing a bike-share company","attr":"Practice scenario: outside changes.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["CityCycle rents bikes and scooters by the minute in a large city. Its managers listed recent changes."],"table":[["Change","Notes"],["City council votes to fund 40 miles of new bike lanes","Policy decision"],["Gas prices rise sharply","Commuters look for cheaper travel"],["Younger workers prefer not to own cars","Lifestyle trend"],["New law requires helmets for scooter riders under 18","Must comply by spring"],["CityCycle launches its own new app","Released last month"]]}},"questions":[{"id":"SA-1","type":"mcq","skill":"Shortage","topic":"1.2","stem":"At $4 a loaf, what is happening in this market?","options":["A surplus, because bakeries are offering more loaves than buyers will take","A shortage, so prices will rise","Equilibrium, since some loaves are still selling","A surplus, so prices will fall"],"ans":1,"exp":"300 wanted vs. 150 offered: buyers compete and price rises.","why":["At $4 buyers want 300 but only 150 are offered.","","Quantities aren't equal.","Reversed."],"src":"A1"},{"id":"SA-2","type":"mcq","skill":"Equilibrium","topic":"1.2","stem":"What is the equilibrium price at the fair?","options":["$8, because that is the price at which the bakeries would earn the most money","$6","$4","$5"],"ans":1,"exp":"At $6, 220 wanted = 220 offered.","why":["At $8 there's a surplus of 150.","","Shortage.","No data; $6 is where they match."],"src":"A1"},{"id":"SA-3","type":"mcq","skill":"Market structure","topic":"1.2","stem":"Suppose 60 bakeries sold identical loaves. Which statement would BEST describe each bakery?","options":["It controls the market price because its bread is fresh and baked that day","It is a monopoly","It is a price taker","It is part of an oligopoly"],"ans":2,"exp":"Many sellers of identical products = perfect competition; each must take the going price.","why":["Identical products give no pricing power.","Many sellers.","","Many small firms."],"src":"A1"},{"id":"SA-4","type":"mcq","skill":"Customers","topic":"1.1","stem":"In most SnackDrop sales, who is the customer?","options":["The parent who buys the box","The college student, because the student opens the box and eats the snacks inside","The snack makers","The founder"],"ans":0,"exp":"The customer pays and decides.","why":["","That's the consumer.","Suppliers.","Owner."],"src":"A2"},{"id":"SA-5","type":"mcq","skill":"Value capture","topic":"1.1","stem":"How much value does SnackDrop capture per box?","options":["$30, which is the full amount that the parent pays SnackDrop for each box","$18","$12","$48"],"ans":2,"exp":"$30 − $18 = $12.","why":["That's the price.","That's the cost.","","Price plus cost."],"src":"A2"},{"id":"SA-6","type":"mcq","skill":"MVP","topic":"1.4","stem":"The 40 hand-packed boxes are BEST described as:","options":["A minimum viable product","A minimum marketable product, since the founder sold them to real students on campus","Mass production","A value proposition"],"ans":0,"exp":"A simple version built to test demand.","why":["","An MMP comes later, for a larger market.","Hand-packed, small run.","That's a statement."],"src":"A2"},{"id":"SA-7","type":"mcq","skill":"Iteration","topic":"1.4","stem":"Changing the snacks after student feedback shows:","options":["Limit pricing, because the founder is trying to keep rival snack boxes out of the market","Vertical integration","Product-market fit is proven","Build-measure-learn"],"ans":3,"exp":"Launch, gather feedback, refine.","why":["Not about price.","No.","One test doesn't prove it.",""],"src":"A2"},{"id":"SA-8","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"The council's vote to fund bike lanes is BEST classified as:","options":["Environmental, because more people riding bikes would help reduce air pollution","Legal","Political","Social"],"ans":2,"exp":"Government spending priorities are political.","why":["The change is a government policy decision.","Not a law CityCycle must obey.","","Not a lifestyle trend."],"src":"A3"},{"id":"SA-9","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which change is NOT a PESTEL factor for CityCycle?","options":["CityCycle's own new app","The helmet law, because CityCycle has to change its rules to comply by spring","Rising gas prices","Younger workers avoiding cars"],"ans":0,"exp":"A firm's own launch is an internal decision.","why":["","That's external and legal.","Economic.","Social."],"src":"A3"},{"id":"SA-10","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which change is a threat rather than an opportunity for CityCycle?","options":["Rising gas prices, because they increase the cost of fuel for everyone in the city","The helmet law for riders under 18","New bike lanes","Fewer young car owners"],"ans":1,"exp":"It adds compliance costs and may cut young riders.","why":["They push commuters toward bikes.","","Opportunity.","Opportunity."],"src":"A3"},{"id":"SA-11","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Rising gas prices are BEST classified as:","options":["Environmental, because burning gasoline releases pollution into the city's air","Political","Technological","Economic"],"ans":3,"exp":"Prices and spending power are economic.","why":["The change is about prices.","Not a policy.","No.",""],"src":"A3"}]},{"name":"Set B: Structures, ethics and supply chains (1.5-1.8)","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"B1":{"title":"Two founders, one decision","attr":"Practice scenario: choosing a structure.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Maya and Jordan plan to open a rock-climbing gym. They need $1.2 million for walls, equipment and a building lease. Climbing gyms face the risk of injury lawsuits. Neither founder wants personal savings or a house put at risk, and they want to keep running the business themselves without a board of directors."]},"B2":{"title":"A promise on the box","attr":"Practice scenario: ethics at a food company.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Harvest Bar's slogan is \"Honest food, nothing hidden.\" A supplier offers a cheaper sweetener that would lower costs by 12%, but the label would have to list it, and many customers avoid it. A manager suggests buying it and keeping the old label for six months until the boxes run out. Store managers earn bonuses only when costs fall."]},"B3":{"title":"Two ways to make a guitar","attr":"Practice scenario: comparing production methods.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Two companies make acoustic guitars."],"table":[["","Oakline Guitars","StrumCo"],["Guitars per year","300","120,000"],["How they're made","Skilled builders by hand; each one different","Assembly lines and machines"],["Average cost per guitar","$1,400","$95"],["Average price","$3,200","$180"]]}},"questions":[{"id":"SB-1","type":"mcq","skill":"Structures","topic":"1.7","stem":"Which structure BEST fits Maya and Jordan's goals?","options":["A partnership, because there are exactly two founders who want to share decisions","An LLC","A C-corporation","A sole proprietorship"],"ans":1,"exp":"Limited liability plus flexible management without a board.","why":["Partners are usually personally liable.","","They want no board.","Two owners and unlimited liability."],"src":"B1"},{"id":"SB-2","type":"mcq","skill":"Liability","topic":"1.7","stem":"Why does the risk of lawsuits matter MOST in their decision?","options":["Lawsuits are a PESTEL factor, so the founders need to list them in a PESTEL analysis","It raises startup costs","Unlimited liability would put their homes at risk","It changes their mission"],"ans":2,"exp":"Liability determines whether personal assets can be taken.","why":["That doesn't answer the structure question.","Not the main issue.","","Unrelated."],"src":"B1"},{"id":"SB-3","type":"mcq","skill":"Corporation","topic":"1.7","stem":"Why might they choose a corporation later?","options":["To avoid all rules and paperwork, since corporations face the least regulation","To keep full control","To raise more money by selling stock","To avoid any taxes"],"ans":2,"exp":"Corporations have the greatest access to funding.","why":["Corporations face the most rules.","A board oversees it.","","C-corps face double taxation."],"src":"B1"},{"id":"SB-4","type":"mcq","skill":"Ethics","topic":"1.6","stem":"Keeping the old label after switching sweeteners would be unethical MAINLY because it:","options":["Lowers costs by 12%, which reduces the quality of the bars that customers buy","Changes a supplier","Breaks a trademark","Conceals information from customers"],"ans":3,"exp":"Concealing data is unethical behavior.","why":["Lower costs alone aren't unethical.","Normal business.","Not stated.",""],"src":"B2"},{"id":"SB-5","type":"mcq","skill":"Frameworks","topic":"1.6","stem":"Which framework points MOST directly against the manager's idea?","options":["Strategic alignment","Net benefit, because only the money saved by the company matters in this decision","Limit pricing","Economies of scale"],"ans":0,"exp":"\"Honest food, nothing hidden\" conflicts with hiding the change.","why":["","Net benefit weighs everyone, not just savings.","Not an ethics framework.","Not ethics."],"src":"B2"},{"id":"SB-6","type":"mcq","skill":"Incentives","topic":"1.6","stem":"What would MOST reduce pressure to hide changes like this?","options":["A larger bonus for managers who find the biggest cost savings each quarter","Bonuses that don't reward cost cuts alone","A new slogan","Fewer suppliers"],"ans":1,"exp":"Poor incentive structures push people toward unethical choices.","why":["Increases the pressure.","","Doesn't change behavior.","Unrelated."],"src":"B2"},{"id":"SB-7","type":"mcq","skill":"Production","topic":"1.8","stem":"Oakline Guitars uses which kind of production?","options":["Artisan production","Mass production, since its guitars sell for a much higher price than StrumCo's","Outsourcing","Vertical integration"],"ans":0,"exp":"Skilled labor, unique items, higher cost per unit.","why":["","Price doesn't define it; hand-built small runs do.","Not stated.","Not stated."],"src":"B3"},{"id":"SB-8","type":"mcq","skill":"Economies of scale","topic":"1.8","stem":"Why is StrumCo's cost per guitar so much lower?","options":["Economies of scale","Its builders are more skilled than Oakline's builders and work much more carefully","A patent","Limit pricing"],"ans":0,"exp":"Fixed costs spread over 120,000 guitars.","why":["","Machines, not skill, cut its cost.","Not stated.","That's about price, not cost."],"src":"B3"},{"id":"SB-9","type":"mcq","skill":"Strategy","topic":"1.8","stem":"Which supply chain strategy does Oakline follow?","options":["Low-price leadership, because it makes far fewer guitars and has lower total costs","Mass production","Restrictive distribution","High-quality differentiation"],"ans":3,"exp":"Premium craft and precision.","why":["It charges premium prices.","No.","Not stated.",""],"src":"B3"}]},{"name":"Math drills: profit, value capture, market share","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{},"questions":[{"id":"MD-1","type":"mcq","skill":"Math","topic":"1.1","stem":"A food truck's revenue last week was $5,600. Its costs were $2,100 for food, $1,500 for wages and $900 for fuel and fees. What was its profit?","options":["$4,500, the total amount the food truck spent on food, wages, fuel and fees","$1,100","$3,500","$2,600"],"ans":1,"exp":"$5,600 − ($2,100 + $1,500 + $900) = $1,100.","why":["That's total cost.","","Subtracts only food.","Leaves out the wages."]},{"id":"MD-2","type":"mcq","skill":"Math","topic":"1.1","stem":"A shop had revenue of $8,000 and total costs of $9,250. What is its result?","options":["A loss of $1,250","A profit of $1,250, because revenue and costs are both reported for the same month","A profit of $17,250","A loss of $9,250"],"ans":0,"exp":"$8,000 − $9,250 = −$1,250.","why":["","Costs are greater than revenue.","Added them.","That's total cost."]},{"id":"MD-3","type":"mcq","skill":"Math","topic":"1.1","stem":"A phone case costs $4 to make and sells for $15. How much value is captured per case?","options":["$15, because that is the full price the customer pays for each phone case","$19","$4","$11"],"ans":3,"exp":"$15 − $4 = $11.","why":["That's the price.","Added.","That's the cost.",""]},{"id":"MD-4","type":"mcq","skill":"Math","topic":"1.2","stem":"A market sells 2,000,000 sneakers a year. One brand sells 500,000. What is its market share?","options":["40%, because it sells the most sneakers of any single brand in this market","25%","4%","50%"],"ans":1,"exp":"500,000 ÷ 2,000,000 = 25%.","why":["Not supported by the math.","","Divided wrong.","Off by double."]},{"id":"MD-5","type":"mcq","skill":"Math","topic":"1.2","stem":"Brand X sells 30,000 units in a market of 120,000. Next year the market grows to 150,000 and Brand X still sells 30,000. Its share:","options":["Stays at 25%, because Brand X sold exactly the same number of units both years","Rises to 30%","Falls from 25% to 20%","Falls to 15%"],"ans":2,"exp":"30,000 ÷ 120,000 = 25%; 30,000 ÷ 150,000 = 20%.","why":["The total grew.","Wrong direction.","","Math error."]},{"id":"MD-6","type":"mcq","skill":"Math","topic":"1.4","stem":"Your study guide's product-market fit test: at least 40% of surveyed users would be very disappointed without the product. Of 350 users, 126 say so. Does it pass?","options":["No, it's 36%","Yes, because more than one hundred of the users surveyed said they would be disappointed","Yes, it's 46%","No, it's 26%"],"ans":0,"exp":"126 ÷ 350 = 36%, below 40%.","why":["","The test is a percentage.","Math error.","Math error."]}]},{"name":"Mock test (40 questions)","mode":"exam","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"M1":{"title":"Trailhead Tutoring","attr":"Practice scenario: a tutoring startup.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Trailhead Tutoring matches high school students with college tutors for online test prep. Parents sign up and pay a monthly fee; students choose their tutors and attend the sessions. The founder tells employees that the company's long-term goal is \"to become the most trusted name in test prep in the region.\" On its website, the company explains: \"We connect students with trained college tutors through live online sessions that fit busy schedules.\"","A recent survey found that 82% of students said Trailhead saved them time compared with driving to a tutoring center. Last month the company reported the following results."],"table":[["Item","Amount"],["Subscription revenue","$24,000"],["Tutor pay","$13,500"],["Software and website","$3,000"],["Advertising","$2,500"],["Other expenses","$1,000"]]},"M2":{"title":"The home-battery market","attr":"Practice scenario: an industry data set.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Home batteries store solar power for use at night. Building a battery factory and getting safety approval costs hundreds of millions of dollars. VoltHome holds a patent on a fast-charging design that no rival can legally copy until 2031, and it has signed an exclusive contract with the country's largest supplier of a key chemical. VoltHome's battery sells for $9,000, compared with an industry average of $7,500."],"table":[["Company","Units sold (thousands)","Market share"],["VoltHome","180","36%"],["PowerNest","150","30%"],["SunVault","100","20%"],["Others","70","14%"]]},"M3":{"title":"Bright Juice expansion report","attr":"Practice scenario: a PESTEL review before expanding.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Bright Juice runs 40 fresh-juice bars and is deciding whether to open 15 locations in a neighboring state. Managers reviewed the developments below. Bright Juice also recently trained all of its staff on a new ordering system it designed itself."],"table":[["Development","Expected impact"],["The state plans a tax on sugary drinks","Higher prices for some menu items"],["Interest rates have risen sharply","Higher cost of borrowing to build stores"],["More young adults want low-sugar, plant-based drinks","Higher demand"],["A popular delivery app is expanding across the state","More ways to reach customers"],["A new law requires calorie labels on all menus","Higher compliance costs"]]},"M4":{"title":"Kit Kart","attr":"Practice scenario: testing a business idea.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Dev noticed that families at youth soccer tournaments struggle to carry chairs, coolers and gear between fields. He imagines a foldable wagon with a built-in cooler. His business hypothesis: at least 30% of surveyed parents will pay $120 for it. He surveyed parents at three tournaments and built five working wagons for families to try for a weekend. Families said the wagon was helpful but the handle was too short, so he redesigned it before ordering any production run."],"table":[["Survey result","Parents"],["Parents surveyed","250"],["Interested in the wagon","190"],["Would pay $120","55"],["Would pay $80","140"]]},"M5":{"title":"ClearView Labs","attr":"Practice scenario: a business decision with competing responsibilities.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["ClearView Labs makes a home air-quality monitor. Final tests show that about 4% of units sometimes report pollution levels slightly higher than the real level. The error poses no safety risk, and engineers believe a software update can fix it within two months.","Delaying the launch would cost about $5 million in lost holiday sales and could let a rival launch first. Launching on time would meet investor expectations. The sales team receives large bonuses based only on how many units ship this quarter, and some sales managers are pushing to launch without telling customers about the issue. Executives are weighing the interests of customers, employees, investors and retailers."]},"M6":{"title":"Rivera Roasters","attr":"Practice scenario: a growing business.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Ana Rivera started a coffee-roasting business on her own, selling bags at farmers markets. As sales grew, her friend Ben joined as a co-owner; Ana manages roasting and supplies, while Ben handles café clients and the website. They hired an outside firm to do their taxes and payroll.","Now a grocery chain wants to stock their coffee in 200 stores. The contract includes large penalties if deliveries are late. To fill the order, the owners would need to buy a $600,000 roaster and hire 20 employees. They are considering changing their business structure."]},"M7":{"title":"GreenLeaf Phone Cases","attr":"Practice scenario: a supply chain disruption.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["GreenLeaf makes phone cases from recycled plastic. It buys recycled pellets from a supplier overseas, molds the cases in its own factory, ships them to a national distributor, and the distributor delivers them to electronics stores. This month, a typhoon closed the supplier's port for three weeks. GreenLeaf's factory has only one week of pellets on hand."],"table":[["Stage","Business","Status"],["Supplier","Overseas pellet maker","Port closed 3 weeks"],["Manufacturer","GreenLeaf factory","1 week of materials left"],["Distributor","National distributor","Normal"],["Retailers","Electronics stores","Normal; holiday demand rising"]]},"M8":{"title":"Stride Shoes","attr":"Practice scenario: values and competencies.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Stride Shoes sells running shoes made from recycled materials and donates part of its profits to youth sports programs. Its engineers are known for designing unusually lightweight soles, and customers rate this as the main reason they choose Stride over cheaper brands. A large retailer offers to sell Stride's shoes nationwide if Stride switches to cheaper, non-recycled materials to lower the price. The founders turn down the offer because it conflicts with their commitment to sustainability."]}},"questions":[{"id":"MK-1","type":"mcq","skill":"Customers","topic":"1.1","stem":"Who is Trailhead Tutoring's customer?","options":["The students, because they choose their tutors and attend every tutoring session","The college tutors","The software company","The parents who pay the fee"],"ans":3,"exp":"The customer pays and decides; the student is the consumer.","why":["Students use the service: they are consumers.","They work for the company.","A supplier.",""],"src":"M1"},{"id":"MK-2","type":"mcq","skill":"Value","topic":"1.1","stem":"Which piece of evidence best shows value creation?","options":["The company collected $24,000 in subscription revenue from parents last month","The founder's long-term goal","82% of students say it saves them time","Advertising cost $2,500"],"ans":2,"exp":"Benefits to customers are value creation.","why":["Revenue is value capture.","That's a vision.","","A cost."],"src":"M1"},{"id":"MK-3","type":"mcq","skill":"Profit","topic":"1.1","stem":"Based on the table, what was Trailhead's profit last month?","options":["$24,000, which is the total amount the company collected from parents this month","$4,000","$10,500","$20,000"],"ans":1,"exp":"$24,000 − ($13,500 + $3,000 + $2,500 + $1,000) = $4,000.","why":["That's revenue.","","That subtracts only tutor pay.","That's total costs."],"src":"M1"},{"id":"MK-4","type":"mcq","skill":"Vision","topic":"1.5","stem":"\"To become the most trusted name in test prep in the region\" is best described as Trailhead's:","options":["Mission statement, since it tells employees what the company does for parents","Value proposition","Vision statement","Core competency"],"ans":2,"exp":"Vision: where the business aspires to go.","why":["It states where the company wants to go.","Not why to choose a product.","","Not a skill."],"src":"M1"},{"id":"MK-5","type":"mcq","skill":"Mission","topic":"1.5","stem":"Which proposal would MOST support Trailhead's vision?","options":["Cut prices sharply and hire any available tutor to grow as quickly as possible","Train tutors well and expand carefully","Stop surveying students","Raise prices without changes"],"ans":1,"exp":"Becoming the most trusted name depends on quality.","why":["Speed and low prices can hurt trust.","","Feedback builds trust.","Doesn't build trust."],"src":"M1"},{"id":"MK-6","type":"mcq","skill":"Market structure","topic":"1.2","stem":"Based on the information, the home-battery market is BEST described as:","options":["Monopolistic competition, since each company's battery is a little bit different","An oligopoly","Perfect competition","A monopoly"],"ans":1,"exp":"Three firms hold 86% of sales, and entry costs hundreds of millions.","why":["A few firms dominate behind high barriers.","","Few firms, high barriers.","Several firms."],"src":"M2"},{"id":"MK-7","type":"mcq","skill":"Barriers","topic":"1.2","stem":"Which barrier to entry protects VoltHome specifically, rather than every firm in the market?","options":["Its patent and exclusive supplier contract","The huge cost of building a factory and getting the batteries approved for safety","Its 36% market share","Its price"],"ans":0,"exp":"The patent and exclusive contract belong to VoltHome alone.","why":["","That barrier protects all existing firms.","A result, not a barrier.","Not a barrier."],"src":"M2"},{"id":"MK-8","type":"mcq","skill":"Competitive advantage","topic":"1.2","stem":"Why can VoltHome charge $1,500 more than the industry average?","options":["Prices in every market are set by the company with the largest market share","Buyers prefer high prices","The government sets its price","Its patented design is differentiated"],"ans":3,"exp":"A unique, protected feature gives pricing power.","why":["Not how prices are set.","No.","Not stated.",""],"src":"M2"},{"id":"MK-9","type":"mcq","skill":"Market share","topic":"1.2","stem":"If total sales grow by 20% next year but VoltHome still sells 180,000 units, what happens to its market share?","options":["It falls","It rises, because VoltHome is selling in a market that is growing quickly","It stays at 36%","It doubles"],"ans":0,"exp":"Same sales in a bigger market means a smaller share.","why":["","Its sales stay flat while the market grows.","The total grew.","No."],"src":"M2"},{"id":"MK-10","type":"mcq","skill":"Patent","topic":"1.2","stem":"What is MOST likely to happen to VoltHome after 2031?","options":["VoltHome will become a monopoly, since its patent gives it permanent control of batteries","Rivals may copy its fast-charging design","Its costs will vanish","Demand will end"],"ans":1,"exp":"Patents give temporary protection.","why":["Patents expire.","","Unrelated.","Not supported."],"src":"M2"},{"id":"MK-11","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which development is NOT part of a PESTEL analysis?","options":["A popular delivery app expanding across the neighboring state","Bright Juice training staff on its own ordering system","Rising interest rates","A calorie-label law"],"ans":1,"exp":"A company's own decisions are internal.","why":["That's an external technological factor.","","Economic.","Legal."],"src":"M3"},{"id":"MK-12","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"The planned tax on sugary drinks is BEST classified as:","options":["An economic factor, because it raises the prices that customers pay for drinks","A social factor","A political factor","An environmental factor"],"ans":2,"exp":"Taxes are government policy decisions.","why":["It's a government policy choice.","Not a trend.","","Unrelated."],"src":"M3"},{"id":"MK-13","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which combination would MOST encourage Bright Juice to expand?","options":["The sugar tax and the calorie-label law, which affect every juice company equally","Higher interest rates and the sugar tax","The low-sugar trend and the delivery app","The calorie law and higher rates"],"ans":2,"exp":"A social trend raising demand plus a new channel to customers are opportunities.","why":["Both raise costs.","Both obstacles.","","Both obstacles."],"src":"M3"},{"id":"MK-14","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which development is MOST likely the biggest immediate obstacle to building 15 new stores?","options":["The low-sugar trend, which might reduce how much juice customers want to buy","The delivery app","Staff training","Higher interest rates"],"ans":3,"exp":"Building stores requires borrowing, which now costs more.","why":["It raises demand.","An opportunity.","Internal.",""],"src":"M3"},{"id":"MK-15","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which pairing is correct?","options":["Delivery app: social, because people are changing how they like to order food","Low-sugar trend: economic","Interest rates: political","Calorie-label law: legal"],"ans":3,"exp":"A specific law a business must follow is legal.","why":["The platform itself is technological.","Social.","Economic.",""],"src":"M3"},{"id":"MK-16","type":"mcq","skill":"Idea generation","topic":"1.4","stem":"How did Dev most likely find the problem?","options":["By studying a government report on the size of the youth soccer market","By copying a rival","By observing families at tournaments","By building a factory"],"ans":2,"exp":"Observation is a source of business ideas.","why":["That's secondary research, not how he found it.","Not stated.","","No."],"src":"M4"},{"id":"MK-17","type":"mcq","skill":"Hypothesis","topic":"1.4","stem":"Based on the survey, what should Dev conclude about his hypothesis?","options":["It is not supported at $120","It is supported, because 190 of the 250 parents said they were interested in the wagon","He should raise the price","He needs no more research"],"ans":0,"exp":"55 ÷ 250 = 22%, below the 30% benchmark.","why":["","Interest isn't willingness to pay $120.","Data don't support that.","Results suggest revising."],"src":"M4"},{"id":"MK-18","type":"mcq","skill":"MVP","topic":"1.4","stem":"Building five working wagons for families to try was MAINLY meant to:","options":["Stop sporting goods companies from copying the wagon before it reaches the stores","Set the final price","Cut production costs","Test whether it meets families' needs"],"ans":3,"exp":"Testing working versions with users is validation.","why":["Not the purpose.","Not mainly.","Not mainly.",""],"src":"M4"},{"id":"MK-19","type":"mcq","skill":"Iteration","topic":"1.4","stem":"Redesigning the handle after feedback is an example of:","options":["Iteration","Mass production, because Dev is getting ready to manufacture many wagons","Limit pricing","Vertical integration"],"ans":0,"exp":"Improving based on feedback is iteration.","why":["","Not yet producing.","Unrelated.","Unrelated."],"src":"M4"},{"id":"MK-20","type":"mcq","skill":"Evidence","topic":"1.4","stem":"Which additional information would MOST help Dev judge whether the survey is reliable?","options":["Whether rival companies have started selling wagons with built-in coolers","Whether he can make enough wagons","Whether these parents represent his target customers","Whether he likes the design"],"ans":2,"exp":"A survey is reliable only if the sample represents the target market.","why":["That's about competition.","Feasibility, not reliability.","","Opinion."],"src":"M4"},{"id":"MK-21","type":"mcq","skill":"Ethics","topic":"1.6","stem":"Which statement BEST describes ClearView's situation?","options":["An ethical dilemma with competing responsibilities","A conflict between two market segments that want different monitor features","A pricing decision","A supply chain risk"],"ans":0,"exp":"Customers, investors and employees pull in different directions.","why":["","Not about segments.","Not about price.","Not the main issue."],"src":"M5"},{"id":"MK-22","type":"mcq","skill":"Incentives","topic":"1.6","stem":"Which factor is MOST likely pushing some managers toward an unethical choice?","options":["Bonuses based only on units shipped","The engineers' estimate that a software update can fix the problem in two months","The 4% error rate","Retailers' interests"],"ans":0,"exp":"Poor incentive structures push people toward unethical choices.","why":["","That's information, not pressure.","A fact.","Not stated as pressure."],"src":"M5"},{"id":"MK-23","type":"mcq","skill":"Stakeholders","topic":"1.6","stem":"If ClearView launches without telling customers, who is MOST directly affected first?","options":["Investors, who expect the company to meet its sales targets this quarter","Retailers","Engineers","Customers using the monitors"],"ans":3,"exp":"Customers, external stakeholders, feel it first.","why":["Not first.","Less directly.","Less directly.",""],"src":"M5"},{"id":"MK-24","type":"mcq","skill":"Frameworks","topic":"1.6","stem":"Which approach would BEST help executives decide?","options":["Choose whatever gives investors the largest return in the short run","Choose the most total benefit and least total harm","Choose what most managers want","Choose the fewest schedule changes"],"ans":1,"exp":"The net benefit framework weighs all stakeholders.","why":["Ignores other stakeholders.","","Popularity isn't a framework.","Not ethical reasoning."],"src":"M5"},{"id":"MK-25","type":"mcq","skill":"Accountability","topic":"1.6","stem":"Which change would MOST directly discourage unethical choices in the future?","options":["Increase the bonus for shipping units so that the sales team works even harder","Remove the engineers","Reward honest reporting, not just units shipped","Delay all launches forever"],"ans":2,"exp":"Fixing incentives addresses the root cause.","why":["Worsens the pressure.","No.","","Too extreme."],"src":"M5"},{"id":"MK-26","type":"mcq","skill":"Structures","topic":"1.7","stem":"When Ana sold coffee by herself at farmers markets, her business was a:","options":["Sole proprietorship","Limited liability company, since she was the only person responsible for it","Corporation","Partnership"],"ans":0,"exp":"One owner with no legal separation.","why":["","Nothing suggests she formed an LLC.","No shareholders.","One owner."],"src":"M6"},{"id":"MK-27","type":"mcq","skill":"Structures","topic":"1.7","stem":"Which factor BEST justifies changing from a partnership to an LLC now?","options":["More personal financial risk from the contract","The owners want to hire twenty employees and buy a large new roasting machine","They outsource taxes","They sell at farmers markets"],"ans":0,"exp":"Penalties and big purchases raise risk; an LLC limits liability.","why":["","Any structure can hire and buy.","Unrelated.","Unrelated."],"src":"M6"},{"id":"MK-28","type":"mcq","skill":"Outsourcing","topic":"1.7","stem":"Why did the owners MOST likely hire an outside firm for taxes and payroll?","options":["To gain control of every stage of the coffee supply chain from farm to store","To let specialists handle those tasks","To find new customers","To differentiate the coffee"],"ans":1,"exp":"Outsourcing taps specialized skills.","why":["That's vertical integration.","","Marketing.","Unrelated."],"src":"M6"},{"id":"MK-29","type":"mcq","skill":"Departments","topic":"1.7","stem":"Ben's role most closely matches which department?","options":["Operations, because Ben works with cafés every day to make sure they are happy","Sales and marketing","Accounting","Human resources"],"ans":1,"exp":"Clients and the website are sales and marketing.","why":["He wins and keeps clients.","","Not records.","Not hiring."],"src":"M6"},{"id":"MK-30","type":"mcq","skill":"Corporation","topic":"1.7","stem":"If the owners formed a corporation instead, what trade-off would they MOST likely face?","options":["Lower startup costs, but losing the protection their personal assets now have","Total control, but full liability","More funding, but less control","No employees, but faster growth"],"ans":2,"exp":"Corporations sell stock but owners cede control to a board.","why":["Reversed.","That's a sole proprietorship.","","Unrelated."],"src":"M6"},{"id":"MK-31","type":"mcq","skill":"Supply chain","topic":"1.8","stem":"Which stage of GreenLeaf's supply chain has been disrupted?","options":["The retailers, because holiday demand for phone cases is rising in the stores","The distributor","The manufacturer","The supplier"],"ans":3,"exp":"The supplier's port is closed.","why":["Retailers are normal.","Normal.","Affected later.",""],"src":"M7"},{"id":"MK-32","type":"mcq","skill":"Risk","topic":"1.8","stem":"The typhoon is BEST classified as which supply chain risk?","options":["A production error inside GreenLeaf's own factory during the molding process","A natural disaster","Political instability","Collusion"],"ans":1,"exp":"Natural disasters are supply chain risks.","why":["The cause is outside.","","Not political.","Unrelated."],"src":"M7"},{"id":"MK-33","type":"mcq","skill":"Stockout","topic":"1.8","stem":"If the port stays closed, what problem is MOST likely within a few weeks?","options":["A surplus of phone cases at the stores, since the factory will keep producing","Stockouts at stores","Lower holiday demand","Higher-quality cases"],"ans":1,"exp":"With one week of pellets and three weeks closed, shelves run out.","why":["The factory runs out of materials.","","Demand is rising.","Unrelated."],"src":"M7"},{"id":"MK-34","type":"mcq","skill":"Strategy","topic":"1.8","stem":"Which action would BEST reduce this kind of risk in the future?","options":["Keep more materials on hand or add a second supplier","Close the factory and stop making phone cases until the shipping port reopens","Raise prices only","Stop using distributors"],"ans":0,"exp":"Extra inventory or backup suppliers make chains resilient.","why":["","That doesn't reduce future risk.","Doesn't fix supply.","Unrelated."],"src":"M7"},{"id":"MK-35","type":"mcq","skill":"Supply chain","topic":"1.8","stem":"What is the distributor's role in GreenLeaf's chain?","options":["Making recycled pellets and shipping them to GreenLeaf's factory overseas","Molding the cases","Moving cases from the factory to stores","Selling to shoppers"],"ans":2,"exp":"Distributors move finished goods to retailers.","why":["That's the supplier.","Manufacturer.","","Retailers."],"src":"M7"},{"id":"MK-36","type":"mcq","skill":"Competencies","topic":"1.5","stem":"Stride's engineers' skill at designing lightweight soles is BEST described as:","options":["A core value, because the company believes strongly in making lightweight shoes","A PESTEL factor","A barrier to entry","A core competency"],"ans":3,"exp":"Capabilities that beat rivals are core competencies.","why":["It's a skill, not a belief.","Internal.","Not stated as one.",""],"src":"M8"},{"id":"MK-37","type":"mcq","skill":"Values","topic":"1.5","stem":"Turning down the retailer's offer shows Stride is guided MAINLY by:","options":["Its core competencies, because it is very good at designing lightweight shoes","A legal requirement","Its core values","Its market share goals"],"ans":2,"exp":"Rejecting profit that conflicts with beliefs shows core values.","why":["The reason is a belief in sustainability.","No law stated.","","It gave up sales."],"src":"M8"},{"id":"MK-38","type":"mcq","skill":"Organizations","topic":"1.5","stem":"Stride is BEST classified as which kind of organization?","options":["A nonprofit, because it gives part of its profits to youth sports programs","A government agency","A monopoly","A social enterprise"],"ans":3,"exp":"Profit plus a social or environmental goal.","why":["It still earns profit.","No.","Has rivals.",""],"src":"M8"},{"id":"MK-39","type":"mcq","skill":"Competitive advantage","topic":"1.2","stem":"Based on the scenario, Stride's main competitive advantage comes from:","options":["Differentiated, lightweight shoes","Charging the lowest prices in the market, which attracts price-sensitive runners","A patent","Government protection"],"ans":0,"exp":"Customers choose Stride for its unique soles.","why":["","Customers pass up cheaper brands.","Not mentioned.","Not mentioned."],"src":"M8"},{"id":"MK-40","type":"mcq","skill":"Supply chain","topic":"1.8","stem":"Stride's choice of recycled materials over cheaper ones BEST reflects which supply chain strategy?","options":["Low-price leadership, since recycled materials always cost less than new ones","Mass production","Limit pricing","High-quality differentiation"],"ans":3,"exp":"Premium inputs that set the product apart.","why":["It chose the costlier option.","Not stated.","Unrelated.",""],"src":"M8"}],"exam":"Mock test","examTips":["Like the real Unit 1 test: 40 multiple-choice questions, one scenario per page, 5 questions each.","Turn the Timer on and leave Shuffle off. About one minute per question.","Many questions have two good answers: choose the one the scenario supports best."]}]},"cheat":[{"title":"Formulas","kind":"list","items":["Profit = revenue − total costs (negative = a loss).","Value captured per unit = price − cost to make it.","Market share = a firm's sales ÷ total market sales."]},{"title":"Pairs people mix up","kind":"table","rows":[["This","vs. this"],["Customer: pays and decides","Consumer: uses it"],["Value creation: benefit to the customer","Value capture: money the business keeps"],["Problem-solution fit: it solves the problem","Product-market fit: enough demand to be viable"],["Core values: what we believe","Core competencies: what we're best at"],["Vision: where and why","Mission: what and how"],["Political: policy choices","Legal: specific laws"],["Shortage: price rises","Surplus: price falls"],["Accounting: records the money","Finance: plans the money"],["Artisan: handmade, unique","Mass production: many, cheap per unit"]]},{"title":"Test-taking reminders","kind":"list","items":["A company's own invention or hire is NOT a PESTEL factor.","Look for the BEST answer: several choices can sound true; pick the one the scenario supports.","Watch for answers that are too extreme (\"always,\" \"guarantees,\" \"eliminates all\").","Liability is the most tested idea in 1.7: unlimited (sole proprietorship, partnership) vs. limited (LLC, corporation)."]},{"title":"Business Canvas lenses","kind":"list","items":["Customer: who we serve.","Product: what we sell and its value.","Market: rivals and alternatives.","Finance: revenue and costs.","Operations: making and delivering.","Organization: people and roles."]}]},"u2":{"images":{},"decks":[{"id":1,"name":"Marketing to Customers (2.1)","optional":false,"sections":[{"name":"What marketing is","cards":[{"term":"Marketing","def":"Everything a business does to understand customers, create products they want, build relationships and convince people to buy.","hook":"Planning the whole circus, not just the sign.","asks":[{"q":"A bakery owner says, \"We don't do marketing; we just bake.\" But she surveys customers, adds a gluten-free line they asked for, and posts specials online. What's the best response?","right":"She is marketing: all of that counts","wrong":[["She's right, because marketing only means paying for advertisements on TV or online","Marketing is far bigger than ads."],["Only the posts count","Surveys and new products are marketing too."],["Only the survey counts","Creating wanted products counts too."]],"exp":"Marketing covers understanding customers, making what they want and persuading them to buy."},{"q":"In the circus analogy, which job is MARKETING?","right":"Planning all of it","wrong":[["The sign that says \"Circus Tonight\" posted on the wall outside the town hall","That's advertising."],["People buying tickets","That's sales."],["The news story","That's publicity."]],"exp":"Marketing is the whole plan: advertising, promotion, publicity, PR and sales."}]},{"term":"Advertising","def":"A message that announces a product to the public, like a sign saying \"Circus Tonight.\"","hook":"The sign.","asks":[{"q":"A new gym puts up billboards around town reading \"Grand opening Saturday.\" Which piece of the circus analogy is this?","right":"Advertising","wrong":[["Publicity, because many people in town will see the billboards on their drive","Publicity is news coverage, not your own sign."],["Public relations","PR builds image, not announcements."],["Sales","No one is buying yet."]],"exp":"A message announcing the product is advertising: the circus sign."},{"q":"Which is the clearest difference between advertising and publicity?","right":"The business controls the first","wrong":[["Advertising is always free, while publicity always costs the business a lot of money","Usually the reverse."],["Publicity is only online","News can be any medium."],["They mean the same thing","Different pieces of the circus."]],"exp":"The business writes its own ad; publicity is what the news decides to say."}]},{"term":"Publicity","def":"Attention from the news media, like a story about the circus elephant in the mayor's flower bed.","hook":"The news story.","asks":[{"q":"A local TV station runs a story about a food truck that feeds firefighters for free. The owner didn't pay for it. This is:","right":"Publicity","wrong":[["Media advertising, because the story was shown on television to thousands of viewers","Ads are messages the business places."],["Personal selling","No salesperson."],["A sales promotion","No discount."]],"exp":"Unpaid news attention is publicity."},{"q":"Why can publicity be risky for a business?","right":"The media decides what the story says","wrong":[["It is the most expensive way to reach customers, so it uses up the marketing budget","Publicity usually isn't paid for."],["It only reaches existing customers","News reaches everyone."],["It's illegal without a license","No."]],"exp":"The elephant in the flower bed made the news: the business doesn't control the story."}]}],"intro":["Picture a circus coming to town. The sign is advertising, the news story about the elephant is publicity, and the photo with the mayor is public relations. People buying tickets is sales. Planning all of it is marketing: understanding customers, making what they want, and convincing them to buy."]},{"name":"Customer data","cards":[{"term":"Demographics","def":"Measurable traits of customers such as age, gender, income, education and location; they show WHO buys.","hook":"Who: numbers on a form.","asks":[{"q":"A skate shop learns its buyers are mostly 14 to 22 years old and live within 5 miles. What kind of data is this?","right":"Demographic","wrong":[["Psychographic, because it tells the shop why these teenagers like to skateboard","Age and location are measurable traits."],["Qualitative","These are numbers."],["Situational","Not a temporary condition."]],"exp":"Age and location are demographics: WHO buys."},{"q":"Which piece of customer data is demographic?","right":"Household income over $150,000","wrong":[["A love of outdoor adventure and caring deeply about protecting the environment","Values and interests are psychographic."],["Prefers convenience","Psychographic."],["Enjoys outdoor yoga","Psychographic."]],"exp":"Income is a measurable trait."}]},{"term":"Psychographics","def":"How customers think and live: interests, values, attitudes, personalities and lifestyles; they explain WHY people buy.","hook":"Why: what's in their head.","asks":[{"q":"Jamba Juice learns its customers value convenience and like customizing their drinks. This is:","right":"Psychographic data","wrong":[["Demographic data, because it describes the students and young adults who buy juice","Values and preferences explain WHY."],["Secondary research","Jamba collected it itself."],["A customer profile","A profile is a made-up sample customer."]],"exp":"Values and lifestyle preferences are psychographics."},{"q":"Fiji, Liquid Death and Great Value all sell water. What mostly separates their buyers?","right":"Their values and lifestyles","wrong":[["Their ages, because each brand only sells to one specific age group of customers","The brands differ in image: luxury, edgy, budget."],["Their locations","Not the difference shown."],["Their education","Not the difference shown."]],"exp":"Luxury, edgy humor and budget convenience are psychographic appeals."}]},{"term":"Market segmentation","def":"Dividing potential customers into groups with similar traits that respond alike to marketing.","hook":"Slicing the pie.","asks":[{"q":"A sneaker company divides buyers into serious runners, casual walkers and fashion buyers. What is it doing?","right":"Segmentation","wrong":[["Targeting, because it is choosing to sell to all three groups at the same time","Dividing is segmentation; choosing is targeting."],["Positioning","That's how the brand is seen."],["A/B testing","No experiment."]],"exp":"Dividing customers into similar groups is segmentation: slicing the pie."},{"q":"Why do businesses segment their market?","right":"Groups respond to marketing differently","wrong":[["To make sure every single person in the country sees exactly the same advertisement","That ignores differences."],["To raise prices for everyone","Not the purpose."],["Because the law requires it","No."]],"exp":"Similar groups respond alike, so each can get a message that fits."}]},{"term":"Targeting","def":"Choosing which customer group to focus on.","hook":"Picking which slice to eat.","asks":[{"q":"After dividing its market, the sneaker company focuses its ads on serious runners. What step is this?","right":"Targeting","wrong":[["Segmentation, because the company is still dividing up customers into different groups","The dividing already happened."],["Branding","Not choosing a group."],["Validation","No test."]],"exp":"Choosing which slice to eat is targeting."},{"q":"What is the MAIN benefit of targeting?","right":"Less marketing money wasted","wrong":[["It guarantees that every customer in the target group will definitely buy the product","Nothing guarantees sales."],["It removes all competitors","No."],["It replaces market research","Targeting depends on research."]],"exp":"Focusing on likely buyers cuts wasted spending and shapes branding, pricing and ads."}]},{"term":"Target customers","def":"The buyers most likely to purchase, chosen so marketing money isn't wasted.","hook":"Aim where the buyers are.","asks":[{"q":"A $300 noise-canceling headphone brand has a small ad budget. Which group is the BEST target?","right":"Frequent flyers who work while traveling","wrong":[["Every teenager in the country, since teenagers listen to more music than any other age group","Many can't afford $300; wasted spending."],["People who rarely listen to audio","Unlikely buyers."],["Customers who only buy the cheapest earbuds","Price-sensitive; unlikely to pay $300."]],"exp":"Target customers are the buyers most likely to purchase."},{"q":"A brand aimed at budget shoppers starts targeting luxury buyers instead. What else would MOST likely need to change?","right":"Its branding, pricing and ads","wrong":[["Nothing else, because the target customer has no effect on any other marketing decisions","Targeting shapes branding, pricing and ads."],["Only its logo color","Too narrow."],["Only its factory","Not mainly."]],"exp":"The target shapes every other marketing choice."}]},{"term":"Customer profile","def":"A made-up description of one sample buyer that combines demographics, psychographics, wants, needs and preferences.","hook":"\"Eco-Explorer Erika.\"","asks":[{"q":"Adventure Bound describes \"Eco-Explorer Erika, 38, earns $160k, loves sustainable travel.\" Erika is:","right":"A customer profile","wrong":[["A real customer whose information the company collected through its online rewards app","She's made up as a sample."],["A target market","A market is a group, not one person."],["A testimonial","Not a real review."]],"exp":"A customer profile is a fictional sample customer."},{"q":"Why include psychographics in a customer profile and not just demographics?","right":"To capture why the person buys","wrong":[["Because demographics are against the law to collect when building a customer profile","Not true."],["To make it longer","Not the purpose."],["To replace the target market","It describes the target."]],"exp":"A profile combines who (demographics) with why (psychographics)."}]},{"term":"Digital data collection","def":"Gathering information through online accounts, subscriber lists, click-tracking, cookies, purchase history and social media monitoring.","hook":"Data you collect from clicks.","asks":[{"q":"A clothing website records which items each shopper views and buys. This is:","right":"Digital data collection","wrong":[["Traditional data collection, because the company is learning what its shoppers want","Tracking clicks and purchases is digital."],["A focus group","No discussion."],["Third-party data","The site collected it itself."]],"exp":"Click-tracking and purchase history are digital collection."},{"q":"What is the BIGGEST advantage of tracking purchases over asking shoppers in a survey?","right":"It shows what people actually do","wrong":[["It always costs nothing and never raises any privacy concerns with customers","It can raise privacy concerns."],["It explains why they buy","Behavior data shows what, not why."],["It needs no computers","It does."]],"exp":"Tracking records real behavior; surveys record what people say."}]},{"term":"Traditional data collection","def":"Gathering information by asking people directly through surveys, interviews and focus groups.","hook":"Data you collect by asking.","asks":[{"q":"A restaurant hands out comment cards and interviews regulars. This is:","right":"Traditional data collection","wrong":[["Digital data collection, because the restaurant will type the answers into a computer later","Asking directly is traditional."],["Third-party data","Collected by the restaurant."],["Big data","Small, direct sample."]],"exp":"Surveys, interviews and focus groups are traditional methods."},{"q":"When is an interview MOST useful compared with cookies and click-tracking?","right":"When you need to know why","wrong":[["When you need to count exactly how many people visited your website last month","Tracking does that better."],["When you want the cheapest data","Not necessarily cheaper."],["When customers can't be reached","You need to reach them to ask."]],"exp":"Asking people directly reveals reasons that clicks don't."}]},{"term":"Third-party data","def":"Information about buyers purchased from outside firms that sell it.","hook":"Bought, not collected.","asks":[{"q":"A startup with no customers yet buys a list of local households with young children from a data company. This is:","right":"Third-party data","wrong":[["Primary research, because the startup is going to use the list to find its own customers","It didn't collect it."],["Digital collection","Bought, not collected."],["A customer profile","A list isn't a sample person."]],"exp":"Data bought from outside companies is third-party data."},{"q":"Which is the BIGGEST risk of using third-party data?","right":"Customers may not know their data was shared","wrong":[["It is always less accurate than any data that the business collects on its own","Too extreme."],["It is illegal to buy any data","Too extreme."],["It costs nothing","Not a risk."]],"exp":"Using data customers don't know about raises privacy concerns."}]}],"intro":["Customer data tells a business which customers to serve, what to make and how to market it. Without it, money is wasted on people who will never buy. Demographics tell you who buys; psychographics tell you why. Businesses use that data to split customers into segments and pick a target."]},{"name":"Customer relationships and data risks","cards":[{"term":"Customer relationships","def":"Ongoing connections a business builds through personal service, rewards programs and feedback surveys.","hook":"Chewy sent flowers.","asks":[{"q":"After a customer's dog died, Chewy refunded her order and sent flowers. What was Chewy MOST likely building?","right":"A customer relationship","wrong":[["A sales promotion, because the company gave the customer her money back on the order","A refund here builds loyalty, not a quick sale."],["A data breach","No."],["Penetration pricing","Not pricing."]],"exp":"Personal service builds lasting relationships."},{"q":"Which tool is MOST directly aimed at building customer relationships?","right":"A rewards program","wrong":[["A one-time billboard placed along a busy highway for the month of the grand opening","Mass advertising reaches strangers once."],["A price increase","No."],["A new factory","Not marketing."]],"exp":"Rewards programs, personal service and feedback surveys build relationships."}]},{"term":"Customer acquisition cost (CAC)","def":"The average spending needed to win one new buyer: marketing, advertising and sales spending ÷ the number of new buyers gained.","hook":"Cost per new customer.","asks":[{"q":"A store spends $6,000 on ads and $2,000 on promotions and gains 200 new customers. What is its CAC?","right":"$40","wrong":[["$30, because only the $6,000 spent on ads is divided by the 200 new customers","Promotion is an acquisition cost too."],["$10","Only promotions."],["$8,000","That's total spending."]],"exp":"($6,000 + $2,000) ÷ 200 = $40."},{"q":"Two ads each brought 100 new customers. Ad A cost $1,500; Ad B cost $3,000. Which is better on CAC?","right":"Ad A: $15 per customer","wrong":[["Ad B, because spending more money on an ad always brings in better-quality customers","Same customers, double the cost."],["They're equal","Same customers, different cost."],["Ad B: $15 per customer","Ad B is $30."]],"exp":"Lower CAC means cheaper customers: $1,500 ÷ 100 = $15."}]},{"term":"Customer lifetime value (CLV)","def":"The estimated total one buyer will spend with a business over time; also called LTV.","hook":"What a loyal customer is worth.","asks":[{"q":"A coffee shop's regular spends $5 a visit, 3 times a week, for 4 years. What is she MOST valuable as?","right":"A high lifetime value customer","wrong":[["A low-value customer, because each of her individual purchases is only five dollars","Small purchases add up over time."],["A third-party customer","Not a term."],["A target market","One person."]],"exp":"Lifetime value counts what she spends over years, not one visit."},{"q":"Adventure Bound's loyalty program rewards repeat bookings. Which number is it MAINLY trying to raise?","right":"Lifetime value","wrong":[["Acquisition cost, because loyalty programs are mostly used to attract brand new customers","It rewards existing customers; CAC should fall."],["Impressions","Not an ad metric."],["Markup","Not pricing."]],"exp":"Loyalty programs aim to raise lifetime value."}]},{"term":"Relationship payoff","def":"Strong, lasting ties with buyers lower acquisition cost (through referrals) and raise lifetime value (through repeat purchases).","hook":"CAC down, CLV up.","asks":[{"q":"A gym's members start referring their friends. What happens to its CAC?","right":"It goes down","wrong":[["It goes up, because the gym now has many more new members to keep track of","Referrals bring customers cheaply."],["It stays the same","Referrals change it."],["It becomes negative","Not possible."]],"exp":"Referrals bring new customers without ad spending, lowering CAC."},{"q":"Jamba Juice's rewards app works on both key numbers. Which pairing is correct?","right":"Lower CAC, higher LTV","wrong":[["Higher CAC and lower LTV, since the app's rewards cost the company money on every order","Reversed."],["Higher CAC, higher LTV","Relationships lower CAC."],["Lower CAC, lower LTV","Repeat buying raises LTV."]],"exp":"Strong relationships lower acquisition cost and raise lifetime value."}]},{"term":"Data privacy risk","def":"Collecting or using customer information in ways customers don't know about or understand.","hook":"They didn't know you had it.","asks":[{"q":"An app shares users' location with advertisers, explained only in fine print. What's the MAIN problem?","right":"Users don't understand how their data is used","wrong":[["Nothing, because anything written in the terms and conditions is automatically ethical","Legal fine print doesn't build trust."],["It costs the app money","Not the issue."],["Location isn't data","It is."]],"exp":"Privacy violations happen when customers don't know or understand how data is used."},{"q":"Why should a business care about privacy even if no law is broken?","right":"Customers who feel misled stop trusting it","wrong":[["Privacy only matters for very large companies that are listed on the stock market","Every business depends on trust."],["It raises CAC to zero","No."],["Privacy has no effect on sales","It affects trust and loyalty."]],"exp":"Protecting data keeps customers' trust."}]},{"term":"Data breach","def":"Poor security that exposes customer information, leading to fraud, identity theft and a damaged reputation.","hook":"Unencrypted card numbers.","asks":[{"q":"Adventure Bound stores customers' card numbers unencrypted, and hackers steal them. This is:","right":"A data breach","wrong":[["A privacy risk only, because the company never meant for the card numbers to be stolen","Exposed data from poor security is a breach."],["A sales promotion","No."],["Third-party data","Not bought data."]],"exp":"Poor security that exposes data is a breach, risking fraud and identity theft."},{"q":"Besides fraud against customers, what is the BIGGEST cost of a breach to the business?","right":"Damage to its reputation","wrong":[["Its products become illegal to sell, since a breach cancels all of its business licenses","Too extreme."],["Its CAC drops","Lost trust usually raises it."],["More impressions","No."]],"exp":"Breaches damage trust and reputation."}]}],"intro":["Winning a customer costs money; keeping one pays off. Strong relationships (rewards programs, personal service, feedback surveys) bring referrals, which lowers the cost of winning customers, and repeat purchases, which raises what each customer is worth. Collecting data also brings risks: privacy problems and breaches can destroy trust."]}],"intro":["Topic 2.1 opens the marketing unit. Marketing is much bigger than ads: it starts with knowing who your customers are, why they buy, and how to keep them. The big ideas are customer data, choosing a target, and the two numbers that show whether customers are worth the effort: what it costs to win one and what one is worth over time."]},{"id":2,"name":"Consumer Behavior (2.2)","optional":false,"sections":[{"name":"How people decide","cards":[{"term":"Consumer behavior","def":"The study of why and how people make purchasing decisions.","hook":"Why we buy.","asks":[{"q":"A store owner asks why shoppers pick up snacks at the register but walk past the same snacks in aisle 5. Which field studies this?","right":"Consumer behavior","wrong":[["Quality control, because the snacks
