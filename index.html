"Hurts quality."],["Mass-producing identical units","Low-price."]],"exp":"Premium resources, precision and durability."}]},{"term":"Supply chain risks","def":"Events that raise costs or delay delivery, such as natural disasters, political instability, trade wars, resource shortages, production errors and problems with vendors.","hook":"What can break the chain.","asks":[{"q":"A laptop maker's shipping costs from South Korea rise due to new rules on cargo ships. This is:","right":"A supply chain risk","wrong":[["A strength of its mass-production process, which lowers the cost of each laptop","It's a risk, not a strength."],["Its corporate structure","Unrelated."],["Its operations expertise","Unrelated."]],"exp":"External changes that raise costs or delay delivery are supply chain risks."},{"q":"Which is most likely to delay deliveries and threaten a firm's advantage?","right":"Political instability where materials are sourced","wrong":[["Rising household incomes in the local market where the company sells products","That raises demand."],["A new vision statement","Internal."],["Choosing an LLC structure","Internal."]],"exp":"Political instability is a supply chain risk."}]},{"term":"Scaling operations","def":"Expanding capacity to produce and deliver more while keeping or improving efficiency.","hook":"Grow without slowing down.","asks":[{"q":"A laptop maker moves from hand-assembly to automated lines and its cost per unit falls. What did it do?","right":"Scaled its operations","wrong":[["Moved toward an artisan process in order to offer customers more customization","The opposite."],["Eliminated its finance department","Unrelated."],["Followed a hand-made trend","The opposite."]],"exp":"Scaling expands capacity while improving efficiency."},{"q":"How can scaling create a barrier to entry?","right":"New firms can't match the low costs","wrong":[["It makes the government stop new firms from entering the market legally","Not a legal barrier."],["It raises prices for everyone","It lowers costs."],["It ends competition forever","Too strong."]],"exp":"Newcomers lack the scale to match established costs."}]},{"term":"Economies of scale","def":"Lower cost per unit from producing more, because fixed costs are spread over more units.","hook":"Bigger, cheaper per unit.","asks":[{"q":"Why does producing 1 million units often cost less per unit than producing 1,000?","right":"Fixed costs are spread over more units","wrong":[["Workers are paid less per hour when the factory makes a larger number of units","Not the reason."],["Materials are free in bulk","Not free."],["Taxes disappear","No."]],"exp":"Spreading fixed costs lowers cost per unit."},{"q":"A large chain and a single shop sell the same product. Rising ingredient costs hurt the shop more. Why?","right":"The chain buys in volume and spreads costs","wrong":[["The single shop pays a special tax that only small businesses have to pay","Not stated."],["The chain doesn't buy ingredients","It does."],["The shop has more customers","Not the reason."]],"exp":"Scale gives large firms cost advantages."}]},{"term":"Exclusive agreements","def":"Contracts that stop suppliers from selling to rivals, creating a barrier to entry.","hook":"Suppliers locked in.","asks":[{"q":"A laptop maker signs a 3-year deal stopping its cooling supplier from selling to rivals. What does this create?","right":"A barrier to entry","wrong":[["Lower quality, since the supplier will stop improving its cooling systems","Not supported."],["A switch to a service model","No."],["A new corporate structure","No."]],"exp":"Exclusive agreements limit rivals' access to key parts."},{"q":"Why might a new rival struggle when an established firm has exclusive supplier contracts?","right":"It can't get the parts it needs","wrong":[["It lacks problem-solution fit because customers don't want the product","Not the issue."],["It didn't write a mission statement","Unrelated."],["It chose differentiation","Unrelated."]],"exp":"Locked-up suppliers block rivals."}]},{"term":"Restrictive distribution","def":"Limiting which retailers carry competitors' products, creating a barrier to entry.","hook":"Shelves locked in.","asks":[{"q":"A soda giant pushes stores to keep rival drinks off its coolers. Which barrier is this?","right":"Restrictive distribution","wrong":[["An exclusive agreement with suppliers, since it controls who makes the soda","This limits retailers, not suppliers."],["A patent","Unrelated."],["Limit pricing","Unrelated."]],"exp":"Limiting which retailers carry rivals is restrictive distribution."},{"q":"How does restrictive distribution hurt a new brand?","right":"It can't reach customers through stores","wrong":[["It raises the new brand's production costs by making materials more expensive","That's a supplier issue."],["It gives the brand a patent","No."],["It lowers its prices","Unrelated."]],"exp":"Blocked retail access keeps rivals off shelves."}]},{"term":"Globalization","def":"The growing connection between countries through trade, technology, communication and the movement of people, goods and money.","hook":"The world is connected.","asks":[{"q":"Students check clothing labels and find items made in Vietnam, Bangladesh and Mexico. What does this show?","right":"Globalization","wrong":[["Vertical integration, because one company made every item from start to finish","Unrelated."],["A recession","Unrelated."],["Collusion","Unrelated."]],"exp":"Goods made worldwide reflect global connections."},{"q":"Why does Ford use a global supply chain?","right":"Different regions make certain parts cheaper or better","wrong":[["The law requires automakers to buy every part from a different country","No such law."],["It removes all risk","It adds risk."],["It avoids mass production","It supports it."]],"exp":"Specialization lowers costs and improves access to inputs."}]},{"term":"Globalization trade-offs","def":"Benefits include more variety and lower prices; costs include lost jobs in industries that can't compete with imports and fragile, interdependent supply chains.","hook":"Winners and losers.","asks":[{"q":"Which is a disadvantage of globalization?","right":"Job losses in industries that can't compete with imports","wrong":[["A wider variety of goods and services available to consumers at home","An advantage."],["Lower prices","An advantage."],["Growth in some industries","An advantage."]],"exp":"Globalization creates winners and losers."},{"q":"Why can globalization make supply chains fragile?","right":"Countries depend on each other for inputs","wrong":[["Because global trade is illegal in most countries and can be stopped at any time","Not true."],["Because it raises prices","It usually lowers them."],["Because it reduces variety","It increases variety."]],"exp":"Interdependence means one disruption can spread."}]}],"intro":["Supply chains can create competitive advantage: low-price leadership through mass production and efficiency, or high-quality differentiation through premium materials and precision. They also face risks such as disasters, political instability, trade wars and supplier problems. Growing efficiently (scaling) lowers costs and can itself become a barrier to entry, as can exclusive agreements and control of distribution."]}],"intro":["Topic 1.8 follows a product from raw materials to the customer. Businesses choose how to produce (by hand or mass production), manage risks that can break the chain, and use their supply chains to compete on price or quality."]}],"sq":[],"flows":[{"id":"F1","title":"How a business idea becomes a business","deck":4,"steps":["Observe, interview, survey (find a real problem)","Validate: test, get feedback, iterate","Develop the solution","Build an MVP","Grow into an MMP and launch"]},{"id":"F2","title":"How a shortage fixes itself","deck":2,"steps":["Buyers want more than sellers offer (shortage)","Buyers compete, so the price rises","Quantity demanded falls, quantity supplied rises","The market moves to the equilibrium price"]},{"id":"F3","title":"How a surplus fixes itself","deck":2,"steps":["Sellers offer more than buyers want (surplus)","Sellers compete, so the price falls","Quantity demanded rises, quantity supplied falls","The market moves to the equilibrium price"]},{"id":"F4","title":"A product supply chain","deck":8,"steps":["Raw materials","Suppliers","Manufacturers","Distributors and wholesalers","Retailers","Consumers"]}],"trees":["WHERE BUSINESS IDEAS GO\nProblem (observe, interview, survey)\n└─ Validation (test → feedback → iterate)\n   └─ Solution development\n      └─ MVP (functional → reliable → usable → engaging)\n         └─ MMP (ready for a larger group)","BUSINESS STRUCTURES BY LIABILITY\nUnlimited liability\n├─ Sole proprietorship (one owner)\n└─ Partnership (two or more owners)\nLimited liability\n├─ LLC (members; flexible; no stock)\n└─ Corporation (shareholders; board; sells stock)\n   ├─ C-corporation (double taxation)\n   └─ S-corporation (pass-through; ≤100 shareholders)"],"tables":[{"title":"The four market structures","rows":[["Structure","Number of firms","Product","Control over price","Barriers to entry","Examples"],["Perfect competition","Many small firms","Identical","None (price takers)","None or very low","Wheat, corn, soybeans"],["Monopolistic competition","Many firms","Differentiated","Some","Low","Restaurants, gyms, hair salons"],["Oligopoly","Few large firms","Identical or differentiated","A lot, but firms depend on each other","High","Airlines, smartphones, soda"],["Monopoly","One firm","Unique","Total","High","Local utilities, patented drugs"]]},{"title":"Business structures","rows":[["Structure","Owners","Liability","Management","Access to funds"],["Sole proprietorship","One owner","Unlimited","Owner decides everything","Very limited (savings, credit)"],["Partnership","Two or more","Usually unlimited","Shared by partners","Limited to moderate"],["LLC","One or more members","Limited","Flexible","Moderate; investors but no stock"],["Corporation","Shareholders","Limited","Executives under a board of directors","Greatest; sells stock"]]},{"title":"PESTEL at a glance","rows":[["Factor","What it covers","Example"],["Political","Government actions and policies","Tax credit for solar panels; tariffs"],["Economic","How the economy is doing","Inflation; interest rates rising from 4% to 7%"],["Social","Trends in society and culture","More people want high-protein meals"],["Technological","New technology available to everyone","A new food-delivery platform; automation"],["Environmental","Nature and environmental concerns","Floods; heat waves; green attitudes"],["Legal","Specific laws a business must follow","Labeling rules; recycling requirements"]]},{"title":"Departments and what they do","rows":[["Department","Job","Typical task"],["Sales and marketing","Win and keep customers","Ad campaign; find a new target market"],["R&D","Design and improve products","Test an improved version"],["Operations","Produce and deliver","Schedule production; fix late deliveries"],["Accounting","Record the money","Prepare financial statements"],["Finance","Plan the money","Decide whether to borrow for a $2M expansion"],["Human resources","People","Hire 75 tutors; plan training"]]},{"title":"Three kinds of organization","rows":[["Type","Goal","Example"],["For-profit","Profit for owners","Walmart, Apple"],["Social enterprise","Profit plus social or environmental goals","Patagonia, TOMS"],["Nonprofit","Public good; surplus reinvested by law","Red Cross, Habitat for Humanity"]]}],"watch":[{"deck":1,"text":"Product-market fit has two definitions in your materials. Your study guide: at least 40% of surveyed users would be \"very disappointed\" if the product disappeared. Your Unit 2 slides and notes: there is enough customer demand to make the business viable. Know both; they describe the same idea."},{"deck":1,"text":"Value capture is described two ways: \"charging above the cost of production\" (study guide) and \"earning revenue and profit from the value created\" (slides). On a number question, value captured per unit = price − cost."},{"deck":2,"text":"The candy simulation chart in your scan is hard to read next to \"Oligopoly.\" Your 1.2 slides and quiz agree: oligopolies have HIGH barriers to entry; monopolistic competition has LOW barriers."},{"deck":3,"text":"Your 1.3 slides label regulators checking Tesla's self-driving software as a political factor, but by the slides' own definitions (political = policy priorities, legal = specific laws and regulations) it reads as legal. If a test question gives both choices, look for clues: a new law or rule a firm must follow is legal; a government's priorities or policy choices are political."},{"deck":3,"text":"A company's own new technology or hire is not a PESTEL factor (your slides' Tesla battery example and practice test question 14)."},{"deck":4,"text":"The 1.4 slides could not be opened, so this deck comes only from your one-page study guide. VERIFY anything your teacher added in class."},{"deck":5,"text":"Your study guide lists only for-profit and nonprofit organizations; the 1.5 slides add social enterprises (profit plus a social or environmental goal). Know all three."},{"deck":6,"text":"There are no 1.6 Ethics slides in your Drive; this deck comes from the study guide and the ethics questions on your practice test. VERIFY anything your teacher added."},{"deck":7,"text":"Your slides teach four structures (sole proprietorship, partnership, LLC, corporation). Your study guide also splits corporations into C-corporations (double taxation) and S-corporations (pass-through, at most 100 shareholders)."},{"deck":8,"text":"Your study guide names the chain sourcing → manufacturing → warehousing → logistics → consumption; your slides name the businesses (raw materials → suppliers → manufacturers → distributors/wholesalers → retailers). Same chain, different labels."}],"practice":{"sections":[{"name":"Set A: Markets, PESTEL and new ideas (1.1-1.4)","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"A1":{"title":"Pumpkin bread at the fall fair","attr":"Practice scenario: a market with a fixed number of sellers.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Five bakeries sell pumpkin bread at a weekend fair. Each loaf is nearly the same. Over the morning, the bakeries tracked how many loaves people wanted at each price."],"table":[["Price per loaf","Loaves buyers want","Loaves bakeries offer"],["$4","300","150"],["$6","220","220"],["$8","140","290"]]},"A2":{"title":"Snack subscription box","attr":"Practice scenario: a new company.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["SnackDrop mails a monthly box of healthy snacks to college students. Most boxes are bought by parents as gifts. To test the idea, the founder first shipped 40 hand-packed boxes to students on one campus and asked what they liked. Students wanted fewer granola bars and more savory snacks, so the next boxes changed. Each box sells for $30 and costs $18 to fill and ship."]},"A3":{"title":"Changes facing a bike-share company","attr":"Practice scenario: outside changes.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["CityCycle rents bikes and scooters by the minute in a large city. Its managers listed recent changes."],"table":[["Change","Notes"],["City council votes to fund 40 miles of new bike lanes","Policy decision"],["Gas prices rise sharply","Commuters look for cheaper travel"],["Younger workers prefer not to own cars","Lifestyle trend"],["New law requires helmets for scooter riders under 18","Must comply by spring"],["CityCycle launches its own new app","Released last month"]]}},"questions":[{"id":"SA-1","type":"mcq","skill":"Shortage","topic":"1.2","stem":"At $4 a loaf, what is happening in this market?","options":["A surplus, because bakeries are offering more loaves than buyers will take","A shortage, so prices will rise","Equilibrium, since some loaves are still selling","A surplus, so prices will fall"],"ans":1,"exp":"300 wanted vs. 150 offered: buyers compete and price rises.","why":["At $4 buyers want 300 but only 150 are offered.","","Quantities aren't equal.","Reversed."],"src":"A1"},{"id":"SA-2","type":"mcq","skill":"Equilibrium","topic":"1.2","stem":"What is the equilibrium price at the fair?","options":["$8, because that is the price at which the bakeries would earn the most money","$6","$4","$5"],"ans":1,"exp":"At $6, 220 wanted = 220 offered.","why":["At $8 there's a surplus of 150.","","Shortage.","No data; $6 is where they match."],"src":"A1"},{"id":"SA-3","type":"mcq","skill":"Market structure","topic":"1.2","stem":"Suppose 60 bakeries sold identical loaves. Which statement would BEST describe each bakery?","options":["It controls the market price because its bread is fresh and baked that day","It is a monopoly","It is a price taker","It is part of an oligopoly"],"ans":2,"exp":"Many sellers of identical products = perfect competition; each must take the going price.","why":["Identical products give no pricing power.","Many sellers.","","Many small firms."],"src":"A1"},{"id":"SA-4","type":"mcq","skill":"Customers","topic":"1.1","stem":"In most SnackDrop sales, who is the customer?","options":["The parent who buys the box","The college student, because the student opens the box and eats the snacks inside","The snack makers","The founder"],"ans":0,"exp":"The customer pays and decides.","why":["","That's the consumer.","Suppliers.","Owner."],"src":"A2"},{"id":"SA-5","type":"mcq","skill":"Value capture","topic":"1.1","stem":"How much value does SnackDrop capture per box?","options":["$30, which is the full amount that the parent pays SnackDrop for each box","$18","$12","$48"],"ans":2,"exp":"$30 − $18 = $12.","why":["That's the price.","That's the cost.","","Price plus cost."],"src":"A2"},{"id":"SA-6","type":"mcq","skill":"MVP","topic":"1.4","stem":"The 40 hand-packed boxes are BEST described as:","options":["A minimum viable product","A minimum marketable product, since the founder sold them to real students on campus","Mass production","A value proposition"],"ans":0,"exp":"A simple version built to test demand.","why":["","An MMP comes later, for a larger market.","Hand-packed, small run.","That's a statement."],"src":"A2"},{"id":"SA-7","type":"mcq","skill":"Iteration","topic":"1.4","stem":"Changing the snacks after student feedback shows:","options":["Limit pricing, because the founder is trying to keep rival snack boxes out of the market","Vertical integration","Product-market fit is proven","Build-measure-learn"],"ans":3,"exp":"Launch, gather feedback, refine.","why":["Not about price.","No.","One test doesn't prove it.",""],"src":"A2"},{"id":"SA-8","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"The council's vote to fund bike lanes is BEST classified as:","options":["Environmental, because more people riding bikes would help reduce air pollution","Legal","Political","Social"],"ans":2,"exp":"Government spending priorities are political.","why":["The change is a government policy decision.","Not a law CityCycle must obey.","","Not a lifestyle trend."],"src":"A3"},{"id":"SA-9","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which change is NOT a PESTEL factor for CityCycle?","options":["CityCycle's own new app","The helmet law, because CityCycle has to change its rules to comply by spring","Rising gas prices","Younger workers avoiding cars"],"ans":0,"exp":"A firm's own launch is an internal decision.","why":["","That's external and legal.","Economic.","Social."],"src":"A3"},{"id":"SA-10","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which change is a threat rather than an opportunity for CityCycle?","options":["Rising gas prices, because they increase the cost of fuel for everyone in the city","The helmet law for riders under 18","New bike lanes","Fewer young car owners"],"ans":1,"exp":"It adds compliance costs and may cut young riders.","why":["They push commuters toward bikes.","","Opportunity.","Opportunity."],"src":"A3"},{"id":"SA-11","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Rising gas prices are BEST classified as:","options":["Environmental, because burning gasoline releases pollution into the city's air","Political","Technological","Economic"],"ans":3,"exp":"Prices and spending power are economic.","why":["The change is about prices.","Not a policy.","No.",""],"src":"A3"}]},{"name":"Set B: Structures, ethics and supply chains (1.5-1.8)","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"B1":{"title":"Two founders, one decision","attr":"Practice scenario: choosing a structure.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Maya and Jordan plan to open a rock-climbing gym. They need $1.2 million for walls, equipment and a building lease. Climbing gyms face the risk of injury lawsuits. Neither founder wants personal savings or a house put at risk, and they want to keep running the business themselves without a board of directors."]},"B2":{"title":"A promise on the box","attr":"Practice scenario: ethics at a food company.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Harvest Bar's slogan is \"Honest food, nothing hidden.\" A supplier offers a cheaper sweetener that would lower costs by 12%, but the label would have to list it, and many customers avoid it. A manager suggests buying it and keeping the old label for six months until the boxes run out. Store managers earn bonuses only when costs fall."]},"B3":{"title":"Two ways to make a guitar","attr":"Practice scenario: comparing production methods.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Two companies make acoustic guitars."],"table":[["","Oakline Guitars","StrumCo"],["Guitars per year","300","120,000"],["How they're made","Skilled builders by hand; each one different","Assembly lines and machines"],["Average cost per guitar","$1,400","$95"],["Average price","$3,200","$180"]]}},"questions":[{"id":"SB-1","type":"mcq","skill":"Structures","topic":"1.7","stem":"Which structure BEST fits Maya and Jordan's goals?","options":["A partnership, because there are exactly two founders who want to share decisions","An LLC","A C-corporation","A sole proprietorship"],"ans":1,"exp":"Limited liability plus flexible management without a board.","why":["Partners are usually personally liable.","","They want no board.","Two owners and unlimited liability."],"src":"B1"},{"id":"SB-2","type":"mcq","skill":"Liability","topic":"1.7","stem":"Why does the risk of lawsuits matter MOST in their decision?","options":["Lawsuits are a PESTEL factor, so the founders need to list them in a PESTEL analysis","It raises startup costs","Unlimited liability would put their homes at risk","It changes their mission"],"ans":2,"exp":"Liability determines whether personal assets can be taken.","why":["That doesn't answer the structure question.","Not the main issue.","","Unrelated."],"src":"B1"},{"id":"SB-3","type":"mcq","skill":"Corporation","topic":"1.7","stem":"Why might they choose a corporation later?","options":["To avoid all rules and paperwork, since corporations face the least regulation","To keep full control","To raise more money by selling stock","To avoid any taxes"],"ans":2,"exp":"Corporations have the greatest access to funding.","why":["Corporations face the most rules.","A board oversees it.","","C-corps face double taxation."],"src":"B1"},{"id":"SB-4","type":"mcq","skill":"Ethics","topic":"1.6","stem":"Keeping the old label after switching sweeteners would be unethical MAINLY because it:","options":["Lowers costs by 12%, which reduces the quality of the bars that customers buy","Changes a supplier","Breaks a trademark","Conceals information from customers"],"ans":3,"exp":"Concealing data is unethical behavior.","why":["Lower costs alone aren't unethical.","Normal business.","Not stated.",""],"src":"B2"},{"id":"SB-5","type":"mcq","skill":"Frameworks","topic":"1.6","stem":"Which framework points MOST directly against the manager's idea?","options":["Strategic alignment","Net benefit, because only the money saved by the company matters in this decision","Limit pricing","Economies of scale"],"ans":0,"exp":"\"Honest food, nothing hidden\" conflicts with hiding the change.","why":["","Net benefit weighs everyone, not just savings.","Not an ethics framework.","Not ethics."],"src":"B2"},{"id":"SB-6","type":"mcq","skill":"Incentives","topic":"1.6","stem":"What would MOST reduce pressure to hide changes like this?","options":["A larger bonus for managers who find the biggest cost savings each quarter","Bonuses that don't reward cost cuts alone","A new slogan","Fewer suppliers"],"ans":1,"exp":"Poor incentive structures push people toward unethical choices.","why":["Increases the pressure.","","Doesn't change behavior.","Unrelated."],"src":"B2"},{"id":"SB-7","type":"mcq","skill":"Production","topic":"1.8","stem":"Oakline Guitars uses which kind of production?","options":["Artisan production","Mass production, since its guitars sell for a much higher price than StrumCo's","Outsourcing","Vertical integration"],"ans":0,"exp":"Skilled labor, unique items, higher cost per unit.","why":["","Price doesn't define it; hand-built small runs do.","Not stated.","Not stated."],"src":"B3"},{"id":"SB-8","type":"mcq","skill":"Economies of scale","topic":"1.8","stem":"Why is StrumCo's cost per guitar so much lower?","options":["Economies of scale","Its builders are more skilled than Oakline's builders and work much more carefully","A patent","Limit pricing"],"ans":0,"exp":"Fixed costs spread over 120,000 guitars.","why":["","Machines, not skill, cut its cost.","Not stated.","That's about price, not cost."],"src":"B3"},{"id":"SB-9","type":"mcq","skill":"Strategy","topic":"1.8","stem":"Which supply chain strategy does Oakline follow?","options":["Low-price leadership, because it makes far fewer guitars and has lower total costs","Mass production","Restrictive distribution","High-quality differentiation"],"ans":3,"exp":"Premium craft and precision.","why":["It charges premium prices.","No.","Not stated.",""],"src":"B3"}]},{"name":"Math drills: profit, value capture, market share","mode":"practice","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{},"questions":[{"id":"MD-1","type":"mcq","skill":"Math","topic":"1.1","stem":"A food truck's revenue last week was $5,600. Its costs were $2,100 for food, $1,500 for wages and $900 for fuel and fees. What was its profit?","options":["$4,500, the total amount the food truck spent on food, wages, fuel and fees","$1,100","$3,500","$2,600"],"ans":1,"exp":"$5,600 − ($2,100 + $1,500 + $900) = $1,100.","why":["That's total cost.","","Subtracts only food.","Leaves out the wages."]},{"id":"MD-2","type":"mcq","skill":"Math","topic":"1.1","stem":"A shop had revenue of $8,000 and total costs of $9,250. What is its result?","options":["A loss of $1,250","A profit of $1,250, because revenue and costs are both reported for the same month","A profit of $17,250","A loss of $9,250"],"ans":0,"exp":"$8,000 − $9,250 = −$1,250.","why":["","Costs are greater than revenue.","Added them.","That's total cost."]},{"id":"MD-3","type":"mcq","skill":"Math","topic":"1.1","stem":"A phone case costs $4 to make and sells for $15. How much value is captured per case?","options":["$15, because that is the full price the customer pays for each phone case","$19","$4","$11"],"ans":3,"exp":"$15 − $4 = $11.","why":["That's the price.","Added.","That's the cost.",""]},{"id":"MD-4","type":"mcq","skill":"Math","topic":"1.2","stem":"A market sells 2,000,000 sneakers a year. One brand sells 500,000. What is its market share?","options":["40%, because it sells the most sneakers of any single brand in this market","25%","4%","50%"],"ans":1,"exp":"500,000 ÷ 2,000,000 = 25%.","why":["Not supported by the math.","","Divided wrong.","Off by double."]},{"id":"MD-5","type":"mcq","skill":"Math","topic":"1.2","stem":"Brand X sells 30,000 units in a market of 120,000. Next year the market grows to 150,000 and Brand X still sells 30,000. Its share:","options":["Stays at 25%, because Brand X sold exactly the same number of units both years","Rises to 30%","Falls from 25% to 20%","Falls to 15%"],"ans":2,"exp":"30,000 ÷ 120,000 = 25%; 30,000 ÷ 150,000 = 20%.","why":["The total grew.","Wrong direction.","","Math error."]},{"id":"MD-6","type":"mcq","skill":"Math","topic":"1.4","stem":"Your study guide's product-market fit test: at least 40% of surveyed users would be very disappointed without the product. Of 350 users, 126 say so. Does it pass?","options":["No, it's 36%","Yes, because more than one hundred of the users surveyed said they would be disappointed","Yes, it's 46%","No, it's 26%"],"ans":0,"exp":"126 ÷ 350 = 36%, below 40%.","why":["","The test is a percentage.","Math error.","Math error."]}]},{"name":"Mock test (40 questions)","mode":"exam","tips":["Read the question first, then the scenario, so you know what to look for.","Several choices can be true. Pick the one the scenario supports BEST.","Use the numbers: if a table is given, at least one question needs it.","Watch for choices that are too extreme (\"always,\" \"guarantees\") or that answer a different question."],"sources":{"M1":{"title":"Trailhead Tutoring","attr":"Practice scenario: a tutoring startup.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Trailhead Tutoring matches high school students with college tutors for online test prep. Parents sign up and pay a monthly fee; students choose their tutors and attend the sessions. The founder tells employees that the company's long-term goal is \"to become the most trusted name in test prep in the region.\" On its website, the company explains: \"We connect students with trained college tutors through live online sessions that fit busy schedules.\"","A recent survey found that 82% of students said Trailhead saved them time compared with driving to a tutoring center. Last month the company reported the following results."],"table":[["Item","Amount"],["Subscription revenue","$24,000"],["Tutor pay","$13,500"],["Software and website","$3,000"],["Advertising","$2,500"],["Other expenses","$1,000"]]},"M2":{"title":"The home-battery market","attr":"Practice scenario: an industry data set.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Home batteries store solar power for use at night. Building a battery factory and getting safety approval costs hundreds of millions of dollars. VoltHome holds a patent on a fast-charging design that no rival can legally copy until 2031, and it has signed an exclusive contract with the country's largest supplier of a key chemical. VoltHome's battery sells for $9,000, compared with an industry average of $7,500."],"table":[["Company","Units sold (thousands)","Market share"],["VoltHome","180","36%"],["PowerNest","150","30%"],["SunVault","100","20%"],["Others","70","14%"]]},"M3":{"title":"Bright Juice expansion report","attr":"Practice scenario: a PESTEL review before expanding.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Bright Juice runs 40 fresh-juice bars and is deciding whether to open 15 locations in a neighboring state. Managers reviewed the developments below. Bright Juice also recently trained all of its staff on a new ordering system it designed itself."],"table":[["Development","Expected impact"],["The state plans a tax on sugary drinks","Higher prices for some menu items"],["Interest rates have risen sharply","Higher cost of borrowing to build stores"],["More young adults want low-sugar, plant-based drinks","Higher demand"],["A popular delivery app is expanding across the state","More ways to reach customers"],["A new law requires calorie labels on all menus","Higher compliance costs"]]},"M4":{"title":"Kit Kart","attr":"Practice scenario: testing a business idea.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Dev noticed that families at youth soccer tournaments struggle to carry chairs, coolers and gear between fields. He imagines a foldable wagon with a built-in cooler. His business hypothesis: at least 30% of surveyed parents will pay $120 for it. He surveyed parents at three tournaments and built five working wagons for families to try for a weekend. Families said the wagon was helpful but the handle was too short, so he redesigned it before ordering any production run."],"table":[["Survey result","Parents"],["Parents surveyed","250"],["Interested in the wagon","190"],["Would pay $120","55"],["Would pay $80","140"]]},"M5":{"title":"ClearView Labs","attr":"Practice scenario: a business decision with competing responsibilities.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["ClearView Labs makes a home air-quality monitor. Final tests show that about 4% of units sometimes report pollution levels slightly higher than the real level. The error poses no safety risk, and engineers believe a software update can fix it within two months.","Delaying the launch would cost about $5 million in lost holiday sales and could let a rival launch first. Launching on time would meet investor expectations. The sales team receives large bonuses based only on how many units ship this quarter, and some sales managers are pushing to launch without telling customers about the issue. Executives are weighing the interests of customers, employees, investors and retailers."]},"M6":{"title":"Rivera Roasters","attr":"Practice scenario: a growing business.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Ana Rivera started a coffee-roasting business on her own, selling bags at farmers markets. As sales grew, her friend Ben joined as a co-owner; Ana manages roasting and supplies, while Ben handles café clients and the website. They hired an outside firm to do their taxes and payroll.","Now a grocery chain wants to stock their coffee in 200 stores. The contract includes large penalties if deliveries are late. To fill the order, the owners would need to buy a $600,000 roaster and hire 20 employees. They are considering changing their business structure."]},"M7":{"title":"GreenLeaf Phone Cases","attr":"Practice scenario: a supply chain disruption.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["GreenLeaf makes phone cases from recycled plastic. It buys recycled pellets from a supplier overseas, molds the cases in its own factory, ships them to a national distributor, and the distributor delivers them to electronics stores. This month, a typhoon closed the supplier's port for three weeks. GreenLeaf's factory has only one week of pellets on hand."],"table":[["Stage","Business","Status"],["Supplier","Overseas pellet maker","Port closed 3 weeks"],["Manufacturer","GreenLeaf factory","1 week of materials left"],["Distributor","National distributor","Normal"],["Retailers","Electronics stores","Normal; holiday demand rising"]]},"M8":{"title":"Stride Shoes","attr":"Practice scenario: values and competencies.","label":"Practice scenario written for this kit from your class materials; the company is made up.","paras":["Stride Shoes sells running shoes made from recycled materials and donates part of its profits to youth sports programs. Its engineers are known for designing unusually lightweight soles, and customers rate this as the main reason they choose Stride over cheaper brands. A large retailer offers to sell Stride's shoes nationwide if Stride switches to cheaper, non-recycled materials to lower the price. The founders turn down the offer because it conflicts with their commitment to sustainability."]}},"questions":[{"id":"MK-1","type":"mcq","skill":"Customers","topic":"1.1","stem":"Who is Trailhead Tutoring's customer?","options":["The students, because they choose their tutors and attend every tutoring session","The college tutors","The software company","The parents who pay the fee"],"ans":3,"exp":"The customer pays and decides; the student is the consumer.","why":["Students use the service: they are consumers.","They work for the company.","A supplier.",""],"src":"M1"},{"id":"MK-2","type":"mcq","skill":"Value","topic":"1.1","stem":"Which piece of evidence best shows value creation?","options":["The company collected $24,000 in subscription revenue from parents last month","The founder's long-term goal","82% of students say it saves them time","Advertising cost $2,500"],"ans":2,"exp":"Benefits to customers are value creation.","why":["Revenue is value capture.","That's a vision.","","A cost."],"src":"M1"},{"id":"MK-3","type":"mcq","skill":"Profit","topic":"1.1","stem":"Based on the table, what was Trailhead's profit last month?","options":["$24,000, which is the total amount the company collected from parents this month","$4,000","$10,500","$20,000"],"ans":1,"exp":"$24,000 − ($13,500 + $3,000 + $2,500 + $1,000) = $4,000.","why":["That's revenue.","","That subtracts only tutor pay.","That's total costs."],"src":"M1"},{"id":"MK-4","type":"mcq","skill":"Vision","topic":"1.5","stem":"\"To become the most trusted name in test prep in the region\" is best described as Trailhead's:","options":["Mission statement, since it tells employees what the company does for parents","Value proposition","Vision statement","Core competency"],"ans":2,"exp":"Vision: where the business aspires to go.","why":["It states where the company wants to go.","Not why to choose a product.","","Not a skill."],"src":"M1"},{"id":"MK-5","type":"mcq","skill":"Mission","topic":"1.5","stem":"Which proposal would MOST support Trailhead's vision?","options":["Cut prices sharply and hire any available tutor to grow as quickly as possible","Train tutors well and expand carefully","Stop surveying students","Raise prices without changes"],"ans":1,"exp":"Becoming the most trusted name depends on quality.","why":["Speed and low prices can hurt trust.","","Feedback builds trust.","Doesn't build trust."],"src":"M1"},{"id":"MK-6","type":"mcq","skill":"Market structure","topic":"1.2","stem":"Based on the information, the home-battery market is BEST described as:","options":["Monopolistic competition, since each company's battery is a little bit different","An oligopoly","Perfect competition","A monopoly"],"ans":1,"exp":"Three firms hold 86% of sales, and entry costs hundreds of millions.","why":["A few firms dominate behind high barriers.","","Few firms, high barriers.","Several firms."],"src":"M2"},{"id":"MK-7","type":"mcq","skill":"Barriers","topic":"1.2","stem":"Which barrier to entry protects VoltHome specifically, rather than every firm in the market?","options":["Its patent and exclusive supplier contract","The huge cost of building a factory and getting the batteries approved for safety","Its 36% market share","Its price"],"ans":0,"exp":"The patent and exclusive contract belong to VoltHome alone.","why":["","That barrier protects all existing firms.","A result, not a barrier.","Not a barrier."],"src":"M2"},{"id":"MK-8","type":"mcq","skill":"Competitive advantage","topic":"1.2","stem":"Why can VoltHome charge $1,500 more than the industry average?","options":["Prices in every market are set by the company with the largest market share","Buyers prefer high prices","The government sets its price","Its patented design is differentiated"],"ans":3,"exp":"A unique, protected feature gives pricing power.","why":["Not how prices are set.","No.","Not stated.",""],"src":"M2"},{"id":"MK-9","type":"mcq","skill":"Market share","topic":"1.2","stem":"If total sales grow by 20% next year but VoltHome still sells 180,000 units, what happens to its market share?","options":["It falls","It rises, because VoltHome is selling in a market that is growing quickly","It stays at 36%","It doubles"],"ans":0,"exp":"Same sales in a bigger market means a smaller share.","why":["","Its sales stay flat while the market grows.","The total grew.","No."],"src":"M2"},{"id":"MK-10","type":"mcq","skill":"Patent","topic":"1.2","stem":"What is MOST likely to happen to VoltHome after 2031?","options":["VoltHome will become a monopoly, since its patent gives it permanent control of batteries","Rivals may copy its fast-charging design","Its costs will vanish","Demand will end"],"ans":1,"exp":"Patents give temporary protection.","why":["Patents expire.","","Unrelated.","Not supported."],"src":"M2"},{"id":"MK-11","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which development is NOT part of a PESTEL analysis?","options":["A popular delivery app expanding across the neighboring state","Bright Juice training staff on its own ordering system","Rising interest rates","A calorie-label law"],"ans":1,"exp":"A company's own decisions are internal.","why":["That's an external technological factor.","","Economic.","Legal."],"src":"M3"},{"id":"MK-12","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"The planned tax on sugary drinks is BEST classified as:","options":["An economic factor, because it raises the prices that customers pay for drinks","A social factor","A political factor","An environmental factor"],"ans":2,"exp":"Taxes are government policy decisions.","why":["It's a government policy choice.","Not a trend.","","Unrelated."],"src":"M3"},{"id":"MK-13","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which combination would MOST encourage Bright Juice to expand?","options":["The sugar tax and the calorie-label law, which affect every juice company equally","Higher interest rates and the sugar tax","The low-sugar trend and the delivery app","The calorie law and higher rates"],"ans":2,"exp":"A social trend raising demand plus a new channel to customers are opportunities.","why":["Both raise costs.","Both obstacles.","","Both obstacles."],"src":"M3"},{"id":"MK-14","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which development is MOST likely the biggest immediate obstacle to building 15 new stores?","options":["The low-sugar trend, which might reduce how much juice customers want to buy","The delivery app","Staff training","Higher interest rates"],"ans":3,"exp":"Building stores requires borrowing, which now costs more.","why":["It raises demand.","An opportunity.","Internal.",""],"src":"M3"},{"id":"MK-15","type":"mcq","skill":"PESTEL","topic":"1.3","stem":"Which pairing is correct?","options":["Delivery app: social, because people are changing how they like to order food","Low-sugar trend: economic","Interest rates: political","Calorie-label law: legal"],"ans":3,"exp":"A specific law a business must follow is legal.","why":["The platform itself is technological.","Social.","Economic.",""],"src":"M3"},{"id":"MK-16","type":"mcq","skill":"Idea generation","topic":"1.4","stem":"How did Dev most likely find the problem?","options":["By studying a government report on the size of the youth soccer market","By copying a rival","By observing families at tournaments","By building a factory"],"ans":2,"exp":"Observation is a source of business ideas.","why":["That's secondary research, not how he found it.","Not stated.","","No."],"src":"M4"},{"id":"MK-17","type":"mcq","skill":"Hypothesis","topic":"1.4","stem":"Based on the survey, what should Dev conclude about his hypothesis?","options":["It is not supported at $120","It is supported, because 190 of the 250 parents said they were interested in the wagon","He should raise the price","He needs no more research"],"ans":0,"exp":"55 ÷ 250 = 22%, below the 30% benchmark.","why":["","Interest isn't willingness to pay $120.","Data don't support that.","Results suggest revising."],"src":"M4"},{"id":"MK-18","type":"mcq","skill":"MVP","topic":"1.4","stem":"Building five working wagons for families to try was MAINLY meant to:","options":["Stop sporting goods companies from copying the wagon before it reaches the stores","Set the final price","Cut production costs","Test whether it meets families' needs"],"ans":3,"exp":"Testing working versions with users is validation.","why":["Not the purpose.","Not mainly.","Not mainly.",""],"src":"M4"},{"id":"MK-19","type":"mcq","skill":"Iteration","topic":"1.4","stem":"Redesigning the handle after feedback is an example of:","options":["Iteration","Mass production, because Dev is getting ready to manufacture many wagons","Limit pricing","Vertical integration"],"ans":0,"exp":"Improving based on feedback is iteration.","why":["","Not yet producing.","Unrelated.","Unrelated."],"src":"M4"},{"id":"MK-20","type":"mcq","skill":"Evidence","topic":"1.4","stem":"Which additional information would MOST help Dev judge whether the survey is reliable?","options":["Whether rival companies have started selling wagons with built-in coolers","Whether he can make enough wagons","Whether these parents represent his target customers","Whether he likes the design"],"ans":2,"exp":"A survey is reliable only if the sample represents the target market.","why":["That's about competition.","Feasibility, not reliability.","","Opinion."],"src":"M4"},{"id":"MK-21","type":"mcq","skill":"Ethics","topic":"1.6","stem":"Which statement BEST describes ClearView's situation?","options":["An ethical dilemma with competing responsibilities","A conflict between two market segments that want different monitor features","A pricing decision","A supply chain risk"],"ans":0,"exp":"Customers, investors and employees pull in different directions.","why":["","Not about segments.","Not about price.","Not the main issue."],"src":"M5"},{"id":"MK-22","type":"mcq","skill":"Incentives","topic":"1.6","stem":"Which factor is MOST likely pushing some managers toward an unethical choice?","options":["Bonuses based only on units shipped","The engineers' estimate that a software update can fix the problem in two months","The 4% error rate","Retailers' interests"],"ans":0,"exp":"Poor incentive structures push people toward unethical choices.","why":["","That's information, not pressure.","A fact.","Not stated as pressure."],"src":"M5"},{"id":"MK-23","type":"mcq","skill":"Stakeholders","topic":"1.6","stem":"If ClearView launches without telling customers, who is MOST directly affected first?","options":["Investors, who expect the company to meet its sales targets this quarter","Retailers","Engineers","Customers using the monitors"],"ans":3,"exp":"Customers, external stakeholders, feel it first.","why":["Not first.","Less directly.","Less directly.",""],"src":"M5"},{"id":"MK-24","type":"mcq","skill":"Frameworks","topic":"1.6","stem":"Which approach would BEST help executives decide?","options":["Choose whatever gives investors the largest return in the short run","Choose the most total benefit and least total harm","Choose what most managers want","Choose the fewest schedule changes"],"ans":1,"exp":"The net benefit framework weighs all stakeholders.","why":["Ignores other stakeholders.","","Popularity isn't a framework.","Not ethical reasoning."],"src":"M5"},{"id":"MK-25","type":"mcq","skill":"Accountability","topic":"1.6","stem":"Which change would MOST directly discourage unethical choices in the future?","options":["Increase the bonus for shipping units so that the sales team works even harder","Remove the engineers","Reward honest reporting, not just units shipped","Delay all launches forever"],"ans":2,"exp":"Fixing incentives addresses the root cause.","why":["Worsens the pressure.","No.","","Too extreme."],"src":"M5"},{"id":"MK-26","type":"mcq","skill":"Structures","topic":"1.7","stem":"When Ana sold coffee by herself at farmers markets, her business was a:","options":["Sole proprietorship","Limited liability company, since she was the only person responsible for it","Corporation","Partnership"],"ans":0,"exp":"One owner with no legal separation.","why":["","Nothing suggests she formed an LLC.","No shareholders.","One owner."],"src":"M6"},{"id":"MK-27","type":"mcq","skill":"Structures","topic":"1.7","stem":"Which factor BEST justifies changing from a partnership to an LLC now?","options":["More personal financial risk from the contract","The owners want to hire twenty employees and buy a large new roasting machine","They outsource taxes","They sell at farmers markets"],"ans":0,"exp":"Penalties and big purchases raise risk; an LLC limits liability.","why":["","Any structure can hire and buy.","Unrelated.","Unrelated."],"src":"M6"},{"id":"MK-28","type":"mcq","skill":"Outsourcing","topic":"1.7","stem":"Why did the owners MOST likely hire an outside firm for taxes and payroll?","options":["To gain control of every stage of the coffee supply chain from farm to "use strict";
/* Shared helpers, storage keys and the unit picked in the address (#unit-id). */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const shuf = (a) => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const ask = (m) => (typeof confirm === "function" ? confirm(m) : true);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const fmt1 = (x) => String(Math.round(x * 10) / 10);

/* Which unit is open: the part of the address after #. No match means the course home page. */
const UNIT = (() => {
  const id = decodeURIComponent(location.hash.slice(1));
  return COURSE.units.find((u) => u.id === id) || null;
})();
const D = UNIT ? UNITDATA[UNIT.id] : null;
addEventListener("hashchange", () => location.reload());

/* Saved progress is namespaced per course and unit, so kits on the same github.io site never overwrite each other. */
const keyOf = (u, part) => "sk:" + COURSE.id + ":" + u.id + ":" + part;
const PREFK = "sk:" + COURSE.id + ":prefs";
COURSE.units.forEach((u) => {
  /* One-time copy from the keys the old single-unit kits used. */
  const legacy = u.legacyKeys || {};
  ["kit", "pt"].forEach((part) => {
    try {
      const k = keyOf(u, part);
      if (legacy[part] && localStorage.getItem(k) === null) {
        const v = localStorage.getItem(legacy[part]);
        if (v !== null) localStorage.setItem(k, v);
      }
    } catch (e) {}
  });
});
const LSK = UNIT ? keyOf(UNIT, "kit") : null;
const PTK = UNIT ? keyOf(UNIT, "pt") : null;
const readJSON = (k) => {
  try {
    const r = localStorage.getItem(k);
    return r ? JSON.parse(r) : null;
  } catch (e) {
    return null;
  }
};
const writeJSON = (k, v) => {
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {}
};

/* Theme and text size apply to the whole course, including the unit list. */
const PREF_DEF = { theme: "auto", size: 2 };
const PREFS = Object.assign({}, PREF_DEF, readJSON(PREFK) || {});

  const root = document.documentElement;
  root.setAttribute("data-theme", PREFS.theme);
  root.style.fontSize = [15, 16, 17, 19, 21][PREFS.size] + "px";
  root.style.setProperty("--accent-l", COURSE.accent);
  root.style.setProperty("--accent-d", COURSE.accentDark || COURSE.accent);
}
applyPrefs();

/* Course home (list of units) and the frame around an open unit: header, progress meter, tabs, deck chips. */
function hubLink() {
  return COURSE.hub ? '<a class="hublink" href="' + esc(COURSE.hub) + '">' + ICON.back + "Study Hub</a>" : "<span></span>";
}

/* Credit line on every kit page. The engine is MIT-licensed (kit-core/LICENSE): copies must keep this line. */
const CREDIT_URL = "https://dn4563.github.io/Study-Hub-by-David/";
function creditLine() {
  return '<footer class="credit">Study kit engine by <a href="' + CREDIT_URL + '">David Noskow</a></footer>';
}

function unitProgress(u) {
  const data = UNITDATA[u.id],
    saved = readJSON(keyOf(u, "kit")) || {},
    known = saved.known || {};
  const ids = [];
  data.decks.forEach((dk) => {
    if (dk.optional) return;
    dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => ids.push(dk.id + "." + si + "." + ci)));
  });
  let answered = 0,
    total = 0;
  const pt = readJSON(keyOf(u, "pt"));
  data.practice.sections.forEach((s) => {
    const st = pt && pt.secs ? (pt.secs.find((x) => x.name === s.name) || {}).st || {} : {};
    s.questions.forEach((q) => {
      total++;
      const x = st[q.id];
      if (x && (x.checked || x.mark != null || Object.keys(x.pm || {}).length)) answered++;
    });
  });
  return { got: ids.filter((id) => known[id]).length, tot: ids.length, answered: answered, total: total };
}

function homeHTML() {
  let h =
    '<header class="top"><div class="topbar">' +
    hubLink() +
    '</div><h1 class="course">' +
    esc(COURSE.name) +
    '</h1><p class="lede">' +
    esc(COURSE.tagline || "Pick a unit. Progress in each unit is saved in this browser.") +
    "</p></header>";
  h += '<main><ul class="unitlist">';
  COURSE.units.forEach((u) => {
    const p = unitProgress(u),
      pct = p.tot ? Math.round((100 * p.got) / p.tot) : 0;
    h +=
      '<li><a class="unitrow" href="#' +
      esc(u.id) +
      '"><span class="ulabel">' +
      esc(u.label) +
      '</span><span class="ubody"><span class="utitle">' +
      esc(u.title) +
      "</span>" +
      (u.blurb ? '<span class="ublurb">' + esc(u.blurb) + "</span>" : "") +
      '<span class="ustat">' +
      p.got +
      " of " +
      p.tot +
      " terms marked got it" +
      (p.total ? ", " + p.answered + " of " + p.total + " practice questions answered" : "") +
      '</span><span class="bar" aria-hidden="true"><i style="width:' +
      pct +
      '%"></i></span></span><span class="ugo">Open' +
      ICON.chev +
      "</span></a></li>";
  });
  return h + "</ul>" + backupHTML() + "</main>" + creditLine();
}

function renderHome() {
  document.title = COURSE.name + " Study Kit";
  document.getElementById("app").innerHTML = homeHTML();
}

const DEF = {
  hooks: true,
  confirm: true,
  optDeck: false,
  fcPool: "unknown",
  fcOrder: "shuffle",
  fcFirst: "term",
  fcMode: "sort",
  qType: "mixed",
  dir: "both",
  focus: "unknown",
  timer: 0,
  recall: true,
};
let SAVE, ALL, BYID, LESSONS, UI, TABS;

function loadSave() {
  SAVE = { settings: Object.assign({}, DEF), known: {}, trouble: {}, done: {}, li: 0, revHist: [], secRev: {}, star: {} };
  const o = readJSON(LSK);
  if (!o) return;
  SAVE.known = o.known || {};
  SAVE.trouble = o.trouble || {};
  SAVE.done = o.done || {};
  SAVE.li = o.li || 0;
  SAVE.ui = o.ui || null;
  SAVE.revHist = o.revHist || [];
  SAVE.secRev = o.secRev || {};
  SAVE.star = o.star || {};
  const s = o.settings || {};
  /* Older kits kept theme and size per kit; carry them over once. */
  if (!readJSON(PREFK) && (s.theme || s.size !== undefined)) {
    if (s.theme) PREFS.theme = s.theme;
    if (typeof s.size === "number") PREFS.size = s.size;
    writeJSON(PREFK, PREFS);
    applyPrefs();
  }
  delete s.theme;
  delete s.size;
  SAVE.settings = Object.assign({}, DEF, s);
}
function save() {
  writeJSON(LSK, SAVE);
}

function indexCards() {
  BYID = {};
  D.allDecks = D.allDecks || D.decks;
  D.allDecks.forEach((dk, di) => {
    dk.tone = di % 8;
    dk.sections.forEach((sc, si) =>
      sc.cards.forEach((c, ci) => {
        c.id = dk.id + "." + si + "." + ci;
        c.deck = dk.id;
        c.sec = dk.id + "." + si;
        BYID[c.id] = c;
      }),
    );
  });
}
/* Optional decks stay out of "All decks", the meter and the mixed quiz unless turned on in Settings. */
function rebuild() {
  D.decks = D.allDecks.filter((d) => !d.optional || SAVE.settings.optDeck);
  ALL = [];
  LESSONS = [];
  D.decks.forEach((dk) =>
    dk.sections.forEach((sc, si) => {
      sc.cards.forEach((c) => ALL.push(c));
      const n = sc.cards.length,
        parts = Math.max(1, Math.ceil(n / 5)),
        base = Math.floor(n / parts),
        extra = n % parts;
      let i = 0;
      for (let p = 0; p < parts; p++) {
        const sz = base + (p < extra ? 1 : 0);
        LESSONS.push({
          id: dk.id + "." + si + "." + p,
          deck: dk.id,
          sec: dk.id + "." + si,
          secName: sc.name,
          part: p,
          parts: parts,
          title: sc.name + (parts > 1 ? " (part " + (p + 1) + " of " + parts + ")" : ""),
          cards: sc.cards.slice(i, i + sz),
        });
        i += sz;
      }
    }),
  );
}

function initShell() {
  loadSave();
  indexCards();
  rebuild();
  const secs = D.practice.sections;
  TABS = [
    ["learn", "Learn"],
    ["guide", "Study guide"],
  ];
  if (D.cheat && D.cheat.length) TABS.push(["cheat", "Cheat sheet"]);
  TABS.push(["flash", "Flashcards"], ["quiz", "Quiz"]);
  if (secs.some((s) => s.mode !== "exam")) TABS.push(["pt", "Practice Test"]);
  if (secs.some((s) => s.mode === "exam")) TABS.push(["exam", COURSE.examTab || "Full exam"]);
  if (secs.length) TABS.push(["prog", "Progress"]);
  TABS.push(["set", "Settings"]);
  UI = { tab: "learn", deck: 0, run: null, q: null, qmsg: "" };
  const u = SAVE.ui;
  if (u) {
    if (TABS.some((t) => t[0] === u.tab)) UI.tab = u.tab;
    if (u.deck && D.decks.some((d) => d.id === u.deck)) UI.deck = u.deck;
    if (u.q && typeof u.q === "object" && u.q.decks) UI.q = u.q;
  }
  document.title = UNIT.label + ": " + UNIT.title + " | " + COURSE.name;
}

const deckOf = (id) => D.allDecks.find((d) => d.id === id);
const deckTone = (id) => {
  const d = deckOf(id);

/* Question builders and the one-at-a-time runner used by Quiz, the final mixed quiz and retries. */
let FC = null,
  TM = null;
const LET = "ABCDE";
function stopTM() {
  clearInterval(TM);
  TM = null;
}
function pickDir() {
  const d = SAVE.settings.dir;
  return d === "both" ? (Math.random() < 0.5 ? "t2d" : "d2t") : d;
}
/* Distractors come from the same section first, then the same deck, then anywhere, preferring similar lengths
   so the right answer never stands out by length. */
function distractors(card, n, field) {
  const target = card[field];
  const fair = (c) => !MIX || field !== "def" || !hasTerm(c.def, card.term);
  const tiers = [
    ALL.filter((c) => c !== card && c.sec === card.sec),
    ALL.filter((c) => c !== card && c.deck === card.deck && c.sec !== card.sec),
    ALL.filter((c) => c.deck !== card.deck),
  ];
  const out = [];
  for (const tier of tiers) {
    const cand = shuf(tier);
    const close = cand.filter((c) => {
      const r = c[field].length / target.length;
      return r >= 0.7 && r <= 1.3;
    });
    const ord = close.concat(cand.filter((c) => close.indexOf(c) < 0));
    for (const c of ord) {
      if (out.length >= n) break;
      if (fair(c) && c[field] !== target && !out.some((o) => o[field] === c[field])) out.push(c);
    }
    if (out.length >= n) break;
  }
  return out;
}
/* Units with "learnMix" on (set per unit in course.json) hide the term inside definitions used as questions
   or choices, and mix in each card's applied questions. Units without it behave exactly as before. */
const MIX = !!(UNIT && UNIT.learnMix);
const STOP = /^(with|from|into|that|this|they|their|than|then|have|each|also|only|some|more|most)$/i;
/* A word counts as the term when it starts with the term word's stem and adds at most a short ending
   (isotope -> isotopes, isotopic). Longer words that merely share letters (mole -> molecules) don't. */
function termStems(term) {
  return (term.match(/[A-Za-z]{4,}/g) || []).filter((w) => !STOP.test(w)).map((w) => w.toLowerCase().slice(0, Math.max(4, w.length >= 8 ? w.length - 2 : w.length - 1)));
}
function maskTerm(text, term) {
  const stems = termStems(term);

  const out = text.replace(/[A-Za-z]+/g, (w) => {
    const lw = w.toLowerCase();
    if (stems.some((st) => lw.startsWith(st) && lw.length - st.length <= 3)) {
      hidden++;
      return "_____";
    }
    return w;
  });
  return { text: out, ratio: hidden / Math.max(1, (text.match(/[A-Za-z]+/g) || []).length) };
}
/* Mixed units: a definition used as the clue has the term blanked out (and is skipped if that leaves too

   definition doesn't contain its own term, and wrong choices that mention the asked term are left out. */
const hasTerm = (text, term) => maskTerm(text, term).ratio > 0;
const clueOK = (card) => !MIX || maskTerm(card.def, card.term).ratio <= 0.2;

const shownDef = (c) => (MIX ? maskTerm(c.def, c.term).text : c.def);
function askQ(card, a) {
  return {
    kind: "ap",
    card: card,
    ask: "Apply it",
    prompt: esc(a.q),
    options: shuf([{ t: a.right, ok: true }].concat(a.wrong.map((w) => ({ t: w[0], ok: false, why: w[1] })))),
    explain: (a.exp ? esc(a.exp) + "<br>" : "") + "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function mcQ(card, dir, nopt) {
  dir = dir || pickDir();
  const okDir = (d) => (d === "d2t" ? clueOK(card) : choicesOK(card));
  if (!okDir(dir)) dir = dir === "d2t" ? "t2d" : "d2t";
  /* No fair definition question for this card: ask its applied question instead. */
  if (!okDir(dir) && card.asks && card.asks.length) return askQ(card, card.asks[Math.floor(Math.random() * card.asks.length)]);
  nopt = nopt || 4;
  const field = dir === "t2d" ? "def" : "term";
  const opts = shuf(
    [{ t: card[field], ok: true }].concat(
      distractors(card, nopt - 1, field).map((c) => ({
        t: c[field],
        ok: false,
        why:
          dir === "t2d"
            ? 'That description belongs to "' + c.term + '", not to "' + card.term + '".'
            : '"' + c.term + '" means: ' + c.def + ' That is a different idea from the description in the question, which fits "' + card.term + '".',
      })),
    ),
  );
  return {
    kind: "mc",
    card: card,
    dir: dir,
    ask: dir === "t2d" ? "Which description best matches this term?" : "Which term matches this description?",
    prompt: dir === "t2d" ? "<b>" + esc(card.term) + "</b>" : esc(shownDef(card)),
    options: opts,
    explain: "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function tfQ(card) {
  let isTrue = Math.random() < 0.5,
    other = null;
  if (!isTrue) {
    const pool = ALL.filter((c) => c !== card && c.sec === card.sec);
    const pool2 = pool.length ? pool : ALL.filter((c) => c !== card && c.deck === card.deck);
    if (pool2.length) other = shuf(pool2)[0];
    else isTrue = true;
  }
  return {
    kind: "tf",
    card: card,
    ask: "True or false: this definition matches the term.",
    prompt: "<b>" + esc(card.term) + "</b><br>" + esc(isTrue ? card.def : other.def),
    options: [
      { t: "True", ok: isTrue },
      { t: "False", ok: !isTrue },
    ],
    explain: (isTrue ? "True. " : "False. That definition belongs to <b>" + esc(other.term) + "</b>. ") + "<b>" + esc(card.term) + "</b>: " + esc(card.def),
  };
}
function scQ(s, ask) {
  return {
    kind: "sc",
    deck: s.deck,
    ask: ask || "Apply it",
    prompt: esc(s.q),
    options: shuf(s.opts.map((t, i) => ({ t: t, ok: i === s.ans, why: i === s.ans ? "" : (s.why && s.why[i]) || "" }))),
    explain: esc(s.exp),
  };
}
const hookLine = (c) => (SAVE.settings.hooks && c.hook ? '<span class="hook"><b>Hook</b> ' + esc(c.hook) + "</span>" : "");
const fresh = (q) => (q.kind === "mc" ? mcQ(q.card, q.dir, q.options.length) : q.kind === "tf" ? tfQ(q.card) : Object.assign({}, q, { elim: [] }));
/* A missed term comes back re-rolled: 35% chance it flips direction, always with reshuffled options. */
const reroll = (q) => mcQ(q.card, Math.random() < 0.35 ? (q.dir === "t2d" ? "d2t" : "t2d") : q.dir || pickDir(), Math.max(3, q.options.length));

  } else if (UI.tab === "learn" && UI.L && UI.L.phase === "quiz") {

    const k = "abcde".indexOf(e.key.toLowerCase()),

      i = k >= 0 ? k : n;
    if (i >= 0 && i < ctx.q.options.length && (ctx.q.elim || []).indexOf(i) < 0) {
      e.preventDefault();

function storyHTML(paras, title, cls) {

const sc0 = (l) => {

  toggleElim((L.cur.elim = L.cur.elim || []), k);
  if (L.sel === k) L.sel = null;
  render();
};
ACT.lnext = () => {
  if (UI.L && UI.L.phase === "quiz" && UI.L.picked !== null) nextLearnQ();
};
ACT.lfinal = () =>
  startRun({
    title: "Final mixed quiz",
    qs: shuf(ALL)
      .slice(0, 40)
      .map((c) => mcQ(c)),
    immediate: true,
    timer: 0,
    retry: true,
    breakdown: true,
  });

/* A lesson in progress survives a reload. */
function packL() {
  const L = UI.L;
  if (!L) return null;
  if (L.phase === "teach") return { phase: "teach" };
  const o = { phase: L.phase, sr: !!L.sr, first: L.first, firstTotal: L.firstTotal, missed: [...L.missed], tried: [...L.tried], scen: L.scenMissIdx || [] };
  if (L.phase === "quiz") {
    const q = L.queue.slice();
    if (L.item && L.picked === null) q.unshift(L.item);
    o.queue = q;
  }
  return o;
}
function restoreL() {
  const p = SAVE.ui && SAVE.ui.L;
  if (!p || !p.phase) return;
  try {
    if (p.phase === "teach") {
      UI.L = { phase: "teach" };
      return;
    }
    const L = {
      phase: p.phase,
      sr: !!p.sr,
      queue: (p.queue || []).filter((it) =>
        it.type === "sc" ? D.sq[it.idx] : it.type === "recall" ? COURSE.units.some((u) => u.id === it.unit && UNITDATA[u.id]) : BYID[it.id],
      ),
      cur: null,
      picked: null,
      first: p.first || 0,
      firstTotal: p.firstTotal || 0,
      missed: new Set((p.missed || []).filter((id) => BYID[id])),
      scenMissIdx: (p.scen || []).filter((i) => D.sq[i]),
      tried: new Set(p.tried || []),
    };
    L.scenMiss = L.scenMissIdx.map((i) => learnQ({ type: "sc", idx: i }));
    UI.L = L;
    if (L.phase === "quiz") {
      if (!L.queue.length) UI.L = { phase: "teach" };
      else {
        L.item = L.queue.shift();
        L.cur = learnQ(L.item);
      }
    }
  } catch (e) {
    UI.L = { phase: "teach" };
  }
}

/* Flashcards, modeled on Quizlet's flashcard mode.
   Pool: not known yet / all / trouble terms / starred. Order: shuffled or section order. Side first: term or definition
   (the Swap sides button flips it in one tap).
   Two modes:
   - Sort: Not yet / Got it. "Not yet" returns the card about 4 cards later. Back undoes the last choice,
     including its Got it / trouble change. The round ends with a results screen.
   - Browse: Previous / Next through the pool, no sorting.
   Keys: Space or Up/Down flips, Right = Got it (Sort) or Next (Browse), Left = Back (Sort) or Previous (Browse),
   1 = Not yet, 2 = Got it, S = star. */
function fcBuild(onlyIds) {
  let pool = deckCards().slice();
  const p = SAVE.settings.fcPool;
  if (onlyIds) pool = pool.filter((c) => onlyIds.indexOf(c.id) >= 0);
  else if (p === "unknown") pool = pool.filter((c) => !SAVE.known[c.id]);
  else if (p === "trouble") pool = pool.filter((c) => SAVE.trouble[c.id] > 0);
  else if (p === "starred") pool = pool.filter((c) => SAVE.star[c.id]);
  if (SAVE.settings.fcOrder === "shuffle") pool = shuf(pool);
  FC = { q: pool.map((c) => c.id), list: pool.map((c) => c.id), i: 0, flip: false, total: pool.length, hist: [], got: [], learning: [] };
}
function selHTML(key, label, opts) {

    "</select></label>"

}

const fcCur = () => (fcBrowse() ? FC.list[FC.i] : FC.q[0]);

function fcCardHTML(c) {

/* Every sort records enough to undo it exactly. */
function fcPush(id) {
  FC.hist.push({ q: FC.q.slice(), got: FC.got.slice(), learning: FC.learning.slice(), known: !!SAVE.known[id], trouble: SAVE.trouble[id], id: id });
}
ACT.fcflip = () => {
  FC.flip = !FC.flip;
  render();
};
ACT.fcagain = () => {
  FC = null;
  render();
};
ACT.fcgot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  setKnown(id, true);
  if (FC.learning.indexOf(id) < 0 && FC.got.indexOf(id) < 0) FC.got.push(id);
  FC.flip = false;
  render();
};
ACT.fcnot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  delete SAVE.known[id];
  SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
  if (FC.learning.indexOf(id) < 0) FC.learning.push(id);
  FC.q.splice(Math.min(FC.q.length, 4), 0, id);
  FC.flip = false;
  save();
  render();
};
ACT.fcback = () => {
  const h = FC && FC.hist.pop();
  if (!h) return;
  FC.q = h.q;
  FC.got = h.got;
  FC.learning = h.learning;
  if (h.known) SAVE.known[h.id] = true;
  else delete SAVE.known[h.id];
  if (h.trouble === undefined) delete SAVE.trouble[h.id];
  else SAVE.trouble[h.id] = h.trouble;
  FC.flip = false;
  save();
  render();
};
ACT.fclearn = () => {
  const ids = FC.learning.slice();
  fcBuild(ids);
  render();
};
ACT.fcprev = () => {
  if (FC.i > 0) FC.i--;
  FC.flip = false;
  render();
};
ACT.fcnext = () => {
  if (FC.i < FC.list.length - 1) FC.i++;
  FC.flip = false;
  render();
};
ACT.fcswap = () => {
  SAVE.settings.fcFirst = SAVE.settings.fcFirst === "term" ? "def" : "term";
  FC.flip = false;
  save();
  render();
};
ACT.fcshuf = () => {
  if (fcBrowse()) {
    FC.list = shuf(FC.list);
    FC.i = 0;
  } else FC.q = shuf(FC.q);
  FC.flip = false;
  render();
};
ACT.fcstar = () => {
  const id = fcCur();
  if (!id) return;
  if (SAVE.star[id]) delete SAVE.star[id];
  else SAVE.star[id] = true;
  save();
  render();
};
document.addEventListener("keydown", (e) => {
  if (!UNIT || UI.tab !== "flash" || UI.run || !FC) return;
  const tg = e.target && e.target.tagName;
  if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const browse = fcBrowse();
  if (!(browse ? FC.list.length : FC.q.length)) {
    if (!browse && e.key === "ArrowLeft") ACT.fcback();
    return;
  }
  if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    ACT.fcflip();
  } else if (e.key === "ArrowRight") browse ? ACT.fcnext() : ACT.fcgot();
  else if (e.key === "ArrowLeft") browse ? ACT.fcprev() : ACT.fcback();
  else if (e.key === "s" || e.key === "S") ACT.fcstar();
  else if (!browse && e.key === "1") ACT.fcnot();
  else if (!browse && e.key === "2") ACT.fcgot();
});

/* 70-quiz.js */
/* Quiz builder: decks, how many of each type, number of choices, feedback timing, order and an optional
   per-question timer. Results break down by type and topic, with retry-missed and rerun. */
function initQ() {
  if (!UI.q) UI.q = { decks: {}, mc: 10, tf: 5, sc: 6, nopt: 4, fb: "immediate", order: "shuffle", timer: SAVE.settings.timer };
  D.decks.forEach((d) => {
    if (UI.q.decks[d.id] === undefined) UI.q.decks[d.id] = true;
  });
}
function QSET(t) {
  initQ();
  if (t.dataset.qd !== undefined) {
    const d = D.decks.find((x) => String(x.id) === t.dataset.qd);
    if (d) UI.q.decks[d.id] = t.checked;
    clampQ();
    return render();
  }
  if (t.type === "number") {
    UI.q[t.dataset.q] = Math.max(0, Math.floor(Number(t.value) || 0));
    clampQ();
    return render();
  }
  UI.q[t.dataset.q] = t.value;
}
/* Real limits for the chosen decks. Multiple choice and true/false share the decks' terms (a term is asked
   once, one way or the other); applied questions are counted separately. */
function quizCaps() {
  const decks = quizDecks();
  return { terms: ALL.filter((c) => decks.indexOf(c.deck) >= 0).length, applied: appliedCount() };
}
function clampQ() {
  const c = quizCaps(),
    q = UI.q;
  q.mc = Math.min(Math.max(0, Number(q.mc) || 0), c.terms);
  q.tf = Math.min(Math.max(0, Number(q.tf) || 0), c.terms - q.mc);
  q.sc = Math.min(Math.max(0, Number(q.sc) || 0), c.applied);
}
/* Questions from the last quiz go to the back of the line next time, so a rerun starts with new ones. */
let QRECENT = new Set();
/* How many applied questions the chosen decks have: scenarios plus applied (asks.json) questions. */
function appliedPool(decks) {
  const pool = [];
  D.sq.forEach((s, i) => decks.indexOf(s.deck) >= 0 && pool.push({ key: "s" + i, make: () => scQ(s) }));
  ALL.filter((c) => decks.indexOf(c.deck) >= 0).forEach((c) => (c.asks || []).forEach((a, i) => pool.push({ key: "a" + c.id + ":" + i, make: () => askQ(c, a) })));
  return pool;
}
const quizDecks = () => D.decks.map((d) => d.id).filter((id) => !UI.q || UI.q.decks[id] !== false);
function appliedCount() {
  return appliedPool(quizDecks()).length;
}
function quizHTML() {
  if (UI.run) return runHTML();
  initQ();
  const q = UI.q;
  const so = (k, opts) =>
    '<select data-q="' + k + '">' + opts.map((o) => '<option value="' + o[0] + '"' + (String(q[k]) === String(o[0]) ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>";
  clampQ();
  const caps = quizCaps();
  const num = (k, label, max) =>
    "<label>" + label + ' <small class="muted">(up to ' + max + ')</small> <input type="number" min="0" max="' + max + '" data-q="' + k + '" value="' + q[k] + '"></label>';
  return (
    '<section class="panel form"><h2>Build a quiz</h2><fieldset><legend>Decks</legend><div class="grp">' +
    D.decks.map((d) => '<label><input type="checkbox" data-qd="' + d.id + '"' + (q.decks[d.id] ? " checked" : "") + ">" + dot(d.id) + esc(d.name) + "</label>").join("") +
    '</div></fieldset><fieldset><legend>Questions</legend><div class="grp">' +
    num("mc", "Multiple choice", caps.terms) +
    num("tf", "True or false", caps.terms - q.mc) +
    num("sc", ALL.some((c) => c.asks && c.asks.length) ? "Applied (scenarios and apply-it)" : "Scenario", caps.applied) +
    '</div></fieldset><fieldset><legend>Options</legend><div class="grp">' +
    "<label>Choices per question " +
    so("nopt", [
      [3, "3"],
      [4, "4"],
      [5, "5"],
    ]) +
    "</label><label>Feedback " +
    so("fb", [
      ["immediate", "After each question"],
      ["end", "At the end"],
    ]) +
    "</label><label>Order " +
    so("order", [
      ["shuffle", "Shuffled"],
      ["deck", "Deck order"],
    ]) +
    "</label><label>Timer per question " +
    so("timer", [
      [0, "Off"],
      [15, "15 s"],
      [30, "30 s"],
      [60, "60 s"],
    ]) +
    '</label></div></fieldset><p class="muted">Every question in a quiz is different: a term is asked once, as multiple choice or true or false. Numbers above the limit are lowered to it. Running out of time counts as a miss. Question types, term direction and focus are in Settings.</p>' +
    (UI.qmsg ? '<p class="msg">' + esc(UI.qmsg) + "</p>" : "") +
    '<div class="qnav"><button class="btn" data-act="qstart">Start quiz</button></div></section>'
  );
}
ACT.qstart = () => {
  initQ();
  const q = UI.q,
    decks = D.decks.map((d) => d.id).filter((id) => q.decks[id]);
  if (!decks.length) {
    UI.qmsg = "Pick at least one deck.";
    return render();
  }
  clampQ();
  /* Random order, then (stable sorts) the Settings focus first and last quiz's questions last. */
  const recentLast = (key) => (QRECENT.has(key) ? 1 : 0);
  let pool = shuf(ALL.filter((c) => decks.indexOf(c.deck) >= 0));
  pool.sort((a, b) => recentLast("c" + a.id) - recentLast("c" + b.id));
  const f = SAVE.settings.focus;
  if (f === "trouble") pool.sort((a, b) => (SAVE.trouble[b.id] || 0) - (SAVE.trouble[a.id] || 0));
  else if (f === "unknown") pool.sort((a, b) => (SAVE.known[a.id] ? 1 : 0) - (SAVE.known[b.id] ? 1 : 0));
  let nmc = Number(q.mc) || 0,
    ntf = Number(q.tf) || 0,
    nsc = Number(q.sc) || 0;
  const qt = SAVE.settings.qType;
  if (qt === "terms") nsc = 0;
  if (qt === "scen") nmc = ntf = 0;
  const qs = [],
    np = Number(q.nopt) || 4;
  /* Each term once: the first nmc as multiple choice, the next ntf as true or false. */
  nmc = Math.min(nmc, pool.length);
  ntf = Math.min(ntf, pool.length - nmc);
  const used = new Set();
  for (let i = 0; i < nmc; i++) {
    const mq = mcQ(pool[i], null, np);
    qs.push(mq);
    used.add("c" + pool[i].id);
    /* A card with no fair definition question is asked with its applied question; don't ask that one again below. */
    if (mq.kind === "ap") used.add("a" + pool[i].id + ":" + pool[i].asks.findIndex((a) => esc(a.q) === mq.prompt));
  }
  for (let i = nmc; i < nmc + ntf; i++) {
    qs.push(tfQ(pool[i]));
    used.add("c" + pool[i].id);
  }
  /* Applied pool: the decks' scenario questions plus every applied (asks.json) question, each at most once. */
  const ap = shuf(appliedPool(decks).filter((it) => !used.has(it.key)));
  ap.sort((a, b) => recentLast(a.key) - recentLast(b.key));
  ap.slice(0, nsc).forEach((it) => {
    qs.push(it.make());
    used.add(it.key);
  });
  QRECENT = used;
  if (!qs.length) {
    UI.qmsg = "Nothing to ask with those settings.";
    return render();
  }
  UI.qmsg = "";
  startRun({ title: "Quiz", qs: q.order === "shuffle" ? shuf(qs) : qs, immediate: q.fb === "immediate", timer: Number(q.timer) || 0, retry: false, breakdown: true, again: true });
};
ACT.qagain = () => {
  UI.run = null;
  stopTM();
